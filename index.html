<style>
  :root {
    --paper: #FAF7F2;
    --paper-raised: #FFFFFF;
    --ink: #3C3733;
    --ink-soft: #9C9186;
    --rule: #EAE2D6;
    --blue: #6E8577;
    --green: #7C8B54;
    --red: #A8607A;
    --amber: #BFA054;

  body {
    margin: 0; font-family: 'Noto Sans TC', sans-serif; background: var(--paper); color: var(--ink);
    padding: 32px 20px 64px;

  .mal-shell { max-width: 920px; margin: 0 auto; }
  .mal-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--rule); padding-bottom: 20px; margin-bottom: 28px; flex-wrap: wrap; }

  .mal-subtitle { font-size: 12.5px; color: var(--ink-soft); margin: 3px 0 0; letter-spacing: 0.01em; }

  .mal-btn:hover { background: #FBF9F5; border-color: var(--ink-soft); box-shadow: 0 3px 10px rgba(60,55,51,0.08); }

  .mal-btn-primary:hover { background: #607A6C; border-color: #607A6C; box-shadow: 0 4px 14px rgba(110,133,119,0.28); }
  .mal-btn-danger { background: transparent; border-color: var(--red); color: var(--red); }
  .mal-btn-danger:hover { background: #F3E4E9; box-shadow: none; }
  .mal-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
  .mal-notice { background: #EEF1E4; border: 1px solid #D8E0C8; color: #5C6B41; font-size: 13px; padding: 10px 16px; border-radius: 10px; margin-bottom: 16px; }
  .mal-error { background: #F3E4E9; border: 1px solid #E3C3D0; color: #8B4A63; font-size: 13px; padding: 10px 16px; border-radius: 10px; margin-bottom: 16px; }
  .mal-empty { border: 1.5px dashed var(--rule); border-radius: 16px; padding: 56px 24px; text-align: center; background: var(--paper-raised); }

  .mal-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 20px; }
  .mal-brand-switch { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .mal-brand-switch-label { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; }
  .mal-brand-chip {
    font-size: 12.5px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--rule);
    background: var(--paper-raised); color: var(--ink-soft); cursor: pointer; white-space: nowrap; transition: all 0.15s ease;

  .mal-brand-chip:hover { border-color: var(--blue); color: var(--ink); }

  .mal-viewmode-switch { display: flex; gap: 6px; margin-bottom: 18px; background: #F2EEE6; padding: 5px; border-radius: 14px; width: fit-content; }
  .mal-viewmode-btn {

  .mal-viewmode-btn-active { color: #fff; background: var(--blue); box-shadow: 0 2px 8px rgba(110,133,119,0.3); }
  .mal-week-box { background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 16px; padding: 20px 22px 8px; margin-bottom: 28px; box-shadow: 0 2px 10px rgba(60,55,51,0.04); }
  .mal-week-title { margin-top: 0; border-bottom: 1px solid var(--rule); }

  .mal-ledger-group-gap { background: var(--paper-raised); }
  .mal-ledger-group-label-backend { color: #5C6B41; }
  .mal-ledger-group-label-meta { color: #8A6A2E; }
  /* 表格較寬需要左右滑動時,第一欄(產品代號/日期)凍結不跟著捲動,滑到多右邊都看得到現在是哪一列。 */

  .mal-tab-active { border-color: var(--blue); color: #fff; background: var(--blue); }

  .mal-perf-section-title { font-family: 'Noto Serif KR', serif; font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .mal-perf-section-chevron { font-size: 13px; transition: transform 0.15s ease; color: var(--ink-soft); }
  .mal-perf-section-body { padding: 4px 18px 18px; }

  .mal-section-count { font-family: 'Noto Sans TC', sans-serif; font-weight: 400; font-size: 12px; color: var(--ink-soft); margin-left: 8px; }

  .mal-ad-fblink { font-family: 'Noto Sans TC', sans-serif; font-size: 11px; color: var(--blue); text-decoration: none; margin-top: 3px; display: inline-flex; align-items: center; gap: 3px; }

  .mal-ad-startdate { font-family: 'Noto Sans TC', sans-serif; font-size: 11px; color: var(--ink-soft); margin-top: 3px; display: block; }

  .mal-status-filter { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }

  .mal-ad-search-wrap { position: relative; margin-left: auto; }

  .mal-ad-search-wrap input:focus { outline: none; border-color: var(--blue); }
  .mal-ad-search-wrap .mal-ad-search-icon { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--ink-soft); pointer-events: none; }
  .mal-ad-search-wrap .mal-ad-search-clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: none; background: none;
    color: var(--ink-soft); cursor: pointer; font-size: 13px; padding: 3px 5px; line-height: 1;

  .mal-ad-search-wrap .mal-ad-search-clear:hover { color: var(--red); }
  .mal-ad-count { color: var(--ink-soft); font-style: italic; margin-left: 4px; }
  .mal-synced-at { color: var(--ink-soft); font-size: 12px; margin: -6px 0 16px; font-family: 'IBM Plex Mono', monospace; }
  .mal-ad-stats { display: flex; gap: 16px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; flex-shrink: 0; }
  .mal-ad-stats div { display: flex; flex-direction: column; align-items: flex-end; }
  .mal-ad-stats span { font-family: 'Noto Sans TC', sans-serif; font-size: 10px; color: var(--ink-soft); text-transform: uppercase; }
  .mal-toggle-ads { margin-bottom: 24px; font-size: 12.5px; padding: 7px 14px; }
  .mal-modal-overlay { position: fixed; inset: 0; background: rgba(60,55,51,0.35); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; backdrop-filter: blur(2px); }
  .mal-modal { background: #fff; border-radius: 20px; max-width: 560px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 28px; box-shadow: 0 20px 60px rgba(60,55,51,0.2); }
  .mal-modal h3 { font-family: 'Noto Serif KR', serif; font-size: 19px; margin: 0 0 4px; }
  .mal-modal p.mal-modal-sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 18px; }
  .mal-modal-small { max-width: 380px; }
  .mal-field { margin-bottom: 13px; }

  .mal-field label .mal-req { color: var(--red); }
  .mal-field select { width: 100%; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 10px; font-family: 'Noto Sans TC', sans-serif; font-size: 13px; background: var(--paper-raised); color: var(--ink); }
  .mal-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  .mal-advanced-toggle { display: flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; color: var(--blue); font-size: 12.5px; font-weight: 600; padding: 8px 0; margin-top: 4px; }

  @media (max-width: 640px) {

    .mal-ad-stats { width: 100%; justify-content: space-between; gap: 8px; }

  @media print {
    body { background: #fff; padding: 0; }
    .mal-header-actions, .mal-print-btn, .mal-toggle-ads, .mal-icon-btn, .mal-tabs, .mal-brand-switch, .mal-viewmode-switch {

    }
    .mal-modal-overlay { display: none !important; }
    .mal-chart-box, .mal-card, .mal-ad-row {

    .mal-perf-card-hint, .mal-perf-section-chevron { display: none !important; }
    .mal-perf-card:hover { transform: none !important; }

    .mal-section-title { break-after: avoid; }
    a[href]::after { content: none !important; }
    .mal-shell { max-width: 100%; }
    .mal-scroll-wrap { overflow: visible !important; }
    .mal-ledger-table th:first-child, .mal-ledger-table td:first-child { position: static !important; }

  body.mal-exporting .mal-header-actions,
  body.mal-exporting .mal-toggle-ads,

  body.mal-exporting .mal-ledger-table th:first-child,
  body.mal-exporting .mal-ledger-table td:first-child {

  }
  body.mal-exporting .mal-perf-card-hint,
  body.mal-exporting .mal-perf-section-chevron {

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ---------- 共用儲存(Claude Artifact 的 window.storage):團隊資料共用,機密資料(API金鑰等)只留在自己瀏覽器 ----------
// 如果不是在 Claude Artifact 環境打開(例如直接把檔案存到電腦、用瀏覽器開啟),window.storage 不存在,
// 這時自動退回「本機儲存」模式,資料只存在自己瀏覽器,不會跨裝置同步——避免直接開檔案時整個當機。
const HAS_SHARED_STORAGE = typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";
const LS_PREFIX = "ad-ledger::";
const localOnlyStorage = {
  async get(key) {
    const v = localStorage.getItem(LS_PREFIX + key);
    return v !== null ? { key, value: v } : null;
  },
  async set(key, value) {
    localStorage.setItem(LS_PREFIX + key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem(LS_PREFIX + key);
    return { key, deleted: true };
  },
  async list(prefix) {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(LS_PREFIX + prefix)) keys.push(k.slice(LS_PREFIX.length));
    }
    return { keys };
  },
};
const STORAGE_PREFIX = "metaads-month:";
const WEEK_STORAGE_PREFIX = "metaads-week:";
const LEDGER_STORAGE_PREFIX = "metaads-ledger:";
// 以下這些 key 存的是「報表資料/品牌設定」,大家看到的要是同一份,所以存到共用空間(shared: true)。
// Meta API 金鑰、帳號ID、記住金鑰的開關、自動同步設定——這些是個人的登入憑證,絕對不能共用,只存在自己瀏覽器(shared: false)。

const storage = {
  async get(key) {
    if (!isSharedKey(key)) return localOnlyStorage.get(key);
    if (HAS_SHARED_STORAGE) {
      try { return await window.storage.get(key, true); } catch { return null; }
    }
    if ((await probeCloud()) === "connected") {
      try { return await cloudStorage.get(key); } catch { /* 掉線就退回本機,不讓畫面壞掉 */ }
    }
    return localOnlyStorage.get(key);
  },
  async set(key, value) {
    if (!isSharedKey(key)) return localOnlyStorage.set(key, value);
    if (HAS_SHARED_STORAGE) return await window.storage.set(key, value, true);
    if ((await probeCloud()) === "connected") {
      try { return await cloudStorage.set(key, value); } catch { /* 掉線就退回本機 */ }
    }
    return localOnlyStorage.set(key, value);
  },
  async delete(key) {
    if (!isSharedKey(key)) return localOnlyStorage.delete(key);
    if (HAS_SHARED_STORAGE) {
      try { return await window.storage.delete(key, true); } catch { return null; }
    }
    if ((await probeCloud()) === "connected") {
      try { return await cloudStorage.delete(key); } catch {}
    }
    return localOnlyStorage.delete(key);
  },
  async list(prefix) {
    if (!isSharedKey(prefix)) return localOnlyStorage.list(prefix);
    if (HAS_SHARED_STORAGE) {
      try { const res = await window.storage.list(prefix, true); return res || { keys: [] }; } catch { return { keys: [] }; }
    }
    if ((await probeCloud()) === "connected") {
      try { return await cloudStorage.list(prefix); } catch {}
    }
    return localOnlyStorage.list(prefix);
  },
};

    } else if (typeof dateCell === "string" && dateCell.trim() === "總結") {
      const overall = {
        revenue: toNum(row[1]), adSpend: toNum(row[2]), profit: toNum(row[4]),
        netProfit: toNum(row[7] !== undefined && row[7] !== null && row[7] !== "" ? row[7] : row[6]),
      };
      const byCode = {};
      blocks.forEach((b) => {
        byCode[b.code] = {
          revenue: toNum(row[b.colRevenue]), spend: toNum(row[b.colSpend]),
          profit: toNum(row[b.colProfit]), netProfit: toNum(row[b.colNetProfit]),
        };
      });
      totalRow = { overall, byCode };
      break; // 「總結」之後是代言費、預估獲利等其他彙總列,不屬於逐日資料,停止解析
    }
  }
  if (!days.length) return null;
  return { days, monthTotal: totalRow, productCodes: blocks.map((b) => b.code) };
}

// 解析整份工作簿(可能包含 12 個月分頁),回傳 { [monthKey]: monthObject }。
function parseLedgerWorkbook(workbook, year) {
  const result = {};
  workbook.SheetNames.forEach((sheetName) => {
    const m = sheetName.match(LEDGER_MONTH_SHEET_RE);
    if (!m) return;
    const monthNum = parseInt(m[1], 10);
    if (!monthNum || monthNum < 1 || monthNum > 12) return;
    const sheet = workbook.Sheets[sheetName];
    const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null, raw: true });
    const parsed = parseLedgerSheet(matrix, year);
    if (parsed) {
      const monthKey = `${year}-${String(monthNum).padStart(2, "0")}`;
      result[monthKey] = { monthKey, year, month: monthNum, ...parsed };
    }
  });
  return result;
}

// 把後台每日資料彙總成指定期間(週或月,用 since ~ until 這種 ISO 日期字串)的總計,依產品代號分組。
// ledgerByMonth: { [monthKey]: monthObject },會自動跨月份撈資料,所以週報表算到跨月份的那一週也沒問題。
function aggregateLedgerRange(ledgerByMonth, sinceISO, untilISO) {
  const matchedDays = [];
  Object.values(ledgerByMonth || {}).forEach((mo) => {
    (mo.days || []).forEach((d) => {
      if (d.date && d.date >= sinceISO && d.date <= untilISO) matchedDays.push(d);
    });
  });
  if (!matchedDays.length) return null;
  const overall = { revenue: 0, adSpend: 0, profit: 0, netProfit: 0 };
  const byCode = {};
  matchedDays.forEach((d) => {
    overall.revenue += d.overall.revenue || 0;
    overall.adSpend += d.overall.adSpend || 0;
    overall.profit += d.overall.profit || 0;
    overall.netProfit += d.overall.netProfit || 0;
    Object.entries(d.byCode || {}).forEach(([code, v]) => {
      if (!byCode[code]) byCode[code] = { revenue: 0, spend: 0, profit: 0, netProfit: 0, orderEst: 0, hasOrderEst: true };
      byCode[code].revenue += v.revenue || 0;
      byCode[code].spend += v.spend || 0;
      byCode[code].profit += v.profit || 0;
      byCode[code].netProfit += v.netProfit || 0;
      if (v.orders !== null && v.orders !== undefined) byCode[code].orderEst += v.orders;
      else byCode[code].hasOrderEst = false;
    });
  });
  Object.values(byCode).forEach((v) => { v.aov = v.hasOrderEst && v.orderEst > 0 ? v.revenue / v.orderEst : null; });
  const hasAnyData = overall.revenue > 0 || overall.adSpend > 0 || Object.values(byCode).some((v) => v.revenue > 0 || v.spend > 0);
  if (!hasAnyData) return null;
  return { overall, byCode, dayCount: matchedDays.length, sinceISO, untilISO };
}

// 從網址參數(url_tags / UTM 字串)裡取出「=」後面的那串值,用來判斷是不是同一個素材。
// 例如 "utm_medium=SR_FB_0309-CPA" -> "SR_FB_0309-CPA"。
// 如果同時有多組參數(用 & 分隔),只取第一組的值——因為廣告主通常只在其中一個參數放素材代碼。
function extractUtmValue(raw) {
  if (!raw) return "";
  const first = raw.split("&")[0] || raw;
  const eqIdx = first.indexOf("=");
  const value = eqIdx >= 0 ? first.slice(eqIdx + 1) : first;
  let decoded = value;
  try { decoded = decodeURIComponent(value); } catch { /* 保留原始值 */ }
  return decoded.trim();
}
function monthLabel(key) {
  const [y, m] = key.split("-");
  return `${y}/${m}`;
}
function monthDateRange(monthKey) {
  const [y, m] = monthKey.split("-").map(Number);
  const since = `${monthKey}-01`;
  const lastDay = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const until = `${monthKey}-${String(lastDay).padStart(2, "0")}`;
  return { since, until };
}
// 用 UTC 運算來加減天數,避免瀏覽器時區造成日期字串位移。
function addDaysISO(iso, days) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d + days));
  return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth() + 1).padStart(2, "0")}-${String(dt.getUTCDate()).padStart(2, "0")}`;
}
function fmtInt(n) { return Math.round(n).toLocaleString("zh-TW"); }
function fmtMoney(n, currency) {
  try {
    return new Intl.NumberFormat("zh-TW", { style: "currency", currency: currency || "TWD", maximumFractionDigits: 0 }).format(n);
  } catch { return `${currency || ""} ${fmtInt(n)}`; }
}
// 把 syncedAt 的 UTC ISO 字串轉成台灣時間顯示,格式跟畫面上其他日期欄位一致(YYYY/MM/DD HH:mm)。
function fmtSyncedAt(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  const tw = new Date(d.getTime() + 8 * 3600 * 1000);
  const pad = (n) => String(n).padStart(2, "0");
  return `${tw.getUTCFullYear()}/${pad(tw.getUTCMonth() + 1)}/${pad(tw.getUTCDate())} ${pad(tw.getUTCHours())}:${pad(tw.getUTCMinutes())}`;
}
// 資料是「什麼時候抓的」提示——這個時間點是「最後一次成功呼叫 Meta API 的當下」,不是「資料涵蓋到哪一天」。
// 舊資料(這次修改之前就存在 KV 裡的)沒有這個欄位,顯示「—」而不是硬猜一個時間,避免誤導。
function SyncedAtNote({ iso }) {
  const text = fmtSyncedAt(iso);
  return (
    <p className="mal-synced-at">
      🕒 資料更新於:{text || "— (舊資料,尚無記錄;重新抓取後就會有)"}
    </p>
  );
}
function deriveMetrics(agg) {
  const cpa = agg.conversions > 0 ? agg.spend / agg.conversions : null;
  const roas = agg.spend > 0 && agg.revenue > 0 ? agg.revenue / agg.spend : null;
  return { ...agg, cpa, roas };
}
function pctChange(curr, prev) {
  if (prev === null || prev === undefined || prev === 0) return null;
  if (curr === null || curr === undefined) return null;
  return ((curr - prev) / prev) * 100;
}

function DeltaBadge({ value, invert = false }) {
  if (value === null || value === undefined || !isFinite(value)) {
    return <span className="mal-delta mal-delta-flat">—</span>;
  }
  const good = invert ? value < 0 : value > 0;
  const flat = Math.abs(value) < 0.05;
  const arrow = flat ? "→" : value > 0 ? "▲" : "▼";
  const cls = flat ? "mal-delta-flat" : good ? "mal-delta-good" : "mal-delta-bad";
  return <span className={`mal-delta ${cls}`}>{arrow} {Math.abs(value).toFixed(1)}%</span>;
}

function AdThumb({ src, alt }) {

// ---------- lightweight dependency-free charts ----------

function SimpleBarChart({ data, seriesA, seriesB, colorA, colorB, labelA, labelB, fmtA, fmtB }) {
  const w = 640, h = 200, padL = 6, padR = 6, padT = 10, padB = 26;
  const n = data.length;
  const groupW = (w - padL - padR) / n;
  const barW = Math.min(22, groupW * 0.28);
  const maxA = Math.max(1, ...data.map((d) => d[seriesA]));
  const maxB = Math.max(1, ...data.map((d) => d[seriesB]));
  return (
    <div>
      <div className="mal-chart-legend">
        <span><i className="mal-chart-dot" style={{ background: colorA }}></i>{labelA}</span>
        <span><i className="mal-chart-dot" style={{ background: colorB }}></i>{labelB}</span>
      </div>
      <svg viewBox={`0 0 ${w} ${h}`} width="100%" height="200">
        <line x1={padL} y1={h - padB} x2={w - padR} y2={h - padB} stroke="#EAE2D6" />
        {data.map((d, i) => {
          const cx = padL + groupW * i + groupW / 2;
          const barH_A = ((h - padT - padB) * d[seriesA]) / maxA;
          const barH_B = ((h - padT - padB) * d[seriesB]) / maxB;
          return (
            <g key={i}>
              <rect x={cx - barW - 2} y={h - padB - barH_A} width={barW} height={barH_A} fill={colorA} rx="2">
                <title>{d.month}: {fmtA(d[seriesA])}</title>
              </rect>
              <rect x={cx + 2} y={h - padB - barH_B} width={barW} height={barH_B} fill={colorB} rx="2">
                <title>{d.month}: {fmtB(d[seriesB])}</title>
              </rect>
              <text x={cx} y={h - 8} textAnchor="middle" fontSize="11" fontFamily="IBM Plex Mono, monospace" fill="#9C9186">{d.month}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function SimpleLineChart({ data, seriesA, seriesB, colorA, colorB, labelA, labelB, fmtA, fmtB }) {
  const w = 640, h = 200, padL = 6, padR = 6, padT = 14, padB = 26;
  const n = data.length;
  const stepX = n > 1 ? (w - padL - padR) / (n - 1) : 0;
  const valsA = data.map((d) => d[seriesA]).filter((v) => v !== null && v !== undefined);
  const valsB = data.map((d) => d[seriesB]).filter((v) => v !== null && v !== undefined);
  const maxA = Math.max(1, ...valsA), minA = Math.min(0, ...valsA);
  const maxB = Math.max(1, ...valsB), minB = Math.min(0, ...valsB);
  const yA = (v) => h - padB - ((v - minA) / (maxA - minA || 1)) * (h - padT - padB);
  const yB = (v) => h - padB - ((v - minB) / (maxB - minB || 1)) * (h - padT - padB);
  const pathFor = (key, yf) => {
    let d = "";
    data.forEach((pt, i) => {
      const v = pt[key];
      if (v === null || v === undefined) return;
      const x = padL + stepX * i;
      d += (d ? " L " : "M ") + x + " " + yf(v);
    });
    return d;
  };
  return (
    <div>
      <div className="mal-chart-legend">
        <span><i className="mal-chart-dot" style={{ background: colorA }}></i>{labelA}</span>
        <span><i className="mal-chart-dot" style={{ background: colorB }}></i>{labelB}</span>
      </div>
      <svg viewBox={`0 0 ${w} ${h}`} width="100%" height="200">
        <line x1={padL} y1={h - padB} x2={w - padR} y2={h - padB} stroke="#EAE2D6" />
        <path d={pathFor(seriesA, yA)} fill="none" stroke={colorA} strokeWidth="2.5" />
        <path d={pathFor(seriesB, yB)} fill="none" stroke={colorB} strokeWidth="2.5" />
        {data.map((pt, i) => {
          const x = padL + stepX * i;
          return (
            <g key={i}>
              {pt[seriesA] !== null && pt[seriesA] !== undefined && (
                <circle cx={x} cy={yA(pt[seriesA])} r="3.2" fill={colorA}><title>{pt.month} {labelA}: {fmtA(pt[seriesA])}</title></circle>
              )}
              {pt[seriesB] !== null && pt[seriesB] !== undefined && (
                <circle cx={x} cy={yB(pt[seriesB])} r="3.2" fill={colorB}><title>{pt.month} {labelB}: {fmtB(pt[seriesB])}</title></circle>
              )}
              <text x={x} y={h - 8} textAnchor="middle" fontSize="11" fontFamily="IBM Plex Mono, monospace" fill="#9C9186">{pt.month}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

// 精選 24 色的色盤,色調跟整體「復古紙本」風格一致(用完才會開始用下面的演算法備援色)。
const DONUT_PALETTE = [
  "#6E8577", "#A8607A", "#BFA054", "#7C8B54", "#8E9AAF", "#C97B63",
  "#5B7F95", "#9B7EDE", "#D98B5F", "#4F8A7B", "#B85C7A", "#7D9471",
  "#8C6E4F", "#5E7A8C", "#A67B9E", "#7B9A6B", "#C08552", "#647A9E",
  "#9E7B6E", "#6B9A8C", "#B88CA6", "#8A9E5B", "#A65B6E", "#5B8AA6",
];

// 產品代號的數量沒有上限,色盤用完之後,用 HSL 色相環演算法自動生成新顏色(黃金角度旋轉,確保彼此夠好分辨),
// 而不是讓顏色從頭循環重複——避免產品一多,兩個不同代號被畫成同一個顏色而看不出差異。
function colorForIndex(i) {
  if (i < DONUT_PALETTE.length) return DONUT_PALETTE[i];
  const hue = (i * 137.508) % 360; // 黃金角度,讓色相盡量分散
  return `hsl(${hue.toFixed(0)}, 46%, 48%)`;
}

function DonutChart({ data, size = 176, thickness = 30 }) {
  const total = data.reduce((s, d) => s + Math.max(0, d.value), 0);
  const r = size / 2;
  const rInner = r - thickness;
  const toXY = (deg, radius) => {
    const rad = ((deg - 90) * Math.PI) / 180;
    return [r + radius * Math.cos(rad), r + radius * Math.sin(rad)];
  };
  function arcPath(startDeg, sweepDeg) {
    if (sweepDeg <= 0) return "";
    const endDeg = Math.min(startDeg + sweepDeg, startDeg + 359.999);
    const large = sweepDeg > 180 ? 1 : 0;
    const [x1, y1] = toXY(startDeg, r);
    const [x2, y2] = toXY(endDeg, r);
    const [x3, y3] = toXY(endDeg, rInner);
    const [x4, y4] = toXY(startDeg, rInner);
    return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${rInner} ${rInner} 0 ${large} 0 ${x4} ${y4} Z`;
  }
  let angle = 0;
  const arcs = data.map((d) => {
    const value = Math.max(0, d.value);
    const frac = total > 0 ? value / total : 0;
    const start = angle;
    const sweep = frac * 360;
    angle += sweep;
    return { ...d, start, sweep, frac };
  });
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
      {arcs.filter((a) => a.sweep > 0).map((a, i) => (
        <path key={i} d={arcPath(a.start, a.sweep)} fill={a.color}>
          <title>{a.label}：{(a.frac * 100).toFixed(1)}%</title>
        </path>
      ))}
      <circle cx={r} cy={r} r={rInner - 1} fill="var(--paper-raised)" />
    </svg>
  );
}

  async function exportPDF() {
    if (!window.html2canvas || !window.jspdf) {
      setError("PDF 匯出工具還沒載入完成,請確認網路連線後再試一次。");
      return;
    }
    setPdfExporting(true);
    setError(null);
    // 先展開所有收合中的「廣告成效分類」區塊,不然收合的內容不會被截進 PDF 裡。
    window.dispatchEvent(new Event(PERF_EXPAND_ALL_EVENT));
    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    document.body.classList.add("mal-exporting");
    try {
      const target = document.querySelector(".mal-shell");
      const canvas = await window.html2canvas(target, { scale: 2, backgroundColor: "#FAF7F2", useCORS: true });
      if (!canvas || !canvas.width || !canvas.height) {
        throw new Error("畫面擷取結果是空的(可能是字型或圖片跨網域限制導致),請重新整理頁面、等待字型與圖片都載入完成後再試一次。");
      }
      const { jsPDF } = window.jspdf;

      // Build a single page sized to the full content's aspect ratio, so nothing
      // gets sliced mid-row/mid-card the way fixed-height A4 pagination would.
      const pageWidthPt = 800;
      const pageHeightPt = (canvas.height * pageWidthPt) / canvas.width;
      const pdf = new jsPDF({
        orientation: pageHeightPt > pageWidthPt ? "p" : "l",
        unit: "pt",
        format: [pageWidthPt, pageHeightPt],
      });
      const imgData = canvas.toDataURL("image/jpeg", 0.95);
      pdf.addImage(imgData, "JPEG", 0, 0, pageWidthPt, pageHeightPt);

      const label =
        viewMode === "week"
          ? focusWeek
            ? `週報-${weekLabel(focusWeek).replace("~", "至")}`
            : "全部週份"
          : focusMonth
          ? monthLabel(focusMonth).replace("/", "-")
          : "全部月份";
      pdf.save(`品牌成效分析-${label}.pdf`);
    } catch (e) {
      setError("匯出 PDF 失敗:" + e.message);
    } finally {
      document.body.classList.remove("mal-exporting");
      setPdfExporting(false);
    }
  }

  function editCpaThreshold(brandId) {

      `設定「${brandName}」的 CPA 過高標準——每筆訂單成本(CPA)超過這個金額,系統會標示為「CPA 過高」。\n留空白可以清除這個品牌的標準。`,

  const MIN_FETCH_SPEND = 500;
  const MIN_API_GAP_MS = 1200; // 任兩次 Meta Graph API 請求之間的最小間隔(毫秒)

  // 所有打 Meta Graph API 的地方都要改叫這個,不要直接用 fetch()。
  // 它會確保「這一次要打的請求」跟「上一次真正打出去的請求」之間至少間隔 MIN_API_GAP_MS,
  // 不管上一次請求是來自周報表、月報表、批次、自動同步、或縮圖抓取,全部共用同一個計時器,
  // 所以就算使用者用兩個不同按鈕(先抓上週、再抓月報表)手動連續觸發,也一樣會被這裡擋下來排隊等待。
  async function throttledFetch(url, context) {
    const now = Date.now();
    const wait = lastApiCallRef.current + MIN_API_GAP_MS - now;
    if (wait > 0) await new Promise((r) => setTimeout(r, wait));
    lastApiCallRef.current = Date.now();
    try {
      return await fetch(url);
    } catch (e) {
      throw new Error(`${context || "呼叫 Meta API"}時網路請求失敗:${e.message}`);
    }
  }

  async function parseApiResponse(res, context) {
    let json;
    try {
      json = await res.json();
    } catch {
      throw new Error(`${context}回傳的內容無法解析(可能是網路中斷或 Meta 伺服器異常)。`);
    }
    if (!res.ok || json.error) {
      const code = json.error && json.error.code;
      const sub = json.error && json.error.error_subcode;
      const msg = (json.error && json.error.message) || `HTTP ${res.status}`;
      const err = new Error(`${context}失敗(錯誤代碼 ${code || res.status}${sub ? "/" + sub : ""}):${msg}`);
      err.code = code;
      err.subcode = sub;
      throw err;
    }
    return json;
  }

  // 統一包裝「打 API + 解析回應」,遇到 Meta 那邊回傳的暫時性錯誤時,自動等一下重試,不用使用者手動再按一次。
  // 錯誤代碼 1(含各種 subcode,例如 1/99)跟 2 都是 Meta 官方文件裡列為「建議直接重試」的暫時性錯誤,
  // 跟權杖/帳號 ID/權限完全無關,常見原因是短時間內打太多次 API(不管是你自己、同事,或自動同步同時在跑)。
  async function fetchGraphApi(url, context, retriesLeft = 2) {
    const res = await throttledFetch(url, context);
    try {
      return await parseApiResponse(res, context);
    } catch (e) {
      if ((e.code === 1 || e.code === 2) && retriesLeft > 0) {
        const waitMs = retriesLeft === 2 ? 3000 : 6000; // 重試間隔逐次拉長,給 Meta 那邊更多喘息時間
        await new Promise((r) => setTimeout(r, waitMs));
        return fetchGraphApi(url, context, retriesLeft - 1);
      }
      throw e;
    }
  }

  // 查廣告帳號自己的時區(跟 UTC 差幾小時),讓「上週一~週日」的日期範圍照這個帳號自己的時區去算,
  // 而不是照瀏覽器所在的時區——不然帳號時區跟瀏覽器不同的話,算出來的週報表區間會跟 Meta 後台的「上週」對不起來,
  // 花費、轉單數、CPA、ROAS 就會整批兜不起來(尤其是靠近週一/週日交界的那幾筆資料)。
  // 抓不到時區也不讓它卡住整個流程,直接退回用瀏覽器時區。
  async function fetchAccountUtcOffset(token, accountId) {
    try {
      const json = await fetchGraphApi(
        `https://graph.facebook.com/v19.0/act_${accountId}?fields=timezone_offset_hours_utc&access_token=${encodeURIComponent(token)}`,
        "讀取帳號時區"
      );
      return typeof json.timezone_offset_hours_utc === "number" ? json.timezone_offset_hours_utc : null;
    } catch {
      return null;
    }
  }

  function apiErrorHint(e) {
    const msg = (e && e.message) || "";
    if (e && (e.code === 1 || e.code === 2)) {
      return (
        "。這不是你的權杖或帳號 ID 設定錯誤——Meta 官方把這種錯誤歸類為「暫時性問題,建議直接重試」," +
        "常見原因是短時間內對同一個廣告帳號打太多次 API(可能是你自己連續按了好幾次、同事剛好也在同時間抓同一個品牌、" +
        "或自動同步跟手動抓取撞在一起),系統已經自動重試過,如果還是失敗,等 1~2 分鐘再試一次通常就會恢復。"
      );
    }
    if (/too many calls/i.test(msg) || /80004/.test(msg) || /error_subcode 2446079/i.test(msg)) {
      return "。這是 Meta 廣告帳號的呼叫頻率限制,不是設定錯誤——通常等 5~15 分鐘再試一次就會恢復,批次抓多個品牌時建議一次不要抓太多個。";
    }
    return "。請確認權杖沒過期、廣告帳號 ID 正確,且已授權 ads_read 權限。";
  }

  // relaxThreshold=true(目前只有「上週報表」會用到):篩選階段不會排除掉「目前還在投放中」的廣告,
  // 就算這支廣告這段期間花費還沒到 500,只要現在仍在投放,一樣會保留下來,方便看到剛起步/學習中的廣告。
  // 月報表(fetchOneBrandMonth)沒有帶這個參數,維持原本花費 ≥ 500 才留下的嚴格門檻。
  async function fetchInsightsForRange(token, accountId, since, until, relaxThreshold = false) {
    const encToken = encodeURIComponent(token);
    const timeRange = encodeURIComponent(JSON.stringify({ since, until }));

    // 0) account currency
    let currency = "TWD";
    try {
      const curJson = await fetchGraphApi(`https://graph.facebook.com/v19.0/act_${accountId}?fields=currency&access_token=${encToken}`, "讀取帳號幣別");
      if (curJson.currency) currency = curJson.currency;
    } catch { /* fall back to TWD, this call isn't critical */ }

    // 1) per-ad performance for the month
    // 關鍵參數 use_account_attribution_setting=true:讓這次 API 呼叫套用「這個廣告帳號自己在 Meta 後台設定的歸因窗口」,
    // 而不是 API 預設的歸因窗口。如果沒有這個參數,API 預設的歸因窗口通常比後台顯示用的寬(例如把 7 天內的點擊、
    // 甚至瀏覽後很久才發生的購買都算進來),會導致轉單數比 Meta 後台顯示的「結果」多出好幾倍,CPA 被嚴重低估、
    // ROAS 被嚴重高估——這正是造成轉單數跟後台數字差非常多倍的根本原因,不是重複計算的問題。
    let insightsUrl =
      `https://graph.facebook.com/v19.0/act_${accountId}/insights?level=ad&use_account_attribution_setting=true` +
      `&fields=ad_id,ad_name,spend,actions,action_values&time_range=${timeRange}&limit=500&access_token=${encToken}`;
    let rows = [];
    let page = 0;
    while (insightsUrl && page < 20) {
      const json = await fetchGraphApi(insightsUrl, "讀取成效資料");
      rows = rows.concat(json.data || []);
      insightsUrl = json.paging && json.paging.next ? json.paging.next : null;
      page++;
    }

    if (!rows.length) {
      return { spend: 0, conversions: 0, revenue: 0, campaigns: 0, currency, accountId, ads: [], syncedAt: new Date().toISOString() };
    }

    // 2) thumbnails + UTM tags + 投放狀態 + 所屬行銷活動,matched by ad_id (more reliable than name)
    // 這一步要放在篩選門檻「之前」,因為 relaxThreshold 模式需要用投放狀態來決定要不要放行低花費的廣告。
    // 只查「這段期間真的有花費紀錄」的廣告 ID,不要掃整個帳號的歷史廣告,避免觸發 Meta 帳號層級的頻率限制。
    const periodAdIds = [...new Set(rows.map((r) => r.ad_id).filter(Boolean))];
    let thumbMap = {};
    let utmMap = {};
    let statusMap = {};
    let campaignMap = {};
    let startDateMap = {};
    let storyIdMap = {}; // ad.id -> effective_object_story_id(這支廣告素材背後對應的前台貼文 ID,不是每支廣告都有)
    const ID_CHUNK_SIZE = 50;
    for (let i = 0; i < periodAdIds.length; i += ID_CHUNK_SIZE) {
      const chunk = periodAdIds.slice(i, i + ID_CHUNK_SIZE);
      const filtering = encodeURIComponent(JSON.stringify([{ field: "id", operator: "IN", value: chunk }]));
      let adsUrl =
        `https://graph.facebook.com/v19.0/act_${accountId}/ads?fields=id,name,url_tags,effective_status,created_time,campaign{name},adset{start_time},creative{thumbnail_url,image_url,url_tags,effective_object_story_id}` +
        `&filtering=${filtering}&limit=500&access_token=${encToken}`;
      let page2 = 0;
      while (adsUrl && page2 < 5) {
        const json = await fetchGraphApi(adsUrl, "讀取廣告清單");
        (json.data || []).forEach((ad) => {
          const thumb = ad.creative && (ad.creative.thumbnail_url || ad.creative.image_url);
          if (thumb) thumbMap[ad.id] = thumb;
          // 有些廣告(例如動態素材/型錄類廣告)的追蹤參數是設在「創意」層級,不是廣告本身,
          // 所以廣告本身的 url_tags 抓不到值時,再退回去看創意底下的 url_tags。
          const tags = ad.url_tags || (ad.creative && ad.creative.url_tags) || "";
          if (tags) utmMap[ad.id] = extractUtmValue(tags);
          statusMap[ad.id] = ad.effective_status || "UNKNOWN";
          if (ad.campaign && ad.campaign.name) campaignMap[ad.id] = ad.campaign.name;
          // 投放起始時間:優先用廣告組合(adset)排定的開始時間,最貼近實際開始投放的日期;
          // 抓不到的話(例如舊資料、權限限制)退回用廣告本身的建立時間,當作大概的參考。
          const startRaw = (ad.adset && ad.adset.start_time) || ad.created_time || "";
          if (startRaw) startDateMap[ad.id] = startRaw;
          if (ad.creative && ad.creative.effective_object_story_id) storyIdMap[ad.id] = ad.creative.effective_object_story_id;
        });
        adsUrl = json.paging && json.paging.next ? json.paging.next : null;
        page2++;
      }
    }

    // 前台發表時間:貼文本身原本在粉專上發佈的時間,跟「投放起始時間」是不同的東西
    // (例如拿一則很久以前的舊貼文來投放廣告,貼文發佈時間會比開始投放時間早很多)。
    // 用批次查詢一次把這段期間所有廣告用到的貼文發佈時間都抓回來,不是一支廣告分開查一次,
    // 避免多打幾十次 API 拖慢速度、更容易撞到頻率限制。沒有對應貼文的廣告(素材是直接建立、不是沿用既有貼文),
    // 這裡就查不到值,畫面上會另外分區顯示,不會假裝有一個時間硬塞進去。
    const uniqueStoryIds = [...new Set(Object.values(storyIdMap))];
    let postPublishMap = {}; // story_id -> created_time
    for (let i = 0; i < uniqueStoryIds.length; i += ID_CHUNK_SIZE) {
      const chunk = uniqueStoryIds.slice(i, i + ID_CHUNK_SIZE);
      try {
        const json = await fetchGraphApi(
          `https://graph.facebook.com/v19.0/?ids=${chunk.join(",")}&fields=created_time&access_token=${encToken}`,
          "讀取貼文發佈時間"
        );
        Object.entries(json || {}).forEach(([storyId, obj]) => {
          if (obj && obj.created_time) postPublishMap[storyId] = obj.created_time;
        });
      } catch { /* 查不到就算了,對應廣告會被歸類到「沒有對應貼文」那一區,不會擋住其他資料 */ }
    }
    const adPostPublishMap = {}; // ad.id -> 貼文發佈時間(查得到的話)
    Object.entries(storyIdMap).forEach(([adId, storyId]) => {
      if (postPublishMap[storyId]) adPostPublishMap[adId] = postPublishMap[storyId];
    });

    // 3) 先用「完整、未篩選」的資料算總計——這樣廣告費/轉單數/轉單金額才會跟 Meta 後台的帳號總覽數字完全一致。
    // 後台的總計是把該期間「所有」廣告都算進去,不會因為某支廣告花費很小就不計入;
    // 如果只加總「花費 ≥ 500」的廣告,總計就會比後台實際數字少,CPA/ROAS 也會跟著失真。
    let totalSpend = 0, totalConv = 0, totalRev = 0;
    rows.forEach((row) => {
      totalSpend += parseFloat(row.spend) || 0;
      totalConv += pickPurchaseValue(row.actions);
      totalRev += pickPurchaseValue(row.action_values);
    });

    // 花費門檻只用來決定「廣告明細列表」要不要顯示這支廣告(避免清單被大量花費很少的測試廣告洗版),
    // 不會再影響上面的總計數字。
    const detailRows = rows.filter((row) => {
      const spend = parseFloat(row.spend) || 0;
      if (spend >= MIN_FETCH_SPEND) return true;
      if (relaxThreshold && statusMap[row.ad_id] === "ACTIVE") return true;
      return false;
    });

    // 4) aggregate, merging ads that share the same UTM tag —— 但「投放中」跟「已停止」的廣告絕對不會合併在一起,
    // 即使 UTM 追蹤代碼相同,只要目前的投放狀態不一樣,就會拆成不同的兩列,避免誤把已經停掉的舊數字跟現在還在跑的混在一起看。
    const grouped = {};
    detailRows.forEach((row) => {
      const spend = parseFloat(row.spend) || 0;
      const conversions = pickPurchaseValue(row.actions);
      const revenue = pickPurchaseValue(row.action_values);

      const adName = row.ad_name || "(未命名廣告)";
      const utm = utmMap[row.ad_id] || "";
      const isActive = statusMap[row.ad_id] === "ACTIVE";
      const groupKey = (utm ? "utm:" + utm : "ad:" + row.ad_id) + "::" + (isActive ? "on" : "off");
      if (!grouped[groupKey]) {
        grouped[groupKey] = { utm, names: new Set(), image: "", spend: 0, conversions: 0, revenue: 0, active: isActive, campaigns: new Set(), adIds: new Set(), startDate: null, postPublishDate: null };
      }
      const g = grouped[groupKey];
      g.names.add(adName);
      g.spend += spend; g.conversions += conversions; g.revenue += revenue;
      if (!g.image && thumbMap[row.ad_id]) g.image = thumbMap[row.ad_id];
      if (campaignMap[row.ad_id]) g.campaigns.add(campaignMap[row.ad_id]);
      if (row.ad_id) g.adIds.add(row.ad_id);
      // 如果這個群組是合併了好幾支廣告(同一個 UTM 追蹤代碼),投放起始時間取「最早」的那個,
      // 代表這個素材/追蹤代碼最初是什麼時候開始投放的。
      const rowStart = startDateMap[row.ad_id];
      if (rowStart && (!g.startDate || rowStart < g.startDate)) g.startDate = rowStart;
      // 前台發表時間也是取最早的一筆;只要合併起來的廣告裡「有任何一支」查得到對應貼文,這個群組就算查得到。
      const rowPostPublish = adPostPublishMap[row.ad_id];
      if (rowPostPublish && (!g.postPublishDate || rowPostPublish < g.postPublishDate)) g.postPublishDate = rowPostPublish;
    });

    const ads = Object.values(grouped)
      .map((g) => {
        const nameList = [...g.names];
        const adCount = nameList.length || 1;
        const name =
          nameList.length === 0
            ? g.utm || "未命名廣告"
            : nameList.length === 1
            ? nameList[0]
            : `${nameList[0]} 等 ${nameList.length} 支廣告`;
        const campaignList = [...g.campaigns];
        const campaign = campaignList.length ? campaignList.join(" / ") : "(未分類活動)";
        return {
          name, utm: g.utm, image: g.image, spend: g.spend, conversions: g.conversions, revenue: g.revenue,
          adCount, rawNames: nameList, active: g.active, campaign, adIds: [...g.adIds], startDate: g.startDate,
          postPublishDate: g.postPublishDate,
        };
      })
      .sort((a, b) => b.spend - a.spend);

    return { spend: totalSpend, conversions: totalConv, revenue: totalRev, campaigns: 0, currency, accountId, ads, syncedAt: new Date().toISOString() };
  }

  async function fetchLastWeekData() {
    if (!apiToken.trim() || !apiAccountId.trim()) {
      setApiError("請填入存取權杖跟廣告帳號 ID。");
      return;
    }
    setApiError(null);
    setApiNotice(null);
    setWeekLoading(true);
    try {
      const cleanId = apiAccountId.trim().replace(/^act_/, "");
      const tzOffset = await fetchAccountUtcOffset(apiToken.trim(), cleanId);
      const info = getLastWeekRange(tzOffset);
      const record = await fetchInsightsForRange(apiToken.trim(), cleanId, info.since, info.until, true);
      const brandIdToUse = await ensureBrandRegistered(cleanId);
      await storage.set(weekKeyFor(brandIdToUse, info.weekStart), JSON.stringify(record));
      setActiveBrandId(brandIdToUse);
      setWeekInfo(info);
      await loadAllWeeks(brandIdToUse);
      setFocusWeek(info.weekStart);
      setViewMode("week");
      setApiNotice(`已抓到上週(${info.since} ~ ${info.until})的資料,共 ${record.ads.length} 支廣告。`);
      setShowApiPanel(false);
    } catch (e) {
      setApiError("抓取失敗:" + e.message + apiErrorHint(e));
    } finally {
      setWeekLoading(false);
    }
  }

  // 自動回溯抓取過去 N 週(週一~週日),依序一週一週抓、中間間隔 4 秒避免觸發 Meta 頻率限制。
  // 每一週都是獨立呼叫 fetchInsightsForRange,所以就算某一週失敗,也不會影響其他週的結果。
  async function fetchRecentWeeksFromApi(weeksCount) {
    if (!apiToken.trim() || !apiAccountId.trim()) {
      setApiError("請填入存取權杖跟廣告帳號 ID。");
      return;
    }
    setApiError(null);
    setApiNotice(null);
    setWeekLoading(true);
    setShowApiPanel(false);
    try {
      const cleanId = apiAccountId.trim().replace(/^act_/, "");
      const brandIdToUse = await ensureBrandRegistered(cleanId);
      const tzOffset = await fetchAccountUtcOffset(apiToken.trim(), cleanId);

      const progress = [];
      for (let w = 1; w <= weeksCount; w++) {
        const info = getLastWeekRange(tzOffset, w);
        progress.push({ id: "w" + w, name: `${info.since} ~ ${info.until}`, status: "pending", message: "" });
      }
      setBatchProgress(progress);

      let lastInfo = null, successCount = 0, errorCount = 0;
      for (let w = 1; w <= weeksCount; w++) {
        setBatchProgress((prev) => prev.map((p, idx) => (idx === w - 1 ? { ...p, status: "running" } : p)));
        try {
          const info = getLastWeekRange(tzOffset, w);
          const record = await fetchInsightsForRange(apiToken.trim(), cleanId, info.since, info.until, true);
          await storage.set(weekKeyFor(brandIdToUse, info.weekStart), JSON.stringify(record));
          lastInfo = info;
          successCount++;
          setBatchProgress((prev) =>
            prev.map((p, idx) => (idx === w - 1 ? { ...p, status: record.ads.length ? "done" : "empty", message: `${record.ads.length} 支廣告` } : p))
          );
        } catch (e) {
          errorCount++;
          setBatchProgress((prev) => prev.map((p, idx) => (idx === w - 1 ? { ...p, status: "error", message: e.message } : p)));
        }
        if (w < weeksCount) await new Promise((r) => setTimeout(r, 4000));
      }

      setActiveBrandId(brandIdToUse);
      if (lastInfo) setWeekInfo(lastInfo);
      await loadAllWeeks(brandIdToUse);
      setViewMode("week");
      setApiNotice(`已抓取過去 ${weeksCount} 週的資料:成功 ${successCount} 週${errorCount > 0 ? `,失敗 ${errorCount} 週(可以之後單獨用「上週報表」模式補抓)` : ""}。`);
    } catch (e) {
      setApiError("抓取失敗:" + e.message + apiErrorHint(e));
    } finally {
      setWeekLoading(false);
    }
  }

  function computeWeekAnalysis(record) {
    if (!record) return [];
    const insights = [];
    const cpa = record.conversions > 0 ? record.spend / record.conversions : null;
    const roas = record.spend > 0 && record.revenue > 0 ? record.revenue / record.spend : null;

    if (roas !== null) {
      if (roas >= 3) insights.push(`ROAS ${roas.toFixed(2)}x,表現不錯,廣告花費有換回明顯的營收。`);
      else if (roas >= 1.5) insights.push(`ROAS ${roas.toFixed(2)}x,表現普通,還有優化空間。`);
      else insights.push(`ROAS ${roas.toFixed(2)}x,偏低,建議檢視這週表現差的廣告是否該關掉或調整素材。`);
    } else {
      insights.push("這週沒有轉換金額資料,無法計算 ROAS。");
    }

    if (cpa !== null) {
      insights.push(`平均每筆訂單成本(CPA)是 ${fmtMoney(cpa, record.currency)},轉單數共 ${fmtInt(record.conversions)} 筆。`);
    } else {
      insights.push("這週沒有任何轉單,檢查一下廣告是否正常投放中。");
    }

    const spendyAds = record.ads.filter((a) => a.spend >= 500);
    if (spendyAds.length) {
      const bestRoas = spendyAds
        .map((a) => ({ ...a, roasVal: a.spend > 0 && a.revenue > 0 ? a.revenue / a.spend : null }))
        .filter((a) => a.roasVal !== null)
        .sort((a, b) => b.roasVal - a.roasVal)[0];
      if (bestRoas) insights.push(`這週表現最好的廣告是「${bestRoas.name}」,ROAS 有 ${bestRoas.roasVal.toFixed(2)}x。`);

      const badOnes = spendyAds.filter((a) => a.spend > 0 && (a.revenue <= 0 || a.revenue / a.spend < 1));
      if (badOnes.length) {
        insights.push(`有 ${badOnes.length} 支花費超過 500 的廣告 ROAS 低於 1x(等於虧錢),建議優先檢查這些廣告。`);
      }
    }

    return insights;
  }

  // ---------- 投放中廣告成效分類(成效好 / 成效正常 / 成效不好 / 學習中) ----------
  const LEARNING_MIN_CONVERSIONS = 10; // 轉單數不足,還看不出真實成效,先歸類為「學習中」
  const PERF_LABELS = { good: "成效好", normal: "成效正常", poor: "成效不好", learning: "學習中" };
  const PERF_COLORS = { good: "var(--green)", normal: "var(--blue)", poor: "var(--red)", learning: "var(--amber)" };
  const PERF_ORDER = ["good", "normal", "poor", "learning"];

  function classifyAdPerformance(ad) {
    if (ad.conversions < LEARNING_MIN_CONVERSIONS) return "learning";
    const roas = ad.spend > 0 && ad.revenue > 0 ? ad.revenue / ad.spend : null;
    if (roas === null) return "poor";
    if (roas >= 3) return "good";
    if (roas >= 1.5) return "normal";
    return "poor";
  }

  function groupAdsByPerformance(ads) {
    // 這裡故意不只看「目前投放中」的廣告——花費超過門檻、已經停止但表現不好的廣告,
    // 也應該讓你看得到(不然「成效不好」分類永遠是空的,容易誤以為沒有表現差的廣告)。
    const qualifyingAds = (ads || []).filter((a) => a.spend >= MIN_AD_SPEND);
    const buckets = { good: [], normal: [], poor: [], learning: [] };
    qualifyingAds.forEach((ad) => {
      buckets[classifyAdPerformance(ad)].push(ad);
    });
    PERF_ORDER.forEach((k) => buckets[k].sort((a, b) => b.spend - a.spend));
    return { qualifyingAds, buckets };
  }

  // ---------- 行銷活動(campaign)整體成效分析 ----------
  function computeCampaignStats(ads) {
    const activeAds = (ads || []).filter((a) => a.active);
    const campaignMap = {};
    activeAds.forEach((ad) => {
      const key = ad.campaign || "(未分類活動)";
      if (!campaignMap[key]) campaignMap[key] = { name: key, spend: 0, conversions: 0, revenue: 0, adCount: 0 };
      const c = campaignMap[key];
      c.spend += ad.spend;
      c.conversions += ad.conversions;
      c.revenue += ad.revenue;
      c.adCount += 1;
    });
    return Object.values(campaignMap)
      .map((c) => ({
        ...c,
        cpa: c.conversions > 0 ? c.spend / c.conversions : null,
        roas: c.spend > 0 && c.revenue > 0 ? c.revenue / c.spend : null,
      }))
      .sort((a, b) => b.spend - a.spend);
  }

  function computeCampaignInsights(campaignStats, currencyCode) {
    if (!campaignStats.length) return ["目前沒有偵測到任何投放中的廣告,無法進行行銷活動分析。"];
    const insights = [];
    const totalSpend = campaignStats.reduce((s, c) => s + c.spend, 0);
    const totalConv = campaignStats.reduce((s, c) => s + c.conversions, 0);
    const totalRev = campaignStats.reduce((s, c) => s + c.revenue, 0);
    const overallRoas = totalSpend > 0 && totalRev > 0 ? totalRev / totalSpend : null;
    insights.push(
      `目前投放中的活動共 ${campaignStats.length} 個,總花費 ${fmtMoney(totalSpend, currencyCode)},轉單 ${fmtInt(totalConv)} 筆${overallRoas !== null ? `,整體 ROAS ${overallRoas.toFixed(2)}x` : ""}。`
    );
    const withRoas = campaignStats.filter((c) => c.roas !== null);
    if (withRoas.length) {
      const best = withRoas.slice().sort((a, b) => b.roas - a.roas)[0];
      insights.push(`表現最好的活動是「${best.name}」,ROAS 有 ${best.roas.toFixed(2)}x。`);
      const worst = withRoas.slice().sort((a, b) => a.roas - b.roas)[0];
      if (worst.name !== best.name && worst.roas < 1.5) {
        insights.push(`表現較弱的活動是「${worst.name}」,ROAS 只有 ${worst.roas.toFixed(2)}x,建議檢視受眾或素材。`);
      }
    } else {
      insights.push("目前投放中的活動都還沒有足夠的轉換金額資料,先持續觀察。");
    }
    const noDataCampaigns = campaignStats.filter((c) => c.conversions < LEARNING_MIN_CONVERSIONS);
    if (noDataCampaigns.length) {
      insights.push(`有 ${noDataCampaigns.length} 個活動轉單數還不到 ${LEARNING_MIN_CONVERSIONS} 筆,屬於學習中階段,建議再觀察一段時間再下結論。`);
    }
    return insights;
  }

  // 依「行銷活動名稱」最前面的括號(例如「【RS】」「【AP】」)自動歸類,統計各產品的營業額/廣告費佔比與利潤。
  // 產品代號完全依實際行銷活動名稱動態產生——新增產品時只要照同一套命名規則建立行銷活動,
  // 不需要在系統裡手動登記新產品,代號就會自動出現在分析裡。
  // 「一頁式正確業績」比對區塊:後台每日收益表匯入後的實際營收/廣告費,vs. Meta 回報的轉單金額,依產品代號逐一比對落差。
  function LedgerVsMetaComparison({ ads, currencyCode, ledgerAgg, onOpenImport, periodLabel }) {
    if (!ledgerAgg) {
      return (
        <div className="mal-empty">
          <p>這個{periodLabel}還沒有匯入後台的「每日收益表」,沒辦法比對後台實際業績跟 Meta 回報的落差。</p>
          <button className="mal-btn mal-btn-primary" onClick={onOpenImport}>📥 匯入後台每日收益表</button>
        </div>
      );
    }
    const metaBreak = buildProductBreakdown(ads || [], MIN_AD_SPEND);
    const metaByCode = {};
    metaBreak.rows.forEach((r) => { metaByCode[r.code] = r; });
    const codes = Array.from(new Set([...Object.keys(ledgerAgg.byCode), ...Object.keys(metaByCode)])).sort();
    let totalBackendRevenue = 0, totalMetaRevenue = 0, totalBackendSpend = 0, totalMetaSpend = 0;
    const rows = codes.map((code) => {
      const b = ledgerAgg.byCode[code];
      const m = metaByCode[code];
      const backendRevenue = b ? b.revenue : 0;
      const metaRevenue = m ? m.revenue : 0;
      const backendSpend = b ? b.spend : 0;
      const metaSpend = m ? m.spend : 0;
      totalBackendRevenue += backendRevenue; totalMetaRevenue += metaRevenue;
      totalBackendSpend += backendSpend; totalMetaSpend += metaSpend;
      const revGap = metaRevenue - backendRevenue;
      const revGapPct = backendRevenue > 0 ? (revGap / backendRevenue) * 100 : null;
      const spendGap = metaSpend - backendSpend;
      const spendGapPct = backendSpend > 0 ? (spendGap / backendSpend) * 100 : null;
      return { code, backendRevenue, metaRevenue, revGap, revGapPct, backendSpend, metaSpend, spendGap, spendGapPct, onlyBackend: !!b && !m, onlyMeta: !!m && !b };
    });
    const totalRevGap = totalMetaRevenue - totalBackendRevenue;
    const totalRevGapPct = totalBackendRevenue > 0 ? (totalRevGap / totalBackendRevenue) * 100 : null;
    const totalSpendGap = totalMetaSpend - totalBackendSpend;
    const totalSpendGapPct = totalBackendSpend > 0 ? (totalSpendGap / totalBackendSpend) * 100 : null;
    const onlyBackendCodes = rows.filter((r) => r.onlyBackend).map((r) => r.code);
    const onlyMetaCodes = rows.filter((r) => r.onlyMeta).map((r) => r.code);
    return (
      <>
        <div className="mal-cards" style={{ marginBottom: 18 }}>
          <div className="mal-card">
            <div className="mal-card-label">後台實際營收</div>
            <div className="mal-card-value">{fmtMoney(totalBackendRevenue, currencyCode)}</div>
          </div>
          <div className="mal-card">
            <div className="mal-card-label">Meta 回報營收</div>
            <div className="mal-card-value">{fmtMoney(totalMetaRevenue, currencyCode)}</div>
          </div>
          <div className="mal-card">
            <div className="mal-card-label">營收落差</div>
            <div className="mal-card-value">{fmtMoney(totalRevGap, currencyCode)}</div>
            {totalRevGapPct !== null && <DeltaBadge value={totalRevGapPct} />}
          </div>
          <div className="mal-card">
            <div className="mal-card-label">廣告費落差</div>
            <div className="mal-card-value">{fmtMoney(totalSpendGap, currencyCode)}</div>
            {totalSpendGapPct !== null && <DeltaBadge value={totalSpendGapPct} invert />}
          </div>
        </div>
        <div className="mal-scroll-wrap" style={{ overflowX: "auto" }}>
          <table className="mal-table mal-ledger-table">
            <thead>
              <tr>
                <th rowSpan={2} style={{ verticalAlign: "bottom" }}>產品代號</th>
                <th colSpan={3} className="mal-ledger-group-backend mal-ledger-group-label-backend" style={{ textAlign: "center" }}>🟩 後台實際業績</th>
                <th colSpan={2} className="mal-ledger-group-meta mal-ledger-group-label-meta" style={{ textAlign: "center" }}>🟧 Meta 回報業績</th>
                <th colSpan={2} className="mal-ledger-group-gap" style={{ textAlign: "center" }}>落差</th>
              </tr>
              <tr>
                <th className="mal-ledger-group-backend">營收</th>
                <th className="mal-ledger-group-backend">廣告費</th>
                <th className="mal-ledger-group-backend">廣告費佔比</th>
                <th className="mal-ledger-group-meta">營收</th>
                <th className="mal-ledger-group-meta">廣告費</th>
                <th className="mal-ledger-group-gap">營收落差%</th>
                <th className="mal-ledger-group-gap">廣告費落差%</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.code}>
                  <td>
                    {r.code}
                    {r.onlyBackend && <span style={{ fontSize: 10, color: "var(--red)", marginLeft: 4 }}>僅後台</span>}
                    {r.onlyMeta && <span style={{ fontSize: 10, color: "var(--red)", marginLeft: 4 }}>僅Meta</span>}
                  </td>
                  <td className="mal-ledger-group-backend">{fmtMoney(r.backendRevenue, currencyCode)}</td>
                  <td className="mal-ledger-group-backend">{fmtMoney(r.backendSpend, currencyCode)}</td>
                  <td className="mal-ledger-group-backend">{adPct(r.backendSpend, r.backendRevenue, adRatioThresholds[activeBrandId])}</td>
                  <td className="mal-ledger-group-meta">{fmtMoney(r.metaRevenue, currencyCode)}</td>
                  <td className="mal-ledger-group-meta">{fmtMoney(r.metaSpend, currencyCode)}</td>
                  <td className="mal-ledger-group-gap">{r.revGapPct !== null ? <DeltaBadge value={r.revGapPct} /> : "—"}</td>
                  <td className="mal-ledger-group-gap">{r.spendGapPct !== null ? `${r.spendGapPct >= 0 ? "+" : ""}${r.spendGapPct.toFixed(0)}%` : "—"}</td>
                </tr>
              ))}
              <tr>
                <td className="mal-row-month">合計</td>
                <td className="mal-ledger-group-backend mal-row-month">{fmtMoney(totalBackendRevenue, currencyCode)}</td>
                <td className="mal-ledger-group-backend mal-row-month">{fmtMoney(totalBackendSpend, currencyCode)}</td>
                <td className="mal-ledger-group-backend mal-row-month">{adPct(totalBackendSpend, totalBackendRevenue, adRatioThresholds[activeBrandId])}</td>
                <td className="mal-ledger-group-meta mal-row-month">{fmtMoney(totalMetaRevenue, currencyCode)}</td>
                <td className="mal-ledger-group-meta mal-row-month">{fmtMoney(totalMetaSpend, currencyCode)}</td>
                <td className="mal-ledger-group-gap mal-row-month">{totalRevGapPct !== null ? <DeltaBadge value={totalRevGapPct} /> : "—"}</td>
                <td className="mal-ledger-group-gap mal-row-month">{totalSpendGapPct !== null ? `${totalSpendGapPct >= 0 ? "+" : ""}${totalSpendGapPct.toFixed(0)}%` : "—"}</td>
              </tr>
            </tbody>
          </table>
        </div>
        <p style={{ fontSize: 11, color: "var(--ink-soft)", margin: "8px 0 0" }}>
          🟩 後台實際業績 = 匯入的每日收益表(以下單日期為準,已扣退換貨);🟧 Meta 回報業績 = Meta 廣告後台回報的轉換金額(以歸因時間為準)。落差% = (Meta − 後台) ÷ 後台。
        </p>
        <div className="mal-week-analysis">
          <div className="mal-week-analysis-title">基礎分析:為什麼會有落差</div>
          <ul>
            <li>歸因時間差:Meta 依廣告帳戶時區、點擊或瀏覽後 1~7 天內成立的轉換計算,後台則依「實際下單日期」計算,同一筆訂單可能被算進不同天,尤其影響跨月/跨週邊界。</li>
            <li>非 Meta 廣告帶來的訂單:自然流量、Google、社團、業配連結等其他渠道的訂單只會出現在後台,不會算進 Meta 回報的營收。</li>
            <li>退換貨與訂單取消:後台營收通常已扣除退貨/取消,Meta 的轉換數字多半不會事後修正,會讓 Meta 端顯示比實際偏高。</li>
            <li>轉換去重估算方式不同:Meta 用像素/CAPI 綜合估算轉換金額,與後台實際成立訂單金額本來就存在估算誤差。</li>
            {onlyBackendCodes.length > 0 && (
              <li>「{onlyBackendCodes.join("、")}」只有後台資料、Meta 端找不到對應代號,可能是這些商品目前沒有投放 Meta 廣告,或廣告活動命名沒有加上一致的產品代號。</li>
            )}
            {onlyMetaCodes.length > 0 && (
              <li>「{onlyMetaCodes.join("、")}」只有 Meta 資料、後台找不到對應,請確認是否已匯入這個{periodLabel}的後台報表,或後台的產品代號拼法是否一致。</li>
            )}
            {metaBreak.unresolved > 0 && (
              <li>Meta 端另有 {metaBreak.unresolved} 支廣告的行銷活動名稱沒有加上「【產品代號】」,沒有被算進上表,可能讓 Meta 端的營收被低估。</li>
            )}
          </ul>
        </div>
      </>
    );
  }

  function ProductShareBreakdown({ ads, currencyCode, prevAds, comparisonLabel = "上期" }) {
    if (!ads || !ads.length) {
      return <p style={{ color: "var(--ink-soft)", fontSize: 13.5 }}>目前還沒有足夠的資料可以分析業績比例。</p>;
    }
    const { rows, unresolved, excludedTestCount, lowSpendCount, lowSpendAmount, totalRevenue, totalSpend } =
      buildProductBreakdown(ads, MIN_AD_SPEND);
    if (!rows.length) {
      return (
        <div className="mal-empty">
          <p>目前的行銷活動名稱前面沒有辨識出「【產品代號】」,系統沒辦法自動統計各產品的業績比例。</p>
          <p style={{ fontSize: 12.5 }}>
            建議在行銷活動名稱最前面加上代號,例如「【RS】A+SC｜價值｜圖+影｜空間噴霧｜CPA」,
            之後新增產品也會自動被抓進來,不需要另外設定。
          </p>
        </div>
      );
    }
    // 上一期(上個月/上週)每個產品代號的營業額,用來算「與上期比」——兩期的營業額都是直接取用 Meta 回報的數字,沒有另外加工計算。
    const prevBreakdown = prevAds && prevAds.length ? buildProductBreakdown(prevAds, MIN_AD_SPEND) : null;
    const prevRevenueByCode = {};
    if (prevBreakdown) prevBreakdown.rows.forEach((r) => { prevRevenueByCode[r.code] = r.revenue; });
    const hasPrevData = !!prevBreakdown;
    const chartData = rows.map((r, i) => ({ label: r.code, value: r.revenue, color: colorForIndex(i) }));
    return (
      <>
        <div className="mal-chart-box" style={{ display: "flex", gap: 28, flexWrap: "wrap", alignItems: "center" }}>
          <DonutChart data={chartData} />
          <div style={{ flex: 1, minWidth: 200 }}>
            {chartData.map((d) => (
              <div key={d.label} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, marginBottom: 7 }}>
                <i className="mal-chart-dot" style={{ background: d.color, width: 10, height: 10, flexShrink: 0 }}></i>
                <span style={{ fontWeight: 600 }}>{d.label}</span>
                <span style={{ color: "var(--ink-soft)", marginLeft: "auto", fontFamily: "IBM Plex Mono, monospace" }}>
                  {totalRevenue > 0 ? ((d.value / totalRevenue) * 100).toFixed(0) : 0}%
                </span>
              </div>
            ))}
          </div>
        </div>
        <div className="mal-scroll-wrap" style={{ overflowX: "auto" }}>
          <table className="mal-table">
            <thead>
              <tr>
                <th>產品代號</th><th>廣告數</th><th>營業額(Meta 回報)</th><th>與{comparisonLabel}比</th>
                <th>廣告費</th><th>廣告費／營業額比</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => {
                const prevRevenue = hasPrevData ? prevRevenueByCode[r.code] : undefined;
                const isNewCode = hasPrevData && prevRevenue === undefined;
                return (
                  <tr key={r.code}>
                    <td>{r.code}</td>
                    <td>{r.count}</td>
                    <td>{fmtMoney(r.revenue, currencyCode)}</td>
                    <td>
                      {!hasPrevData ? (
                        "—"
                      ) : isNewCode ? (
                        <span style={{ fontSize: 11.5, color: "var(--ink-soft)" }}>新代號</span>
                      ) : (
                        <DeltaBadge value={pctChange(r.revenue, prevRevenue)} />
                      )}
                    </td>
                    <td>{fmtMoney(r.spend, currencyCode)}</td>
                    <td>{r.costRatio !== null ? `${r.costRatio.toFixed(0)}%` : "—"}</td>
                  </tr>
                );
              })}
              <tr>
                <td className="mal-row-month">合計</td>
                <td></td>
                <td>{fmtMoney(totalRevenue, currencyCode)}</td>
                <td>{hasPrevData ? <DeltaBadge value={pctChange(totalRevenue, prevBreakdown.totalRevenue)} /> : "—"}</td>
                <td>{fmtMoney(totalSpend, currencyCode)}</td>
                <td>{totalRevenue > 0 ? `${((totalSpend / totalRevenue) * 100).toFixed(0)}%` : "—"}</td>
              </tr>
            </tbody>
          </table>
        </div>
        {(unresolved > 0 || excludedTestCount > 0 || lowSpendCount > 0) && (
          <div style={{ fontSize: 12, color: "var(--ink-soft)", marginTop: 8, lineHeight: 1.8 }}>
            {unresolved > 0 && (
              <p style={{ margin: "4px 0" }}>
                另外有 {unresolved} 支廣告所屬的行銷活動名稱前面沒有加上「【產品代號】」,沒有被算進上面的分析。
              </p>
            )}
            {excludedTestCount > 0 && (
              <p style={{ margin: "4px 0" }}>
                另外有 {excludedTestCount} 支廣告所屬的行銷活動代號含有「test / 測試」字樣,判斷為測試活動,不算進上面的分析。
              </p>
            )}
            {lowSpendCount > 0 && (
              <p style={{ margin: "4px 0" }}>
                另外有 {lowSpendCount} 支廣告花費低於 {fmtMoney(MIN_AD_SPEND, currencyCode)} 且沒有轉單金額
                (合計 {fmtMoney(lowSpendAmount, currencyCode)}),為了避免資料量過大拖慢讀取,沒有算進上面的分析——
                這是合計金額跟頁面最上方總花費卡片對不起來的原因。
              </p>
            )}
          </div>
        )}
      </>
    );
  }

  function PerformanceBreakdown({ ads, currencyCode, accountId }) {
    const { qualifyingAds, buckets } = groupAdsByPerformance(ads);
    // 預設先把每一組收起來(不然「成效好」動輒上百支廣告,頁面會很長),
    // 點卡片跳過去的時候,才把該組展開,同時捲動過去。
    const [collapsed, setCollapsed] = useState({ good: true, normal: true, poor: true, learning: true });

    useEffect(() => {
      function handleExpandAll() {
        setCollapsed({ good: false, normal: false, poor: false, learning: false });
      }
      window.addEventListener(PERF_EXPAND_ALL_EVENT, handleExpandAll);
      return () => window.removeEventListener(PERF_EXPAND_ALL_EVENT, handleExpandAll);
    }, []);

    if (!qualifyingAds.length) return null;

    function jumpToBucket(k) {
      if (!buckets[k].length) return;
      setCollapsed((prev) => ({ ...prev, [k]: false }));
      // 等展開後 DOM 高度更新,再捲動,位置才會準——不然可能捲到展開前的舊位置。
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const el = document.getElementById(`mal-perf-bucket-${k}`);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });
    }

    function toggleBucket(k) {
      setCollapsed((prev) => ({ ...prev, [k]: !prev[k] }));
    }

    return (
      <>
        <h2 className="mal-section-title">
          廣告成效分類<span className="mal-section-count">(花費 ≥ {MIN_AD_SPEND} 的廣告共 {qualifyingAds.length} 支,含已停止)</span>
        </h2>
        <div className="mal-cards">
          {PERF_ORDER.map((k) => (
            <button
              type="button"
              key={k}
              className="mal-card mal-perf-card"
              disabled={!buckets[k].length}
              onClick={() => jumpToBucket(k)}
            >
              <div className="mal-perf-card-label" style={{ color: PERF_COLORS[k] }}>{PERF_LABELS[k]}</div>
              <div className="mal-card-value">{buckets[k].length}</div>
              {buckets[k].length > 0 && <div className="mal-perf-card-hint">↓ 點擊查看廣告明細</div>}
            </button>
          ))}
        </div>
        {PERF_ORDER.filter((k) => buckets[k].length > 0).map((k) => (
          <div key={k} id={`mal-perf-bucket-${k}`} className="mal-perf-section">
            <button type="button" className="mal-perf-section-header" onClick={() => toggleBucket(k)}>
              <span className="mal-perf-section-title" style={{ color: PERF_COLORS[k] }}>
                {PERF_LABELS[k]}<span className="mal-section-count">({buckets[k].length})</span>
              </span>
              <span className="mal-perf-section-chevron" style={{ transform: collapsed[k] ? "rotate(-90deg)" : "rotate(0deg)" }}>▾</span>
            </button>
            {!collapsed[k] && (
              <div className="mal-perf-section-body">
                <div className="mal-ad-list">
                  {buckets[k].map((ad, i) => {
                    const adCpa = ad.conversions > 0 ? ad.spend / ad.conversions : null;
                    const adRoas = ad.spend > 0 && ad.revenue > 0 ? ad.revenue / ad.spend : null;
                    const fbLink = fbAdsManagerLink(accountId, ad.adIds);
                    const fbLibLink = ad.active !== false ? fbAdLibraryLink(ad.adIds) : null;
                    return (
                      <div className={`mal-ad-row ${ad.active === false ? "mal-ad-row-inactive" : ""}`} key={ad.name + i}>
                        <AdThumb src={ad.image} alt={ad.name} />
                        <div className="mal-ad-info">
                          <div className="mal-ad-name" title={ad.name}>
                            {ad.name}
                            <ActiveBadge active={ad.active} />
                            {cpaThresholds[activeBrandId] != null && adCpa !== null && adCpa > cpaThresholds[activeBrandId] && (
                              <span style={{ color: "var(--red)", fontWeight: 600, fontSize: 11 }}> ⚠ CPA過高</span>
                            )}
                          </div>
                          <div className="mal-ad-utm" title={ad.campaign}>📣 {ad.campaign}</div>
                          {ad.startDate && <span className="mal-ad-startdate">🗓 {fmtStartDate(ad.startDate)} 開始投放</span>}
                          {fbLink && <a className="mal-ad-fblink" href={fbLink} target="_blank" rel="noopener noreferrer">↗ 前往廣告</a>}
                          {fbLibLink && <a className="mal-ad-fblink" href={fbLibLink} target="_blank" rel="noopener noreferrer">↗ 前往 FB 前台</a>}
                        </div>
                        <div className="mal-ad-stats">
                          <div><span>廣告費</span>{fmtMoney(ad.spend, currencyCode)}</div>
                          <div><span>轉單</span>{fmtInt(ad.conversions)}</div>
                          <div><span>轉單金額</span>{ad.revenue > 0 ? fmtMoney(ad.revenue, currencyCode) : "—"}</div>
                          <div><span>CPA</span>{adCpa !== null ? fmtMoney(adCpa, currencyCode) : "—"}</div>
                          <div><span>ROAS</span>{adRoas !== null ? `${adRoas.toFixed(2)}x` : "—"}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        ))}
      </>
    );
  }

  async function fetchFullMonthFromApi() {
    if (!apiToken.trim() || !apiAccountId.trim() || !apiMonth) {
      setApiError("請填入存取權杖、廣告帳號 ID,並選擇月份。");
      return;
    }
    setApiError(null);
    setApiNotice(null);
    setApiLoading(true);
    try {
      const cleanId = apiAccountId.trim().replace(/^act_/, "");
      await storage.set("meta-api-account-id", cleanId).catch(() => {});
      const record = await fetchOneBrandMonth(apiToken.trim(), cleanId, apiMonth);
      if (!record.ads.length) {
        setApiNotice(`${monthLabel(apiMonth)} 沒有抓到任何廣告成效資料,請確認該月份確實有花費紀錄。`);
        setApiLoading(false);
        return;
      }
      const brandIdToUse = await ensureBrandRegistered(cleanId);
      await storage.set(monthKeyFor(brandIdToUse, apiMonth), JSON.stringify(record));

      await loadAll(brandIdToUse);
      setFocusMonth(apiMonth);
      setApiNotice(`已從 API 抓到 ${monthLabel(apiMonth)} 的資料,共 ${record.ads.length} 支廣告。`);

    } catch (e) {
      setApiError("抓取失敗:" + e.message + apiErrorHint(e));
    } finally {
      setApiLoading(false);
    }
  }

  async function fetchBatchFromApi() {
    if (!apiToken.trim() || (batchGranularity === "month" && !apiMonth)) {
      setApiError("請填入存取權杖" + (batchGranularity === "month" ? "並選擇月份。" : "。"));
      return;
    }
    const targets = brands.filter((b) => selectedBatchBrandIds.includes(b.id));
    if (!targets.length) {
      setApiError("請至少勾選一個品牌。");
      return;
    }
    setApiError(null);
    setApiNotice(null);
    setApiLoading(true);
    const progress = targets.map((b) => ({ id: b.id, name: b.name, status: "pending", message: "" }));
    setBatchProgress(progress);
    let lastWeekRangeUsed = null;
    for (let i = 0; i < targets.length; i++) {
      const b = targets[i];
      setBatchProgress((prev) => prev.map((p, idx) => (idx === i ? { ...p, status: "running" } : p)));
      try {
        if (batchGranularity === "week") {
          // 每個品牌的廣告帳號時區可能不一樣,「上週」要分別依各自帳號的時區去算,
          // 不能整批共用同一組日期,不然時區跟瀏覽器不同的帳號會抓錯週次、數字對不起來。
          const tzOffset = await fetchAccountUtcOffset(apiToken.trim(), b.id);
          const weekRangeForThisBrand = getLastWeekRange(tzOffset);
          lastWeekRangeUsed = weekRangeForThisBrand;
          const record = await fetchInsightsForRange(apiToken.trim(), b.id, weekRangeForThisBrand.since, weekRangeForThisBrand.until, true);
          await storage.set(weekKeyFor(b.id, weekRangeForThisBrand.weekStart), JSON.stringify(record));
          setBatchProgress((prev) =>
            prev.map((p, idx) => (idx === i ? { ...p, status: record.ads.length ? "done" : "empty", message: `${record.ads.length} 支廣告` } : p))
          );
        } else {
          const record = await fetchOneBrandMonth(apiToken.trim(), b.id, apiMonth);
          await storage.set(monthKeyFor(b.id, apiMonth), JSON.stringify(record));
          setBatchProgress((prev) =>
            prev.map((p, idx) => (idx === i ? { ...p, status: record.ads.length ? "done" : "empty", message: `${record.ads.length} 支廣告` } : p))
          );
        }
      } catch (e) {
        setBatchProgress((prev) => prev.map((p, idx) => (idx === i ? { ...p, status: "error", message: e.message } : p)));
      }
      if (i < targets.length - 1) await new Promise((r) => setTimeout(r, 4000));
    }
    setApiLoading(false);
    if (batchGranularity === "week" && lastWeekRangeUsed) setWeekInfo(lastWeekRangeUsed);
    setApiNotice("批次抓取完成,上方可以切換品牌查看結果。");
    await loadAll(activeBrandId);
    await loadAllWeeks(activeBrandId);
  }

  async function toggleRememberToken(checked) {

      if (apiToken.trim()) await storage.set("meta-api-token", apiToken.trim()).catch(() => {});
    } else {

      await storage.delete("meta-api-token").catch(() => {});

      if (autoSyncEnabled) {
        setAutoSyncEnabled(false);
        await storage.set("meta-api-autosync", "0").catch(() => {});
      }
