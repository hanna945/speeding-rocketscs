  function editCpaThreshold(brandId) {
    const brandName = (brands.find((b) => b.id === brandId) || {}).name || brandId;
    const current = cpaThresholds[brandId];
    const input = window.prompt(
      `設定「${brandName}」的 CPA 過高標準——每筆訂單成本(CPA)超過這個金額,系統會標示為「CPA 過高」。\n留空白可以清除這個品牌的標準。`,
      current != null ? String(current) : ""
    );
    if (input === null) return; // 使用者按取消
    const trimmed = input.trim();
    const updated = { ...cpaThresholds };
    if (!trimmed) {
      delete updated[brandId];
    } else {
      const num = parseFloat(trimmed);
      if (isNaN(num) || num <= 0) {
        setApiError("CPA 標準請輸入一個大於 0 的數字。");
        return;
      }
      updated[brandId] = num;
    }
    setCpaThresholds(updated);
    storage.set("meta-api-cpa-thresholds", JSON.stringify(updated)).catch(() => {});
  }

  // 跟 editCpaThreshold 同一套模式:每個品牌各自的「廣告費佔比過高」標準(百分比),
  // 超過這個比例,每日報表(選一天/矩陣總覽)裡的廣告費佔比欄位會標紅提醒。
  function editAdRatioThreshold(brandId) {
    const brandName = (brands.find((b) => b.id === brandId) || {}).name || brandId;
    const current = adRatioThresholds[brandId];
    const input = window.prompt(
      `設定「${brandName}」的廣告費佔比過高標準——廣告費佔營收的比例超過這個百分比,會用黃字提醒;超過 30% 不管有沒有設定,一律用紅字提醒,比黃字更嚴重(只要輸入數字,例如想設 25%,輸入 25 就好,不用打 % 符號)。\n留空白可以清除這個品牌的標準(但超過 30% 紅字提醒不受影響,一定會顯示)。`,
      current != null ? String(current) : ""
    );
    if (input === null) return;
    const trimmed = input.trim();
    const updated = { ...adRatioThresholds };
    if (!trimmed) {
      delete updated[brandId];
    } else {
      const num = parseFloat(trimmed);
      if (isNaN(num) || num <= 0 || num > 100) {
        setApiError("廣告費佔比標準請輸入 0~100 之間的數字(百分比)。");
        return;
      }
      updated[brandId] = num;
    }
    setAdRatioThresholds(updated);
    storage.set("meta-api-adratio-thresholds", JSON.stringify(updated)).catch(() => {});
  }

  // 跟 editAdRatioThreshold 同一套模式:「投放成效報告」(週報表/月報表裡的卡片+長條圖+分級表格)
  // 用的 ROAS 目標倍數,沒設定的話預設 3(對應範例報表的「目標 3.0x」)。
  function editRoasTarget(brandId) {
    const brandName = (brands.find((b) => b.id === brandId) || {}).name || brandId;
    const current = roasTargets[brandId];
    const input = window.prompt(
      `設定「${brandName}」投放成效報告的 ROAS 目標倍數——用來判斷整體是否達標、每個代號屬於哪個效率等級(優秀/穩健/待優化/低效)。\n留空白會用預設值 3。`,
      current != null ? String(current) : ""
    );
    if (input === null) return;
    const trimmed = input.trim();
    const updated = { ...roasTargets };
    if (!trimmed) {
      delete updated[brandId];
    } else {
      const num = parseFloat(trimmed);
      if (isNaN(num) || num <= 0) {
        setApiError("ROAS 目標請輸入一個大於 0 的數字。");
        return;
      }
      updated[brandId] = num;
    }
    setRoasTargets(updated);
    storage.set("meta-api-roas-targets", JSON.stringify(updated)).catch(() => {});
  }

  // 產品代號本身沒辦法自動對應到「水光直播/水晶萃」這種中文名稱(廣告活動命名不夠固定,
  // 抓不出乾淨的名稱),讓使用者自己設定一次,之後「投放成效」圖表跟表格會顯示成「代號(名稱)」。
  function editProductName(brandId, code) {
    const brandNames = productNames[brandId] || {};
    const current = brandNames[code];
    const input = window.prompt(`設定「${code}」這個代號的顯示名稱(例如「前台文/舒華」)——會顯示成「${code}(你填的名稱)」。\n留空白會清除,只顯示代號本身。`, current || "");
    if (input === null) return;
    const trimmed = input.trim();
    const updatedBrandNames = { ...brandNames };
    if (!trimmed) {
      delete updatedBrandNames[code];
    } else {
      updatedBrandNames[code] = trimmed;
    }
    const updated = { ...productNames, [brandId]: updatedBrandNames };
    setProductNames(updated);
    storage.set("meta-api-product-names", JSON.stringify(updated)).catch(() => {});
  }

  async function saveCurrentAsBrand() {
    if (!apiAccountId.trim()) {
      setApiError("請先填廣告帳號 ID,才能存成常用品牌。");
      return;
    }
    const name = window.prompt("幫這個廣告帳號取個品牌名稱:");
    if (!name || !name.trim()) return;
    const cleanId = apiAccountId.trim().replace(/^act_/, "");
    const updated = [...brands.filter((b) => b.name !== name.trim()), { name: name.trim(), id: cleanId }];
    setBrands(updated);
    try {
      await storage.set("meta-api-brands", JSON.stringify(updated));
      // 同時記住這個帳號 ID 是「目前使用中」的,下次打開網頁時才會自動帶入,
      // 不用等到真的按下抓取資料才會被記住。
      await storage.set("meta-api-account-id", cleanId).catch(() => {});
      setApiNotice(`已將「${name.trim()}」存為常用品牌。`);
      setTimeout(() => setApiNotice(null), 4000);
    } catch {
      setApiError("儲存常用品牌失敗,請再試一次。");
    }
  }

  function selectBrand(name) {
    const found = brands.find((b) => b.name === name);
    if (found) {
      setApiAccountId(found.id);
      // 選了常用品牌後也立刻記住,這樣下次打開網頁會直接帶入這個品牌的帳號 ID。
      storage.set("meta-api-account-id", found.id).catch(() => {});
    }
  }

  async function deleteBrand(name) {
    const updated = brands.filter((b) => b.name !== name);
    setBrands(updated);
    try {
      await storage.set("meta-api-brands", JSON.stringify(updated));
    } catch {
      setApiError("刪除常用品牌失敗,請再試一次。");
    }
  }

  async function fetchOneBrandMonth(token, accountId, month) {
    const [y, m] = month.split("-").map(Number);
    const since = `${month}-01`;
    const lastDay = new Date(y, m, 0).getDate();
    const until = `${month}-${String(lastDay).padStart(2, "0")}`;
    return fetchInsightsForRange(token, accountId, since, until);
  }

  const MIN_FETCH_SPEND = 500;
  const MIN_API_GAP_MS = 1200; // 任兩次 Meta Graph API 請求之間的最小間隔(毫秒)

  // 所有打 Meta Graph API 的地方都要改叫這個,不要直接用 fetch()。
  // 它會確保「這一次要打的請求」跟「上一次真正打出去的請求」之間至少間隔 MIN_API_GAP_MS,
  // 不管上一次請求是來自周報表、月報表、批次、自動同步、或縮圖抓取,全部共用同一個計時器,
  // 所以就算使用者用兩個不同按鈕(先抓上週、再抓月報表)手動連續觸發,也一樣會被這裡擋下來排隊等待。
  async function throttledFetch(url, context) {
    const now = Date.now();
    const wait = lastApiCallRef.current + MIN_API_GAP_MS - now;
    if (wait > 0) await new Promise((r) => setTimeout(r, wait));
    lastApiCallRef.current = Date.now();
    try {
      return await fetch(url);
    } catch (e) {
      throw new Error(`${context || "呼叫 Meta API"}時網路請求失敗:${e.message}`);
    }
  }

  async function parseApiResponse(res, context) {
    let json;
    try {
      json = await res.json();
    } catch {
      throw new Error(`${context}回傳的內容無法解析(可能是網路中斷或 Meta 伺服器異常)。`);
    }
    if (!res.ok || json.error) {
      const code = json.error && json.error.code;
      const sub = json.error && json.error.error_subcode;
      const msg = (json.error && json.error.message) || `HTTP ${res.status}`;
      const err = new Error(`${context}失敗(錯誤代碼 ${code || res.status}${sub ? "/" + sub : ""}):${msg}`);
      err.code = code;
      err.subcode = sub;
      throw err;
    }
    return json;
  }

  // 統一包裝「打 API + 解析回應」,遇到 Meta 那邊回傳的暫時性錯誤時,自動等一下重試,不用使用者手動再按一次。
  // 錯誤代碼 1(含各種 subcode,例如 1/99)跟 2 都是 Meta 官方文件裡列為「建議直接重試」的暫時性錯誤,
  // 跟權杖/帳號 ID/權限完全無關,常見原因是短時間內打太多次 API(不管是你自己、同事,或自動同步同時在跑)。
  async function fetchGraphApi(url, context, retriesLeft = 2) {
    const res = await throttledFetch(url, context);
    try {
      return await parseApiResponse(res, context);
    } catch (e) {
      if ((e.code === 1 || e.code === 2) && retriesLeft > 0) {
        const waitMs = retriesLeft === 2 ? 3000 : 6000; // 重試間隔逐次拉長,給 Meta 那邊更多喘息時間
        await new Promise((r) => setTimeout(r, waitMs));
        return fetchGraphApi(url, context, retriesLeft - 1);
      }
      throw e;
    }
  }

  // 查廣告帳號自己的時區(跟 UTC 差幾小時),讓「上週一~週日」的日期範圍照這個帳號自己的時區去算,
  // 而不是照瀏覽器所在的時區——不然帳號時區跟瀏覽器不同的話,算出來的週報表區間會跟 Meta 後台的「上週」對不起來,
  // 花費、轉單數、CPA、ROAS 就會整批兜不起來(尤其是靠近週一/週日交界的那幾筆資料)。
  // 抓不到時區也不讓它卡住整個流程,直接退回用瀏覽器時區。
  async function fetchAccountUtcOffset(token, accountId) {
    try {
      const json = await fetchGraphApi(
        `https://graph.facebook.com/v19.0/act_${accountId}?fields=timezone_offset_hours_utc&access_token=${encodeURIComponent(token)}`,
        "讀取帳號時區"
      );
      return typeof json.timezone_offset_hours_utc === "number" ? json.timezone_offset_hours_utc : null;
    } catch {
      return null;
    }
  }

  function apiErrorHint(e) {
    const msg = (e && e.message) || "";
    if (e && (e.code === 1 || e.code === 2)) {
      return (
        "。這不是你的權杖或帳號 ID 設定錯誤——Meta 官方把這種錯誤歸類為「暫時性問題,建議直接重試」," +
        "常見原因是短時間內對同一個廣告帳號打太多次 API(可能是你自己連續按了好幾次、同事剛好也在同時間抓同一個品牌、" +
        "或自動同步跟手動抓取撞在一起),系統已經自動重試過,如果還是失敗,等 1~2 分鐘再試一次通常就會恢復。"
      );
    }
    if (/too many calls/i.test(msg) || /80004/.test(msg) || /error_subcode 2446079/i.test(msg)) {
      return "。這是 Meta 廣告帳號的呼叫頻率限制,不是設定錯誤——通常等 5~15 分鐘再試一次就會恢復,批次抓多個品牌時建議一次不要抓太多個。";
    }
    return "。請確認權杖沒過期、廣告帳號 ID 正確,且已授權 ads_read 權限。";
  }

  // relaxThreshold=true(目前只有「上週報表」會用到):篩選階段不會排除掉「目前還在投放中」的廣告,
  // 就算這支廣告這段期間花費還沒到 500,只要現在仍在投放,一樣會保留下來,方便看到剛起步/學習中的廣告。
  // 月報表(fetchOneBrandMonth)沒有帶這個參數,維持原本花費 ≥ 500 才留下的嚴格門檻。
  async function fetchInsightsForRange(token, accountId, since, until, relaxThreshold = false) {
    const encToken = encodeURIComponent(token);
    const timeRange = encodeURIComponent(JSON.stringify({ since, until }));

    // 0) account currency
    let currency = "TWD";
    try {
      const curJson = await fetchGraphApi(`https://graph.facebook.com/v19.0/act_${accountId}?fields=currency&access_token=${encToken}`, "讀取帳號幣別");
      if (curJson.currency) currency = curJson.currency;
    } catch { /* fall back to TWD, this call isn't critical */ }

    // 1) per-ad performance for the month
    // 關鍵參數 use_account_attribution_setting=true:讓這次 API 呼叫套用「這個廣告帳號自己在 Meta 後台設定的歸因窗口」,
    // 而不是 API 預設的歸因窗口。如果沒有這個參數,API 預設的歸因窗口通常比後台顯示用的寬(例如把 7 天內的點擊、
    // 甚至瀏覽後很久才發生的購買都算進來),會導致轉單數比 Meta 後台顯示的「結果」多出好幾倍,CPA 被嚴重低估、
    // ROAS 被嚴重高估——這正是造成轉單數跟後台數字差非常多倍的根本原因,不是重複計算的問題。
    let insightsUrl =
      `https://graph.facebook.com/v19.0/act_${accountId}/insights?level=ad&use_account_attribution_setting=true` +
      `&fields=ad_id,ad_name,spend,actions,action_values&time_range=${timeRange}&limit=500&access_token=${encToken}`;
    let rows = [];
    let page = 0;
    while (insightsUrl && page < 20) {
      const json = await fetchGraphApi(insightsUrl, "讀取成效資料");
      rows = rows.concat(json.data || []);
      insightsUrl = json.paging && json.paging.next ? json.paging.next : null;
      page++;
    }

    if (!rows.length) {
      return { spend: 0, conversions: 0, revenue: 0, campaigns: 0, currency, accountId, ads: [], syncedAt: new Date().toISOString() };
    }

    // 2) thumbnails + UTM tags + 投放狀態 + 所屬行銷活動,matched by ad_id (more reliable than name)
    // 這一步要放在篩選門檻「之前」,因為 relaxThreshold 模式需要用投放狀態來決定要不要放行低花費的廣告。
    // 只查「這段期間真的有花費紀錄」的廣告 ID,不要掃整個帳號的歷史廣告,避免觸發 Meta 帳號層級的頻率限制。
    const periodAdIds = [...new Set(rows.map((r) => r.ad_id).filter(Boolean))];
    let thumbMap = {};
    let utmMap = {};
    let statusMap = {};
    let campaignMap = {};
    let startDateMap = {};
    let storyIdMap = {}; // ad.id -> effective_object_story_id(這支廣告素材背後對應的前台貼文 ID,不是每支廣告都有)
    const ID_CHUNK_SIZE = 50;
    for (let i = 0; i < periodAdIds.length; i += ID_CHUNK_SIZE) {
      const chunk = periodAdIds.slice(i, i + ID_CHUNK_SIZE);
      const filtering = encodeURIComponent(JSON.stringify([{ field: "id", operator: "IN", value: chunk }]));
      let adsUrl =
        `https://graph.facebook.com/v19.0/act_${accountId}/ads?fields=id,name,url_tags,effective_status,created_time,campaign{name},adset{start_time},creative{thumbnail_url,image_url,url_tags,effective_object_story_id}` +
        `&filtering=${filtering}&limit=500&access_token=${encToken}`;
      let page2 = 0;
      while (adsUrl && page2 < 5) {
        const json = await fetchGraphApi(adsUrl, "讀取廣告清單");
        (json.data || []).forEach((ad) => {
          const thumb = ad.creative && (ad.creative.thumbnail_url || ad.creative.image_url);
          if (thumb) thumbMap[ad.id] = thumb;
          // 有些廣告(例如動態素材/型錄類廣告)的追蹤參數是設在「創意」層級,不是廣告本身,
          // 所以廣告本身的 url_tags 抓不到值時,再退回去看創意底下的 url_tags。
          const tags = ad.url_tags || (ad.creative && ad.creative.url_tags) || "";
          if (tags) utmMap[ad.id] = extractUtmValue(tags);
          statusMap[ad.id] = ad.effective_status || "UNKNOWN";
          if (ad.campaign && ad.campaign.name) campaignMap[ad.id] = ad.campaign.name;
          // 投放起始時間:優先用廣告組合(adset)排定的開始時間,最貼近實際開始投放的日期;
          // 抓不到的話(例如舊資料、權限限制)退回用廣告本身的建立時間,當作大概的參考。
          const startRaw = (ad.adset && ad.adset.start_time) || ad.created_time || "";
          if (startRaw) startDateMap[ad.id] = startRaw;
          if (ad.creative && ad.creative.effective_object_story_id) storyIdMap[ad.id] = ad.creative.effective_object_story_id;
        });
        adsUrl = json.paging && json.paging.next ? json.paging.next : null;
        page2++;
      }
    }

    // 前台發表時間:貼文本身原本在粉專上發佈的時間,跟「投放起始時間」是不同的東西
    // (例如拿一則很久以前的舊貼文來投放廣告,貼文發佈時間會比開始投放時間早很多)。
    // 用批次查詢一次把這段期間所有廣告用到的貼文發佈時間都抓回來,不是一支廣告分開查一次,
    // 避免多打幾十次 API 拖慢速度、更容易撞到頻率限制。沒有對應貼文的廣告(素材是直接建立、不是沿用既有貼文),
    // 這裡就查不到值,畫面上會另外分區顯示,不會假裝有一個時間硬塞進去。
    const uniqueStoryIds = [...new Set(Object.values(storyIdMap))];
    let postPublishMap = {}; // story_id -> created_time
    for (let i = 0; i < uniqueStoryIds.length; i += ID_CHUNK_SIZE) {
      const chunk = uniqueStoryIds.slice(i, i + ID_CHUNK_SIZE);
      try {
        const json = await fetchGraphApi(
          `https://graph.facebook.com/v19.0/?ids=${chunk.join(",")}&fields=created_time&access_token=${encToken}`,
          "讀取貼文發佈時間"
        );
        Object.entries(json || {}).forEach(([storyId, obj]) => {
          if (obj && obj.created_time) postPublishMap[storyId] = obj.created_time;
        });
      } catch { /* 查不到就算了,對應廣告會被歸類到「沒有對應貼文」那一區,不會擋住其他資料 */ }
    }
    const adPostPublishMap = {}; // ad.id -> 貼文發佈時間(查得到的話)
    Object.entries(storyIdMap).forEach(([adId, storyId]) => {
      if (postPublishMap[storyId]) adPostPublishMap[adId] = postPublishMap[storyId];
    });

    // 3) 先用「完整、未篩選」的資料算總計——這樣廣告費/轉單數/轉單金額才會跟 Meta 後台的帳號總覽數字完全一致。
    // 後台的總計是把該期間「所有」廣告都算進去,不會因為某支廣告花費很小就不計入;
    // 如果只加總「花費 ≥ 500」的廣告,總計就會比後台實際數字少,CPA/ROAS 也會跟著失真。
    let totalSpend = 0, totalConv = 0, totalRev = 0;
    rows.forEach((row) => {
      totalSpend += parseFloat(row.spend) || 0;
      totalConv += pickPurchaseValue(row.actions);
      totalRev += pickPurchaseValue(row.action_values);
    });

    // 花費門檻只用來決定「廣告明細列表」要不要顯示這支廣告(避免清單被大量花費很少的測試廣告洗版),
    // 不會再影響上面的總計數字。
    const detailRows = rows.filter((row) => {
      const spend = parseFloat(row.spend) || 0;
      if (spend >= MIN_FETCH_SPEND) return true;
      if (relaxThreshold && statusMap[row.ad_id] === "ACTIVE") return true;
      return false;
    });

    // 4) aggregate, merging ads that share the same UTM tag —— 但「投放中」跟「已停止」的廣告絕對不會合併在一起,
    // 即使 UTM 追蹤代碼相同,只要目前的投放狀態不一樣,就會拆成不同的兩列,避免誤把已經停掉的舊數字跟現在還在跑的混在一起看。
    const grouped = {};
    detailRows.forEach((row) => {
      const spend = parseFloat(row.spend) || 0;
      const conversions = pickPurchaseValue(row.actions);
      const revenue = pickPurchaseValue(row.action_values);

      const adName = row.ad_name || "(未命名廣告)";
      const utm = utmMap[row.ad_id] || "";
      const isActive = statusMap[row.ad_id] === "ACTIVE";
      // 跟shopline-proxy後端同一個bug、同一套修法:UTM相同但行銷活動不同的廣告,不該被合併成一筆,
      // 分組key加上行銷活動名稱,兩個都相同才合併。
      const campaignName = campaignMap[row.ad_id] || "(未分類活動)";
      const groupKey = (utm ? "utm:" + utm : "ad:" + row.ad_id) + "::campaign:" + campaignName + "::" + (isActive ? "on" : "off");
      if (!grouped[groupKey]) {
        grouped[groupKey] = { utm, names: new Set(), image: "", postId: "", spend: 0, conversions: 0, revenue: 0, active: isActive, campaigns: new Set(), adIds: new Set(), startDate: null, postPublishDate: null };
      }
      const g = grouped[groupKey];
      g.names.add(adName);
      g.spend += spend; g.conversions += conversions; g.revenue += revenue;
      if (!g.image && thumbMap[row.ad_id]) g.image = thumbMap[row.ad_id];
      if (!g.postId && storyIdMap[row.ad_id]) g.postId = storyIdMap[row.ad_id];
      if (campaignMap[row.ad_id]) g.campaigns.add(campaignMap[row.ad_id]);
      if (row.ad_id) g.adIds.add(row.ad_id);
      // 如果這個群組是合併了好幾支廣告(同一個 UTM 追蹤代碼),投放起始時間取「最早」的那個,
      // 代表這個素材/追蹤代碼最初是什麼時候開始投放的。
      const rowStart = startDateMap[row.ad_id];
      if (rowStart && (!g.startDate || rowStart < g.startDate)) g.startDate = rowStart;
      // 前台發表時間也是取最早的一筆;只要合併起來的廣告裡「有任何一支」查得到對應貼文,這個群組就算查得到。
      const rowPostPublish = adPostPublishMap[row.ad_id];
      if (rowPostPublish && (!g.postPublishDate || rowPostPublish < g.postPublishDate)) g.postPublishDate = rowPostPublish;
    });

    const ads = Object.values(grouped)
      .map((g) => {
        const nameList = [...g.names];
        const adCount = nameList.length || 1;
        const name =
          nameList.length === 0
            ? g.utm || "未命名廣告"
            : nameList.length === 1
            ? nameList[0]
            : `${nameList[0]} 等 ${nameList.length} 支廣告`;
        const campaignList = [...g.campaigns];
        // 跟 shopline-proxy 後端同一個bug、同一個修法:同一個UTM群組如果合併了很多支分屬不同
        // Meta行銷活動的廣告,原本用join(" / ")全部接在一起會變成一長串看不懂的文字,
        // 改成跟上面 name 欄位同一套「只顯示第一個+等N個活動」的邏輯。
        const campaign =
          campaignList.length === 0
            ? "(未分類活動)"
            : campaignList.length === 1
            ? campaignList[0]
            : `${campaignList[0]} 等 ${campaignList.length} 個活動`;
        return {
          name, utm: g.utm, image: g.image, postId: g.postId, spend: g.spend, conversions: g.conversions, revenue: g.revenue,
          adCount, rawNames: nameList, active: g.active, campaign, adIds: [...g.adIds], startDate: g.startDate,
          postPublishDate: g.postPublishDate,
        };
      })
      .sort((a, b) => b.spend - a.spend);

    return { spend: totalSpend, conversions: totalConv, revenue: totalRev, campaigns: 0, currency, accountId, ads, syncedAt: new Date().toISOString() };
  }

  async function fetchLastWeekData() {
    if (!apiToken.trim() || !apiAccountId.trim()) {
      setApiError("請填入存取權杖跟廣告帳號 ID。");
      return;
    }
    setApiError(null);
    setApiNotice(null);
    setWeekLoading(true);
    try {
      const cleanId = apiAccountId.trim().replace(/^act_/, "");
      const tzOffset = await fetchAccountUtcOffset(apiToken.trim(), cleanId);
      const info = getLastWeekRange(tzOffset);
      const record = await fetchInsightsForRange(apiToken.trim(), cleanId, info.since, info.until, true);
      const brandIdToUse = await ensureBrandRegistered(cleanId);
      await storage.set(weekKeyFor(brandIdToUse, info.weekStart), JSON.stringify(record));
      setActiveBrandId(brandIdToUse);
      setWeekInfo(info);
      await loadAllWeeks(brandIdToUse);
      setFocusWeek(info.weekStart);
      setViewMode("week");
      setApiNotice(`已抓到上週(${info.since} ~ ${info.until})的資料,共 ${record.ads.length} 支廣告。`);
      setShowApiPanel(false);
    } catch (e) {
      setApiError("抓取失敗:" + e.message + apiErrorHint(e));
    } finally {
      setWeekLoading(false);
    }
  }

  // 自動回溯抓取過去 N 週(週一~週日),依序一週一週抓、中間間隔 4 秒避免觸發 Meta 頻率限制。
  // 每一週都是獨立呼叫 fetchInsightsForRange,所以就算某一週失敗,也不會影響其他週的結果。
  async function fetchRecentWeeksFromApi(weeksCount) {
    if (!apiToken.trim() || !apiAccountId.trim()) {
      setApiError("請填入存取權杖跟廣告帳號 ID。");
      return;
    }
    setApiError(null);
    setApiNotice(null);
    setWeekLoading(true);
    setShowApiPanel(false);
    try {
      const cleanId = apiAccountId.trim().replace(/^act_/, "");
      const brandIdToUse = await ensureBrandRegistered(cleanId);
      const tzOffset = await fetchAccountUtcOffset(apiToken.trim(), cleanId);

      const progress = [];
      for (let w = 1; w <= weeksCount; w++) {
        const info = getLastWeekRange(tzOffset, w);
        progress.push({ id: "w" + w, name: `${info.since} ~ ${info.until}`, status: "pending", message: "" });
      }
      setBatchProgress(progress);

      let lastInfo = null, successCount = 0, errorCount = 0;
      for (let w = 1; w <= weeksCount; w++) {
        setBatchProgress((prev) => prev.map((p, idx) => (idx === w - 1 ? { ...p, status: "running" } : p)));
        try {
          const info = getLastWeekRange(tzOffset, w);
          const record = await fetchInsightsForRange(apiToken.trim(), cleanId, info.since, info.until, true);
          await storage.set(weekKeyFor(brandIdToUse, info.weekStart), JSON.stringify(record));
          lastInfo = info;
          successCount++;
          setBatchProgress((prev) =>
            prev.map((p, idx) => (idx === w - 1 ? { ...p, status: record.ads.length ? "done" : "empty", message: `${record.ads.length} 支廣告` } : p))
          );
        } catch (e) {
          errorCount++;
          setBatchProgress((prev) => prev.map((p, idx) => (idx === w - 1 ? { ...p, status: "error", message: e.message } : p)));
        }
        if (w < weeksCount) await new Promise((r) => setTimeout(r, 4000));
      }

      setActiveBrandId(brandIdToUse);
      if (lastInfo) setWeekInfo(lastInfo);
      await loadAllWeeks(brandIdToUse);
      setViewMode("week");
      setApiNotice(`已抓取過去 ${weeksCount} 週的資料:成功 ${successCount} 週${errorCount > 0 ? `,失敗 ${errorCount} 週(可以之後單獨用「上週報表」模式補抓)` : ""}。`);
    } catch (e) {
      setApiError("抓取失敗:" + e.message + apiErrorHint(e));
    } finally {
      setWeekLoading(false);
    }
  }

  function computeWeekAnalysis(record) {
    if (!record) return [];
    const insights = [];
    const cpa = record.conversions > 0 ? record.spend / record.conversions : null;
    const roas = record.spend > 0 && record.revenue > 0 ? record.revenue / record.spend : null;

    if (roas !== null) {
      if (roas >= 3) insights.push(`ROAS ${roas.toFixed(2)}x,表現不錯,廣告花費有換回明顯的營收。`);
      else if (roas >= 1.5) insights.push(`ROAS ${roas.toFixed(2)}x,表現普通,還有優化空間。`);
      else insights.push(`ROAS ${roas.toFixed(2)}x,偏低,建議檢視這週表現差的廣告是否該關掉或調整素材。`);
    } else {
      insights.push("這週沒有轉換金額資料,無法計算 ROAS。");
    }

    if (cpa !== null) {
      insights.push(`平均每筆訂單成本(CPA)是 ${fmtMoney(cpa, record.currency)},轉單數共 ${fmtInt(record.conversions)} 筆。`);
    } else {
      insights.push("這週沒有任何轉單,檢查一下廣告是否正常投放中。");
    }

    const spendyAds = record.ads.filter((a) => a.spend >= 500);
    if (spendyAds.length) {
      const bestRoas = spendyAds
        .map((a) => ({ ...a, roasVal: a.spend > 0 && a.revenue > 0 ? a.revenue / a.spend : null }))
        .filter((a) => a.roasVal !== null)
        .sort((a, b) => b.roasVal - a.roasVal)[0];
      if (bestRoas) insights.push(`這週表現最好的廣告是「${bestRoas.name}」,ROAS 有 ${bestRoas.roasVal.toFixed(2)}x。`);

      const badOnes = spendyAds.filter((a) => a.spend > 0 && (a.revenue <= 0 || a.revenue / a.spend < 1));
      if (badOnes.length) {
        insights.push(`有 ${badOnes.length} 支花費超過 500 的廣告 ROAS 低於 1x(等於虧錢),建議優先檢查這些廣告。`);
      }
    }

    return insights;
  }

  // ---------- 投放中廣告成效分類(成效好 / 成效正常 / 成效不好 / 學習中) ----------
  const LEARNING_MIN_CONVERSIONS = 10; // 轉單數不足,還看不出真實成效,先歸類為「學習中」
  const PERF_LABELS = { good: "成效好", normal: "成效正常", poor: "成效不好", learning: "學習中" };
  const PERF_COLORS = { good: "var(--green)", normal: "var(--blue)", poor: "var(--red)", learning: "var(--amber)" };
  const PERF_ORDER = ["good", "normal", "poor", "learning"];

  function classifyAdPerformance(ad) {
    if (ad.conversions < LEARNING_MIN_CONVERSIONS) return "learning";
    const roas = ad.spend > 0 && ad.revenue > 0 ? ad.revenue / ad.spend : null;
    if (roas === null) return "poor";
    if (roas >= 3) return "good";
    if (roas >= 1.5) return "normal";
    return "poor";
  }

  function groupAdsByPerformance(ads) {
    // 這裡故意不只看「目前投放中」的廣告——花費超過門檻、已經停止但表現不好的廣告,
    // 也應該讓你看得到(不然「成效不好」分類永遠是空的,容易誤以為沒有表現差的廣告)。
    const qualifyingAds = (ads || []).filter((a) => a.spend >= MIN_AD_SPEND);
    const buckets = { good: [], normal: [], poor: [], learning: [] };
    qualifyingAds.forEach((ad) => {
      buckets[classifyAdPerformance(ad)].push(ad);
    });
    PERF_ORDER.forEach((k) => buckets[k].sort((a, b) => b.spend - a.spend));
    return { qualifyingAds, buckets };
  }

  // ---------- 行銷活動(campaign)整體成效分析 ----------
  function computeCampaignStats(ads) {
    const activeAds = (ads || []).filter((a) => a.active);
    const campaignMap = {};
    activeAds.forEach((ad) => {
      const key = ad.campaign || "(未分類活動)";
      if (!campaignMap[key]) campaignMap[key] = { name: key, spend: 0, conversions: 0, revenue: 0, adCount: 0 };
      const c = campaignMap[key];
      c.spend += ad.spend;
      c.conversions += ad.conversions;
      c.revenue += ad.revenue;
      c.adCount += 1;
    });
    return Object.values(campaignMap)
      .map((c) => ({
        ...c,
        cpa: c.conversions > 0 ? c.spend / c.conversions : null,
        roas: c.spend > 0 && c.revenue > 0 ? c.revenue / c.spend : null,
      }))
      .sort((a, b) => b.spend - a.spend);
  }

  function computeCampaignInsights(campaignStats, currencyCode) {
    if (!campaignStats.length) return ["目前沒有偵測到任何投放中的廣告,無法進行行銷活動分析。"];
    const insights = [];
    const totalSpend = campaignStats.reduce((s, c) => s + c.spend, 0);
    const totalConv = campaignStats.reduce((s, c) => s + c.conversions, 0);
    const totalRev = campaignStats.reduce((s, c) => s + c.revenue, 0);
    const overallRoas = totalSpend > 0 && totalRev > 0 ? totalRev / totalSpend : null;
    insights.push(
      `目前投放中的活動共 ${campaignStats.length} 個,總花費 ${fmtMoney(totalSpend, currencyCode)},轉單 ${fmtInt(totalConv)} 筆${overallRoas !== null ? `,整體 ROAS ${overallRoas.toFixed(2)}x` : ""}。`
    );
    const withRoas = campaignStats.filter((c) => c.roas !== null);
    if (withRoas.length) {
      const best = withRoas.slice().sort((a, b) => b.roas - a.roas)[0];
      insights.push(`表現最好的活動是「${best.name}」,ROAS 有 ${best.roas.toFixed(2)}x。`);
      const worst = withRoas.slice().sort((a, b) => a.roas - b.roas)[0];
      if (worst.name !== best.name && worst.roas < 1.5) {
        insights.push(`表現較弱的活動是「${worst.name}」,ROAS 只有 ${worst.roas.toFixed(2)}x,建議檢視受眾或素材。`);
      }
    } else {
      insights.push("目前投放中的活動都還沒有足夠的轉換金額資料,先持續觀察。");
    }
    const noDataCampaigns = campaignStats.filter((c) => c.conversions < LEARNING_MIN_CONVERSIONS);
    if (noDataCampaigns.length) {
      insights.push(`有 ${noDataCampaigns.length} 個活動轉單數還不到 ${LEARNING_MIN_CONVERSIONS} 筆,屬於學習中階段,建議再觀察一段時間再下結論。`);
    }
    return insights;
  }

  // 依「行銷活動名稱」最前面的括號(例如「【RS】」「【AP】」)自動歸類,統計各產品的營業額/廣告費佔比與利潤。
  // 產品代號完全依實際行銷活動名稱動態產生——新增產品時只要照同一套命名規則建立行銷活動,
  // 不需要在系統裡手動登記新產品,代號就會自動出現在分析裡。
  // 「一頁式正確業績」比對區塊:後台每日收益表匯入後的實際營收/廣告費,vs. Meta 回報的轉單金額,依產品代號逐一比對落差。
  // 週報告 / 下週規劃區塊——每個品牌、每個週期(週/月)各自獨立一份,存在KV,使用者自己編輯,
  // 不是系統自動產生的。三個子區塊對應 Hanna 提供的範例格式:下週操作方向(編號+標題+說明)、
  // 專案進度(負責人/預定完成日/進度/狀態燈號/說明)、素材調整方向(狀態燈號+標題+內容)。
  // 900ms 防抖自動儲存,不用按「儲存」按鈕,跟這裡其他設定(ROAS目標等)是不同的儲存模式——
  // 那些是「跳出視窗一次填完」,這裡是「持續編輯的長文字內容」,debounce autosave 比較適合。
  const WeeklyPlanningSection = React.forwardRef(function WeeklyPlanningSection(
    { storageKey, ads, currencyCode, roasTarget, periodLabel, brandName, minSpend },
    planRef
  ) {
    const [data, setData] = useState(null); // null = 載入中
    const [saveStatus, setSaveStatus] = useState("");
    const [aiLoading, setAiLoading] = useState(false);
    const [aiError, setAiError] = useState("");
    const [loadError, setLoadError] = useState("");
    const [lightboxImage, setLightboxImage] = useState(null); // 點縮圖放大看原圖用
    const saveTimerRef = useRef(null);
    // 待存檔的最新內容——跟 saveTimerRef 分開追蹤,是因為「立即存檔」(flush)要能在計時器
    // 還沒觸發前,直接把這裡記著的最新資料送出去,不用等900ms。之前的版本只靠setTimeout,
    // 使用者打完字後如果馬上切換品牌/週期/把App切到背景,計時器根本還沒觸發存檔動作就消失了,
    // 資料就真的遺失——這是這次修正的根本原因。
    const pendingSaveRef = useRef(null);

    function flushPendingSave() {
      if (saveTimerRef.current) {
        clearTimeout(saveTimerRef.current);
        saveTimerRef.current = null;
      }
      if (pendingSaveRef.current) {
        const { key, value } = pendingSaveRef.current;
        pendingSaveRef.current = null;
        // 頁面即將關閉/離開時的最後嘗試,這裡沒辦法再跳UI提示了(頁面都要關了),
        // 只能盡量送出去,送不出去也沒有更好的辦法,所以這裡維持吞掉錯誤。
        storageSetStrict(key, value).catch(() => {});
      }
    }

    useEffect(() => {
      let cancelled = false;
      setData(null);
      setLoadError("");
      (async () => {
        try {
          const res = await storageGetStrict(storageKey);
          if (cancelled) return;
          if (res && res.value) {
            try {
              setData(JSON.parse(res.value));
              return;
            } catch {}
          }
          setData({ actionItems: [], projects: [], materialIssues: [] });
        } catch (e) {
          if (cancelled) return;
          // 連不上雲端才會走到這裡(key不存在是正常回傳null,不會丟例外)——這時候不能顯示空白表單,
          // 因為畫面看起來會像「這期沒資料」,但實際上是「不知道有沒有資料,因為根本連不上去查」,
          // 兩者天差地遠,不能混為一談。
          setLoadError(e.message || "連不上雲端資料庫,無法確認這期是否已有內容。");
        }
      })();
      return () => { cancelled = true; };
    }, [storageKey]);

    // 三層保護,確保「還沒等到900ms就離開」的情境一定會把最新內容存下去:
    // ①頁面被切到背景/分頁不可見(手機切App、鎖螢幕最常見)②使用者關閉分頁/離開網站
    // ③這個元件本身被卸載(例如切換品牌或週期,key改變導致React整個重新建立元件實例)。
    useEffect(() => {
      function handleVisibilityChange() {
        if (document.visibilityState === "hidden") flushPendingSave();
      }
      document.addEventListener("visibilitychange", handleVisibilityChange);
      window.addEventListener("beforeunload", flushPendingSave);
      window.addEventListener("pagehide", flushPendingSave);
      return () => {
        document.removeEventListener("visibilitychange", handleVisibilityChange);
        window.removeEventListener("beforeunload", flushPendingSave);
        window.removeEventListener("pagehide", flushPendingSave);
        flushPendingSave();
      };
    }, []);

    async function performSave(next) {
      const value = JSON.stringify(next);
      pendingSaveRef.current = { key: storageKey, value };
      try {
        await storageSetStrict(storageKey, value);
        pendingSaveRef.current = null;
        setSaveStatus("已儲存 ✓");
        setTimeout(() => setSaveStatus(""), 2000);
      } catch (e) {
        // 特意不清空 pendingSaveRef——存檔失敗時保留這筆待存資料,之後flushPendingSave
        // (切換分頁/關閉頁面時)還有機會再試一次,不是失敗一次就徹底放棄這筆內容。
        pendingSaveRef.current = { key: storageKey, value };
        setSaveStatus(`⚠ 存檔失敗:${e.message || "未知錯誤"}(內容還留在畫面上,但還沒真的存進雲端,請勿關閉頁面,再按一次「立即儲存」重試)`);
      }
    }

    function scheduleSave(next) {
      setData(next);
      setSaveStatus("編輯中…");
      if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
      saveTimerRef.current = setTimeout(() => {
        saveTimerRef.current = null;
        performSave(next);
      }, 900);
    }

    // 明確的「立即儲存」按鈕——跳過900ms的debounce等待,直接存,而且有清楚的成功/失敗畫面回饋。
    // 自動存檔已經有debounce+分頁切換/關閉時的保護,這顆按鈕是給使用者「我現在就是想親眼確認存到了」
    // 的明確操作,兩者不衝突,按下這顆的時候就算debounce計時器還在跑,也會被取消、直接用這次的結果。
    function manualSave() {
      if (saveTimerRef.current) {
        clearTimeout(saveTimerRef.current);
        saveTimerRef.current = null;
      }
      setSaveStatus("儲存中…");
      performSave(data);
    }

    // AI分析:沿用「投放成效」同一套 buildProductBreakdown 邏輯算出逐代號數據,
    // 送去跟「投放成效」共用同一支 OpenAI 金鑰的另一支後端(material-issues.js,職責不同、金鑰共用),
    // 請AI挑出「值得下週特別調整」的系列,寫成標題+數據佐證+建議方向。是「新增建議草稿」進現有清單,
    // 不會清掉使用者已經手動寫好/編輯過的項目,AI生成的項目使用者一樣可以編輯或刪除。
    // 「下週操作方向」「素材調整方向」兩個子區塊的AI按鈕都呼叫這同一個函式——同一份期間數據,
    // 沒必要因為使用者按了兩個不同按鈕就打兩次OpenAI,拿到回應後兩個子區塊會一起更新。
    async function runAiMaterialAnalysis() {
      if (!data) return;
      setAiLoading(true);
      setAiError("");
      try {
        const { rows, totalRevenue, totalSpend } = buildProductBreakdown(ads || [], minSpend || 500);
        if (!rows.length) throw new Error("目前沒有足夠的資料可以分析。");
        const totalConversions = rows.reduce((s, r) => s + r.conversions, 0);
        const res = await fetch("/api/ai/material-issues", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...teamKeyHeaders() },
          body: JSON.stringify({
            brandName: brandName || "",
            periodLabel,
            roasTarget: roasTarget || 3,
            totals: { spend: totalSpend, revenue: totalRevenue, conversions: totalConversions, roas: totalSpend > 0 ? totalRevenue / totalSpend : null },
            rows: rows.map((r) => ({
              code: r.code,
              spend: r.spend,
              revenue: r.revenue,
              roas: r.spend > 0 && r.revenue > 0 ? r.revenue / r.spend : null,
              conversions: r.conversions,
              spendShare: totalSpend > 0 ? (r.spend / totalSpend) * 100 : 0,
            })),
          }),
        });
        const resData = await res.json().catch(() => null);
        if (!res.ok || !resData || resData.error) throw new Error((resData && resData.error) || `狀態碼 ${res.status}`);
        const newActionItems = Array.isArray(resData.actionItems)
          ? resData.actionItems.map((it) => ({ id: Date.now() + Math.random(), title: it.title || "", description: it.description || "" }))
          : [];
        const newMaterialIssues = Array.isArray(resData.materialIssues)
          ? resData.materialIssues.map((it) => ({
              id: Date.now() + Math.random(),
              title: it.title || "",
              status: it.status === "red" || it.status === "yellow" || it.status === "green" ? it.status : "red",
              category: it.category || "",
              content: it.content || "",
            }))
          : [];
        if (!newActionItems.length && !newMaterialIssues.length) {
          setAiError("AI 沒有回傳有效的分析內容,可能是資料量不足,可以稍後再試。");
          return;
        }
        scheduleSave({
          ...data,
          actionItems: [...data.actionItems, ...newActionItems],
          materialIssues: [...data.materialIssues, ...newMaterialIssues],
        });
        if (!newMaterialIssues.length) {
          setAiError("這段期間沒有挑出特別需要調整的系列(素材調整方向沒有新增項目),可能整體表現都還算健康——下週操作方向已經正常生成。");
        }
      } catch (e) {
        setAiError(e.message || String(e));
      } finally {
        setAiLoading(false);
      }
    }

    // 沒有依賴陣列,每次render都重新指定,理由跟AdPerformanceReport那邊一樣——確保外部觸發時
    // 拿到的一定是包著最新ads/props的版本。
    useImperativeHandle(planRef, () => ({ triggerAi: runAiMaterialAnalysis }));

    if (loadError) {
      return (
        <div className="mal-plan-load-error">
          <p>⚠ 週報告讀取失敗:{loadError}</p>
          <p style={{ fontSize: 12, marginTop: 4 }}>這不代表資料不存在,是暫時連不上雲端資料庫確認——請勿在這個狀態下新增內容,以免蓋掉原本已經存在雲端的資料。稍後重新整理再試一次。</p>
        </div>
      );
    }
    if (!data) return <p style={{ color: "var(--ink-soft)", fontSize: 13, marginTop: 32 }}>載入報告中…</p>;

    const STATUS_OPTIONS = [
      { value: "green", label: "🟢 照計畫" },
      { value: "yellow", label: "🟡 有風險" },
      { value: "red", label: "🔴 已落後/卡住" },
    ];

    function addActionItem() {
      scheduleSave({ ...data, actionItems: [...data.actionItems, { id: Date.now(), title: "", description: "" }] });
    }
    function updateActionItem(id, field, value) {
      scheduleSave({ ...data, actionItems: data.actionItems.map((it) => (it.id === id ? { ...it, [field]: value } : it)) });
    }
    function removeActionItem(id) {
      scheduleSave({ ...data, actionItems: data.actionItems.filter((it) => it.id !== id) });
    }
    function addProject() {
      scheduleSave({ ...data, projects: [...data.projects, { id: Date.now(), name: "", owner: "", dueDate: "", progress: "", status: "green", description: "", link: "", image: "" }] });
    }
    function updateProject(id, field, value) {
      scheduleSave({ ...data, projects: data.projects.map((it) => (it.id === id ? { ...it, [field]: value } : it)) });
    }
    function removeProject(id) {
      scheduleSave({ ...data, projects: data.projects.filter((it) => it.id !== id) });
    }
    // 圖片存進雲端資料庫時,是跟整份「週報告」文字內容存在同一個key裡(不是另外開檔案儲存空間),
    // 原圖(尤其手機拍的照片)動輒4-5MB,同時放幾張很容易撐爆單一key的儲存上限、也會讓每次
    // 存檔/讀取變慢。選好圖片後,先用畫布把長邊壓縮到最多960px、轉成JPEG(品質0.75)再存,
    // 壓縮後通常只有幾百KB,對「輔助說明用的示意圖」這種用途來說,畫質已經很夠用。
    function handleProjectImageUpload(id, file) {
      if (!file || !file.type.startsWith("image/")) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const MAX_DIM = 960;
          let { width, height } = img;
          if (width > MAX_DIM || height > MAX_DIM) {
            const ratio = Math.min(MAX_DIM / width, MAX_DIM / height);
            width = Math.round(width * ratio);
            height = Math.round(height * ratio);
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          const compressed = canvas.toDataURL("image/jpeg", 0.75);
          updateProject(id, "image", compressed);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }
    function addMaterialIssue() {
      scheduleSave({ ...data, materialIssues: [...data.materialIssues, { id: Date.now(), title: "", status: "red", category: "", content: "" }] });
    }
    function updateMaterialIssue(id, field, value) {
      scheduleSave({ ...data, materialIssues: data.materialIssues.map((it) => (it.id === id ? { ...it, [field]: value } : it)) });
    }
    function removeMaterialIssue(id) {
      scheduleSave({ ...data, materialIssues: data.materialIssues.filter((it) => it.id !== id) });
    }

    return (
      <>

          <h2 className="mal-section-title" style={{ margin: 0 }}>
            📋 週報告{saveStatus && (
              <span className={saveStatus.startsWith("⚠") ? "mal-plan-savestatus mal-plan-savestatus-error" : "mal-plan-savestatus"}> · {saveStatus}</span>
            )}
          </h2>

        {aiError && <p className="mal-plan-ai-error">⚠ {aiError}</p>}

            <div className="mal-plan-block-title">素材調整方向</div>
            <button className="mal-icon-btn" onClick={runAiMaterialAnalysis} disabled={aiLoading || !ads}>
              {aiLoading ? "🤖 分析中…" : "🤖 AI 分析"}
            </button>
          </div>
          {data.materialIssues.map((m) => (
            <div className="mal-plan-card" key={m.id}>
              <div className="mal-plan-card-row">
                <select className="mal-plan-select" value={m.status} onChange={(e) => updateMaterialIssue(m.id, "status", e.target.value)}>
                  {STATUS_OPTIONS.map((s) => <option key={s.value} value={s.value}>{s.label}</option>)}
                </select>
                <span className="mal-plan-select-export-text">{(STATUS_OPTIONS.find((s) => s.value === m.status) || {}).label}</span>
                <input className="mal-plan-input mal-plan-input-category" placeholder="分類" value={m.category || ""} onChange={(e) => updateMaterialIssue(m.id, "category", e.target.value)} />
                <input className="mal-plan-input mal-plan-input-title" placeholder="標題(例如:SR涼感衣吃掉最大預算,CPA偏高)" value={m.title} onChange={(e) => updateMaterialIssue(m.id, "title", e.target.value)} />
                <button className="mal-plan-remove" onClick={() => removeMaterialIssue(m.id)} title="刪除">✕</button>
              </div>
              <textarea className="mal-plan-textarea" placeholder="數據、問題點、建議方向…(可以換行分段)" rows={4} value={m.content} onChange={(e) => updateMaterialIssue(m.id, "content", e.target.value)} />
            </div>
          ))}
          <button className="mal-btn" onClick={addMaterialIssue}>+ 新增素材問題</button>
        </div>

        <div className="mal-plan-block">
          <div className="mal-plan-block-header">
            <div className="mal-plan-block-title">下週操作方向</div>
            <button className="mal-icon-btn" onClick={runAiMaterialAnalysis} disabled={aiLoading || !ads}>
              {aiLoading ? "🤖 分析中…" : "🤖 AI 分析"}
            </button>
          </div>
          {data.actionItems.map((item, i) => (
            <div className="mal-plan-card" key={item.id}>
              <div className="mal-plan-card-row">
                <span className="mal-plan-index">{String(i + 1).padStart(2, "0")}</span>

  function PerformanceBreakdown({ ads, currencyCode, accountId }) {
    const { qualifyingAds, buckets } = groupAdsByPerformance(ads);
    const brandPageId = derivePageIdFromAds(ads);
    // 預設先把每一組收起來(不然「成效好」動輒上百支廣告,頁面會很長),
    // 點卡片跳過去的時候,才把該組展開,同時捲動過去。
    const [collapsed, setCollapsed] = useState({ good: true, normal: true, poor: true, learning: true });

    useEffect(() => {
      function handleExpandAll() {
        setCollapsed({ good: false, normal: false, poor: false, learning: false });
      }
      window.addEventListener(PERF_EXPAND_ALL_EVENT, handleExpandAll);
      return () => window.removeEventListener(PERF_EXPAND_ALL_EVENT, handleExpandAll);
    }, []);

    if (!qualifyingAds.length) return null;

    function jumpToBucket(k) {
      if (!buckets[k].length) return;
      setCollapsed((prev) => ({ ...prev, [k]: false }));
      // 等展開後 DOM 高度更新,再捲動,位置才會準——不然可能捲到展開前的舊位置。
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const el = document.getElementById(`mal-perf-bucket-${k}`);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });
    }

    function toggleBucket(k) {
      setCollapsed((prev) => ({ ...prev, [k]: !prev[k] }));
    }

    return (
      <>
        <h2 className="mal-section-title">
          廣告成效分類<span className="mal-section-count">(花費 ≥ {MIN_AD_SPEND} 的廣告共 {qualifyingAds.length} 支,含已停止)</span>
        </h2>
        <div className="mal-cards">
          {PERF_ORDER.map((k) => (
            <button
              type="button"
              key={k}
              className="mal-card mal-perf-card"
              disabled={!buckets[k].length}
              onClick={() => jumpToBucket(k)}
            >
              <div className="mal-perf-card-label" style={{ color: PERF_COLORS[k] }}>{PERF_LABELS[k]}</div>
              <div className="mal-card-value">{buckets[k].length}</div>
              {buckets[k].length > 0 && <div className="mal-perf-card-hint">↓ 點擊查看廣告明細</div>}
            </button>
          ))}
        </div>
        {PERF_ORDER.filter((k) => buckets[k].length > 0).map((k) => (
          <div key={k} id={`mal-perf-bucket-${k}`} className="mal-perf-section">
            <button type="button" className="mal-perf-section-header" onClick={() => toggleBucket(k)}>
              <span className="mal-perf-section-title" style={{ color: PERF_COLORS[k] }}>
                {PERF_LABELS[k]}<span className="mal-section-count">({buckets[k].length})</span>
              </span>
              <span className="mal-perf-section-chevron" style={{ transform: collapsed[k] ? "rotate(-90deg)" : "rotate(0deg)" }}>▾</span>
            </button>
            {!collapsed[k] && (
              <div className="mal-perf-section-body">
                <div className="mal-ad-list">
                  {buckets[k].map((ad, i) => {
                    const adCpa = ad.conversions > 0 ? ad.spend / ad.conversions : null;
                    const adRoas = ad.spend > 0 && ad.revenue > 0 ? ad.revenue / ad.spend : null;
                    const fbLink = fbAdsManagerLink(accountId, ad.adIds);
                    const fbLibLink = fbPostLink(ad.postId);
                    return (
                      <div className={`mal-ad-row ${ad.active === false ? "mal-ad-row-inactive" : ""}`} key={ad.name + i}>
                        <AdThumb src={ad.image} alt={ad.name} />
                        <div className="mal-ad-info">
                          <div className="mal-ad-name" title={ad.name}>
                            {ad.name}
                            <ActiveBadge active={ad.active} />
                            {cpaThresholds[activeBrandId] != null && adCpa !== null && adCpa > cpaThresholds[activeBrandId] && (
                              <span style={{ color: "var(--red)", fontWeight: 600, fontSize: 11 }}> ⚠ CPA過高</span>
                            )}
                          </div>
                          <div className="mal-ad-utm" title={ad.campaign}>📣 {ad.campaign}</div>
                          {ad.startDate && <span className="mal-ad-startdate">🗓 {fmtStartDate(ad.startDate)} 開始投放</span>}
                          {fbLink && <a className="mal-ad-fblink" href={fbLink} target="_blank" rel="noopener noreferrer">↗ 前往廣告</a>}
                          {fbLibLink && <a className="mal-ad-fblink" href={fbLibLink} target="_blank" rel="noopener noreferrer">↗ 前往 FB 前台</a>}
                        {!fbLibLink && fbAdLibraryFallbackLink(brandPageId) && <a className="mal-ad-fblink" href={fbAdLibraryFallbackLink(brandPageId)} target="_blank" rel="noopener noreferrer" title="沒有找到對應貼文,改連到廣告檔案庫查詢,不一定查得到">↗ 前往廣告檔案庫查看(備用)</a>}
                        </div>
                        <div className="mal-ad-stats">
                          <div><span>廣告費</span>{fmtMoney(ad.spend, currencyCode)}</div>
                          <div><span>轉單</span>{fmtInt(ad.conversions)}</div>
                          <div><span>轉單金額</span>{ad.revenue > 0 ? fmtMoney(ad.revenue, currencyCode) : "—"}</div>
                          <div><span>CPA</span>{adCpa !== null ? fmtMoney(adCpa, currencyCode) : "—"}</div>
                          <div><span>ROAS</span>{adRoas !== null ? `${adRoas.toFixed(2)}x` : "—"}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        ))}
      </>
    );
  }

  async function fetchFullMonthFromApi() {
    if (!apiToken.trim() || !apiAccountId.trim() || !apiMonth) {
      setApiError("請填入存取權杖、廣告帳號 ID,並選擇月份。");
      return;
    }
    setApiError(null);
    setApiNotice(null);
    setApiLoading(true);
    try {
      const cleanId = apiAccountId.trim().replace(/^act_/, "");
      await storage.set("meta-api-account-id", cleanId).catch(() => {});
      const record = await fetchOneBrandMonth(apiToken.trim(), cleanId, apiMonth);
      if (!record.ads.length) {
        setApiNotice(`${monthLabel(apiMonth)} 沒有抓到任何廣告成效資料,請確認該月份確實有花費紀錄。`);
        setApiLoading(false);
        return;
      }
      const brandIdToUse = await ensureBrandRegistered(cleanId);
      await storage.set(monthKeyFor(brandIdToUse, apiMonth), JSON.stringify(record));
      setActiveBrandId(brandIdToUse);
      await loadAll(brandIdToUse);
      setFocusMonth(apiMonth);
      setApiNotice(`已從 API 抓到 ${monthLabel(apiMonth)} 的資料,共 ${record.ads.length} 支廣告。`);
      setShowApiPanel(false);
    } catch (e) {
      setApiError("抓取失敗:" + e.message + apiErrorHint(e));
    } finally {
      setApiLoading(false);
    }
  }

  async function fetchBatchFromApi() {
    if (!apiToken.trim() || (batchGranularity === "month" && !apiMonth)) {
      setApiError("請填入存取權杖" + (batchGranularity === "month" ? "並選擇月份。" : "。"));
      return;
    }
    const targets = brands.filter((b) => selectedBatchBrandIds.includes(b.id));
    if (!targets.length) {
      setApiError("請至少勾選一個品牌。");
      return;
    }
    setApiError(null);
    setApiNotice(null);
    setApiLoading(true);
    const progress = targets.map((b) => ({ id: b.id, name: b.name, status: "pending", message: "" }));
    setBatchProgress(progress);
    let lastWeekRangeUsed = null;
    for (let i = 0; i < targets.length; i++) {
      const b = targets[i];
      setBatchProgress((prev) => prev.map((p, idx) => (idx === i ? { ...p, status: "running" } : p)));
      try {
        if (batchGranularity === "week") {
          // 每個品牌的廣告帳號時區可能不一樣,「上週」要分別依各自帳號的時區去算,
          // 不能整批共用同一組日期,不然時區跟瀏覽器不同的帳號會抓錯週次、數字對不起來。
          const tzOffset = await fetchAccountUtcOffset(apiToken.trim(), b.id);
          const weekRangeForThisBrand = getLastWeekRange(tzOffset);
          lastWeekRangeUsed = weekRangeForThisBrand;
          const record = await fetchInsightsForRange(apiToken.trim(), b.id, weekRangeForThisBrand.since, weekRangeForThisBrand.until, true);
          await storage.set(weekKeyFor(b.id, weekRangeForThisBrand.weekStart), JSON.stringify(record));
          setBatchProgress((prev) =>
            prev.map((p, idx) => (idx === i ? { ...p, status: record.ads.length ? "done" : "empty", message: `${record.ads.length} 支廣告` } : p))
          );
        } else {
          const record = await fetchOneBrandMonth(apiToken.trim(), b.id, apiMonth);
          await storage.set(monthKeyFor(b.id, apiMonth), JSON.stringify(record));
          setBatchProgress((prev) =>
            prev.map((p, idx) => (idx === i ? { ...p, status: record.ads.length ? "done" : "empty", message: `${record.ads.length} 支廣告` } : p))
          );
        }
      } catch (e) {
        setBatchProgress((prev) => prev.map((p, idx) => (idx === i ? { ...p, status: "error", message: e.message } : p)));
      }
      if (i < targets.length - 1) await new Promise((r) => setTimeout(r, 4000));
    }
    setApiLoading(false);
    if (batchGranularity === "week" && lastWeekRangeUsed) setWeekInfo(lastWeekRangeUsed);
    setApiNotice("批次抓取完成,上方可以切換品牌查看結果。");
    await loadAll(activeBrandId);
    await loadAllWeeks(activeBrandId);
  }

  async function toggleRememberToken(checked) {
    setRememberToken(checked);
    if (checked) {
      await storage.set("meta-api-remember-token", "1").catch(() => {});
      if (apiToken.trim()) await storage.set("meta-api-token", apiToken.trim()).catch(() => {});
    } else {
      await storage.set("meta-api-remember-token", "0").catch(() => {});
      await storage.delete("meta-api-token").catch(() => {});
      // 不記住權杖的話,自動同步也一併關閉,因為沒有存起來的權杖可以自動用
      if (autoSyncEnabled) {
        setAutoSyncEnabled(false);
        await storage.set("meta-api-autosync", "0").catch(() => {});
      }
    }
  }

  async function toggleAutoSync(checked) {
    setAutoSyncEnabled(checked);
    await storage.set("meta-api-autosync", checked ? "1" : "0").catch(() => {});
  }

  // 開啟網頁時的自動同步:檢查上週(週一~週日)跟上個月的資料是否已經存在,
  // 沒有的話就自動用記住的權杖抓一次,依序抓每個常用品牌(或預設帳號),中間間隔 4 秒避免觸發 Meta 頻率限制。
  async function runAutoSyncWith(token, brandsList, defaultAccountId) {
    if (!token || !token.trim()) return;
    const cleanDefaultId = (defaultAccountId || "").trim().replace(/^act_/, "");
    // 如果呼叫時沒帶品牌清單,先看「目前登入身份自己有沒有帶一份品牌清單」(TEAM_CREDENTIALS 設定的 {id,name} 清單)可以用,
    // 不要一沒清單就直接拿「畫面上記住的單一帳號 ID」捏造一個假品牌、覆蓋掉真正的品牌清單——
    // 這是之前造成品牌清單被單一帳號蓋掉的原因,範圍受限的身份尤其容易踩到,因為 meta-api-brands 這份共用清單一開始可能是空的。
    const effectiveBrandsList = (brandsList && brandsList.length) ? brandsList : (getCredentialBrands() || []);
    const targets = (effectiveBrandsList && effectiveBrandsList.length)
      ? effectiveBrandsList.map((b) => ({ apiId: b.id, storageId: b.id, name: b.name }))
      : cleanDefaultId
      // 已經拿掉「預設帳本」,所以這裡也不能再把資料存進看不到的地方——
      // 沒有任何常用品牌、身份也沒有自帶清單時,直接用帳號 ID 本身當作品牌 ID 來存,並登記進品牌清單。
      ? [{ apiId: cleanDefaultId, storageId: cleanDefaultId, name: cleanDefaultId }]
      : [];
    if (!targets.length) return;

    if (!effectiveBrandsList || !effectiveBrandsList.length) {
      const autoBrand = { name: cleanDefaultId, id: cleanDefaultId };
      const updatedBrands = [autoBrand];
      setBrands(updatedBrands);
      await storage.set("meta-api-brands", JSON.stringify(updatedBrands)).catch(() => {});
    }

    const now = new Date();
    const lastMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const lastMonthKey = `${lastMonthDate.getFullYear()}-${String(lastMonthDate.getMonth() + 1).padStart(2, "0")}`;

    const weekListRes = await storage.list(WEEK_STORAGE_PREFIX).catch(() => ({ keys: [] }));
    const monthListRes = await storage.list(STORAGE_PREFIX).catch(() => ({ keys: [] }));
    const existingWeekKeys = new Set(weekListRes.keys || []);
    const existingMonthKeys = new Set(monthListRes.keys || []);

    // 開啟網頁自動同步時,不是只補「上週」一週,而是自動檢查並補齊「最近 4 週」裡缺少的每一週——
    // 這樣不用手動開「連接 Meta API」選「回溯抓取」,平常自動同步就會自動幫你把最近幾週補齊。
    // 每個品牌的廣告帳號時區可能不一樣,所以每一週的日期範圍都分別依各自帳號的時區去算。
    const AUTO_SYNC_WEEKS_BACK = 4;
    const needsWeek = [];
    for (const t of targets) {
      const tzOffset = await fetchAccountUtcOffset(token.trim(), t.apiId);
      for (let w = 1; w <= AUTO_SYNC_WEEKS_BACK; w++) {
        const weekRange = getLastWeekRange(tzOffset, w);
        if (!existingWeekKeys.has(weekKeyFor(t.storageId, weekRange.weekStart))) {
          needsWeek.push({ apiId: t.apiId, storageId: t.storageId, name: t.name, weekRange });
        }
      }
    }
    const needsMonth = targets.filter((t) => !existingMonthKeys.has(monthKeyFor(t.storageId, lastMonthKey)));
    if (!needsWeek.length && !needsMonth.length) return; // 資料都是新的,不用做任何事

    setAutoSyncStatus(`自動同步中… 補齊最近 ${AUTO_SYNC_WEEKS_BACK} 週與 ${monthLabel(lastMonthKey)} 資料`);
    let successCount = 0, errorCount = 0;

    for (let i = 0; i < needsWeek.length; i++) {
      const t = needsWeek[i];
      try {
        const record = await fetchInsightsForRange(token.trim(), t.apiId, t.weekRange.since, t.weekRange.until, true);
        await storage.set(weekKeyFor(t.storageId, t.weekRange.weekStart), JSON.stringify(record));
        successCount++;
      } catch { errorCount++; }
      if (i < needsWeek.length - 1 || needsMonth.length) await new Promise((r) => setTimeout(r, 4000));
    }
    for (let i = 0; i < needsMonth.length; i++) {
      const t = needsMonth[i];
      try {
        const record = await fetchOneBrandMonth(token.trim(), t.apiId, lastMonthKey);
        await storage.set(monthKeyFor(t.storageId, lastMonthKey), JSON.stringify(record));
        successCount++;
      } catch { errorCount++; }
      if (i < needsMonth.length - 1) await new Promise((r) => setTimeout(r, 4000));
    }

    setAutoSyncStatus(null);
    await loadAll(activeBrandId);
    await loadAllWeeks(activeBrandId);
    if (successCount > 0) {
      setApiNotice(`已自動同步完成:成功更新 ${successCount} 筆資料${errorCount > 0 ? `,${errorCount} 筆失敗(可能是頻率限制,之後再手動抓一次即可)` : ""}。`);
    } else if (errorCount > 0) {
      setApiError("瀏覽器裡存的個人Token可能已過期,這套前端自動同步失敗了——但這不影響報表資料本身,資料主要來源是後端排程(不需要Token),不用緊張。如果不想再看到這個訊息,可以把下面的「記住Token」「自動同步」關掉。");
    }
  }

  // 手動觸發同步(例如面板裡的「立即同步」按鈕),用目前畫面上的權杖跟品牌清單
  function runAutoSync() {
    return runAutoSyncWith(apiToken, brands, apiAccountId);
  }

  const sortedKeys = useMemo(() => Object.keys(months).sort(), [months]);
  const enriched = useMemo(() => { const out = {}; for (const mk of sortedKeys) out[mk] = deriveMetrics(months[mk]); return out; }, [months, sortedKeys]);
  const chartData = useMemo(() => sortedKeys.map((mk) => ({
    month: monthLabel(mk), 廣告費: Math.round(enriched[mk].spend), 轉單: enriched[mk].conversions,
    CPA: enriched[mk].cpa !== null ? Number(enriched[mk].cpa.toFixed(1)) : null,
    ROAS: enriched[mk].roas !== null ? Number(enriched[mk].roas.toFixed(2)) : null,
  })), [sortedKeys, enriched]);
  const currency = sortedKeys.length ? months[sortedKeys[sortedKeys.length - 1]].currency : "TWD";
  const focusIdx = sortedKeys.indexOf(focusMonth);
  const focusData = focusMonth ? enriched[focusMonth] : null;
  const prevData = focusIdx > 0 ? enriched[sortedKeys[focusIdx - 1]] : null;
  const MIN_AD_SPEND = 500;
  const spendFilteredAds = focusData && focusData.ads ? focusData.ads.filter((ad) => ad.spend >= MIN_AD_SPEND) : [];
  const visibleAds = filterAdsByStatus(spendFilteredAds, adStatusFilter, adSearchKeyword);
  const hiddenAdCount = focusData && focusData.ads ? focusData.ads.length - spendFilteredAds.length : 0;

  // ---------- 每日營收報表:直接呈現後台每日收益表(ledgerByMonth)裡「每一天 x 每個產品代號」的明細,不用另外彙總 ----------
  // 選單月份/選單日,優先順序是:①使用者自己手動點過的(dailyMonth/focusDay,只要那筆資料還在就沿用,尊重手動導覽)
  // ②今天實際的月份/日期(如果那個月/那一天剛好有資料的話)③都沒有的話,退回資料裡最後一筆(例如試算表只匯到某個過去的月份)。
  // 這樣打開「每日報表」預設就會對準今天,不用手動點,但只要手動切換過,還是會照使用者選的走,不會一直搶跳回今天。
  const ledgerMonthKeys = useMemo(() => Object.keys(ledgerByMonth).sort(), [ledgerByMonth]);
  const todayParts = useMemo(() => {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return { monthKey: `${y}-${m}`, dateKey: `${y}-${m}-${d}` };
  }, []);
  const activeDailyMonth = (dailyMonth && ledgerByMonth[dailyMonth])
    ? dailyMonth
    : ledgerByMonth[todayParts.monthKey]
    ? todayParts.monthKey
    : (ledgerMonthKeys.length ? ledgerMonthKeys[ledgerMonthKeys.length - 1] : null);
  const dailyMonthRecord = activeDailyMonth ? ledgerByMonth[activeDailyMonth] : null;
  const sortedDailyDays = useMemo(
    () => (dailyMonthRecord ? dailyMonthRecord.days.slice().sort((a, b) => (a.date < b.date ? -1 : 1)) : []),
    [dailyMonthRecord]
  );
  const activeFocusDay = (focusDay && sortedDailyDays.some((d) => d.date === focusDay))
    ? focusDay
    : sortedDailyDays.some((d) => d.date === todayParts.dateKey)
    ? todayParts.dateKey
    : (sortedDailyDays.length ? sortedDailyDays[sortedDailyDays.length - 1].date : null);
  const focusDayRecord = activeFocusDay ? sortedDailyDays.find((d) => d.date === activeFocusDay) : null;
  const focusDayIdx = activeFocusDay ? sortedDailyDays.findIndex((d) => d.date === activeFocusDay) : -1;
  const prevDayRecord = focusDayIdx > 0 ? sortedDailyDays[focusDayIdx - 1] : null;
  const dailyMatrixCodes = dailyMonthRecord ? dailyMonthRecord.productCodes : [];
  // adPct / AD_RATIO_CRITICAL_PCT 已經移到檔案最上面的頂層,這裡不用重複定義。
  // 淨利潤是負的(虧錢)時,用比廣告費佔比超標更重的標紅樣式(深紅底色+粗體),兩種警示程度做出區別。
  const netProfitCell = (value) => {
    if (value < 0) {
      return (
        <span style={{ color: "#8B1E2B", fontWeight: 700, background: "#FBE4E4", padding: "1px 6px", borderRadius: 4 }}>
          {fmtMoney(value)}
        </span>
      );
    }
    return fmtMoney(value);
  };
  // 基礎分析用:當月每一天的廣告費佔比,抓出佔比最高的一天,以及(如果有設定門檻)超過門檻的天數清單。
  const dailyRatioStats = useMemo(() => {
    let highestDay = null;
    const overThresholdDays = [];
    const threshold = adRatioThresholds[activeBrandId];
    sortedDailyDays.forEach((d) => {
      if (d.overall.revenue > 0) {
        const pct = (d.overall.adSpend / d.overall.revenue) * 100;
        if (!highestDay || pct > highestDay.pct) highestDay = { date: d.date, pct };
        if (threshold != null && pct > threshold) overThresholdDays.push({ date: d.date, pct });
      }
    });
    return { highestDay, overThresholdDays };
  }, [sortedDailyDays, adRatioThresholds, activeBrandId]);

  // ---------- 業配廣告長線分析:把名稱或行銷活動裡含「業配」兩個字的廣告單獨拉出來,依月份累計趨勢 ----------
  const SPONSOR_KEYWORD = "業配";
  const sponsorMonthlyStats = useMemo(() => sortedKeys.map((mk) => {
    const rec = months[mk];
    const sponsorAds = (rec.ads || []).filter(
      (ad) => (ad.name && ad.name.includes(SPONSOR_KEYWORD)) || (ad.campaign && ad.campaign.includes(SPONSOR_KEYWORD))
    );
    const spend = sponsorAds.reduce((s, a) => s + a.spend, 0);
    const conversions = sponsorAds.reduce((s, a) => s + a.conversions, 0);
    const revenue = sponsorAds.reduce((s, a) => s + a.revenue, 0);
    return {
      monthKey: mk, month: monthLabel(mk), ads: sponsorAds, spend, conversions, revenue,
      cpa: conversions > 0 ? spend / conversions : null,
      roas: spend > 0 && revenue > 0 ? revenue / spend : null,
    };
  }), [sortedKeys, months]);
  const sponsorChartData = useMemo(() => sponsorMonthlyStats.map((s) => ({
    month: s.month, 廣告費: Math.round(s.spend), 轉單: s.conversions,
    CPA: s.cpa !== null ? Number(s.cpa.toFixed(1)) : null,
    ROAS: s.roas !== null ? Number(s.roas.toFixed(2)) : null,
  })), [sponsorMonthlyStats]);
  const sponsorTotal = useMemo(() => {
    const spend = sponsorMonthlyStats.reduce((s, m) => s + m.spend, 0);
    const conversions = sponsorMonthlyStats.reduce((s, m) => s + m.conversions, 0);
    const revenue = sponsorMonthlyStats.reduce((s, m) => s + m.revenue, 0);
    return { spend, conversions, revenue, cpa: conversions > 0 ? spend / conversions : null, roas: spend > 0 && revenue > 0 ? revenue / spend : null };
  }, [sponsorMonthlyStats]);
  const sponsorMonthsWithData = sponsorMonthlyStats.filter((m) => m.ads.length > 0);

  const sortedWeekKeys = useMemo(() => Object.keys(weeksData).sort(), [weeksData]);
  const focusWeekData = focusWeek ? weeksData[focusWeek] : null;
  const focusWeekIdx = sortedWeekKeys.indexOf(focusWeek);
  const prevWeekData = focusWeekIdx > 0 ? weeksData[sortedWeekKeys[focusWeekIdx - 1]] : null;
  function weekLabel(weekStart) {
    if (!weekStart) return "";
    const [y, m, d] = weekStart.split("-").map(Number);
    const start = new Date(y, m - 1, d);
    const end = new Date(y, m - 1, d + 6);
    const fmt2 = (dt) => `${String(dt.getMonth() + 1).padStart(2, "0")}/${String(dt.getDate()).padStart(2, "0")}`;
    return `${fmt2(start)}~${fmt2(end)}`;
  }

  const sortedVisibleAds = useMemo(() => {
    const withMetrics = visibleAds.map((ad) => ({
      ad,
      cpa: ad.conversions > 0 ? ad.spend / ad.conversions : null,
      roas: ad.spend > 0 && ad.revenue > 0 ? ad.revenue / ad.spend : null,
    }));
    if (adSortMode === "cpa") {
      return withMetrics
        .slice()
        .sort((a, b) => {
          if (a.cpa === null) return 1;
          if (b.cpa === null) return -1;
          return a.cpa - b.cpa;
        })
        .map((x) => x.ad);
    }
    if (adSortMode === "roas") {
      return withMetrics
        .slice()
        .sort((a, b) => {
          if (a.roas === null) return 1;
          if (b.roas === null) return -1;
          return b.roas - a.roas;
        })
        .map((x) => x.ad);
    }
    if (adSortMode === "composite") {
      // rank-based composite: best CPA (lowest) and best ROAS (highest) each contribute a rank;
      // lower combined rank = better overall performance. Ads missing a metric get the worst rank.
      const n = withMetrics.length;
      const byCpa = withMetrics
        .map((x, i) => i)
        .sort((i, j) => {
          const a = withMetrics[i].cpa, b = withMetrics[j].cpa;
          if (a === null) return 1;
          if (b === null) return -1;
          return a - b;
        });
      const byRoas = withMetrics
        .map((x, i) => i)
        .sort((i, j) => {
          const a = withMetrics[i].roas, b = withMetrics[j].roas;
          if (a === null) return 1;
          if (b === null) return -1;
          return b - a;
        });
      const cpaRank = new Array(n), roasRank = new Array(n);
      byCpa.forEach((idx, rank) => { cpaRank[idx] = rank; });
      byRoas.forEach((idx, rank) => { roasRank[idx] = rank; });
      return withMetrics
        .map((x, i) => ({ ad: x.ad, score: cpaRank[i] + roasRank[i] }))
        .sort((a, b) => a.score - b.score)
        .map((x) => x.ad);
    }
    if (adSortMode === "startDate") {
      return withMetrics
        .slice()
        .sort((a, b) => {
          if (!a.ad.startDate) return 1;
          if (!b.ad.startDate) return -1;
          return a.ad.startDate < b.ad.startDate ? 1 : a.ad.startDate > b.ad.startDate ? -1 : 0;
        })
        .map((x) => x.ad);
    }
    if (adSortMode === "postPublishDate") {
      // 查得到前台發表時間的排前面(新到舊),查不到的排最後——查不到的那一段,畫面上會另外用分隔線標示出來,
      // 不會讓人誤以為那些廣告也有排進時間順序裡。
      return withMetrics
        .slice()
        .sort((a, b) => {
          if (!a.ad.postPublishDate) return 1;
          if (!b.ad.postPublishDate) return -1;
          return a.ad.postPublishDate < b.ad.postPublishDate ? 1 : a.ad.postPublishDate > b.ad.postPublishDate ? -1 : 0;
        })
        .map((x) => x.ad);
    }
    // default: by spend, high to low
    return withMetrics.map((x) => x.ad).sort((a, b) => b.spend - a.spend);
  }, [visibleAds, adSortMode]);

  return (
    <div className="mal-shell">
      <div className="mal-header">

          </div>

        <div className="mal-header-actions">

            {!HAS_SHARED_STORAGE && (
              <button className="mal-btn" onClick={() => { setTeamKeyInput(getTeamKey()); setShowTeamKeyModal(true); }}>
                {cloudStatus === "connected" ? <><span className="mal-btn-emoji">☁️</span> {credentialName || "已連線"}</> : <><span className="mal-btn-emoji">🔑</span> 團隊密碼</>}
              </button>
            )}
          </div>
          <div className="mal-header-actions-secondary">
            {activeBrandId && (
              <button className="mal-btn" onClick={() => setShowLedgerModal(true)}><span className="mal-btn-emoji">📥</span> 匯入後台業績</button>
            )}
            {(sortedKeys.length > 0 || sortedWeekKeys.length > 0) && (
              <button className="mal-btn mal-print-btn" onClick={handlePrintClick}><span className="mal-btn-emoji">🖨</span> 列印</button>
            )}
            {(sortedKeys.length > 0 || sortedWeekKeys.length > 0) && (
              <button className="mal-btn mal-print-btn" onClick={() => setShowPdfSectionModal(true)}><span className="mal-btn-emoji">📄</span> 匯出 PDF</button>
            )}
          </div>
          {sortedKeys.length > 0 && (
            <div className="mal-header-actions-reset-row">
              <button className="mal-btn mal-btn-danger" onClick={() => setConfirmReset(true)}><span className="mal-btn-emoji">🗑</span> 重置</button>
            </div>
          )}
        </div>

        {showPdfSectionModal && (
          <div className="mal-modal-overlay" onClick={() => setShowPdfSectionModal(false)}>
            <div className="mal-modal" onClick={(e) => e.stopPropagation()}>
              <h3>選擇要匯出的內容</h3>
              <label className="mal-pdf-section-row mal-pdf-section-all">
                <input
                  type="checkbox"
                  checked={pdfSelectedSections.size === PDF_SECTION_OPTIONS.length}
                  onChange={(e) => toggleAllPdfSections(e.target.checked)}
                />
                全選 / 全不選
              </label>
              {PDF_SECTION_OPTIONS.map((opt) => (
                <label className="mal-pdf-section-row" key={opt.key}>
                  <input type="checkbox" checked={pdfSelectedSections.has(opt.key)} onChange={() => togglePdfSection(opt.key)} />
                  {opt.label}
                </label>
              ))}
              <div className="mal-modal-actions">
                <button className="mal-btn" onClick={() => setShowPdfSectionModal(false)}>取消</button>
                <button
                  className="mal-btn mal-btn-primary"
                  disabled={pdfSelectedSections.size === 0 || pdfExportBusy}
                  onClick={() => { setShowPdfSectionModal(false); runPdfExport(); }}
                >
                  {pdfExportBusy ? "準備中…" : "確認匯出"}
                </button>
              </div>
            </div>
          </div>
        )}
      </div>

            <div
              key={b.id}
              className={`mal-brand-chip ${activeBrandId === b.id ? "mal-brand-chip-active" : ""}`}
              onClick={() => setActiveBrandId(b.id)}
              title={b.id}
            >
              {b.name}
            </div>
          ))}
        </div>
      )}

      {activeBrandId && (
        <div style={{ fontSize: 12.5, color: "var(--ink-soft)", marginBottom: 18, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>

          <strong style={{ color: "var(--ink)", fontFamily: "IBM Plex Mono, monospace" }}>

          </strong>
          <button className="mal-btn" style={{ padding: "3px 10px", fontSize: 11.5 }} onClick={() => editCpaThreshold(activeBrandId)}>
            ✎ {cpaThresholds[activeBrandId] != null ? "修改" : "設定"}
          </button>
          <span style={{ marginLeft: 8 }}>廣告費佔比過高標準:</span>
          <strong style={{ color: "var(--ink)", fontFamily: "IBM Plex Mono, monospace" }}>
            {adRatioThresholds[activeBrandId] != null ? `${adRatioThresholds[activeBrandId]}%` : "尚未設定"}
          </strong>
          <button className="mal-btn" style={{ padding: "3px 10px", fontSize: 11.5 }} onClick={() => editAdRatioThreshold(activeBrandId)}>
            ✎ {adRatioThresholds[activeBrandId] != null ? "修改" : "設定"}
          </button>
        </div>
      )}

      {apiNotice && <div className="mal-notice">✓ {apiNotice}</div>}
      {autoSyncStatus && <div className="mal-notice">⏳ {autoSyncStatus}</div>}
      {error && <div className="mal-error">⚠ {error}</div>}
      {apiError && <div className="mal-error">⚠ {apiError}</div>}

        </button>
        <button className={`mal-viewmode-btn ${viewMode === "month" ? "mal-viewmode-btn-active" : ""}`} onClick={() => setViewMode("month")}>
          📅 每月報表
        </button>
        <button className={`mal-viewmode-btn ${viewMode === "daily" ? "mal-viewmode-btn-active" : ""}`} onClick={() => setViewMode("daily")}>
          📆 每日報表
        </button>
