  /* 滿版底色的標題區塊(韓系奶油淺色調質感)——用負邊距讓背景色逃出 .mal-shell 的寬度限制延伸到
     整個視窗邊緣,裡面的文字內容用 padding 補回對齊寬度,不會跑版。這個手法在手機、桌面寬度都
     驗證過,是視覺上「滿版」但 DOM 結構完全沒變動,不影響任何功能。
     配色改成奶油/淺金漸層(不用深色底),第二輪根據回饋拿掉綠色調,主色改成淺玫瑰色。 */
  .mal-header {

  /* 表格較寬需要左右滑動時,第一欄(日期)凍結不跟著捲動,滑到多右邊都看得到現在是哪一列。
     用box-shadow當分隔線(不是border),避免border影響sticky欄位的box-sizing計算導致寬度跟

  .mal-ledger-table th:first-child, .mal-ledger-table td:first-child {

  /* 矩陣表格裡,每個產品代號區塊(4欄一組)交替上底色,跟相鄰代號區塊、跟「全店」都要能一眼分辨,

  /* 自訂checkbox:拿掉瀏覽器原生藍色,選中用低飽和焦糖色,checkbox跟文字同一列對齊,
     文字太長時從文字起點自然換行(不是整個掉到checkbox下面),點文字也能切換勾選狀態。
     用「原生checkbox視覺隱藏+label偽元素畫方框」,比單靠appearance:none更穩定可靠
     (appearance:none在部分瀏覽器/情境下無法完全清除原生checkbox保留的內建尺寸)。 */
  .mal-checkbox-row { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; font-weight: 400; position: relative; padding-left: 25px; }

  @media (max-width: 640px) {
    .mal-title { font-size: 22px; }
    .mal-cards { grid-template-columns: repeat(2, 1fr); }
    .mal-ad-row { flex-wrap: wrap; }
    /* 手機版圖表容器留白縮小、圖表本身矮一點——原本640:208的比例在窄螢幕下容器變窄,
       固定200px高度會顯得偏方正、留白比例失衡,縮小高度讓長寬比更接近原本設計的樣子。 */
    .mal-chart-box { padding: 16px 14px; }
    .mal-chart-svg { height: 168px !important; }
    /* 手機版數據區改成3+2兩列(6欄grid,前3項各佔2欄、後2項各佔3欄)——固定5欄在窄螢幕下
       長金額(7-8位數,例如$12,345,678)會過度擁擠甚至重疊,3+2讓CPA/ROAS有更寬的欄位可用。
       5個數據項目順序固定(廣告費/轉單/轉單金額/CPA/ROAS),用nth-child指定span,不用動JSX結構。 */
    .mal-ad-stats {
      width: 100%; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
      row-gap: 11px; column-gap: 6px;
    }
    .mal-ad-stats > div:nth-child(1), .mal-ad-stats > div:nth-child(2), .mal-ad-stats > div:nth-child(3) {
      grid-column: span 2;
    }
    .mal-ad-stats > div:nth-child(4), .mal-ad-stats > div:nth-child(5) {
      grid-column: span 3;
    }
    .mal-ad-stats div { align-items: center; min-width: 0; font-size: 11.5px; white-space: nowrap; }
    .mal-ad-stats span { white-space: nowrap; font-size: 9px; }
    /* 搜尋框、排序選單手機版各自獨占一整列,不要跟狀態篩選按鈕擠在同一橫排——
       這是造成「搜尋框只占右半邊、排序選單只占左半邊、兩者對不齊」的根本原因:
       桌機版靠flex-wrap自然換行,手機版寬度不夠時只會換到「剩下的那一小塊空間」,
       不會自動變成滿版寬度,必須明確給width:100%。 */
    .mal-status-filter { flex-direction: column; align-items: stretch; gap: 0; }
    .mal-status-filter-group { gap: 8px; }
    .mal-ad-search-wrap { width: 100%; min-width: 0; margin-left: 0; margin-top: 10px; }
    .mal-ad-search-wrap input { width: 100%; padding-right: 42px; box-sizing: border-box; }
    .mal-ad-header-row { flex-direction: column; align-items: stretch; }
    .mal-ad-header-row .mal-ad-sort-select { width: 100%; min-width: 0; margin-top: 8px; box-sizing: border-box; }
    /* 手機版壓縮上半部控制區的留白高度,避免報表內容被推太下面 */
    .mal-header { padding-top: 16px; padding-bottom: 12px; margin-bottom: 14px; }
    .mal-viewmode-switch { margin-bottom: 12px; }
    .mal-section-title { margin-top: 26px; }

    /* 手機版操作區固定三段版型,不是5-6顆按鈕塞進同一個2欄grid(那樣一定會有一格留白)。
       外層改成直向排列,三個子區各自是獨立的grid,彼此不共用格線。 */
    .mal-header-actions { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .mal-header-actions-primary, .mal-header-actions-secondary, .mal-header-actions-reset-row { display: grid; gap: 8px; width: 100%; align-self: stretch; }
    /* 第一列:連接Meta API + 團隊密碼,固定2欄,46px高 */
    .mal-header-actions-primary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .mal-header-actions-primary .mal-btn { height: 46px; font-size: 12.5px; padding: 0 8px; width: 100%; min-width: 0; }
    /* 第二列:匯入後台業績 + 列印 + 匯出PDF,固定3欄,42px高,字級略小但不換行不斷字 */
    .mal-header-actions-secondary { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .mal-header-actions-secondary .mal-btn { height: 42px; font-size: 11.5px; padding: 0 4px; width: 100%; min-width: 0; }
    /* 第三列:重置,小型文字/細框按鈕,靠右,不占大面積 */
    .mal-header-actions-reset-row { grid-template-columns: auto; justify-content: end; margin: 0; }
    .mal-header-actions-reset-row .mal-btn-danger {
      height: 35px; font-size: 12px; font-weight: 500; padding: 0 16px;
      background: transparent; width: auto;
    }

    /* 「品牌:」跟操作區只保留約20px間距,不要黏著也不要留大量空白 */
    .mal-brand-switch { margin-top: 20px; margin-bottom: 10px; }
    /* 品牌名稱長度不一,手機版改成2欄grid,長名稱允許在按鈕內換行(最多視覺上約2行),
       不要用nowrap硬撐寬度,不然像「Halo-Mavis國際連線(光速代操)」這種長名稱會把版面撐爆。
       align-items:stretch要明確覆寫,不然會沿用桌機版flex的align-items:center,同一列不會等高。 */
    .mal-brand-switch { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; align-items: stretch; }
    .mal-brand-switch-label { grid-column: 1 / -1; margin-bottom: 2px; }
    .mal-brand-chip {
      white-space: normal; line-height: 1.35; text-align: center; padding: 6px 10px; min-height: 46px;
      display: flex; align-items: center; justify-content: center;
    }
    /* 純裝飾用的emoji(插頭/鑰匙/雲朵/信封/印表機/垃圾桶)手機版隱藏,不影響按鈕點擊事件跟文字 */
    .mal-header-actions .mal-btn .mal-btn-emoji { display: none; }
  }

  body.mal-exporting .mal-header-actions,

  /* 列印/匯出PDF時,position: sticky 在部分瀏覽器的列印引擎下常常定位不準,乾脆這時候關掉凍結效果——
     反正上面那行已經把捲動框展開顯示全部內容了,凍結欄位本來就只有「還在捲動」的情境下才有意義。 */
  body.mal-exporting .mal-ledger-table th:first-child,

  body.mal-exporting .mal-plan-remove,

     平常(不是匯出模式)這個純文字版本要藏起來,不然畫面上會看到選單旁邊多一段重複的文字。 */
  .mal-plan-select-export-text { display: none; }

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useImperativeHandle } = React;

// ---------- 共用儲存(Claude Artifact 的 window.storage):團隊資料共用,機密資料(API金鑰等)只留在自己瀏覽器 ----------
// 如果不是在 Claude Artifact 環境打開(例如直接把檔案存到電腦、用瀏覽器開啟),window.storage 不存在,
// 這時自動退回「本機儲存」模式,資料只存在自己瀏覽器,不會跨裝置同步——避免直接開檔案時整個當機。
const HAS_SHARED_STORAGE = typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";
const LS_PREFIX = "ad-ledger::";
const localOnlyStorage = {
  async get(key) {
    const v = localStorage.getItem(LS_PREFIX + key);
    return v !== null ? { key, value: v } : null;
  },
  async set(key, value) {
    localStorage.setItem(LS_PREFIX + key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem(LS_PREFIX + key);
    return { key, deleted: true };
  },
  async list(prefix) {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(LS_PREFIX + prefix)) keys.push(k.slice(LS_PREFIX.length));
    }
    return { keys };
  },
};
const STORAGE_PREFIX = "metaads-month:";
const LEDGER_STORAGE_PREFIX = "metaads-ledger:";
const MONTHLY_PLAN_PREFIX = "monthly-plan:";
const ADPERF_AI_MONTH_PREFIX = "adperf-ai-month:";
// 2026-07-30新增:H-J那邊已經在同步真實Shopline訂單資料(shopline-month:),
// key格式完全一致,speedingscs這裡只要讀,不用自己另外抓——H&J一頁業績透過speedingscs看矩陣總覽時,
// 就能顯示跟H-J同一套「真實Shopline訂單」欄位,不用speedingscs自己重新建一套API呼叫/同步邏輯。
const SHOPLINE_MONTH_PREFIX = "shopline-month:";
// 以下這些 key 存的是「報表資料/品牌設定」,大家看到的要是同一份,所以存到共用空間(shared: true)。
// Meta API 金鑰、帳號ID、記住金鑰的開關、自動同步設定——這些是個人的登入憑證,絕對不能共用,只存在自己瀏覽器(shared: false)。
const SHARED_EXACT_KEYS = new Set(["meta-api-brands", "meta-api-cpa-thresholds", "meta-api-cpc-thresholds", "meta-api-adratio-thresholds", "meta-api-roas-targets", "meta-api-monthly-budgets", "meta-api-product-names"]);
const SHARED_PREFIXES = [STORAGE_PREFIX, LEDGER_STORAGE_PREFIX, MONTHLY_PLAN_PREFIX, ADPERF_AI_MONTH_PREFIX, SHOPLINE_MONTH_PREFIX];
function isSharedKey(key) {
  if (SHARED_EXACT_KEYS.has(key)) return true;
  return SHARED_PREFIXES.some((p) => key.startsWith(p));
}

// ---------- 團隊共用資料庫二號選擇:Cloudflare Pages Functions + KV ----------
// 如果這個網站不是在 Claude Artifact 裡打開(window.storage 不存在),就改試著打 /api/kv 這個後端
// (要搭配另外附上的 functions/api/kv 一起部署到 Cloudflare Pages 才會有作用)。
// 團隊密碼只存在使用者自己瀏覽器的 localStorage,不會經過共用資料庫,純粹是拿來認證每個裝置能不能讀寫。
const CLOUD_KV_BASE = "/api/kv";
const TEAM_KEY_STORAGE_KEY = "ad-ledger-team-key";
function getTeamKey() {
  try { return localStorage.getItem(TEAM_KEY_STORAGE_KEY) || ""; } catch { return ""; }
}
function setTeamKey(v) {
  try {
    if (v) localStorage.setItem(TEAM_KEY_STORAGE_KEY, v);
    else localStorage.removeItem(TEAM_KEY_STORAGE_KEY);
  } catch {}
}
function resetCredentialCache() {
  cloudStatusCache = "unknown";
  credentialNameCache = "";
  credentialBrandsCache = null;
}
function teamKeyHeaders() {
  const k = getTeamKey();
  return k ? { "X-Team-Key": k } : {};
}
// cloudStatus: "unknown"(還沒測)|"connected"(接得上)|"unauthorized"(接得上但密碼不對)|"unavailable"(沒有部署這個API,例如單純開檔案或還沒佈署Functions)
let cloudStatusCache = "unknown";
let credentialNameCache = ""; // 目前這組密碼對應的顯示名稱(依 Cloudflare 的 TEAM_CREDENTIALS 設定),沒有多身份設定時是空字串。
let credentialBrandsCache = null; // 這組密碼「自帶」的品牌清單([{id,name}, ...]),來自 TEAM_CREDENTIALS 本身;最高權限身份或沒設定多身份時是 null。
async function probeCloud(force) {
  if (cloudStatusCache !== "unknown" && !force) return cloudStatusCache;
  try {
    const res = await fetch(`${CLOUD_KV_BASE}/health`, { headers: teamKeyHeaders(), cache: "no-store" });
    if (res.status === 401) {
      cloudStatusCache = "unauthorized";
      credentialNameCache = "";
      credentialBrandsCache = null;
    }
    else if (res.ok) {
      cloudStatusCache = "connected";
      try {
        const j = await res.json();
        credentialNameCache = (j && j.credentialName) || "";
        credentialBrandsCache = (j && j.credentialBrands) || null;
      } catch { credentialNameCache = ""; credentialBrandsCache = null; }
    }
    else {
      cloudStatusCache = "unavailable";
      credentialNameCache = "";
      credentialBrandsCache = null;
    }
  } catch {
    cloudStatusCache = "unavailable";
    credentialNameCache = "";
    credentialBrandsCache = null;
  }
  return cloudStatusCache;
}
function getCredentialName() { return credentialNameCache; }
function getCredentialBrands() { return credentialBrandsCache; }

// 這些項目仍可留在共用 KV / 舊設定中，但不應出現在這份品牌成效表單的品牌切換列。
// H&J 官網業績屬於網站通路資料，不是另一個 Meta 品牌帳本；避免跟 H&J 主品牌重複呈現。
const HIDDEN_REPORT_BRAND_NAMES = new Set(["H&J官網業績"]);
function visibleReportBrands(list) {
  return (list || []).filter((b) => b && !HIDDEN_REPORT_BRAND_NAMES.has((b.name || "").trim()));
}

// 把「共用品牌清單」(meta-api-brands)跟「目前登入身份自帶的品牌清單」(如果 TEAM_CREDENTIALS 有設定 {id,name} 格式)合併成
// 最終可切換的品牌清單。身份自帶的清單優先排在前面,共用清單裡其他不在身份清單內的品牌(例如最高權限使用者額外存的常用品牌)接在後面。
// 純函式,不管在「網頁剛打開」還是「登入成功那一刻」呼叫,結果都一樣,兩處共用同一套邏輯,不會各自維護一份容易漏改其中一邊。
function mergeCredentialBrands(cleanedSharedBrands) {
  const shared = visibleReportBrands(cleanedSharedBrands);
  const credBrands = visibleReportBrands(getCredentialBrands());
  if (!credBrands || !credBrands.length) return shared;
  const byId = {};
  shared.forEach((b) => { byId[b.id] = b; });
  credBrands.forEach((b) => { if (!byId[b.id]) byId[b.id] = { id: b.id, name: b.name }; });
  const credIds = new Set(credBrands.map((b) => b.id));
  return [...credBrands.map((b) => byId[b.id]), ...shared.filter((b) => !credIds.has(b.id))];
}
const cloudStorage = {
  async get(key) {
    const res = await fetch(`${CLOUD_KV_BASE}/item/${encodeURIComponent(key)}`, { headers: teamKeyHeaders() });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error("cloud get failed: " + res.status);
    return await res.json();
  },
  async set(key, value) {
    const res = await fetch(`${CLOUD_KV_BASE}/item/${encodeURIComponent(key)}`, {
      method: "PUT", headers: { ...teamKeyHeaders(), "Content-Type": "text/plain" }, body: value,
    });
    if (!res.ok) throw new Error("cloud set failed: " + res.status);
    return await res.json();
  },
  async delete(key) {
    const res = await fetch(`${CLOUD_KV_BASE}/item/${encodeURIComponent(key)}`, { method: "DELETE", headers: teamKeyHeaders() });
    if (!res.ok) throw new Error("cloud delete failed: " + res.status);
    return await res.json();
  },
  async list(prefix) {
    const res = await fetch(`${CLOUD_KV_BASE}/list?prefix=${encodeURIComponent(prefix)}`, { headers: teamKeyHeaders() });
    if (!res.ok) throw new Error("cloud list failed: " + res.status);
    return await res.json();
  },
};

const REPORT_PLAN_API = "/api/public/report-plans";
function isReportPlanKey(key) { return /^\\bmonthly-plan:[^:]+::\\d{4}-\\d{2}$/.test(String(key || "")); }
async function sharedReportPlanGet(key) {
  const res = await fetch(`${REPORT_PLAN_API}?key=${encodeURIComponent(key)}`, { cache: "no-store" });
  if (!res.ok) throw new Error("report plan get failed: " + res.status);
  const json = await res.json();
  if (!json || !json.ok) throw new Error((json && json.error) || "report plan get failed");
  return json.value == null ? null : { key, value: json.value };
}
async function sharedReportPlanSet(key, value) {
  const res = await fetch(REPORT_PLAN_API, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ key, value }),
  });
  if (!res.ok) {
    const msg = await res.text().catch(() => "");
    throw new Error("report plan set failed: " + res.status + (msg ? " " + msg : ""));
  }
  return await res.json();
}

// 「嚴格版」存檔——跟上面 storage.set 的差異是:連不上雲端/雲端回錯,這裡會直接把錯誤丟出去,
// 不會悄悄退回存到本機。只給「月報告」這種使用者主動打字、資料遺失會很有感的功能用;
// 其他既有功能(月報表快取等)本來就是靠自動同步機制重新填滿,繼續沿用會悄悄退回本機
// 的 storage.set,不改,降低這次修正波及其他既有功能的風險。
async function storageSetStrict(key, value) {
  if (isReportPlanKey(key)) {
    await localOnlyStorage.set(key, value);
    return await sharedReportPlanSet(key, value);
  }
  if (!isSharedKey(key)) return localOnlyStorage.set(key, value);
  if (HAS_SHARED_STORAGE) return await window.storage.set(key, value, true);
  const status = await probeCloud();
  if (status !== "connected") {
    throw new Error(status === "unauthorized" ? "登入身份的金鑰不對,雲端拒絕存取。" : "目前連不上雲端資料庫。");
  }
  return await cloudStorage.set(key, value); // 特意不 catch——存檔失敗要讓呼叫端知道,不能悄悄吞掉
}
// 讀取版的「嚴格模式」,理由跟 storageSetStrict 一樣——原本 storage.get 連不上雲端時會悄悄退回讀本機
// (通常是空的,尤其換裝置/換瀏覽器一定是空的),畫面看起來會像「資料真的不見了」,實際上只是連線問題。
async function storageGetStrict(key) {
  if (isReportPlanKey(key)) {
    const remote = await sharedReportPlanGet(key);
    if (remote && remote.value != null) {
      await localOnlyStorage.set(key, remote.value).catch(() => {});
      return remote;
    }
    const local = await localOnlyStorage.get(key);
    if (local && local.value != null) {
      await sharedReportPlanSet(key, local.value);
      return local;
    }
    return null;
  }
  if (!isSharedKey(key)) return localOnlyStorage.get(key);
  if (HAS_SHARED_STORAGE) return await window.storage.get(key, true);
  const status = await probeCloud();
  if (status !== "connected") {
    throw new Error(status === "unauthorized" ? "登入身份的金鑰不對,雲端拒絕存取。" : "目前連不上雲端資料庫。");
  }
  return await cloudStorage.get(key);
}

const storage = {
  async get(key) {
    if (!isSharedKey(key)) return localOnlyStorage.get(key);
    if (HAS_SHARED_STORAGE) {
      try { return await window.storage.get(key, true); } catch { return null; }
    }
    if ((await probeCloud()) === "connected") {
      try { return await cloudStorage.get(key); } catch { /* 掉線就退回本機,不讓畫面壞掉 */ }
    }
    return localOnlyStorage.get(key);
  },
  async set(key, value) {
    if (!isSharedKey(key)) return localOnlyStorage.set(key, value);
    if (HAS_SHARED_STORAGE) return await window.storage.set(key, value, true);
    if ((await probeCloud()) === "connected") {
      try { return await cloudStorage.set(key, value); } catch { /* 掉線就退回本機 */ }
    }
    return localOnlyStorage.set(key, value);
  },
  async delete(key) {
    if (!isSharedKey(key)) return localOnlyStorage.delete(key);
    if (HAS_SHARED_STORAGE) {
      try { return await window.storage.delete(key, true); } catch { return null; }
    }
    if ((await probeCloud()) === "connected") {
      try { return await cloudStorage.delete(key); } catch {}
    }
    return localOnlyStorage.delete(key);
  },
  async list(prefix) {
    if (!isSharedKey(prefix)) return localOnlyStorage.list(prefix);
    if (HAS_SHARED_STORAGE) {
      try { const res = await window.storage.list(prefix, true); return res || { keys: [] }; } catch { return { keys: [] }; }
    }
    if ((await probeCloud()) === "connected") {
      try { return await cloudStorage.list(prefix); } catch {}
    }
    return localOnlyStorage.list(prefix);
  },
};


function monthKeyFor(brandId, mk) {
  return STORAGE_PREFIX + (brandId ? brandId + "::" : "") + mk;
}
// ---------- 後台「一頁式正確業績」(每日收益表匯入) ----------
// 每個品牌、每個月存一筆,key 格式跟月報表一致,方便重複匯入時直接覆蓋更新。
function ledgerKeyFor(brandId, monthKey) {
  return LEDGER_STORAGE_PREFIX + (brandId ? brandId + "::" : "") + monthKey;
}
// Shopline 資料不分品牌(一個商店對應所有廣告帳號),所以這裡的 key 不像 Meta 那樣帶品牌 id——
// 跟 H-J 那邊用的是完全一樣的 key 格式,這樣才能真的讀到同一份共用資料,不是自己另外開一份。

    .filter((o) => !UNPAID_STATUSES.has(o.paymentStatus) && o.status !== "cancelled")
    .forEach((o) => {

function filterAdsByStatus(ads, filter, keyword) {
  let result = ads || [];
  if (filter === "active") result = result.filter((a) => a.active === true);
  else if (filter === "inactive") result = result.filter((a) => a.active === false);

// 產品可能隨時新增,只要行銷活動的命名規則不變(代號一律放在活動名稱最前面的【】或[]裡),
// 新代號就會自動被抓出來,不需要手動維護產品清單——如果活動名稱前面沒有括號代號,

// 業績來源分三層：商品代號=一頁式網站、SHOPIFY/SHOPLINE=官網、其餘平台=外部通路。

function buildLedgerProductBreakdown(ledgerAgg) {
  const allCodes = Object.keys(ledgerAgg.byCode).sort();
  const officialSiteCodes = allCodes.filter((c) => !isLegacyAdOnlyCode(c) && isOfficialSiteCode(c));
  const externalChannelCodes = allCodes.filter((c) => !isLegacyAdOnlyCode(c) && isExternalChannelCode(c) && !isOfficialSiteCode(c));
  const productCodes = allCodes.filter(isOnePageCode);
  function toRow(code) {
    const v = ledgerAgg.byCode[code];
    return { code, spend: v.spend, revenue: v.revenue, conversions: v.hasOrderEst ? v.orderEst : 0, profit: v.profit, netProfit: v.netProfit, aov: v.aov };
  }
  const rows = productCodes.map(toRow);
  const officialSiteRows = officialSiteCodes.map(toRow);
  const externalChannelRows = externalChannelCodes.map(toRow);
  const totalProductSpend = rows.reduce((s, r) => s + r.spend, 0);
  rows.forEach((r) => { r.spendShare = totalProductSpend > 0 ? (r.spend / totalProductSpend) * 100 : 0; });
  const totalOfficialSpend = officialSiteRows.reduce((s, r) => s + r.spend, 0);
  officialSiteRows.forEach((r) => { r.spendShare = totalOfficialSpend > 0 ? (r.spend / totalOfficialSpend) * 100 : 0; });
  const totalExternalSpend = externalChannelRows.reduce((s, r) => s + r.spend, 0);
  externalChannelRows.forEach((r) => { r.spendShare = totalExternalSpend > 0 ? (r.spend / totalExternalSpend) * 100 : 0; });
  return { rows, officialSiteRows, externalChannelRows };
}

function buildProductBreakdown(ads, minSpend) {

  let excludedTestCount = 0;
  let lowSpendCount = 0;

  (ads || []).forEach((ad) => {
    if (ad.spend < minSpend && !(ad.revenue > 0)) {
      lowSpendCount++;
      lowSpendAmount += ad.spend;
      return;
    }
    const code = parseProductCode(ad.campaign);
    if (!code) { unresolved++; return; }
    if (NON_PRODUCT_CODE_PATTERN.test(code)) { excludedTestCount++; return; }
    if (!byCode[code]) byCode[code] = { spend: 0, conversions: 0, revenue: 0, count: 0 };
    byCode[code].spend += ad.spend;
    byCode[code].conversions += ad.conversions;
    byCode[code].revenue += ad.revenue;
    byCode[code].count += 1;
    totalRevenue += ad.revenue;
    totalSpend += ad.spend;
  });
  const rows = Object.entries(byCode)
    .map(([code, v]) => ({
      code, ...v,
      profit: v.revenue - v.spend,
      revenueShare: totalRevenue > 0 ? (v.revenue / totalRevenue) * 100 : 0,
      spendShare: totalSpend > 0 ? (v.spend / totalSpend) * 100 : 0,
      costRatio: v.revenue > 0 ? (v.spend / v.revenue) * 100 : null,
    }))
    .sort((a, b) => b.revenue - a.revenue);
  return { rows, unresolved, excludedTestCount, lowSpendCount, lowSpendAmount, totalRevenue, totalSpend };
}

function mergeChannelBreakdown(metaRows, metaTotalRevenue, metaTotalSpend, ledgerAgg) {
  const metaCodes = new Set(metaRows.map((r) => r.code));
  const channelRowsToMerge = [];
  const channelRevenueOnlyRows = [];
  if (ledgerAgg && ledgerAgg.byCode) {
    Object.entries(ledgerAgg.byCode).forEach(([code, v]) => {
      if (metaCodes.has(code)) return; // 這個代號 Meta 已經有資料,不重複算(帳面 vs Meta 落差另外由 LedgerVsMetaComparison 負責)
      // 只有「真正的通路」(SHOPLINE、GOOGLE、蝦皮、MOMO…)才放進「其他通路」;產品代號(SR、TE、FS、REC、RS、KE、JK…)
      // 就算 Meta 沒有對應資料,也不是通路,不能塞進「其他通路」——否則會被誤當成通路顯示、也會讓通路總額灌水。
      if (!isChannelCode(code)) return;
      // spend 門檻多一道「至少是營收1%」的保護,是因為帳本解析在少數欄位對不到文字時會退回固定位移量保底,
      // 保底偶爾會抓到旁邊的百分比顯示欄(數字很小但不是0),這裡避免那種雜訊被誤判成「有花費」。
      const hasRealSpend = v.spend > 0 && (!(v.revenue > 0) || v.spend >= v.revenue * 0.01);
      if (hasRealSpend) {
        channelRowsToMerge.push({
          code,
          spend: v.spend,
          revenue: v.revenue,
          conversions: v.hasOrderEst && v.orderEst > 0 ? Math.round(v.orderEst) : null,
          count: 0,
          isChannel: true,
        });
      } else if (v.revenue > 0 || v.spend > 0) {
        channelRevenueOnlyRows.push({ code, revenue: v.revenue, spend: v.spend || 0, profit: v.profit, netProfit: v.netProfit });
      }
    });
  }
  const mergedTotalRevenue = metaTotalRevenue + channelRowsToMerge.reduce((s, r) => s + r.revenue, 0);
  const mergedTotalSpend = metaTotalSpend + channelRowsToMerge.reduce((s, r) => s + r.spend, 0);
  const rows = [...metaRows, ...channelRowsToMerge]
    .map((r) => ({
      ...r,
      profit: r.revenue - r.spend,
      revenueShare: mergedTotalRevenue > 0 ? (r.revenue / mergedTotalRevenue) * 100 : 0,
      spendShare: mergedTotalSpend > 0 ? (r.spend / mergedTotalSpend) * 100 : 0,
      costRatio: r.revenue > 0 ? (r.spend / r.revenue) * 100 : null,
    }))
    .sort((a, b) => b.revenue - a.revenue);
  const grandTotalRevenue = mergedTotalRevenue + channelRevenueOnlyRows.reduce((s, r) => s + r.revenue, 0);
  const grandTotalSpend = mergedTotalSpend + channelRevenueOnlyRows.reduce((s, r) => s + (r.spend || 0), 0);
  return { rows, totalRevenue: mergedTotalRevenue, totalSpend: mergedTotalSpend, channelRowsToMerge, channelRevenueOnlyRows, grandTotalRevenue, grandTotalSpend };
}


// ---------- 後台「每日收益表」(.xlsx) 解析 ----------
// 檔案格式(依使用者提供的範例表單):每個分頁是一個月(例如「7月」),
// 第 1 列是各品牌/產品區塊的代號與名稱標題,第 2 列是每個區塊裡的欄位名稱(帳面營業額/平均客單價/廣告費/帳面利潤/稅後淨利),
// 第 3 列開始每一列是一天的資料,直到出現「總結」列為止。
// 每個產品區塊固定寬度 8 欄:[帳面營業額, 平均客單價, 廣告費, %, 帳面利潤, 稅後淨利, %, (空)]。
// 這個寬度與偏移量是從範例表單直接反推出來的——如果之後表單欄位順序有調整,這裡也要跟著更新。
const LEDGER_PRODUCT_BLOCK_WIDTH = 8;
const LEDGER_PRODUCT_BLOCK_START_COL = 19; // 從 T 欄(0-indexed 19)開始才是「產品代號」區塊,前面 A-R 欄是總表與 FB 總花費
const LEDGER_MONTH_SHEET_RE = /^(\d{1,2})\s*月/;

function excelDateToISO(v) {
  if (v instanceof Date) {
    return `${v.getUTCFullYear()}-${String(v.getUTCMonth() + 1).padStart(2, "0")}-${String(v.getUTCDate()).padStart(2, "0")}`;
  }
  return null;
}

function toNum(v) {
  const n = typeof v === "number" ? v : parseFloat(v);
  return isFinite(n) ? n : 0;
}

// 解析單一分頁(一個月份)成 { monthKey, days: [...], productCodes: [...] }。
// year 由匯入時使用者指定(表單裡沒有年份資訊,只有分頁月份)。
function parseLedgerSheet(matrix, year) {
  if (!matrix || matrix.length < 3) return null;
  const row1 = matrix[0] || [];
  const row2 = matrix[1] || [];
  const blocks = [];
  // fallback 防呆用:文字比對找不到欄位、要用固定位移量保底之前,先確認那一欄「沒有寫任何標籤」。
  // 那一欄已經寫著別的欄位名(例:SHOPLINE 區塊的 c+4 是 GOOGLE、KP 門市/經銷的 c+2 是抽成費用/貨物成本,
  // 或已經跨進下一個代號的區塊),就代表這個區塊根本沒有這個欄位——硬用固定位移會把別人的數字當成
  // 自己的廣告費/利潤(SHOPLINE 的帳面利潤曾因此顯示成 GOOGLE 廣告費)。回傳 null,讀值時 toNum(row[null])
  // 自然是 0,寧可空白也不要錯的數字。
  const emptyLabelCol = (col) => (((row2[col] || "").toString().trim()) ? null : col);
  // 不再寫死從T欄(index19)開始掃描——這個假設對某些品牌是錯的(例如宥凱的整體總表只到第8欄,
  // 產品代號第9欄就開始了,寫死19會把前面的代號整批跳過)。改成從第1欄開始逐欄掃描,
  // 但「帳面營業額」第一次出現一定是整體/全店總表本身(不是產品代號),要跳過不當成代號,
  // 從第二次出現開始才是真正的產品代號區塊——不管整體總表實際多寬,都能正確定位。
  let skippedOverall = false;
  for (let c = 1; c < Math.max(row1.length, row2.length); c += 1) {
    if ((row2[c] || "").toString().trim() === "帳面營業額") {
      if (!skippedOverall) { skippedOverall = true; continue; }
      const code = (row1[c] || "").toString().trim().toUpperCase();
      if (!code) continue;
      // 蝦皮、MOMO 這兩個代號沒有「平均客單價」這一欄,導致後面欄位整批往左遞補一格,
      // 固定位移量在這兩個代號上會直接抓錯欄——平均客單價/廣告費/帳面利潤/稅後淨利全部改用文字比對定位。
      const SEARCH_LIMIT = 12;
      let colAov = null;
      let colSpend = null;
      let colProfit = null;
      let colNetProfit = null;
      let colGoogleSpend = null; // 只有少數代號(目前已知:H&J一頁業績的SHOPLINE區塊)會有這欄,大部分代號沒有
      let blockEnd = c + SEARCH_LIMIT;
      // 搜尋界線加一道保險:碰到下一個區塊的起點(下一個「帳面營業額」)就停,絕不跨進下一個代號的
      // 欄位範圍——SHOPLINE 區塊比標準區塊窄,原本的搜尋範圍會越界「偷到」隔壁 SR 的平均客單價。
      for (let n = c + 1; n < blockEnd; n++) {
        if ((row2[n] || "").toString().trim() === "帳面營業額") { blockEnd = n; break; }
      }
      for (let k = c + 1; k < blockEnd; k++) {
        const label = (row2[k] || "").toString().trim();
        if (colAov === null && label === "平均客單價") colAov = k;
        // 廣告費/帳面利潤,原本用精確比對,MOMO、LINE禮物的欄名其實是「廣告費(平台抽成)」,
        // 門市、經銷的利潤欄名是「帳面利潤:扣貨物成本」「帳面利潤:貨物成本」這種帶冒號後綴的寫法,
        // 精確比對全部對不上、會落到後面的固定位移量保底(而保底位移量對這幾個代號來說是錯的,
        // 通常會抓到旁邊的百分比顯示欄,數字很小但不是0,不會被『沒資料』的判斷擋下來)。
        // 改成 startsWith,只要開頭是這幾個字就算數,涵蓋全部後綴變體。
        // 2026-07-30新增:「FB廣告費」也算數(H&J一頁業績SHOPLINE區塊的實際欄名不是「廣告費」,是
        // 「FB廣告費」,原本比對不到、導致搜尋一路延伸到緊接著的下一個代號區塊,誤抓別人的廣告費欄位
        // 當成自己的——這正是SHOPLINE跟SR顯示出一模一樣廣告費數字的根本原因。
        if (colSpend === null && (label.startsWith("廣告費") || label === "FB廣告費")) colSpend = k;
        if (colGoogleSpend === null && label === "GOOGLE") colGoogleSpend = k;
        if (colProfit === null && label.startsWith("帳面利潤")) colProfit = k;
        if (colNetProfit === null && (label === "稅後淨利" || label.startsWith("實際利潤") || label.startsWith("真實利潤"))) colNetProfit = k;
      }
      blocks.push({
        code,
        name: (row1[c + 1] || "").toString().trim(),
        colRevenue: c,
        colAov: colAov,
        colSpend: colSpend !== null ? colSpend : emptyLabelCol(c + 2),
        colProfit: colProfit !== null ? colProfit : emptyLabelCol(c + 4),
        colNetProfit: colNetProfit !== null ? colNetProfit : emptyLabelCol(c + 6),
        colGoogleSpend,
      });
      if (colGoogleSpend !== null) {
        blocks.push({
          code: "GOOGLE",
          name: "Google廣告",
          colRevenue: null,
          colAov: null,
          colSpend: colGoogleSpend,
          colProfit: null,
          colNetProfit: null,
        });
      }
    }
  }
  // 全店(整體)的「淨利」欄位改用文字比對定位——原本寫死 row[7]||row[6] 其實只符合 H&J 的版型:
  // KP 的真實利潤在第6欄、第7欄是百分比(被當成 0.28 這種數字,畫面顯示 $0);Mavis/J.GAO 的第7欄是
  // 另外登記的廣告費(直接把廣告費金額當成全店淨利顯示)。改成依「稅後淨利 → 真實利潤 → 實際利潤」的
  // 優先順序,在全店區塊的範圍內(第2欄起、到第一個產品代號區塊之前)找標籤;全部找不到才退回舊的
  // row[7]||row[6] 行為(對未知版型維持原本結果,不會更糟)。H&J 的「(改)稅後淨利」會被第一優先命中、
  // 「(原)」不含這些關鍵字所以自然跳過,跟原本取值一致。
  const firstBlockCol = blocks.length ? blocks[0].colRevenue : Math.max(row1.length, row2.length);
  let overallNetCol = null;
  const OVERALL_NET_TIERS = [
    (l) => l.includes("稅後淨利"),
    (l) => l.startsWith("真實利潤"),
    (l) => l.startsWith("實際利潤"),
  ];
  for (const tierMatches of OVERALL_NET_TIERS) {
    for (let k = 2; k < firstBlockCol; k++) {
      const l = (row2[k] || "").toString().trim();
      if (l && tierMatches(l)) { overallNetCol = k; break; }
    }
    if (overallNetCol !== null) break;
  }
  const days = [];
  let totalRow = null;
  for (let r = 2; r < matrix.length; r++) {
    const row = matrix[r] || [];
    const dateCell = row[0];
    if (dateCell instanceof Date) {
      const iso = excelDateToISO(dateCell);
      const overall = {
        revenue: toNum(row[1]), adSpend: toNum(row[2]), profit: toNum(row[4]),
        netProfit: overallNetCol !== null ? toNum(row[overallNetCol]) : toNum(row[7] !== undefined && row[7] !== null && row[7] !== "" ? row[7] : row[6]),
      };
      const byCode = {};
      blocks.forEach((b) => {
        const revenue = toNum(row[b.colRevenue]);
        const spend = toNum(row[b.colSpend]);
        const aov = toNum(row[b.colAov]);
        if (revenue === 0 && spend === 0) return; // 這天這個產品沒有資料,不建立空物件,避免污染平均值計算
        byCode[b.code] = {
          revenue, spend, aov,
          profit: toNum(row[b.colProfit]),
          netProfit: toNum(row[b.colNetProfit]),
          orders: aov > 0 ? revenue / aov : null,
        };
      });
      days.push({ date: iso, overall, byCode });
    } else if (typeof dateCell === "string" && dateCell.trim() === "總結") {
      const overall = {
        revenue: toNum(row[1]), adSpend: toNum(row[2]), profit: toNum(row[4]),
        netProfit: overallNetCol !== null ? toNum(row[overallNetCol]) : toNum(row[7] !== undefined && row[7] !== null && row[7] !== "" ? row[7] : row[6]),
      };
      const byCode = {};
      blocks.forEach((b) => {
        byCode[b.code] = {
          revenue: toNum(row[b.colRevenue]), spend: toNum(row[b.colSpend]),
          profit: toNum(row[b.colProfit]), netProfit: toNum(row[b.colNetProfit]),
        };
      });
      totalRow = { overall, byCode };
      break; // 「總結」之後是代言費、預估獲利等其他彙總列,不屬於逐日資料,停止解析
    }
  }
  if (!days.length) return null;
  return { days, monthTotal: totalRow, productCodes: blocks.map((b) => b.code) };
}

// 解析整份工作簿(可能包含 12 個月分頁),回傳 { [monthKey]: monthObject }。
function parseLedgerWorkbook(workbook, year) {
  const result = {};
  workbook.SheetNames.forEach((sheetName) => {
    const m = sheetName.match(LEDGER_MONTH_SHEET_RE);
    if (!m) return;
    const monthNum = parseInt(m[1], 10);
    if (!monthNum || monthNum < 1 || monthNum > 12) return;
    const sheet = workbook.Sheets[sheetName];
    const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null, raw: true });
    const parsed = parseLedgerSheet(matrix, year);
    if (parsed) {
      const monthKey = `${year}-${String(monthNum).padStart(2, "0")}`;
      result[monthKey] = { monthKey, year, month: monthNum, ...parsed };
    }
  });
  return result;
}

// 把後台每日資料彙總成指定日期區間(since ~ until)的總計,依產品代號分組。
// ledgerByMonth: { [monthKey]: monthObject },會自動跨月份撈資料。
function aggregateLedgerRange(ledgerByMonth, sinceISO, untilISO) {
  const matchedDays = [];
  Object.values(ledgerByMonth || {}).forEach((mo) => {
    (mo.days || []).forEach((d) => {
      if (d.date && d.date >= sinceISO && d.date <= untilISO) matchedDays.push(d);
    });
  });
  if (!matchedDays.length) return null;
  const overall = { revenue: 0, adSpend: 0, profit: 0, netProfit: 0 };
  const byCode = {};
  matchedDays.forEach((d) => {
    overall.revenue += d.overall.revenue || 0;
    overall.adSpend += d.overall.adSpend || 0;
    overall.profit += d.overall.profit || 0;
    overall.netProfit += d.overall.netProfit || 0;
    Object.entries(d.byCode || {}).forEach(([code, v]) => {
      if (!byCode[code]) byCode[code] = { revenue: 0, spend: 0, profit: 0, netProfit: 0, orderEst: 0, hasOrderEst: true };
      byCode[code].revenue += v.revenue || 0;
      byCode[code].spend += v.spend || 0;
      byCode[code].profit += v.profit || 0;
      byCode[code].netProfit += v.netProfit || 0;
      if (v.orders !== null && v.orders !== undefined) byCode[code].orderEst += v.orders;
      else byCode[code].hasOrderEst = false;
    });
  });
  Object.values(byCode).forEach((v) => { v.aov = v.hasOrderEst && v.orderEst > 0 ? v.revenue / v.orderEst : null; });
  const hasAnyData = overall.revenue > 0 || overall.adSpend > 0 || Object.values(byCode).some((v) => v.revenue > 0 || v.spend > 0);
  if (!hasAnyData) return null;
  return { overall, byCode, dayCount: matchedDays.length, sinceISO, untilISO };
}

// 從網址參數(url_tags / UTM 字串)裡取出「=」後面的那串值,用來判斷是不是同一個素材。
// 例如 "utm_medium=SR_FB_0309-CPA" -> "SR_FB_0309-CPA"。
// 如果同時有多組參數(用 & 分隔),只取第一組的值——因為廣告主通常只在其中一個參數放素材代碼。
function extractUtmValue(raw) {
  if (!raw) return "";
  const first = raw.split("&")[0] || raw;
  const eqIdx = first.indexOf("=");
  const value = eqIdx >= 0 ? first.slice(eqIdx + 1) : first;
  let decoded = value;
  try { decoded = decodeURIComponent(value); } catch { /* 保留原始值 */ }
  return decoded.trim();
}
function monthLabel(key) {
  const [y, m] = key.split("-");
  return `${y}/${m}`;
}
function monthDateRange(monthKey) {
  const [y, m] = monthKey.split("-").map(Number);
  const since = `${monthKey}-01`;
  const lastDay = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const until = `${monthKey}-${String(lastDay).padStart(2, "0")}`;
  return { since, until };
}
// 週的 key 本身就是那一週的起始日(例如 "2026-06-29"),固定跨 7 天,加 6 天就是週末最後一天。
// 用 UTC 運算來加減天數,避免瀏覽器時區造成日期字串位移。
function fmtInt(n) { return Math.round(n).toLocaleString("zh-TW"); }
function fmtMoney(n, currency) {
  try {
    return new Intl.NumberFormat("zh-TW", { style: "currency", currency: currency || "TWD", maximumFractionDigits: 0 }).format(n);
  } catch { return `${currency || ""} ${fmtInt(n)}`; }
}
// 把 syncedAt 的 UTC ISO 字串轉成台灣時間顯示,格式跟畫面上其他日期欄位一致(YYYY/MM/DD HH:mm)。
function fmtSyncedAt(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  const tw = new Date(d.getTime() + 8 * 3600 * 1000);
  const pad = (n) => String(n).padStart(2, "0");
  return `${tw.getUTCFullYear()}/${pad(tw.getUTCMonth() + 1)}/${pad(tw.getUTCDate())} ${pad(tw.getUTCHours())}:${pad(tw.getUTCMinutes())}`;
}
// 資料是「什麼時候抓的」提示——這個時間點是「最後一次成功呼叫 Meta API 的當下」,不是「資料涵蓋到哪一天」。
// 舊資料(這次修改之前就存在 KV 裡的)沒有這個欄位,顯示「—」而不是硬猜一個時間,避免誤導。
const SOURCE_LABEL = { manual: "已手動更新", auto: "已自動更新", cron: "已自動更新", airbyte: " · Airbyte 集中同步" };
function SyncedAtNote({ iso, source }) {
  const text = fmtSyncedAt(iso);
  const sourceLabel = source && SOURCE_LABEL[source] ? SOURCE_LABEL[source] : "";
  return (
    <p className="mal-synced-at">
      🕒 {text ? `${text}${sourceLabel ? sourceLabel : "更新"}` : "— (舊資料,尚無記錄;重新抓取後就會有)"}
    </p>
  );
}
function deriveMetrics(agg) {
  const cpa = agg.conversions > 0 ? agg.spend / agg.conversions : null;
  const roas = agg.spend > 0 && agg.revenue > 0 ? agg.revenue / agg.spend : null;
  return { ...agg, cpa, roas };
}
// 依排序模式把廣告清單排序(每月報表使用的排序邏輯,回傳新陣列、不改動原陣列)。
// mode:spend(廣告費 高→低,預設)/ cpa / roas / composite / startDate(投放時間 新→舊)
//      / postPublishDate(貼文前台發佈時間 新→舊;後台直接發佈=抓不到前台發佈時間的排最前面)
// ⚠️ 這個函式跟 H-J/index.html 的同名函式要保持一致,兩邊同步改。
function sortAdsByMode(ads, mode) {
  const withMetrics = (ads || []).map((ad) => ({
    ad,
    cpa: ad.conversions > 0 ? ad.spend / ad.conversions : null,
    roas: ad.spend > 0 && ad.revenue > 0 ? ad.revenue / ad.spend : null,
  }));
  if (mode === "cpa") {
    return withMetrics.slice().sort((a, b) => {
      if (a.cpa === null) return 1;
      if (b.cpa === null) return -1;
      return a.cpa - b.cpa;
    }).map((x) => x.ad);
  }
  if (mode === "roas") {
    return withMetrics.slice().sort((a, b) => {
      if (a.roas === null) return 1;
      if (b.roas === null) return -1;
      return b.roas - a.roas;
    }).map((x) => x.ad);
  }
  if (mode === "composite") {
    const n = withMetrics.length;
    const byCpa = withMetrics.map((x, i) => i).sort((i, j) => {
      const a = withMetrics[i].cpa, b = withMetrics[j].cpa;
      if (a === null) return 1;
      if (b === null) return -1;
      return a - b;
    });
    const byRoas = withMetrics.map((x, i) => i).sort((i, j) => {
      const a = withMetrics[i].roas, b = withMetrics[j].roas;
      if (a === null) return 1;
      if (b === null) return -1;
      return b - a;
    });
    const cpaRank = new Array(n), roasRank = new Array(n);
    byCpa.forEach((idx, rank) => { cpaRank[idx] = rank; });
    byRoas.forEach((idx, rank) => { roasRank[idx] = rank; });
    return withMetrics.map((x, i) => ({ ad: x.ad, score: cpaRank[i] + roasRank[i] })).sort((a, b) => a.score - b.score).map((x) => x.ad);
  }
  if (mode === "startDate") {
    return withMetrics.slice().sort((a, b) => {
      if (!a.ad.startDate) return 1;
      if (!b.ad.startDate) return -1;
      return a.ad.startDate < b.ad.startDate ? 1 : a.ad.startDate > b.ad.startDate ? -1 : 0;
    }).map((x) => x.ad);
  }
  if (mode === "postPublishDate") {
    return withMetrics.slice().sort((a, b) => {
      const pa = a.ad.postPublishDate, pb = b.ad.postPublishDate;
      if (!pa && !pb) return 0;
      if (!pa) return -1; // 後台直接發佈(沒有前台發佈時間)排最前面
      if (!pb) return 1;
      return pa < pb ? 1 : pa > pb ? -1 : 0; // 有前台發佈時間:新→舊
    }).map((x) => x.ad);
  }
  return withMetrics.map((x) => x.ad).sort((a, b) => b.spend - a.spend);
}
function pctChange(curr, prev) {
  if (prev === null || prev === undefined || prev === 0) return null;
  if (curr === null || curr === undefined) return null;
  return ((curr - prev) / prev) * 100;
}

function DeltaBadge({ value, invert = false }) {
  if (value === null || value === undefined || !isFinite(value)) {
    return <span className="mal-delta mal-delta-flat">—</span>;
  }
  const good = invert ? value < 0 : value > 0;
  const flat = Math.abs(value) < 0.05;
  const arrow = flat ? "→" : value > 0 ? "▲" : "▼";
  const cls = flat ? "mal-delta-flat" : good ? "mal-delta-good" : "mal-delta-bad";
  return <span className={`mal-delta ${cls}`}>{arrow} {Math.abs(value).toFixed(1)}%</span>;
}

// AI 生成的重點觀察裡,關鍵結論會用 **文字** 標記強調(對齊參考PDF範例裡加粗的效果)——
// 這裡把這種簡易 markdown 語法解析成真正的粗體,不是整段輸出 **字面上的星號**。
function renderBoldText(text) {
  const parts = String(text || "").split(/(\*\*[^*]+\*\*)/g);
  return parts.map((part, i) => {
    if (part.startsWith("**") && part.endsWith("**")) {
      return <strong key={i}>{part.slice(2, -2)}</strong>;
    }
    return part ? <React.Fragment key={i}>{part}</React.Fragment> : null;
  });
}

// 廣告縮圖:Meta 回傳的 fbcdn 網址只有「登入 FB 且對這個廣告帳號有權限的人」(管理員)
// 載得出來,品牌方直接連 fbcdn 會被擋掉、看不到縮圖。改成透過 shopline-proxy 的 /api/img
// 端點由伺服器端代抓、再回傳,任何人(含品牌方)都看得到,不需要自己有 FB 權限。
// 不是 fbcdn 的網址(例如 data: 或已經代理過的)就原樣使用,不重複包。
// ⚠️ 這段跟 H-J/index.html 的 AdThumb 完全一致,兩邊要同步改。
const IMG_PROXY_BASE = "https://shopline-proxy.hanna-104.workers.dev";
function proxiedImg(src) {
  if (!src) return src;
  if (src.startsWith("data:") || src.includes("/api/img?u=")) return src;
  if (!/fbcdn\.net|facebook\.com/.test(src)) return src;
  return IMG_PROXY_BASE + "/api/img?u=" + encodeURIComponent(src);
}
function AdThumb({ src, alt }) {
  const [errored, setErrored] = useState(false);
  const finalSrc = proxiedImg(src);
  if (!finalSrc || errored) return <div className="mal-thumb mal-thumb-fallback">素材</div>;
  return <img src={finalSrc} alt={alt || "廣告預覽"} className="mal-thumb" onError={() => setErrored(true)} />;
}

// ---------- lightweight dependency-free charts ----------

function SimpleBarChart({ data, seriesA, seriesB, colorA, colorB, labelA, labelB, fmtA, fmtB }) {
  const w = 640, h = 208, padL = 6, padR = 6, padT = 18, padB = 28;
  const n = data.length;
  const groupW = (w - padL - padR) / n;
  const barW = Math.min(22, groupW * 0.26);
  const maxA = Math.max(1, ...data.map((d) => d[seriesA]));
  const maxB = Math.max(1, ...data.map((d) => d[seriesB]));
  const gridLines = [0.25, 0.5, 0.75]; // 三條極淡的水平參考線,只是視覺輔助,不代表任何刻度數字
  return (
    <div>
      <div className="mal-chart-legend">
        <span><i className="mal-chart-dot" style={{ background: colorA }}></i>{labelA}</span>
        <span><i className="mal-chart-dot" style={{ background: colorB }}></i>{labelB}</span>
      </div>
      <svg viewBox={`0 0 ${w} ${h}`} width="100%" height="200" className="mal-chart-svg" preserveAspectRatio="xMidYMid meet">
        {gridLines.map((g) => (
          <line key={g} x1={padL} y1={padT + (h - padT - padB) * g} x2={w - padR} y2={padT + (h - padT - padB) * g} stroke="#EFE9DE" strokeWidth="1" />
        ))}
        <line x1={padL} y1={h - padB} x2={w - padR} y2={h - padB} stroke="#E8E0D3" />
        {data.map((d, i) => {
          const cx = padL + groupW * i + groupW / 2;
          const barH_A = ((h - padT - padB) * d[seriesA]) / maxA;
          const barH_B = ((h - padT - padB) * d[seriesB]) / maxB;
          return (
            <g key={i}>
              <rect x={cx - barW - 1.5} y={h - padB - barH_A} width={barW} height={barH_A} fill={colorA} rx="2">
                <title>{d.month}: {fmtA(d[seriesA])}</title>
              </rect>
              <rect x={cx + 1.5} y={h - padB - barH_B} width={barW} height={barH_B} fill={colorB} rx="2">
                <title>{d.month}: {fmtB(d[seriesB])}</title>
              </rect>
              <text x={cx} y={h - 10} textAnchor="middle" fontSize="11" fontFamily="IBM Plex Mono, monospace" fill="#8F8171">{d.month}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function SimpleLineChart({ data, seriesA, seriesB, colorA, colorB, labelA, labelB, fmtA, fmtB }) {
  const w = 640, h = 208, padL = 6, padR = 6, padT = 20, padB = 28;
  const n = data.length;
  const stepX = n > 1 ? (w - padL - padR) / (n - 1) : 0;
  const valsA = data.map((d) => d[seriesA]).filter((v) => v !== null && v !== undefined);
  const valsB = data.map((d) => d[seriesB]).filter((v) => v !== null && v !== undefined);
  const maxA = Math.max(1, ...valsA), minA = Math.min(0, ...valsA);
  const maxB = Math.max(1, ...valsB), minB = Math.min(0, ...valsB);
  const yA = (v) => h - padB - ((v - minA) / (maxA - minA || 1)) * (h - padT - padB);
  const yB = (v) => h - padB - ((v - minB) / (maxB - minB || 1)) * (h - padT - padB);
  const gridLines = [0.25, 0.5, 0.75];
  const pathFor = (key, yf) => {
    let d = "";
    data.forEach((pt, i) => {
      const v = pt[key];
      if (v === null || v === undefined) return;
      const x = padL + stepX * i;
      d += (d ? " L " : "M ") + x + " " + yf(v);
    });
    return d;
  };
  return (
    <div>
      <div className="mal-chart-legend">
        <span><i className="mal-chart-dot" style={{ background: colorA }}></i>{labelA}</span>
        <span><i className="mal-chart-dot" style={{ background: colorB }}></i>{labelB}</span>
      </div>
      <svg viewBox={`0 0 ${w} ${h}`} width="100%" height="200" className="mal-chart-svg" preserveAspectRatio="xMidYMid meet">
        {gridLines.map((g) => (
          <line key={g} x1={padL} y1={padT + (h - padT - padB) * g} x2={w - padR} y2={padT + (h - padT - padB) * g} stroke="#EFE9DE" strokeWidth="1" />
        ))}
        <line x1={padL} y1={h - padB} x2={w - padR} y2={h - padB} stroke="#E8E0D3" />
        <path d={pathFor(seriesA, yA)} fill="none" stroke={colorA} strokeWidth="2.5" />
        <path d={pathFor(seriesB, yB)} fill="none" stroke={colorB} strokeWidth="2.5" />
        {data.map((pt, i) => {
          const x = padL + stepX * i;
          return (
            <g key={i}>
              {pt[seriesA] !== null && pt[seriesA] !== undefined && (
                <circle cx={x} cy={yA(pt[seriesA])} r="3.2" fill={colorA}><title>{pt.month} {labelA}: {fmtA(pt[seriesA])}</title></circle>
              )}
              {pt[seriesB] !== null && pt[seriesB] !== undefined && (
                <circle cx={x} cy={yB(pt[seriesB])} r="3.2" fill={colorB}><title>{pt.month} {labelB}: {fmtB(pt[seriesB])}</title></circle>
              )}
              <text x={x} y={h - 10} textAnchor="middle" fontSize="11" fontFamily="IBM Plex Mono, monospace" fill="#8F8171">{pt.month}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

// 精選 24 色的色盤,色調跟整體「復古紙本」風格一致(用完才會開始用下面的演算法備援色)。
const DONUT_PALETTE = [
  "#A9744A", "#5B4A3B", "#8A8D74", "#C9AF97", "#8F5F39", "#B08653", "#73624F",
  "#9C7A54", "#6E5A4A", "#A78366", "#87816A", "#CBB89F", "#B08653", "#5D422F",
  "#D9BC9A", "#8E7B5C", "#A99378", "#8A8D74", "#73624F", "#B8A48A", "#9C7A54",
  "#DDCBB0", "#7A6650", "#AE8968",
];

// 產品代號的數量沒有上限,色盤用完之後,用 HSL 色相環演算法自動生成新顏色(黃金角度旋轉,確保彼此夠好分辨),
// 而不是讓顏色從頭循環重複——避免產品一多,兩個不同代號被畫成同一個顏色而看不出差異。
function colorForIndex(i) {
  if (i < DONUT_PALETTE.length) return DONUT_PALETTE[i];
  // 色盤用完之後的備用色,原本用完整360度色相環,會跑出藍紫綠這些冷色調,跟整體暖色主題不搭。
  // 改成只在暖色相範圍(15°~45°,橘棕色系)裡跑黃金角度旋轉,亮度/彩度也調低,保持低調質感。
  const hue = 15 + ((i * 137.508) % 30);
  return `hsl(${hue.toFixed(0)}, 38%, 42%)`;
}

// ROAS 效率分級,四級沿用既有報表圖例。
const ROAS_TIERS = [
  { min: 5, label: "優秀", color: "#8A8D74" },
  { min: 3, label: "穩健", color: "#73624F" },
  { min: 2, label: "待優化", color: "#B08653" },
  { min: 0, label: "低效", color: "#A56357" },
];
function roasTier(roas) {
  if (roas === null || roas === undefined || !isFinite(roas)) return null;
  return ROAS_TIERS.find((t) => roas >= t.min) || ROAS_TIERS[ROAS_TIERS.length - 1];
}

// 規則式自動摘要——不是真的 AI(Claude)生成的文字,是根據數字用固定規則組句子,
// 風格模仿範例報表的 🏆/⚠️/📌 條列重點,但本質是統計規則,不是語言模型理解數據後寫出來的。
// 如果之後要換成真的 Claude 生成的分析,需要後台設定 Anthropic API 金鑰,現在還沒有。
// 固定產出「剛好4條」,順序、角色固定(對齊目前報表與 AI 版 prompt 的結構),
// 不是原本那種依條件增減的做法——AI 失敗時退回這版,畫面看起來的結構要跟AI版一致,不會忽長忽短。
function generateAutoInsights(rows, totalRevenue, totalSpend, roasTarget) {
  if (!rows.length) return [];
  const overallRoas = totalSpend > 0 ? totalRevenue / totalSpend : null;
  const withRoas = rows.filter((r) => r.spend > 0).map((r) => ({ ...r, roas: r.revenue / r.spend }));
  const sortedByRoas = [...withRoas].sort((a, b) => b.roas - a.roas);
  const best = sortedByRoas[0];
  const worst = sortedByRoas[sortedByRoas.length - 1];
  const highestSpend = [...rows].sort((a, b) => b.spend - a.spend)[0];

  const insights = [];
  insights.push({
    icon: "🏆",
    text: best ? `${best.code} ROAS ${best.roas.toFixed(2)}x,本期**效率最高的系列**。` : "本期沒有可計算 ROAS 的系列資料。",
  });
  insights.push({
    icon: "💪",
    text: overallRoas !== null
      ? `整體 ROAS ${overallRoas.toFixed(2)}x,${overallRoas >= roasTarget ? `**達標**(目標 ${roasTarget}x)` : `**未達標**(目標 ${roasTarget}x)`}。`
      : "本期沒有足夠花費計算整體 ROAS。",
  });
  insights.push({
    icon: "⚠️",
    text: worst && (!best || worst.code !== best.code)
      ? `${worst.code} ROAS ${worst.roas.toFixed(2)}x,相對**最需要留意**,建議檢視素材或調整預算。`
      : "本期各系列表現相對平均,沒有特別需要留意的落後系列。",
  });
  insights.push({
    icon: "📌",
    text: highestSpend ? `${highestSpend.code} 花費佔比最高(${highestSpend.spendShare.toFixed(1)}%),是**本期主要花費項目**。` : "本期沒有花費資料。",
  });
  return insights;
}


function generateRuleJudgments(rows, roasTarget) {
  const target = roasTarget > 0 ? roasTarget : 3;
  const result = {};
  (rows || []).forEach((r) => {
    if (!(r.spend > 0)) {
      result[r.code] = { icon: "⚪", label: "無投放資料" };
      return;
    }
    const roas = r.revenue > 0 ? r.revenue / r.spend : 0;
    const conversions = Number(r.conversions || 0);
    const spendShare = Number(r.spendShare || 0);
    const profit = Number(r.profit || 0);

    if (profit < 0) {
      result[r.code] = { icon: "🔴", label: "帳面虧損，優先調整" };
    } else if (conversions < 10) {
      result[r.code] = roas >= target
        ? { icon: "🟡", label: "效率達標但樣本少，先觀察" }
        : { icon: "🟡", label: "樣本不足，暫不放大" };
    } else if (roas >= target * 1.3) {
      result[r.code] = { icon: "🟢", label: "主力系列，可逐步擴量" };
    } else if (roas >= target) {
      result[r.code] = { icon: "🟢", label: "達標，維持投放" };
    } else if (roas >= target * 0.75) {
      result[r.code] = { icon: "🟠", label: "接近目標，先優化" };
    } else if (spendShare >= 30) {
      result[r.code] = { icon: "🔴", label: "吃預算但未達標，建議降量" };
    } else {
      result[r.code] = { icon: "🔴", label: "低效，建議降預算或換素材" };
    }
  });
  return result;
}

function generateRulePlanning(rows, totalRevenue, totalSpend, roasTarget, currencyCode) {
  const target = roasTarget > 0 ? roasTarget : 3;
  const enriched = (rows || [])
    .filter((r) => r.spend > 0)
    .map((r) => ({
      ...r,
      roas: r.revenue > 0 ? r.revenue / r.spend : 0,
      spendShare: totalSpend > 0 ? (r.spend / totalSpend) * 100 : 0,
    }));
  const overallRoas = totalSpend > 0 ? totalRevenue / totalSpend : null;
  const strong = enriched.filter((r) => r.conversions >= 10 && r.roas >= target * 1.3).sort((a,b) => b.roas-a.roas);
  const weak = enriched.filter((r) => r.conversions >= 10 && r.roas < target * 0.75).sort((a,b) => b.spend-a.spend);
  const learning = enriched.filter((r) => r.conversions < 10).sort((a,b) => b.spend-a.spend);
  const actionItems = [];
  const materialIssues = [];

  if (strong.length) {
    const r = strong[0];
    actionItems.push({
      title: `${r.code} 優先逐步擴量`,
      description: `ROAS ${r.roas.toFixed(2)}x，高於目標 ${target}x，轉單 ${Math.round(r.conversions)} 筆。建議單次預算先增加 10–15%，觀察 2–3 天後再決定下一次調整。`,
    });
  }
  if (weak.length) {
    const r = weak[0];
    actionItems.push({
      title: `先收斂 ${r.code} 的低效花費`,
      description: `目前花費 ${fmtMoney(r.spend, currencyCode)}，佔總花費 ${r.spendShare.toFixed(1)}%，ROAS 僅 ${r.roas.toFixed(2)}x。建議先降量，把預算移往已達標系列。`,
    });
  }
  if (overallRoas !== null) {
    actionItems.push({
      title: overallRoas >= target ? "整體達標，維持漸進調整" : "整體未達標，先改善效率再擴量",
      description: overallRoas >= target
        ? `整體 ROAS ${overallRoas.toFixed(2)}x 已達目標 ${target}x。避免一次大幅加預算，優先對穩定達標系列小幅放大。`
        : `整體 ROAS ${overallRoas.toFixed(2)}x 低於目標 ${target}x。先處理高花費低 ROAS 系列，再評估擴量。`,
    });
  }

  weak.slice(0, 3).forEach((r) => {
    materialIssues.push({
      title: `${r.code} ROAS 未達標`,
      status: r.spendShare >= 30 ? "red" : "yellow",
      category: "投放效率",
      content: `花費 ${fmtMoney(r.spend, currencyCode)}，花費佔比 ${r.spendShare.toFixed(1)}%，ROAS ${r.roas.toFixed(2)}x，低於目標 ${target}x。建議先檢查素材疲勞、受眾與頁面轉換，再決定是否降預算。`,
    });
  });
  learning.slice(0, 2).forEach((r) => {
    materialIssues.push({
      title: `${r.code} 樣本仍不足`,
      status: "yellow",
      category: "資料量",
      content: `目前轉單 ${Math.round(r.conversions)} 筆、ROAS ${r.roas.toFixed(2)}x。樣本未滿 10 筆前先避免大幅調整，除非已出現明顯虧損或高花費零轉換。`,
    });
  });

  if (!actionItems.length) {
    actionItems.push({ title: "目前維持觀察", description: "現有資料沒有出現需要立即大幅調整的訊號，先維持投放並累積更多轉換樣本。" });
  }
  return { actionItems, materialIssues };
}


function computeDeliveryMetrics(record) {
  if (!record) return null;
  const spend = Number(record.spend || 0);
  const revenue = Number(record.revenue || 0);
  const conversions = Number(record.conversions || 0);
  const impressions = Number(record.impressions || 0);
  const clicks = Number(record.clicks || 0);
  const linkClicks = Number(record.linkClicks || 0);
  const reach = Number(record.reach || 0);
  const effectiveClicks = linkClicks > 0 ? linkClicks : clicks;
  return {
    spend,
    revenue,
    conversions,
    impressions,
    clicks,
    linkClicks,
    reach,
    roas: spend > 0 ? revenue / spend : null,
    cpa: conversions > 0 ? spend / conversions : null,
    ctr: impressions > 0 ? (effectiveClicks / impressions) * 100 : null,
    cpm: impressions > 0 ? (spend / impressions) * 1000 : null,
    cvr: effectiveClicks > 0 ? (conversions / effectiveClicks) * 100 : null,
    frequency: reach > 0 ? impressions / reach : null,
  };
}

function metricPctDelta(curr, prev) {
  if (curr === null || curr === undefined || prev === null || prev === undefined || prev === 0) return null;
  return ((curr - prev) / prev) * 100;
}

function decisionAdKey(ad) {
  return [ad && ad.utm, ad && ad.campaign, ad && ad.adSet, ad && ad.name].filter(Boolean).join("||");
}

function adDecision(ad, prevAd, roasTarget, cpaTarget) {
  const target = roasTarget > 0 ? roasTarget : 3;
  const spend = Number(ad && ad.spend || 0);
  const conversions = Number(ad && ad.conversions || 0);
  const revenue = Number(ad && ad.revenue || 0);
  const roas = spend > 0 ? revenue / spend : 0;
  const cpa = conversions > 0 ? spend / conversions : null;
  const impressions = Number(ad && ad.impressions || 0);
  const clicks = Number(ad && (ad.linkClicks || ad.clicks) || 0);
  const reach = Number(ad && ad.reach || 0);
  const ctr = impressions > 0 ? (clicks / impressions) * 100 : null;
  const frequency = reach > 0 ? impressions / reach : null;

  let prevCtr = null;
  if (prevAd) {
    const pImp = Number(prevAd.impressions || 0);
    const pClicks = Number(prevAd.linkClicks || prevAd.clicks || 0);
    prevCtr = pImp > 0 ? (pClicks / pImp) * 100 : null;
  }
  const ctrDelta = metricPctDelta(ctr, prevCtr);
  const likelyFatigue = ctrDelta !== null && ctrDelta <= -25 && (frequency === null || frequency >= 2.2);
  const campaignName = String(ad && ad.campaign || "").toUpperCase();
  const autoAllocated = /(^|[^A-Z])(CBO|ASC)([^A-Z]|$)|ADVANTAGE\+|ADV\+/.test(campaignName);

  if (cpaTarget > 0 && conversions === 0 && spend >= cpaTarget * 2) {
    return { code: "REDUCE", icon: "🔴", label: "REDUCE", reason: `已花費 ${fmtMoney(spend)}、仍無轉單，已超過目標 CPA ×2。` };
  }
  if (likelyFatigue) {
    return { code: "REFRESH", icon: "🟠", label: "REFRESH", reason: `CTR 較前期下降 ${Math.abs(ctrDelta).toFixed(0)}%，優先換素材而不是直接砍整組。` };
  }
  if (conversions < 10) {
    return { code: "MONITOR", icon: "🟡", label: "MONITOR", reason: `目前 ${conversions} 筆轉單，樣本未滿 10 筆，先不要過度解讀。` };
  }
  if (autoAllocated) {
    if (roas >= target) {
      return { code: "KEEP", icon: "🟢", label: "KEEP", reason: `此活動疑似 CBO / ASC / Advantage+；單支平均值不適合獨立擴量。ROAS ${roas.toFixed(2)}x 已達標，保留並從 Campaign 層級判斷預算。` };
    }
    return { code: "MONITOR", icon: "🟡", label: "MONITOR", reason: `此活動疑似 CBO / ASC / Advantage+；先看 Campaign 整體與邊際成本，不因單支平均 CPA/ROAS 直接停掉。` };
  }
  if (roas >= target * 1.3 && (!cpaTarget || cpa === null || cpa <= cpaTarget)) {
    return { code: "SCALE", icon: "🟢", label: "SCALE", reason: `ROAS ${roas.toFixed(2)}x，高於目標 ${target}x，建議單次 +10–15%。` };
  }
  if (roas >= target) {
    return { code: "KEEP", icon: "🟢", label: "KEEP", reason: `ROAS ${roas.toFixed(2)}x 已達目標，維持投放。` };
  }
  if ((cpaTarget > 0 && cpa !== null && cpa > cpaTarget * 1.25) || roas < target * 0.75) {
    return { code: "REDUCE", icon: "🔴", label: "REDUCE", reason: `已有足夠樣本且效率明顯低於目標，建議降量或停掉低效素材。` };
  }
  return { code: "MONITOR", icon: "🟡", label: "MONITOR", reason: `接近目標但尚未穩定，先觀察並做小幅優化。` };
}

function buildDecisionIntelligence(currentRecord, previousRecord, roasTarget, cpaTarget, monthlyBudget, periodType) {
  const current = computeDeliveryMetrics(currentRecord);
  const previous = computeDeliveryMetrics(previousRecord);
  if (!current) return null;
  const target = roasTarget > 0 ? roasTarget : 3;
  const deltas = {};
  ["spend", "revenue", "conversions", "roas", "cpa", "ctr", "cpm", "cvr", "frequency"].forEach((k) => {
    deltas[k] = previous ? metricPctDelta(current[k], previous[k]) : null;
  });

  const anomalies = [];
  const reliable = current.conversions >= 10 || current.spend >= Math.max(5000, (cpaTarget || 0) * 3);

  if (periodType === "month" && monthlyBudget > 0) {
    const usage = (current.spend / monthlyBudget) * 100;
    if (usage > 100) anomalies.push({ level: "red", title: "月預算已超支", detail: `目前使用 ${usage.toFixed(1)}%，超出 ${fmtMoney(current.spend - monthlyBudget)}。` });
    else if (usage >= 90) anomalies.push({ level: "yellow", title: "月預算接近上限", detail: `目前已使用 ${usage.toFixed(1)}%，剩餘 ${fmtMoney(monthlyBudget - current.spend)}。` });
  }

  if (current.roas !== null && current.roas < target) {
    anomalies.push({ level: current.roas < target * 0.75 ? "red" : "yellow", title: "整體 ROAS 未達標", detail: `目前 ${current.roas.toFixed(2)}x，目標 ${target}x。` });
  }
  if (reliable && deltas.roas !== null && deltas.roas <= -20) {
    anomalies.push({ level: "red", title: "ROAS 明顯下滑", detail: `較前期下降 ${Math.abs(deltas.roas).toFixed(1)}%，已超出一般小波動範圍。` });
  }
  if (reliable && deltas.cpa !== null && deltas.cpa >= 20) {
    anomalies.push({ level: "red", title: "CPA 明顯上升", detail: `較前期增加 ${deltas.cpa.toFixed(1)}%，需要找出成本上升來源。` });
  }
  if (deltas.ctr !== null && deltas.ctr <= -20) {
    anomalies.push({ level: current.frequency !== null && current.frequency >= 2.5 ? "red" : "yellow", title: "CTR 下滑", detail: `較前期下降 ${Math.abs(deltas.ctr).toFixed(1)}%${current.frequency !== null ? `，目前頻率 ${current.frequency.toFixed(2)}` : ""}，可能是素材疲勞或吸引力下降。` });
  }
  if (deltas.cpm !== null && deltas.cpm >= 20) {
    anomalies.push({ level: "yellow", title: "CPM 上升", detail: `較前期增加 ${deltas.cpm.toFixed(1)}%，偏向流量成本／競價環境變貴。` });
  }
  if (deltas.cvr !== null && deltas.cvr <= -20) {
    anomalies.push({ level: "red", title: "CVR 下滑", detail: `較前期下降 ${Math.abs(deltas.cvr).toFixed(1)}%，優先檢查商品頁、優惠與結帳轉換。` });
  }

  let score = 100;
  if (current.roas !== null && current.roas < target) score -= current.roas < target * 0.75 ? 22 : 10;
  if (deltas.roas !== null && deltas.roas <= -20) score -= 12;
  if (deltas.cpa !== null && deltas.cpa >= 20) score -= 10;
  if (deltas.ctr !== null && deltas.ctr <= -20) score -= 8;
  if (deltas.cpm !== null && deltas.cpm >= 20) score -= 5;
  if (deltas.cvr !== null && deltas.cvr <= -20) score -= 12;
  if (periodType === "month" && monthlyBudget > 0 && current.spend > monthlyBudget) score -= 8;
  score = Math.max(0, Math.min(100, score));

  const prevMap = new Map((previousRecord && previousRecord.ads || []).map((ad) => [decisionAdKey(ad), ad]));
  const decisions = (currentRecord.ads || [])
    .filter((ad) => Number(ad.spend || 0) >= 500 || ad.active)
    .map((ad) => ({ ad, decision: adDecision(ad, prevMap.get(decisionAdKey(ad)), target, cpaTarget) }))
    .sort((a, b) => {
      const order = { REDUCE: 0, REFRESH: 1, SCALE: 2, MONITOR: 3, KEEP: 4 };
      const oa = order[a.decision.code] ?? 9;
      const ob = order[b.decision.code] ?? 9;
      return oa !== ob ? oa - ob : Number(b.ad.spend || 0) - Number(a.ad.spend || 0);
    });

  const actions = [];
  const scale = decisions.find((x) => x.decision.code === "SCALE");
  const reduce = decisions.find((x) => x.decision.code === "REDUCE");
  const refresh = decisions.find((x) => x.decision.code === "REFRESH");
  if (scale) actions.push({ icon: "🟢", title: `${scale.ad.name} 可逐步擴量`, detail: scale.decision.reason });
  if (reduce) actions.push({ icon: "🔴", title: `${reduce.ad.name} 優先降量`, detail: reduce.decision.reason });
  if (refresh) actions.push({ icon: "🟠", title: `${refresh.ad.name} 優先換素材`, detail: refresh.decision.reason });
  if (!actions.length) actions.push({ icon: "🟡", title: "目前以維持與觀察為主", detail: "沒有出現需要立刻大幅調整的訊號，先累積更多樣本。" });

  return { current, previous, deltas, anomalies, decisions, actions, score };
}


function EvidenceExecutiveSummary({
  currentRecord,
  previousRecord,
  roasTarget = 3,
  cpaTarget = null,
  monthlyBudget = null,
  periodType = "month",
  periodLabel = "",
  brandName = "品牌",
  syncedAt = "",
  sourceLabel = "Meta Ads / 品牌報表",
}) {
  const result = buildDecisionIntelligence(currentRecord, previousRecord, roasTarget, cpaTarget, monthlyBudget, periodType);
  if (!result) return null;

  const { current, previous, deltas, anomalies, decisions, score } = result;
  const target = roasTarget > 0 ? roasTarget : 3;
  const activeDecisions = (decisions || []).filter((x) => x && x.ad && x.ad.active !== false);
  const count = (code) => activeDecisions.filter((x) => x.decision && x.decision.code === code).length;
  const reduceCount = count("REDUCE");
  const refreshCount = count("REFRESH");
  const scaleCount = count("SCALE");
  const monitorCount = count("MONITOR");
  const keepCount = count("KEEP");
  const urgentCount = reduceCount + refreshCount;
  const topRisk = anomalies.find((a) => a.level === "red") || anomalies[0] || null;

  const pctText = (value, goodWhenUp = true) => {
    if (value == null || !Number.isFinite(value)) return "前期無可比資料";
    const direction = value > 0 ? "增加" : value < 0 ? "下降" : "持平";
    const good = value === 0 ? null : (value > 0) === goodWhenUp;
    return direction + " " + Math.abs(value).toFixed(1) + "%" + (good === true ? "，方向正向" : good === false ? "，需要留意" : "");
  };

  let headline = brandName + " " + (periodLabel || "本期") + "投放表現";
  if (topRisk) headline = "本期優先處理：" + topRisk.title;
  else if (current.roas != null && current.roas >= target && score >= 80) headline = "本期投放整體穩定，ROAS 已達目標";
  else if (current.roas != null && current.roas < target) headline = "本期效率低於目標，先守住成本再擴量";

  const deckParts = [];
  if (current.roas != null) deckParts.push("ROAS " + current.roas.toFixed(2) + "x，目標 " + target + "x");
  if (current.cpa != null) deckParts.push("CPA " + fmtMoney(current.cpa, currentRecord.currency));
  if (previous && deltas.roas != null) deckParts.push("ROAS 較前期" + (deltas.roas >= 0 ? "增加" : "下降") + " " + Math.abs(deltas.roas).toFixed(1) + "%");
  if (urgentCount > 0) deckParts.push("目前有 " + urgentCount + " 支廣告需要優先處理");
  else if (scaleCount > 0) deckParts.push("目前有 " + scaleCount + " 支廣告具擴量條件");
  const deck = deckParts.join("；") + "。";

  const healthLabel = score >= 80 ? "健康" : score >= 65 ? "需留意" : "需處理";
  const healthIcon = score >= 80 ? "🟢" : score >= 65 ? "🟡" : "🔴";

  const nextSteps = [];
  if (reduceCount) nextSteps.push("降量 / 停低效：" + reduceCount + " 支");
  if (refreshCount) nextSteps.push("優先換素材：" + refreshCount + " 支");
  if (scaleCount) nextSteps.push("可小幅加預算：" + scaleCount + " 支");
  if (monitorCount) nextSteps.push("持續觀察：" + monitorCount + " 支");
  if (keepCount) nextSteps.push("維持現況：" + keepCount + " 支");
  if (!nextSteps.length) nextSteps.push("目前沒有需要立即調整的廣告");

  let syncedText = "未提供更新時間";
  if (syncedAt) {
    try {
      syncedText = new Date(syncedAt).toLocaleString("zh-TW", { hour12: false });
    } catch {}
  }

  return (
    <div className="mal-evidence-report">
      <div className="mal-evidence-hero">
        <div className="mal-evidence-kicker">Executive Summary · Monthly Report</div>
        <h2 className="mal-evidence-headline">{headline}</h2>
        <div className="mal-evidence-deck">{deck}</div>
        <div className="mal-evidence-status">{healthIcon} 投放健康度 {score}/100 · {healthLabel}</div>
      </div>

      <div className="mal-evidence-grid">
        <div className="mal-evidence-block">
          <div className="mal-evidence-block-title">本期表現</div>
          <p>廣告費 {fmtMoney(current.spend, currentRecord.currency)}，轉單 {fmtInt(current.conversions)}。</p>
          <p>ROAS：{current.roas != null ? current.roas.toFixed(2) + "x" : "—"}；CPA：{current.cpa != null ? fmtMoney(current.cpa, currentRecord.currency) : "—"}。</p>
          {previous && <p>花費較前期 {pctText(deltas.spend, false)}；轉單較前期 {pctText(deltas.conversions, true)}。</p>}
        </div>

        <div className="mal-evidence-block">
          <div className="mal-evidence-block-title">主要風險</div>
          {anomalies.length ? (
            <ul>
              {anomalies.slice(0, 3).map((a, i) => <li key={i}>{a.level === "red" ? "🔴" : "🟡"} {a.title}：{a.detail}</li>)}
            </ul>
          ) : (
            <p>目前沒有偵測到超出門檻的異常，維持監控即可。</p>
          )}
        </div>

        <div className="mal-evidence-block">
          <div className="mal-evidence-block-title">下一步</div>
          <ul>{nextSteps.slice(0, 4).map((x, i) => <li key={i}>{x}</li>)}</ul>
        </div>
      </div>

      <div className="mal-evidence-source">
        資料來源：{sourceLabel} · 更新時間：{syncedText} · 本摘要由現有報表數據與 Shadow 規則即時計算，不會自動修改 Meta 廣告。
      </div>
    </div>
  );
}

function EvidenceSectionNavigator({ refreshKey = "" }) {
  const [sections, setSections] = useState([]);

  useEffect(() => {
    let cancelled = false;
    const collect = () => {
      const titles = Array.from(document.querySelectorAll(".mal-major-section-title"))
        .filter((el) => el.offsetParent !== null)
        .map((el, index) => {
          if (!el.id) el.id = "report-section-" + index;
          const toggle = el.querySelector(".mal-major-section-toggle");
          const label = String(el.textContent || "")
            .replace(toggle ? String(toggle.textContent || "") : "", "")
            .replace(/\s+/g, " ")
            .trim();
          return { id: el.id, label };
        })
        .filter((x) => x.label);
      if (!cancelled) setSections(titles);
    };
    const timer = setTimeout(collect, 120);
    return () => { cancelled = true; clearTimeout(timer); };
  }, [refreshKey]);

  if (!sections.length) return null;

  const jump = (id) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.getAttribute("aria-expanded") === "false") el.click();
    setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
  };

  return (
    <div className="mal-evidence-nav">
      <span className="mal-evidence-nav-label">章節</span>
      {sections.map((s) => <button key={s.id} onClick={() => jump(s.id)}>{s.label}</button>)}
    </div>
  );
}

function metaSuiteCsvCell(value) {
  const s = value == null ? "" : String(value);

}

function exportMetaSuiteCsv(currentRecord, periodLabel) {
  const ads = (currentRecord && currentRecord.ads) || [];
  if (!ads.length) {
    window.alert("目前期間沒有可匯出的 Meta 廣告明細。");
    return;
  }
  const header = [
    "Campaign","Ad Set","Ad","Spend","Conversions","Revenue","ROAS","CPA",
    "Impressions","Clicks","CTR","CPM","CVR","Reach","Frequency","Active"
  ];
  const rows = ads.map((ad) => {
    const spend = Number(ad.spend || 0);
    const conversions = Number(ad.conversions || 0);
    const revenue = Number(ad.revenue || 0);
    const impressions = Number(ad.impressions || 0);
    const clicks = Number(ad.linkClicks || ad.clicks || 0);
    const reach = Number(ad.reach || 0);
    const roas = spend > 0 ? revenue / spend : null;
    const cpa = conversions > 0 ? spend / conversions : null;
    const ctr = impressions > 0 ? clicks / impressions * 100 : null;
    const cpm = impressions > 0 ? spend / impressions * 1000 : null;
    const cvr = clicks > 0 ? conversions / clicks * 100 : null;
    const frequency = reach > 0 ? impressions / reach : null;
    return [
      ad.campaign || "", ad.adSet || "", ad.name || "", spend, conversions, revenue,
      roas == null ? "" : roas.toFixed(4),
      cpa == null ? "" : cpa.toFixed(2),
      impressions, clicks,
      ctr == null ? "" : ctr.toFixed(4),
      cpm == null ? "" : cpm.toFixed(2),
      cvr == null ? "" : cvr.toFixed(4),
      reach,
      frequency == null ? "" : frequency.toFixed(4),
      ad.active === false ? "false" : ad.active === true ? "true" : ""
    ];
  });
  const csv = "\uFEFF" + [header, ...rows].map((row) => row.map(metaSuiteCsvCell).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safePeriod = String(periodLabel || "current-period").replace(/[\\/:*?"<>|]+/g, "-");
  a.href = url;
  a.download = "meta-ads-extractor-" + safePeriod + ".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
}

function buildMetaSuiteDiagnostics(currentRecord, previousRecord, roasTarget, cpaTarget, periodType) {
  const ads = (currentRecord && currentRecord.ads) || [];
  const prevMap = new Map(((previousRecord && previousRecord.ads) || []).map((ad) => [decisionAdKey(ad), ad]));
  const campaignCount = new Set(ads.map((ad) => ad.campaign).filter(Boolean)).size;
  const adSetCount = new Set(ads.map((ad) => [ad.campaign, ad.adSet].filter(Boolean).join("||")).filter(Boolean)).size;
  const decisionResult = buildDecisionIntelligence(currentRecord, previousRecord, roasTarget, cpaTarget, null, periodType);
  const decisions = (decisionResult && decisionResult.decisions) || [];
  const decisionCounts = { SCALE:0, KEEP:0, MONITOR:0, REFRESH:0, REDUCE:0 };
  decisions.forEach((x) => {
    const code = x && x.decision && x.decision.code;
    if (code && Object.prototype.hasOwnProperty.call(decisionCounts, code)) decisionCounts[code] += 1;
  });

  const autoAllocated = ads.filter((ad) => {
    const name = String(ad && ad.campaign || "").toUpperCase();
    return /(^|[^A-Z])(CBO|ASC)([^A-Z]|$)|ADVANTAGE\+|ADV\+/.test(name);
  }).length;
  const insufficient = ads.filter((ad) => Number(ad && ad.conversions || 0) < 10).length;

  const findings = [];
  ads.forEach((ad) => {
    const spend = Number(ad && ad.spend || 0);
    const conv = Number(ad && ad.conversions || 0);
    const impressions = Number(ad && ad.impressions || 0);
    const clicks = Number(ad && (ad.linkClicks || ad.clicks) || 0);
    const reach = Number(ad && ad.reach || 0);
    const ctr = impressions > 0 ? clicks / impressions * 100 : null;
    const frequency = reach > 0 ? impressions / reach : null;
    const prev = prevMap.get(decisionAdKey(ad));
    let prevCtr = null;
    if (prev) {
      const pImp = Number(prev.impressions || 0);
      const pClicks = Number(prev.linkClicks || prev.clicks || 0);
      prevCtr = pImp > 0 ? pClicks / pImp * 100 : null;
    }
    const ctrDelta = metricPctDelta(ctr, prevCtr);
    if (ctrDelta != null && ctrDelta <= -25 && frequency != null && frequency >= 2.2) {
      findings.push({
        level:"orange", type:"Creative fatigue", ad,
        detail:"CTR 較前期下降 " + Math.abs(ctrDelta).toFixed(0) + "%，Frequency " + frequency.toFixed(2) + "，優先更新素材。"
      });
    }
    if (cpaTarget > 0 && conv === 0 && spend >= cpaTarget * 2) {
      findings.push({
        level:"red", type:"Delivery stall", ad,
        detail:"已花費 " + fmtMoney(spend, currentRecord && currentRecord.currency) + " 且仍無轉單，已達目標 CPA ×2。"
      });
    }
    if (frequency != null && frequency >= 3 && (ctrDelta == null || ctrDelta <= -10)) {
      findings.push({
        level:"yellow", type:"Audience saturation", ad,
        detail:"Frequency " + frequency.toFixed(2) + " 偏高，且 CTR 沒有同步改善，留意受眾飽和。"
      });
    }
  });

  const score = decisionResult ? decisionResult.score : null;
  return {
    ads, campaignCount, adSetCount, decisionCounts, autoAllocated, insufficient,
    findings: findings.sort((a,b) => {
      const rank = { red:0, orange:1, yellow:2 };
      return (rank[a.level] ?? 9) - (rank[b.level] ?? 9) || Number(b.ad.spend || 0) - Number(a.ad.spend || 0);
    }),
    score
  };
}

function computeAdSetStats(ads) {
  const map = {};
  (ads || []).forEach((ad) => {
    const campaign = ad.campaign || "(未分類活動)";
    const adSet = ad.adSet || "(未分類廣告組合)";
    const key = campaign + "||" + adSet;
    if (!map[key]) {
      map[key] = {
        campaign, adSet, spend: 0, conversions: 0, revenue: 0,
        impressions: 0, clicks: 0, reach: 0, adCount: 0, activeAds: 0,
      };
    }
    const g = map[key];
    g.spend += Number(ad.spend || 0);
    g.conversions += Number(ad.conversions || 0);
    g.revenue += Number(ad.revenue || 0);
    g.impressions += Number(ad.impressions || 0);
    g.clicks += Number(ad.linkClicks || ad.clicks || 0);
    g.reach += Number(ad.reach || 0);
    g.adCount += 1;
    if (ad.active !== false) g.activeAds += 1;
  });
  return Object.values(map)
    .map((g) => ({
      ...g,
      cpa: g.conversions > 0 ? g.spend / g.conversions : null,
      roas: g.spend > 0 ? g.revenue / g.spend : null,
      ctr: g.impressions > 0 ? (g.clicks / g.impressions) * 100 : null,
      cpm: g.impressions > 0 ? (g.spend / g.impressions) * 1000 : null,
      cvr: g.clicks > 0 ? (g.conversions / g.clicks) * 100 : null,
      frequency: g.reach > 0 ? g.impressions / g.reach : null,
    }))
    .sort((a, b) => b.spend - a.spend);
}

// 匯出「投放成效」報告成 Word 檔——用瀏覽器版的 docx 套件(CDN載入,不用後端),
// 圖表(長條圖)在 Word 裡不好還原,所以匯出版本只保留卡片數字、明細表格、圖例文字、自動摘要,
// 這些才是會議上真的要看/要編輯的內容,長條圖本身在畫面上看就好。
async function exportAdPerformanceToWord({ rows, totalRevenue, totalSpend, totalConversions, overallRoas, roasTarget, periodLabel, currencyCode, brandName, insights, productNames = {} }) {
  const D = window.docx;
  if (!D || !window.saveAs) {
    window.alert("Word 匯出套件還沒載入完成,請重新整理頁面再試一次。");
    return;
  }
  const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, HeadingLevel, ShadingType } = D;

  // Word 的 TextRun 不支援行內 markdown,把 **粗體** 標記拆成多段 TextRun,標記的部分給 bold:true。
  function boldTextRuns(text, size) {
    return String(text || "")
      .split(/(\*\*[^*]+\*\*)/g)
      .filter(Boolean)
      .map((part) =>
        part.startsWith("**") && part.endsWith("**")
          ? new TextRun({ text: part.slice(2, -2), size, bold: true })
          : new TextRun({ text: part, size })
      );
  }

  function cardCell(label, value) {
    return new TableCell({
      width: { size: 25, type: WidthType.PERCENTAGE },
      shading: { type: ShadingType.CLEAR, fill: "F7F5EF" },
      margins: { top: 120, bottom: 120, left: 150, right: 150 },
      children: [
        new Paragraph({ children: [new TextRun({ text: label, size: 18, color: "6B6459" })] }),
        new Paragraph({ children: [new TextRun({ text: value, size: 26, bold: true })] }),
      ],
    });
  }
  function headerCell(text) {
    return new TableCell({
      shading: { type: ShadingType.CLEAR, fill: "1F3A3D" },
      children: [new Paragraph({ children: [new TextRun({ text, color: "FFFFFF", bold: true, size: 18 })] })],
    });
  }
  function dataCell(text, color) {
    return new TableCell({
      children: [new Paragraph({ children: [new TextRun({ text, size: 18, ...(color ? { color: color.replace("#", ""), bold: true } : {}) })] })],
    });
  }

  const doc = new Document({
    sections: [
      {
        children: [
          new Paragraph({ heading: HeadingLevel.HEADING_1, text: `投放成效${periodLabel ? `(${periodLabel})` : ""}` }),
          ...(brandName ? [new Paragraph({ text: brandName, spacing: { after: 200 } })] : []),
          new Table({
            width: { size: 100, type: WidthType.PERCENTAGE },
            rows: [
              new TableRow({
                children: [
                  cardCell("總花費", fmtMoney(totalSpend, currencyCode)),
                  cardCell("總業績", fmtMoney(totalRevenue, currencyCode)),
                  cardCell("成交筆數", fmtInt(totalConversions)),
                  cardCell("整體 ROAS", overallRoas !== null ? `${overallRoas.toFixed(2)}x(目標 ${roasTarget}x)` : "—"),
                ],
              }),
            ],
          }),
          new Paragraph({ text: "", spacing: { after: 200 } }),
          new Table({
            width: { size: 100, type: WidthType.PERCENTAGE },
            rows: [
              new TableRow({ children: ["系列", "業績", "花費", "ROAS", "廣告佔比", "平均CPA", "成交數"].map(headerCell) }),
              ...rows.map((r) => {
                const roas = r.spend > 0 ? r.revenue / r.spend : null;
                const cpa = r.conversions > 0 ? r.spend / r.conversions : null;
                const tier = roasTier(roas);
                const adRatioText = r.revenue > 0 ? `${((r.spend / r.revenue) * 100).toFixed(0)}%` : "—";
                return new TableRow({
                  children: [
                    dataCell(productNames[r.code] ? `${r.code}(${productNames[r.code]})` : r.code),
                    dataCell(fmtMoney(r.revenue, currencyCode)),
                    dataCell(fmtMoney(r.spend, currencyCode)),
                    dataCell(roas !== null ? `${roas.toFixed(2)}x` : "—", tier && tier.color),
                    dataCell(adRatioText),
                    dataCell(cpa !== null ? fmtMoney(cpa, currencyCode) : "—"),
                    dataCell(fmtInt(r.conversions)),
                  ],
                });
              }),
            ],
          }),
          new Paragraph({ text: "", spacing: { after: 100 } }),
          new Paragraph({
            children: [new TextRun({ text: "圖例:ROAS ≥5 優秀 / 3-5 穩健 / 2-3 待優化 / <2 低效", size: 16, color: "8A8478", italics: true })],
            spacing: { after: 300 },
          }),
          new Paragraph({ heading: HeadingLevel.HEADING_2, text: "自動摘要重點" }),
          new Paragraph({
            children: [new TextRun({ text: "(依統計規則產生,不是 AI 生成的分析文字)", size: 16, color: "8A8478", italics: true })],
            spacing: { after: 150 },
          }),
          ...insights.map(
            (ins) => new Paragraph({
              bullet: { level: 0 },
              spacing: { after: 80 },
              children: [new TextRun({ text: `${ins.icon} `, size: 20 }), ...boldTextRuns(ins.text, 20)],
            })
          ),
        ],
      },
    ],
  });

  const blob = await Packer.toBlob(doc);
  window.saveAs(blob, `投放成效報告${periodLabel ? `_${periodLabel}` : ""}.docx`);
}

  const [rowJudgments, setRowJudgments] = useState({}); // { 代號: {icon, label} } AI生成的逐代號短判斷,跟insights同一次呼叫產生

  const [aiSaveStatus, setAiSaveStatus] = useState("");

  // key跟「月報告」同一套設計,依品牌+月份分開存,彼此不會互相蓋掉。只讀不寫silent失敗:
  // 讀取失敗就當作「還沒有存檔」處理,不會用錯誤訊息打斷使用者第一次打開頁面的體驗。
  useEffect(() => {
    if (!storageKey) return;
    let cancelled = false;
    (async () => {
      try {
        const res = await storageGetStrict(storageKey);
        if (cancelled || !res || !res.value) return;
        const saved = JSON.parse(res.value);
        if (saved.insights) setAiInsights(saved.insights);
        if (saved.rowJudgments) setRowJudgments(saved.rowJudgments);
      } catch {
        /* 沒有存檔或讀取失敗,維持預設(規則統計版) */
      }
    })();
    return () => { cancelled = true; };
  }, [storageKey]);

  async function persistAiState(nextInsights, nextJudgments) {
    if (!storageKey) return;
    setAiSaveStatus("儲存中…");
    try {
      await storageSetStrict(storageKey, JSON.stringify({ insights: nextInsights, rowJudgments: nextJudgments }));
      setAiSaveStatus("已儲存 ✓");
      setTimeout(() => setAiSaveStatus(""), 2000);
    } catch (e) {
      setAiSaveStatus(`⚠ 存檔失敗:${e.message || "未知錯誤"}`);
    }

function DonutChart({ data, size = 176, thickness = 30 }) {
  const total = data.reduce((s, d) => s + Math.max(0, d.value), 0);
  const r = size / 2;
  const rInner = r - thickness;
  const toXY = (deg, radius) => {
    const rad = ((deg - 90) * Math.PI) / 180;
    return [r + radius * Math.cos(rad), r + radius * Math.sin(rad)];
  };
  function arcPath(startDeg, sweepDeg) {
    if (sweepDeg <= 0) return "";
    const endDeg = Math.min(startDeg + sweepDeg, startDeg + 359.999);
    const large = sweepDeg > 180 ? 1 : 0;
    const [x1, y1] = toXY(startDeg, r);
    const [x2, y2] = toXY(endDeg, r);
    const [x3, y3] = toXY(endDeg, rInner);
    const [x4, y4] = toXY(startDeg, rInner);
    return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${rInner} ${rInner} 0 ${large} 0 ${x4} ${y4} Z`;
  }
  let angle = 0;
  const arcs = data.map((d) => {
    const value = Math.max(0, d.value);
    const frac = total > 0 ? value / total : 0;
    const start = angle;
    const sweep = frac * 360;
    angle += sweep;
    return { ...d, start, sweep, frac };
  });
  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size}>
      {arcs.filter((a) => a.sweep > 0).map((a, i) => (
        <path key={i} d={arcPath(a.start, a.sweep)} fill={a.color}>
          <title>{a.label}：{(a.frac * 100).toFixed(1)}%</title>
        </path>
      ))}
      <circle cx={r} cy={r} r={rInner - 1} fill="var(--paper-raised)" />
    </svg>
  );
}
