  function LedgerVsMetaComparison({ ads, currencyCode, ledgerAgg, onOpenImport, periodLabel }) {
    if (!ledgerAgg) {
      return (
        <div className="mal-empty">
          {onOpenImport ? (
            <>
              <p>這個{periodLabel}還沒有匯入後台的「每日收益表」,沒辦法比對後台實際業績跟 Meta 回報的落差。</p>
              <button className="mal-btn mal-btn-primary" onClick={onOpenImport}>📥 匯入後台每日收益表</button>
            </>
          ) : (
            <p>這個{periodLabel}的後台業績資料還沒同步完成,稍後重新整理再看一次。</p>
          )}
        </div>
      );
    }
    const metaBreak = buildProductBreakdown(ads || [], MIN_AD_SPEND);
    const metaByCode = {};
    metaBreak.rows.forEach((r) => { metaByCode[r.code] = r; });
    const codes = Array.from(new Set([...Object.keys(ledgerAgg.byCode), ...Object.keys(metaByCode)])).sort();
    let totalBackendRevenue = 0, totalMetaRevenue = 0, totalBackendSpend = 0, totalMetaSpend = 0;
    const rows = codes.map((code) => {
      const b = ledgerAgg.byCode[code];
      const m = metaByCode[code];
      const backendRevenue = b ? b.revenue : 0;
      const metaRevenue = m ? m.revenue : 0;
      const backendSpend = b ? b.spend : 0;
      const metaSpend = m ? m.spend : 0;
      totalBackendRevenue += backendRevenue; totalMetaRevenue += metaRevenue;
      totalBackendSpend += backendSpend; totalMetaSpend += metaSpend;
      const revGap = metaRevenue - backendRevenue;
      const revGapPct = backendRevenue > 0 ? (revGap / backendRevenue) * 100 : null;
      const spendGap = metaSpend - backendSpend;
      const spendGapPct = backendSpend > 0 ? (spendGap / backendSpend) * 100 : null;
      return { code, backendRevenue, metaRevenue, revGap, revGapPct, backendSpend, metaSpend, spendGap, spendGapPct, onlyBackend: !!b && !m, onlyMeta: !!m && !b };
    });
    const totalRevGap = totalMetaRevenue - totalBackendRevenue;
    const totalRevGapPct = totalBackendRevenue > 0 ? (totalRevGap / totalBackendRevenue) * 100 : null;
    const totalSpendGap = totalMetaSpend - totalBackendSpend;
    const totalSpendGapPct = totalBackendSpend > 0 ? (totalSpendGap / totalBackendSpend) * 100 : null;
    const onlyBackendCodes = rows.filter((r) => r.onlyBackend).map((r) => r.code);
    const onlyMetaCodes = rows.filter((r) => r.onlyMeta).map((r) => r.code);
    return (
      <>
        <div className="mal-cards" style={{ marginBottom: 18 }}>
          <div className="mal-card">
            <div className="mal-card-label">後台實際營收</div>
            <div className="mal-card-value">{fmtMoney(totalBackendRevenue, currencyCode)}</div>
          </div>
          <div className="mal-card">
            <div className="mal-card-label">Meta 回報營收</div>
            <div className="mal-card-value">{fmtMoney(totalMetaRevenue, currencyCode)}</div>
          </div>
          <div className="mal-card">
            <div className="mal-card-label">營收落差</div>
            <div className="mal-card-value">{fmtMoney(totalRevGap, currencyCode)}</div>
            {totalRevGapPct !== null && <DeltaBadge value={totalRevGapPct} />}
          </div>
          <div className="mal-card">
            <div className="mal-card-label">廣告費落差</div>
            <div className="mal-card-value">{fmtMoney(totalSpendGap, currencyCode)}</div>
            {totalSpendGapPct !== null && <DeltaBadge value={totalSpendGapPct} invert />}
          </div>
        </div>
        <div className="mal-scroll-wrap mal-ledger-compare-wrap" style={{ overflowX: "auto" }}>
          <table className="mal-table mal-ledger-table mal-ledger-compare-table">
            <colgroup>
              <col style={{ width: "20%" }} />
              <col style={{ width: "12%" }} />
              <col style={{ width: "12%" }} />
              <col style={{ width: "12%" }} />
              <col style={{ width: "12%" }} />
              <col style={{ width: "12%" }} />
              <col style={{ width: "10%" }} />
              <col style={{ width: "10%" }} />
            </colgroup>
            <thead>
              <tr>
                <th rowSpan={2} style={{ verticalAlign: "bottom" }}>產品代號</th>
                <th colSpan={3} className="mal-ledger-group-backend mal-ledger-group-label-backend" style={{ textAlign: "center" }}>🟩 後台實際業績</th>
                <th colSpan={2} className="mal-ledger-group-meta mal-ledger-group-label-meta" style={{ textAlign: "center" }}>🟧 Meta 回報業績</th>
                <th colSpan={2} className="mal-ledger-group-gap" style={{ textAlign: "center" }}>落差</th>
              </tr>
              <tr>
                <th className="mal-ledger-group-backend">營收</th>
                <th className="mal-ledger-group-backend">廣告費</th>
                <th className="mal-ledger-group-backend">廣告費佔比</th>
                <th className="mal-ledger-group-meta">營收</th>
                <th className="mal-ledger-group-meta">廣告費</th>
                <th className="mal-ledger-group-gap">營收落差%</th>
                <th className="mal-ledger-group-gap">廣告費落差%</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.code}>
                  <td>
                    {r.code}
                    {r.onlyBackend && <span style={{ fontSize: 10, color: "var(--red)", marginLeft: 4 }}>僅後台</span>}
                    {r.onlyMeta && <span style={{ fontSize: 10, color: "var(--red)", marginLeft: 4 }}>僅Meta</span>}
                  </td>
                  <td className="mal-ledger-group-backend">{fmtMoney(r.backendRevenue, currencyCode)}</td>
                  <td className="mal-ledger-group-backend">{fmtMoney(r.backendSpend, currencyCode)}</td>
                  <td className="mal-ledger-group-backend">{adPct(r.backendSpend, r.backendRevenue, adRatioThresholds[activeBrandId])}</td>
                  <td className="mal-ledger-group-meta">{fmtMoney(r.metaRevenue, currencyCode)}</td>
                  <td className="mal-ledger-group-meta">{fmtMoney(r.metaSpend, currencyCode)}</td>
                  <td className="mal-ledger-group-gap">{r.revGapPct !== null ? <DeltaBadge value={r.revGapPct} /> : "—"}</td>
                  <td className="mal-ledger-group-gap">{r.spendGapPct !== null ? `${r.spendGapPct >= 0 ? "+" : ""}${r.spendGapPct.toFixed(0)}%` : "—"}</td>
                </tr>
              ))}
              <tr>
                <td className="mal-row-month">合計</td>
                <td className="mal-ledger-group-backend mal-row-month">{fmtMoney(totalBackendRevenue, currencyCode)}</td>
                <td className="mal-ledger-group-backend mal-row-month">{fmtMoney(totalBackendSpend, currencyCode)}</td>
                <td className="mal-ledger-group-backend mal-row-month">{adPct(totalBackendSpend, totalBackendRevenue, adRatioThresholds[activeBrandId])}</td>
                <td className="mal-ledger-group-meta mal-row-month">{fmtMoney(totalMetaRevenue, currencyCode)}</td>
                <td className="mal-ledger-group-meta mal-row-month">{fmtMoney(totalMetaSpend, currencyCode)}</td>
                <td className="mal-ledger-group-gap mal-row-month">{totalRevGapPct !== null ? <DeltaBadge value={totalRevGapPct} /> : "—"}</td>
                <td className="mal-ledger-group-gap mal-row-month">{totalSpendGapPct !== null ? `${totalSpendGapPct >= 0 ? "+" : ""}${totalSpendGapPct.toFixed(0)}%` : "—"}</td>
              </tr>
            </tbody>
          </table>
        </div>
        <p style={{ fontSize: 11, color: "var(--ink-soft)", margin: "8px 0 0" }}>
          🟩 後台實際業績 = 匯入的每日收益表(以下單日期為準,已扣退換貨);🟧 Meta 回報業績 = Meta 廣告後台回報的轉換金額(以歸因時間為準)。落差% = (Meta − 後台) ÷ 後台。
        </p>
        <div className="mal-analysis">
          <div className="mal-analysis-title">基礎分析:為什麼會有落差</div>
          <ul>
            <li>歸因時間差:Meta 依廣告帳戶時區、點擊或瀏覽後 1~7 天內成立的轉換計算,後台則依「實際下單日期」計算,同一筆訂單可能被算進不同天,尤其影響跨月邊界。</li>
            <li>非 Meta 廣告帶來的訂單:自然流量、Google、社團、業配連結等其他渠道的訂單只會出現在後台,不會算進 Meta 回報的營收。</li>
            <li>退換貨與訂單取消:後台營收通常已扣除退貨/取消,Meta 的轉換數字多半不會事後修正,會讓 Meta 端顯示比實際偏高。</li>
            <li>轉換去重估算方式不同:Meta 用像素/CAPI 綜合估算轉換金額,與後台實際成立訂單金額本來就存在估算誤差。</li>
            {onlyBackendCodes.length > 0 && (
              <li>「{onlyBackendCodes.join("、")}」只有後台資料、Meta 端找不到對應代號,可能是這些商品目前沒有投放 Meta 廣告,或廣告活動命名沒有加上一致的產品代號。</li>
            )}
            {onlyMetaCodes.length > 0 && (
              <li>「{onlyMetaCodes.join("、")}」只有 Meta 資料、後台找不到對應,請確認是否已匯入這個{periodLabel}的後台報表,或後台的產品代號拼法是否一致。</li>
            )}
            {metaBreak.unresolved > 0 && (
              <li>Meta 端另有 {metaBreak.unresolved} 支廣告的行銷活動名稱沒有加上「【產品代號】」,沒有被算進上表,可能讓 Meta 端的營收被低估。</li>
            )}
          </ul>
        </div>
      </>
    );
  }

function PerformanceBreakdown({ ads, currencyCode, accountId }) {
    const { qualifyingAds, buckets } = groupAdsByPerformance(ads);
    const brandPageId = derivePageIdFromAds(ads);
    // 預設全部展開；使用者仍可手動收合各成效分類。
    const [collapsed, setCollapsed] = useState({ good: false, normal: false, poor: false, learning: false });

    useEffect(() => {
      function handleExpandAll() {
        setCollapsed({ good: false, normal: false, poor: false, learning: false });
      }
      window.addEventListener(PERF_EXPAND_ALL_EVENT, handleExpandAll);
      return () => window.removeEventListener(PERF_EXPAND_ALL_EVENT, handleExpandAll);
    }, []);

    if (!qualifyingAds.length) return null;

    function jumpToBucket(k) {
      if (!buckets[k].length) return;
      setCollapsed((prev) => ({ ...prev, [k]: false }));
      // 等展開後 DOM 高度更新,再捲動,位置才會準——不然可能捲到展開前的舊位置。
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const el = document.getElementById(`mal-perf-bucket-${k}`);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });
    }

    function toggleBucket(k) {
      setCollapsed((prev) => ({ ...prev, [k]: !prev[k] }));
    }

    return (
      <>
        <CollapsibleSectionTitle className="mal-section-title">
          廣告成效分類<span className="mal-section-count">(花費 ≥ {MIN_AD_SPEND} 的廣告共 {qualifyingAds.length} 支,含已停止)</span>
        </CollapsibleSectionTitle>
        <div className="mal-perf-tabs">
          {PERF_ORDER.map((k) => (
            <button
              type="button"
              key={k}
              className={`mal-perf-card ${!collapsed[k] && buckets[k].length > 0 ? "mal-perf-card-active" : ""}`}
              disabled={!buckets[k].length}
              onClick={() => jumpToBucket(k)}
            >
              <span className="mal-perf-card-label">{PERF_LABELS[k]} {buckets[k].length}</span>
            </button>
          ))}
        </div>
        {PERF_ORDER.filter((k) => buckets[k].length > 0).map((k) => (
          <div key={k} id={`mal-perf-bucket-${k}`} className="mal-perf-section">
            <button type="button" className="mal-perf-section-header" onClick={() => toggleBucket(k)}>
              <span className="mal-perf-section-title" style={{ color: PERF_COLORS[k] }}>
                {PERF_LABELS[k]}<span className="mal-section-count">({buckets[k].length})</span>
              </span>
              <span className="mal-perf-section-chevron" style={{ transform: collapsed[k] ? "rotate(-90deg)" : "rotate(0deg)" }}>▾</span>
            </button>
            {!collapsed[k] && (
              <div className="mal-perf-section-body">
                <div className="mal-ad-list">
                  {buckets[k].map((ad, i) => {
                    const adCpa = ad.conversions > 0 ? ad.spend / ad.conversions : null;
                    const adRoas = ad.spend > 0 && ad.revenue > 0 ? ad.revenue / ad.spend : null;
                    const fbLink = fbAdsManagerLink(accountId, ad.adIds);
                    const fbLibLink = fbPostLink(ad.postId);
                    return (
                      <div className={`mal-ad-row ${ad.active === false ? "mal-ad-row-inactive" : ""}`} key={ad.name + i}>
                        <AdThumb src={ad.image} alt={ad.name} />
                        <div className="mal-ad-info">
                          <div className="mal-ad-name" title={ad.name}>
                            {ad.name}
                            <ActiveBadge active={ad.active} />
                            {cpaThresholds[activeBrandId] != null && adCpa !== null && adCpa > cpaThresholds[activeBrandId] && (
                              <span style={{ color: "var(--red)", fontWeight: 600, fontSize: 11 }}> ⚠ CPA過高</span>
                            )}
                          </div>
                          <div className="mal-ad-utm" title={ad.campaign}>{ad.campaign}</div>
                          {ad.startDate && <span className="mal-ad-startdate">{fmtStartDate(ad.startDate)} 開始投放</span>}
                          {fbLink && <a className="mal-ad-fblink" href={fbLink} target="_blank" rel="noopener noreferrer">↗ 前往廣告</a>}
                          {fbLibLink && <a className="mal-ad-fblink" href={fbLibLink} target="_blank" rel="noopener noreferrer">↗ 前往 FB 前台</a>}
                        {!fbLibLink && fbAdLibraryFallbackLink(brandPageId) && <a className="mal-ad-fblink" href={fbAdLibraryFallbackLink(brandPageId)} target="_blank" rel="noopener noreferrer" title="沒有找到對應貼文,改連到廣告檔案庫查詢,不一定查得到">↗ 前往廣告檔案庫查看(備用)</a>}
                        </div>
                        <div className="mal-ad-stats">
                          <div><span>廣告費</span>{fmtMoney(ad.spend, currencyCode)}</div>
                          <div><span>轉單</span>{fmtInt(ad.conversions)}</div>
                          <div><span>轉單金額</span>{ad.revenue > 0 ? fmtMoney(ad.revenue, currencyCode) : "—"}</div>
                          <div><span>CPA</span>{adCpa !== null ? fmtMoney(adCpa, currencyCode) : "—"}</div>
                          <div><span>ROAS</span>{adRoas !== null ? `${adRoas.toFixed(2)}x` : "—"}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
        ))}
      </>
    );
  }

  function CampaignAnalysis({ ads, currencyCode }) {
    const campaignStats = computeCampaignStats(ads);
    if (!campaignStats.length) return null;
    const insights = computeCampaignInsights(campaignStats, currencyCode);
    return (
      <>
        <CollapsibleSectionTitle className="mal-section-title">

  async function fetchFullMonthFromApi() {
    if (!apiToken.trim() || !apiAccountId.trim() || !apiMonth) {
      setApiError("請填入存取權杖、廣告帳號 ID,並選擇月份。");
      return;
    }
    setApiError(null);
    setApiNotice(null);
    setApiLoading(true);
    try {
      const cleanId = apiAccountId.trim().replace(/^act_/, "");
      await storage.set("meta-api-account-id", cleanId).catch(() => {});
      const record = await fetchOneBrandMonth(apiToken.trim(), cleanId, apiMonth);
      if (!record.ads.length) {
        setApiNotice(`${monthLabel(apiMonth)} 沒有抓到任何廣告成效資料,請確認該月份確實有花費紀錄。`);
        setApiLoading(false);
        return;
      }
      const brandIdToUse = await ensureBrandRegistered(cleanId);
      record.source = "manual";
      await storage.set(monthKeyFor(brandIdToUse, apiMonth), JSON.stringify(record));
      setActiveBrandId(brandIdToUse);
      await loadAll(brandIdToUse);
      setFocusMonth(apiMonth);
      setApiNotice(`已從 API 抓到 ${monthLabel(apiMonth)} 的資料,共 ${record.ads.length} 支廣告。`);
      setShowApiPanel(false);
    } catch (e) {
      setApiError("抓取失敗:" + e.message + apiErrorHint(e));
    } finally {
      setApiLoading(false);
    }
  }

  async function fetchBatchFromApi() {
  if (!apiToken.trim() || !apiMonth) {
    setApiError("請填入存取權杖並選擇月份。");
    return;
  }
  const targets = brands.filter((b) => selectedBatchBrandIds.includes(b.id));
  if (!targets.length) {
    setApiError("請至少勾選一個品牌。");
    return;
  }
  setApiError(null);
  setApiNotice(null);
  setApiLoading(true);
  const progress = targets.map((b) => ({ id: b.id, name: b.name, status: "pending", message: "" }));
  setBatchProgress(progress);
  for (let i = 0; i < targets.length; i++) {
    const b = targets[i];
    setBatchProgress((prev) => prev.map((p, idx) => idx === i ? { ...p, status: "running" } : p));
    try {
      const record = await fetchOneBrandMonth(apiToken.trim(), b.id, apiMonth);
      record.source = "manual";
      await storage.set(monthKeyFor(b.id, apiMonth), JSON.stringify(record));
      setBatchProgress((prev) => prev.map((p, idx) => idx === i ? {
        ...p,
        status: record.ads.length ? "done" : "empty",
        message: String(record.ads.length) + " 支廣告"
      } : p));
    } catch (e) {
      setBatchProgress((prev) => prev.map((p, idx) => idx === i ? { ...p, status: "error", message: e.message } : p));
    }
    if (i < targets.length - 1) await new Promise((resolve) => setTimeout(resolve, 4000));
  }
  setApiLoading(false);
  setApiNotice("批次抓取完成,上方可以切換品牌查看結果。");
  await loadAll(activeBrandId);
}

async function toggleRememberToken(checked) {
    setRememberToken(checked);
    if (checked) {
      await storage.set("meta-api-remember-token", "1").catch(() => {});
      if (apiToken.trim()) await storage.set("meta-api-token", apiToken.trim()).catch(() => {});
    } else {
      await storage.set("meta-api-remember-token", "0").catch(() => {});
      await storage.delete("meta-api-token").catch(() => {});
      // 不記住權杖的話,自動同步也一併關閉,因為沒有存起來的權杖可以自動用
      if (autoSyncEnabled) {
        setAutoSyncEnabled(false);
        await storage.set("meta-api-autosync", "0").catch(() => {});
      }
    }
  }

  async function toggleAutoSync() {
    setAutoSyncEnabled(false);
    await storage.set("meta-api-autosync", "0").catch(() => {});
    setApiNotice("Meta 自動同步已由中央排程接管；此頁只讀取已同步資料。手動抓取功能保留作緊急備援。");
  }

  // 前端備援同步只檢查上個月資料是否存在；正式同步已由中央排程接管。
  async function runAutoSyncWith(token, brandsList, defaultAccountId) {
  if (!token || !token.trim()) return;
  const cleanDefaultId = (defaultAccountId || "").trim().replace(/^act_/, "");
  const effectiveBrandsList = (brandsList && brandsList.length) ? brandsList : (getCredentialBrands() || []);
  const targets = (effectiveBrandsList && effectiveBrandsList.length)
    ? effectiveBrandsList.map((b) => ({ apiId: b.id, storageId: b.id, name: b.name }))
    : cleanDefaultId
      ? [{ apiId: cleanDefaultId, storageId: cleanDefaultId, name: cleanDefaultId }]
      : [];
  if (!targets.length) return;

  if (!effectiveBrandsList || !effectiveBrandsList.length) {
    const autoBrand = { name: cleanDefaultId, id: cleanDefaultId };
    setBrands([autoBrand]);
    await storage.set("meta-api-brands", JSON.stringify([autoBrand])).catch(() => {});
  }

  const now = new Date();
  const lastMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const lastMonthKey = lastMonthDate.getFullYear() + "-" + String(lastMonthDate.getMonth() + 1).padStart(2, "0");
  const monthListRes = await storage.list(STORAGE_PREFIX).catch(() => ({ keys: [] }));
  const existingMonthKeys = new Set(monthListRes.keys || []);
  const needsMonth = targets.filter((t) => !existingMonthKeys.has(monthKeyFor(t.storageId, lastMonthKey)));
  if (!needsMonth.length) return;

  setAutoSyncStatus("自動同步中… 補齊 " + monthLabel(lastMonthKey) + " 資料");
  let successCount = 0;
  let errorCount = 0;
  for (let i = 0; i < needsMonth.length; i++) {
    const t = needsMonth[i];
    try {
      const record = await fetchOneBrandMonth(token.trim(), t.apiId, lastMonthKey);
      record.source = "auto";
      await storage.set(monthKeyFor(t.storageId, lastMonthKey), JSON.stringify(record));
      successCount++;
    } catch {
      errorCount++;
    }
    if (i < needsMonth.length - 1) await new Promise((resolve) => setTimeout(resolve, 4000));
  }
  setAutoSyncStatus(null);
  await loadAll(activeBrandId);
  if (successCount > 0) {
    const errorText = errorCount > 0 ? "," + errorCount + " 筆失敗(可能是頻率限制,之後再手動抓一次即可)" : "";
    setApiNotice("已自動同步完成:成功更新 " + successCount + " 筆資料" + errorText + "。");
  } else if (errorCount > 0) {
    setApiError("瀏覽器裡存的個人Token可能已過期,前端備援同步失敗；這不影響中央 Airbyte 已同步的報表資料。");
  }
}

// 手動觸發同步(例如面板裡的「立即同步」按鈕),用目前畫面上的權杖跟品牌清單
  function runAutoSync() {
    return runAutoSyncWith(apiToken, brands, apiAccountId);
  }

  const sortedKeys = useMemo(() => Object.keys(months).sort(), [months]);
  const enriched = useMemo(() => { const out = {}; for (const mk of sortedKeys) out[mk] = deriveMetrics(months[mk]); return out; }, [months, sortedKeys]);
  const chartData = useMemo(() => sortedKeys.map((mk) => ({
    month: monthLabel(mk), 廣告費: Math.round(enriched[mk].spend), 轉單: enriched[mk].conversions,
    CPA: enriched[mk].cpa !== null ? Number(enriched[mk].cpa.toFixed(1)) : null,
    ROAS: enriched[mk].roas !== null ? Number(enriched[mk].roas.toFixed(2)) : null,
  })), [sortedKeys, enriched]);
  const currency = sortedKeys.length ? months[sortedKeys[sortedKeys.length - 1]].currency : "TWD";
  const focusIdx = sortedKeys.indexOf(focusMonth);
  const focusData = focusMonth ? enriched[focusMonth] : null;
  const prevData = focusIdx > 0 ? enriched[sortedKeys[focusIdx - 1]] : null;
  const MIN_AD_SPEND = 500;
  const spendFilteredAds = focusData && focusData.ads ? focusData.ads.filter((ad) => ad.spend >= MIN_AD_SPEND) : [];
  // 「本月新投放」只看 startDate 真正落在目前選取月份內的廣告。
  // 例如 focusMonth=2026-10，9/30 開始投放即使 10 月仍有花費，也不會進這個細項。
  const monthStartedAds = focusMonth
    ? spendFilteredAds.filter((ad) => ad.startDate && String(ad.startDate).slice(0, 7) === focusMonth)
    : [];
  const launchFilteredAds = adLaunchFilter === "month" ? monthStartedAds : spendFilteredAds;
  const visibleAds = filterAdsByStatus(launchFilteredAds, adStatusFilter, adSearchKeyword);
  const hiddenAdCount = focusData && focusData.ads ? focusData.ads.length - spendFilteredAds.length : 0;
  // TOP 3 不在前端重算，直接讀中央 API 的月份排名，避免品牌總報表與獨立報表邏輯分岔。
  const centralTopProductsMonth = focusMonth ? centralTopProductsByMonth[focusMonth] : null;
  const monthLaunchProductTop3 = centralTopProductsMonth && Array.isArray(centralTopProductsMonth.top3)
    ? centralTopProductsMonth.top3
    : [null, null, null];
  const monthRankedSpend = centralTopProductsMonth ? Number(centralTopProductsMonth.totalAdSpend) || 0 : 0;
  const monthRankedAdCount = centralTopProductsMonth ? Number(centralTopProductsMonth.spendingAdCount) || 0 : 0;

  // ---------- 每日營收報表:直接呈現後台每日收益表(ledgerByMonth)裡「每一天 x 每個產品代號」的明細,不用另外彙總 ----------
  // 選單月份/選單日,優先順序是:①使用者自己手動點過的(dailyMonth/focusDay,只要那筆資料還在就沿用,尊重手動導覽)
  // ②今天實際的月份/日期(如果那個月/那一天剛好有資料的話)③都沒有的話,退回資料裡最後一筆(例如試算表只匯到某個過去的月份)。
  // 這樣打開「每日報表」預設就會對準今天,不用手動點,但只要手動切換過,還是會照使用者選的走,不會一直搶跳回今天。
  const ledgerMonthKeys = useMemo(() => Object.keys(ledgerByMonth).sort(), [ledgerByMonth]);
  const todayParts = useMemo(() => {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return { monthKey: `${y}-${m}`, dateKey: `${y}-${m}-${d}` };
  }, []);
  const activeDailyMonth = (dailyMonth && ledgerByMonth[dailyMonth])
    ? dailyMonth
    : ledgerByMonth[todayParts.monthKey]
    ? todayParts.monthKey
    : (ledgerMonthKeys.length ? ledgerMonthKeys[ledgerMonthKeys.length - 1] : null);
  const dailyMonthRecord = activeDailyMonth ? ledgerByMonth[activeDailyMonth] : null;
  const sortedDailyDays = useMemo(
    () => (dailyMonthRecord ? dailyMonthRecord.days.slice().sort((a, b) => (a.date < b.date ? -1 : 1)) : []),
    [dailyMonthRecord]
  );
  // 目前這個月裡,淨利潤是負的那幾天——比廣告費佔比超標更嚴重,所以不是放在下面的「基礎分析」裡,
  // 是顯示在每日報表最上面,一打開就看得到,不用往下滑或切分頁去找。(跟H-J同步補上,原本只有
  // H-J有這個區塊,speedingscs這邊完全沒有,不是壞掉、是原本就沒做。)
  const negativeProfitDays = useMemo(
    () => sortedDailyDays.filter((d) => d.overall && d.overall.netProfit < 0),
    [sortedDailyDays]
  );
  const activeFocusDay = (focusDay && sortedDailyDays.some((d) => d.date === focusDay))
    ? focusDay
    : sortedDailyDays.some((d) => d.date === todayParts.dateKey)
    ? todayParts.dateKey
    : (sortedDailyDays.length ? sortedDailyDays[sortedDailyDays.length - 1].date : null);
  const focusDayRecord = activeFocusDay ? sortedDailyDays.find((d) => d.date === activeFocusDay) : null;
  const focusDayIdx = activeFocusDay ? sortedDailyDays.findIndex((d) => d.date === activeFocusDay) : -1;
  const prevDayRecord = focusDayIdx > 0 ? sortedDailyDays[focusDayIdx - 1] : null;
  const dailyMatrixCodesRaw = dailyMonthRecord ? dailyMonthRecord.productCodes : [];
  const dailyMatrixSplit = sortCodesChannelFirst(dailyMatrixCodesRaw);
  const dailyMatrixCodes = dailyMatrixSplit.sorted;
  // H&J一頁業績專用:讀取H-J那邊已經同步好的真實Shopline訂單資料(共用儲存,不用speedingscs自己抓)。
  // 同時涵蓋矩陣總覽/選一天用的activeDailyMonth,跟每月報表用的 focusMonth——
  // 不同分頁各自選的月份可能不一樣,分開判斷、分開讀,已經讀過的不重讀。
  useEffect(() => {
  if (activeBrandId !== HJ_ONEPAGE_ACCOUNT_ID) return;
  let cancelled = false;
  const monthsNeeded = [...new Set([activeDailyMonth, focusMonth].filter(Boolean))]
    .filter((mk) => !shoplineMonthsData[mk]);
  if (!monthsNeeded.length) return;
  (async () => {
    for (const mk of monthsNeeded) {
      try {
        const res = await storage.get(shoplineMonthKey(mk));
        if (!cancelled && res && res.value) {
          const record = JSON.parse(res.value);
          setShoplineMonthsData((prev) => ({ ...prev, [mk]: record }));
        }
      } catch {}
    }
  })();
  return () => { cancelled = true; };
}, [activeBrandId, activeDailyMonth, focusMonth, shoplineMonthsData]);
const shopeRealDailyMap = useMemo(() => {
    if (activeBrandId !== HJ_ONEPAGE_ACCOUNT_ID) return {};
    const monthRecord = activeDailyMonth ? shoplineMonthsData[activeDailyMonth] : null;
    if (!monthRecord || !monthRecord.orders) return {};
    const grouped = groupShoplineOrdersByDay(monthRecord.orders);
    return Object.fromEntries(grouped.map((g) => [g.date, g]));
  }, [activeBrandId, shoplineMonthsData, activeDailyMonth]);
  // adPct / AD_RATIO_CRITICAL_PCT 已經移到檔案最上面的頂層,這裡不用重複定義。
  // 淨利潤是負的(虧錢)時,用比廣告費佔比超標更重的標紅樣式(深紅底色+粗體),兩種警示程度做出區別。
  const netProfitCell = (value) => {
    if (value < 0) {
      return (
        <span style={{ color: "#8B1E2B", fontWeight: 700, background: "#FBE4E4", padding: "1px 6px", borderRadius: 4 }}>
          {fmtMoney(value)}
        </span>
      );
    }
    return fmtMoney(value);
  };
  // 基礎分析用:當月每一天的廣告費佔比,抓出佔比最高的一天,以及(如果有設定門檻)超過門檻的天數清單。
  const dailyRatioStats = useMemo(() => {
    let highestDay = null;
    const overThresholdDays = [];
    const threshold = adRatioThresholds[activeBrandId];
    sortedDailyDays.forEach((d) => {
      if (d.overall.revenue > 0) {
        const pct = (d.overall.adSpend / d.overall.revenue) * 100;
        if (!highestDay || pct > highestDay.pct) highestDay = { date: d.date, pct };
        if (threshold != null && pct > threshold) overThresholdDays.push({ date: d.date, pct });
      }
    });
    return { highestDay, overThresholdDays };
  }, [sortedDailyDays, adRatioThresholds, activeBrandId]);

  // ---------- 業配廣告長線分析:把名稱或行銷活動裡含「業配」兩個字的廣告單獨拉出來,依月份累計趨勢 ----------
  const SPONSOR_KEYWORD = "業配";
  const sponsorMonthlyStats = useMemo(() => sortedKeys.map((mk) => {
    const rec = months[mk];
    const sponsorAds = Array.isArray(rec.sponsorAds)
      ? rec.sponsorAds
      : (rec.ads || []).filter(
          (ad) => (ad.name && ad.name.includes(SPONSOR_KEYWORD)) || (ad.campaign && ad.campaign.includes(SPONSOR_KEYWORD))
        );
    const spend = sponsorAds.reduce((s, a) => s + a.spend, 0);
    const conversions = sponsorAds.reduce((s, a) => s + a.conversions, 0);
    const revenue = sponsorAds.reduce((s, a) => s + a.revenue, 0);
    return {
      monthKey: mk, month: monthLabel(mk), ads: sponsorAds, spend, conversions, revenue,
      cpa: conversions > 0 ? spend / conversions : null,
      roas: spend > 0 && revenue > 0 ? revenue / spend : null,
    };
  }), [sortedKeys, months]);
  const sponsorChartData = useMemo(() => sponsorMonthlyStats.map((s) => ({
    month: s.month, 廣告費: Math.round(s.spend), 轉單: s.conversions,
    CPA: s.cpa !== null ? Number(s.cpa.toFixed(1)) : null,
    ROAS: s.roas !== null ? Number(s.roas.toFixed(2)) : null,
  })), [sponsorMonthlyStats]);
  const sponsorTotal = useMemo(() => {
    const spend = sponsorMonthlyStats.reduce((s, m) => s + m.spend, 0);
    const conversions = sponsorMonthlyStats.reduce((s, m) => s + m.conversions, 0);
    const revenue = sponsorMonthlyStats.reduce((s, m) => s + m.revenue, 0);
    return { spend, conversions, revenue, cpa: conversions > 0 ? spend / conversions : null, roas: spend > 0 && revenue > 0 ? revenue / spend : null };
  }, [sponsorMonthlyStats]);
  const sponsorMonthsWithData = sponsorMonthlyStats.filter((m) => m.ads.length > 0);
  const sponsorFocusStats = useMemo(() => {
    if (!sponsorMonthsWithData.length) return null;
    return sponsorMonthsWithData.find((m) => m.monthKey === focusMonth)
      || sponsorMonthsWithData[sponsorMonthsWithData.length - 1];
  }, [sponsorMonthsWithData, focusMonth]);

  const sortedVisibleAds = useMemo(() => sortAdsByMode(visibleAds, adSortMode), [visibleAds, adSortMode]);
  const focusLedgerAgg = focusMonth
    ? aggregateLedgerRange(ledgerByMonth, monthDateRange(focusMonth).since, monthDateRange(focusMonth).until)
    : null;
  const prevLedgerAgg = focusIdx > 0
    ? aggregateLedgerRange(ledgerByMonth, monthDateRange(sortedKeys[focusIdx - 1]).since, monthDateRange(sortedKeys[focusIdx - 1]).until)
    : null;

  return (
    <div className="mal-shell">

        <div className="mal-header-actions">
          <div className="mal-header-actions-primary">

            {!HAS_SHARED_STORAGE && (
              <button type="button" className="mal-btn" onClick={openDepartmentSwitcher} title="切換登入部門">
                {cloudStatus === "connected"
                  ? <><span className="mal-btn-emoji">🔄</span> 切換部門{credentialName ? "（" + credentialName + "）" : ""}</>
                  : <><span className="mal-btn-emoji">🔑</span> 登入部門</>}
              </button>
            )}
          </div>
          <div className="mal-header-actions-secondary">
            {activeBrandId && (
              <button className="mal-btn" onClick={() => setShowLedgerModal(true)}><span className="mal-btn-emoji">📥</span> 匯入後台業績</button>
            )}
            {sortedKeys.length > 0 && (
              <button className="mal-btn mal-print-btn" onClick={handlePrintClick}><span className="mal-btn-emoji">🖨</span> 列印</button>
            )}
            {sortedKeys.length > 0 && (
              <button className="mal-btn mal-print-btn" onClick={() => setShowPdfSectionModal(true)}><span className="mal-btn-emoji">📄</span> 匯出 PDF</button>
            )}
          </div>
          {sortedKeys.length > 0 && (
            <div className="mal-header-actions-reset-row">
              <button className="mal-btn mal-btn-danger" onClick={() => setConfirmReset(true)}><span className="mal-btn-emoji">🗑</span> 重置</button>
            </div>
          )}
        </div>

        {showPrintSelector && (
          <div className="mal-modal-overlay" onClick={() => setShowPrintSelector(false)}>
            <div className="mal-modal" onClick={(e) => e.stopPropagation()}>
              <h3>選擇要列印的大項</h3>
              <p className="mal-modal-sub">只列印目前分頁中你勾選的大項；未勾選的內容不會送進列印。</p>

              <div className="mal-print-selector-toolbar">
                <button className="mal-btn" onClick={() => setSelectedPrintSections(printSections.map((section) => section.id))}>全選</button>
                <button className="mal-btn" onClick={() => setSelectedPrintSections([])}>全部取消</button>
              </div>

              <div className="mal-print-selector-list">
                {printSections.map((section) => (
                  <label className="mal-print-selector-item" key={section.id}>
                    <input
                      type="checkbox"
                      checked={selectedPrintSections.includes(section.id)}
                      onChange={(e) => {
                        setSelectedPrintSections((prev) =>
                          e.target.checked
                            ? Array.from(new Set([...prev, section.id]))
                            : prev.filter((id) => id !== section.id)
                        );
                      }}
                    />
                    <span>{section.label}</span>
                  </label>
                ))}
              </div>

              <div className="mal-modal-actions">
                <button className="mal-btn" onClick={() => setShowPrintSelector(false)}>取消</button>
                <button
                  className="mal-btn mal-btn-primary"
                  disabled={!selectedPrintSections.length}
                  onClick={printSelectedSections}
                >
                  列印已勾選項目
                </button>
              </div>
            </div>
          </div>
        )}

        {showPdfSectionModal && (
          <div className="mal-modal-overlay" onClick={() => setShowPdfSectionModal(false)}>
            <div className="mal-modal" onClick={(e) => e.stopPropagation()}>
              <h3>選擇要匯出的內容</h3>
              <label className="mal-pdf-section-row mal-pdf-section-all">
                <input
                  type="checkbox"
                  checked={pdfSelectedSections.size === PDF_SECTION_OPTIONS.length}
                  onChange={(e) => toggleAllPdfSections(e.target.checked)}
                />
                全選 / 全不選
              </label>
              {PDF_SECTION_OPTIONS.map((opt) => (
                <label className="mal-pdf-section-row" key={opt.key}>
                  <input type="checkbox" checked={pdfSelectedSections.has(opt.key)} onChange={() => togglePdfSection(opt.key)} />
                  {opt.label}
                </label>
              ))}
              <div className="mal-modal-actions">
                <button className="mal-btn" onClick={() => setShowPdfSectionModal(false)}>取消</button>
                <button
                  className="mal-btn mal-btn-primary"
                  disabled={pdfSelectedSections.size === 0 || pdfExportBusy}
                  onClick={() => { setShowPdfSectionModal(false); runPdfExport(); }}
                >
                  {pdfExportBusy ? "準備中…" : "確認匯出"}
                </button>
              </div>
            </div>
          </div>
        )}
      </div>

      {brands.length > 0 && (
        <div className="mal-brand-switch">
          <span className="mal-brand-switch-label">品牌:</span>
          {brands.map((b) => (
            <div
              key={b.id}
              className={`mal-brand-chip ${activeBrandId === b.id ? "mal-brand-chip-active" : ""}`}
              onClick={() => setActiveBrandId(b.id)}
              title={b.id}
            >
              {b.name}
            </div>
          ))}
        </div>
      )}

        <div className="mal-threshold-group">

            <span className="mal-threshold-label">CPA 過高標準</span>
            <strong className={`mal-threshold-value${cpaThresholds[activeBrandId] != null ? " mal-threshold-value-set" : ""}`}>
              {cpaThresholds[activeBrandId] != null ? `${cpaThresholds[activeBrandId]}` : "尚未設定"}
            </strong>
            <button className="mal-btn mal-threshold-btn" onClick={() => editCpaThreshold(activeBrandId)}>
              {cpaThresholds[activeBrandId] != null ? "修改" : "設定"}
            </button>
          </div>

                    <li>目前還沒設定「廣告費佔比過高標準」(在上方「✎ 設定」),設定後這裡會自動列出超標的日期,表格裡超標的儲存格也會標紅提醒。</li>
                  ) : dailyRatioStats.overThresholdDays.length > 0 ? (
                    <li>
                      {monthLabel(activeDailyMonth)}有 {dailyRatioStats.overThresholdDays.length} 天廣告費佔比超過設定的 {adRatioThresholds[activeBrandId]}% 門檻:
                      {dailyRatioStats.overThresholdDays.map((d) => d.date.slice(5)).join("、")}。
                    </li>
                  ) : (
                    <li>{monthLabel(activeDailyMonth)}每一天的廣告費佔比都在設定的 {adRatioThresholds[activeBrandId]}% 門檻以內。</li>
                  )}
                </ul>
              </div>
            )}
          </>
        )
      )}

      {showApiPanel && (
        <div className="mal-modal-overlay">
          <div className="mal-modal mal-modal-small">
            <h3>連接 Meta API</h3>
            <p className="mal-modal-sub">
              {rememberToken
                ? "權杖已記住,存在這台瀏覽器裡(其他人用同一台電腦、同一個瀏覽器也看得到)。"
                : "權杖不會存起來,重新整理頁面後要重新貼一次。"}
            </p>

            <div className="mal-field">
              <label>模式</label>
              <select value={apiMode} onChange={(e) => { setApiMode(e.target.value); setBatchProgress(null); }}>
                <option value="full">直接抓整月資料</option>
                <option value="multi">多品牌批次抓取</option>
                </select>
            </div>

            <div className="mal-field">
              <label>存取權杖(Access Token)</label>
              <input
                type="password"
                value={apiToken}
                onChange={(e) => setApiToken(e.target.value)}
                placeholder="EAAxxxxxxxxxxxxxxxx"
              />
              <label className="mal-checkbox-row" style={{ marginTop: 10, fontSize: 12.5 }}>
                <input type="checkbox" checked={rememberToken} onChange={(e) => toggleRememberToken(e.target.checked)} />
                <span className="mal-checkbox-box"></span>
                <span>記住這組權杖(存在這台瀏覽器,下次開啟自動帶入)</span>
              </label>
              {rememberToken && (
                <label className="mal-checkbox-row" style={{ marginTop: 8, fontSize: 12.5 }}>
                  <input type="checkbox" checked={autoSyncEnabled} onChange={(e) => toggleAutoSync(e.target.checked)} />
                  <span className="mal-checkbox-box"></span>
                  <span>開啟網頁時自動檢查並補抓上個月的資料</span>
                </label>
              )}
              {autoSyncEnabled && rememberToken && (
                <p style={{ fontSize: 11.5, color: "var(--ink-secondary)", marginTop: 8, lineHeight: 1.5 }}>
                  只在打開這個網頁的當下才會檢查,不會在你沒開網頁時於背景執行。已經抓過的月份不會重抓。
                </p>
              )}
            </div>

            {rememberToken && (
              <div className="mal-field">
                <button
                  type="button"
                  className="mal-btn"
                  style={{ height: 40, fontWeight: 500 }}
                  disabled={!!autoSyncStatus}
                  onClick={runAutoSync}
                >
                  {autoSyncStatus ? "同步中…" : "立即檢查並補抓上月資料"}
                </button>
              </div>
            )}

            {apiMode !== "multi" && brands.length > 0 && (
              <div className="mal-field">
                <label>常用品牌</label>
                <div style={{ display: "flex", gap: 8 }}>
                  <select
                    style={{ flex: 1 }}
                    value={brands.find((b) => b.id === apiAccountId.trim().replace(/^act_/, "")) ? brands.find((b) => b.id === apiAccountId.trim().replace(/^act_/, "")).name : ""}
                    onChange={(e) => selectBrand(e.target.value)}
                  >
                    <option value="">— 選擇品牌自動帶入 ID —</option>
                    {brands.map((b) => (
                      <option key={b.name} value={b.name}>{b.name}</option>
                    ))}
                  </select>
                  {brands.find((b) => b.id === apiAccountId.trim().replace(/^act_/, "")) && (
                    <button
                      type="button"
                      className="mal-icon-btn mal-delete-brand-btn"
                      title="刪除這個常用品牌"
                      onClick={() => deleteBrand(brands.find((b) => b.id === apiAccountId.trim().replace(/^act_/, "")).name)}
                    >
                      🗑
                    </button>
                  )}
                </div>
              </div>
            )}

            {apiMode !== "multi" && (
              <div className="mal-field">
                <label>廣告帳號 ID</label>
                <div className="mal-input-btn-row">
                  <input
                    type="text"
                    value={apiAccountId}
                    onChange={(e) => setApiAccountId(e.target.value)}
                    placeholder="2157995930925784 或 act_2157995930925784"
                  />
                  <button type="button" className="mal-btn mal-input-row-btn" onClick={saveCurrentAsBrand}>
                    存為常用
                  </button>
                </div>
              </div>
            )}

            {apiMode === "multi" && (
              <div className="mal-field">
                <label>選擇要一起抓的品牌</label>
                {brands.length === 0 ? (
                  <p style={{ fontSize: 12.5, color: "var(--ink-secondary)" }}>
                    還沒有存過任何常用品牌。先切到「直接抓整月資料」模式,填一次帳號 ID 並「存為常用」,之後就能在這裡勾選批次抓取。
                  </p>
                ) : (
                  <div style={{ border: "1px solid var(--rule)", borderRadius: "5px", padding: "6px 10px", maxHeight: 160, overflowY: "auto" }}>
                    {brands.map((b) => (
                      <label key={b.id} className="mal-checkbox-row" style={{ padding: "6px 0", fontSize: 13 }}>
                        <input
                          type="checkbox"
                          checked={selectedBatchBrandIds.includes(b.id)}
                          onChange={(e) => {
                            setSelectedBatchBrandIds((prev) =>
                              e.target.checked ? [...prev, b.id] : prev.filter((id) => id !== b.id)
                            );
                          }}
                        />
                        <span className="mal-checkbox-box"></span>
                        <span>{b.name}</span>
                      </label>
                    ))}
                  </div>
                )}
              </div>
            )}

            {(apiMode === "full" || apiMode === "multi") && (
              <div className="mal-field">
                <label>要抓哪個月?</label>
                <input
                  type="month"
                  value={apiMonth}
                  onChange={(e) => setApiMonth(e.target.value)}
                />
                <p style={{ fontSize: 11.5, color: "var(--ink-secondary)", marginTop: 8, lineHeight: 1.5 }}>
                  只會統計「購買」類型的轉換(訂單數與金額)。如果你的廣告目標不是導購,轉單數可能會顯示 0,這是正常的。
                </p>
              </div>
            )}

            {batchProgress && (
              <div className="mal-field">
                <label>批次進度</label>
                <div style={{ border: "1px solid var(--rule)", borderRadius: "10px", padding: "8px 10px" }}>
                  {batchProgress.map((p) => (
                    <div key={p.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, padding: "4px 0" }}>
                      <span>{p.name}</span>
                      <span style={{
                        color: p.status === "error" ? "var(--red)" : p.status === "done" ? "var(--green)" : "var(--ink-soft)",
                      }}>
                        {p.status === "pending" && "等待中"}
                        {p.status === "running" && "抓取中…"}
                        {p.status === "done" && `✓ ${p.message}`}
                        {p.status === "empty" && "沒有資料"}
                        {p.status === "error" && `✗ ${p.message}`}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div className="mal-modal-actions">
              <button className="mal-btn" onClick={() => setShowApiPanel(false)}>取消</button>
              <button
                className="mal-btn mal-btn-primary"
                disabled={apiLoading}
                onClick={apiMode === "multi" ? fetchBatchFromApi : fetchFullMonthFromApi}
              >
                {apiLoading ? "抓取中…" : "開始抓取"}
              </button>
            </div>
          </div>
        </div>
      )}

      {showTeamKeyModal && (
        <div className="mal-modal-overlay">
          <div className="mal-modal">
            <h3>切換部門</h3>
            <p className="mal-modal-sub">
              輸入要切換到的部門密碼。每個部門只會載入自己有權限的品牌；切換成功後會立即重新整理品牌清單。
              密碼只存在你自己的瀏覽器裡，不會同步給其他人。
            </p>
            <div className="mal-field">
              <label>密碼</label>
              <input
                type="password"
                value={teamKeyInput}
                onChange={(e) => setTeamKeyInput(e.target.value)}
                placeholder="輸入你的登入密碼"
                style={{ width: "100%", padding: "8px 10px", border: "1px solid var(--rule)", borderRadius: "10px", fontFamily: "IBM Plex Mono, monospace", fontSize: "13px" }}
              />
            </div>
            <p style={{ fontSize: 11.5, color: "var(--ink-soft)", marginTop: 6, lineHeight: 1.5 }}>
              目前狀態:
              {cloudStatus === "connected" && ` ☁️ 已連上共用資料庫${credentialName ? `(身份:${credentialName})` : ""}`}
              {cloudStatus === "unauthorized" && " ⚠️ 有連上,但密碼不對"}
              {cloudStatus === "unavailable" && " ⚠️ 連不到 /api/kv,請確認 Cloudflare Functions 已經跟這個網站一起部署"}
              {cloudStatus === "unknown" && " 尚未測試"}
            </p>
            <div className="mal-modal-actions">
              <button className="mal-btn" onClick={() => setShowTeamKeyModal(false)}>關閉</button>
              <button className="mal-btn mal-btn-primary" onClick={saveTeamKey}>登入並切換</button>
            </div>
          </div>
        </div>
      )}

      {showLedgerModal && (
        <div className="mal-modal-overlay">
          <div className="mal-modal">
            <h3>匯入後台每日收益表</h3>
            <p className="mal-modal-sub">
              上傳「每日收益表」.xlsx 檔(跟範例表單一致:分頁是「1月」~「12月」,欄位依產品代號拆分)。
              系統會自動抓出每個分頁對應的月份,存成該品牌的後台實際業績,月報表會自動比對 Meta 回報的落差。
              重新匯入同一個月份會直接覆蓋更新。
            </p>
            <div className="mal-field">
              <label>這份檔案的年度 <span className="mal-req">*</span></label>
              <input
                type="number"
                value={ledgerYear}
                onChange={(e) => setLedgerYear(e.target.value)}
                style={{ width: "100%", padding: "8px 10px", border: "1px solid var(--rule)", borderRadius: "10px", fontFamily: "IBM Plex Mono, monospace", fontSize: "13px" }}
              />
              <p style={{ fontSize: 11.5, color: "var(--ink-soft)", marginTop: 6, lineHeight: 1.5 }}>
                表單裡的分頁只有「月」沒有「年」,所以需要另外指定年度,才能正確存成例如 2026-07 這樣的月份。
              </p>
            </div>
            <div className="mal-field">
              <label>選擇檔案 <span className="mal-req">*</span></label>
              <input
                type="file"
                accept=".xlsx"
                onChange={(e) => { const f = e.target.files && e.target.files[0]; if (f) importLedgerFile(f); }}
                style={{ width: "100%" }}
              />
            </div>
            {!HAS_SHARED_STORAGE && (
              <>
                <div style={{ borderTop: "1px dashed var(--rule)", margin: "16px 0 14px" }} />
                <div className="mal-field">
                  <label>或者:直接從 Google 試算表同步(不用手動下載/上傳)</label>
                  <input
                    type="text"
                    value={sheetIdInput}
                    onChange={(e) => setSheetIdInput(e.target.value)}
                    placeholder="Google 試算表 ID(網址 .../spreadsheets/d/ 後面那一串)"
                    style={{ width: "100%", padding: "8px 10px", border: "1px solid var(--rule)", borderRadius: "10px", fontFamily: "IBM Plex Mono, monospace", fontSize: "13px", marginBottom: 8 }}
                  />
                  <p style={{ fontSize: 11.5, color: "var(--ink-soft)", lineHeight: 1.5, marginBottom: 8 }}>
                    試算表不用公開,只要分享給服務帳號的 email(檢視者權限即可,詳見 README「步驟 7」)。
                    會同步到目前選取的品牌(廣告帳號 ID:{activeBrandId || "尚未選擇"}),下次打開會自動記住這個品牌對應的試算表 ID(留空直接按同步,會沿用上次記住的那份)。
                  </p>
                  <button className="mal-btn mal-btn-primary" disabled={sheetSyncLoading} onClick={syncFromGoogleSheet}>
                    {sheetSyncLoading ? "同步中…" : "☁️ 從 Google 試算表同步"}
                  </button>
                </div>
              </>
            )}
            {ledgerImportError && <div className="mal-error">⚠ {ledgerImportError}</div>}
            {ledgerImportNotice && <div className="mal-notice">✓ {ledgerImportNotice}</div>}
            <div className="mal-modal-actions">
              <button className="mal-btn" disabled={ledgerImportLoading} onClick={() => setShowLedgerModal(false)}>
                {ledgerImportLoading ? "匯入中…" : "關閉"}
              </button>
            </div>
          </div>
        </div>
      )}

      {confirmReset && (
        <div className="mal-modal-overlay">
          <div className="mal-modal mal-modal-small">
            <h3>重置「{activeBrandId ? (brands.find((b) => b.id === activeBrandId) || {}).name || activeBrandId : "此帳本"}」?</h3>
            <p className="mal-modal-sub">這會刪除目前這個品牌底下所有已儲存的月份資料,無法復原。其他品牌的資料不受影響。</p>
            <div className="mal-modal-actions">
              <button className="mal-btn" onClick={() => setConfirmReset(false)}>取消</button>
              <button className="mal-btn mal-btn-danger" onClick={resetAll}>確認重置</button>
            </div>
          </div>
        </div>
      )}

      {confirmDelete && (
        <div className="mal-modal-overlay">
          <div className="mal-modal mal-modal-small">
            <h3>刪除 {monthLabel(confirmDelete)} 的資料?</h3>
            <p className="mal-modal-sub">刪除後可重新上傳該月報表補回。</p>
            <div className="mal-modal-actions">
              <button className="mal-btn" onClick={() => setConfirmDelete(null)}>取消</button>
              <button className="mal-btn mal-btn-danger" onClick={() => deleteMonth(confirmDelete)}>確認刪除</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// 診斷用:目前這個app沒有任何error boundary,React遇到render過程中拋出的錯誤,預設行為是把整棵
// 元件樹卸載掉——這可以解釋「畫面顯示到一半、後面全部消失變空白」這種症狀。加上這層,錯誤發生時
// 會直接把錯誤訊息印在畫面上,而不是留下一片空白,才能真正知道問題出在哪一行。之後確認問題解決,
// 這層可以拿掉,但保留著也無害,不影響任何正常功能。
// 特意不吞掉錯誤、不用空白畫面取代——顯示完整診斷內容才是重點,不是讓畫面看起來「正常」。
const MAL_DEPLOY_VERSION = "62d676d-diag2"; // 每次部署更新這個標記,方便確認瀏覽器載入的是不是最新版本
class MalErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null, info: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    this.setState({ info });
    const debugState = window.__MAL_DEBUG_STATE__ || {};
    // 用單一字串印出完整內容,不要分成好幾次console.error呼叫——避免瀏覽器主控台把不同呼叫的
    // 內容混在一起、或摺疊/截斷其中一段,複製起來才會是完整、連續的一份文字。
    console.error(
      "=== MalErrorBoundary 完整診斷資訊開始 ===\n" +
      "部署版本標記: " + MAL_DEPLOY_VERSION + "\n" +
      "發生當下的頁面(viewMode): " + debugState.viewMode + "\n" +
      "發生當下選中的品牌: " + debugState.activeBrandName + "(id: " + debugState.activeBrandId + ")\n" +
      "當下品牌總數: " + debugState.brandCount + "\n" +
      "錯誤訊息(error.message): " + (error && error.message) + "\n" +
      "錯誤堆疊(error.stack):\n" + (error && error.stack) + "\n" +
      "元件堆疊(componentStack):\n" + (info && info.componentStack) + "\n" +
      "=== MalErrorBoundary 完整診斷資訊結束 ==="
    );
  }
  render() {
    if (this.state.error) {
      const debugState = window.__MAL_DEBUG_STATE__ || {};
      return (
        <div style={{ padding: 24, fontFamily: "monospace", fontSize: 12.5, whiteSpace: "pre-wrap", wordBreak: "break-word", color: "#A56357", background: "#FBF7F0", minHeight: "100vh" }}>
          <h2 style={{ color: "#3B2F27" }}>畫面發生錯誤(這是診斷用的錯誤邊界,不是正常畫面)</h2>
          <p style={{ color: "#3B2F27" }}>下面這段診斷資訊已經完整印在瀏覽器主控台(console),用F12打開Console分頁可以直接複製整段文字。</p>
          <p><b>部署版本標記:</b>{MAL_DEPLOY_VERSION}</p>
          <p><b>發生當下的頁面(viewMode):</b>{String(debugState.viewMode)}</p>
          <p><b>發生當下選中的品牌:</b>{String(debugState.activeBrandName)}(id: {String(debugState.activeBrandId)})</p>
          <p><b>當下品牌總數:</b>{String(debugState.brandCount)}</p>
          <p><b>錯誤訊息(error.message):</b>{String(this.state.error && this.state.error.message)}</p>
          <p><b>錯誤堆疊(error.stack):</b>{"\n"}{this.state.error && this.state.error.stack}</p>
          <p><b>元件堆疊(componentStack):</b>{"\n"}{this.state.info && this.state.info.componentStack}</p>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <MalErrorBoundary><MetaAdsLedger /></MalErrorBoundary>
);
</script>
</body>
