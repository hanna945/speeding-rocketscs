  async function toggleAutoSync(checked) {
    setAutoSyncEnabled(checked);
    await storage.set("meta-api-autosync", checked ? "1" : "0").catch(() => {});
  }

  // 開啟網頁時的自動同步:檢查上週(週一~週日)跟上個月的資料是否已經存在,
  // 沒有的話就自動用記住的權杖抓一次,依序抓每個常用品牌(或預設帳號),中間間隔 4 秒避免觸發 Meta 頻率限制。
  async function runAutoSyncWith(token, brandsList, defaultAccountId) {
    if (!token || !token.trim()) return;
    const cleanDefaultId = (defaultAccountId || "").trim().replace(/^act_/, "");
    // 如果呼叫時沒帶品牌清單,先看「目前登入身份自己有沒有帶一份品牌清單」(TEAM_CREDENTIALS 設定的 {id,name} 清單)可以用,
    // 不要一沒清單就直接拿「畫面上記住的單一帳號 ID」捏造一個假品牌、覆蓋掉真正的品牌清單——
    // 這是之前造成品牌清單被單一帳號蓋掉的原因,範圍受限的身份尤其容易踩到,因為 meta-api-brands 這份共用清單一開始可能是空的。
    const effectiveBrandsList = (brandsList && brandsList.length) ? brandsList : (getCredentialBrands() || []);
    const targets = (effectiveBrandsList && effectiveBrandsList.length)
      ? effectiveBrandsList.map((b) => ({ apiId: b.id, storageId: b.id, name: b.name }))
      : cleanDefaultId
      // 已經拿掉「預設帳本」,所以這裡也不能再把資料存進看不到的地方——
      // 沒有任何常用品牌、身份也沒有自帶清單時,直接用帳號 ID 本身當作品牌 ID 來存,並登記進品牌清單。
      ? [{ apiId: cleanDefaultId, storageId: cleanDefaultId, name: cleanDefaultId }]
      : [];
    if (!targets.length) return;

    if (!effectiveBrandsList || !effectiveBrandsList.length) {
      const autoBrand = { name: cleanDefaultId, id: cleanDefaultId };
      const updatedBrands = [autoBrand];
      setBrands(updatedBrands);
      await storage.set("meta-api-brands", JSON.stringify(updatedBrands)).catch(() => {});
    }

    const now = new Date();
    const lastMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const lastMonthKey = `${lastMonthDate.getFullYear()}-${String(lastMonthDate.getMonth() + 1).padStart(2, "0")}`;

    const weekListRes = await storage.list(WEEK_STORAGE_PREFIX).catch(() => ({ keys: [] }));
    const monthListRes = await storage.list(STORAGE_PREFIX).catch(() => ({ keys: [] }));
    const existingWeekKeys = new Set(weekListRes.keys || []);
    const existingMonthKeys = new Set(monthListRes.keys || []);

    // 開啟網頁自動同步時,不是只補「上週」一週,而是自動檢查並補齊「最近 4 週」裡缺少的每一週——
    // 這樣不用手動開「連接 Meta API」選「回溯抓取」,平常自動同步就會自動幫你把最近幾週補齊。
    // 每個品牌的廣告帳號時區可能不一樣,所以每一週的日期範圍都分別依各自帳號的時區去算。
    const AUTO_SYNC_WEEKS_BACK = 4;
    const needsWeek = [];
    for (const t of targets) {
      const tzOffset = await fetchAccountUtcOffset(token.trim(), t.apiId);
      for (let w = 1; w <= AUTO_SYNC_WEEKS_BACK; w++) {
        const weekRange = getLastWeekRange(tzOffset, w);
        if (!existingWeekKeys.has(weekKeyFor(t.storageId, weekRange.weekStart))) {
          needsWeek.push({ apiId: t.apiId, storageId: t.storageId, name: t.name, weekRange });
        }
      }
    }
    const needsMonth = targets.filter((t) => !existingMonthKeys.has(monthKeyFor(t.storageId, lastMonthKey)));
    if (!needsWeek.length && !needsMonth.length) return; // 資料都是新的,不用做任何事

    setAutoSyncStatus(`自動同步中… 補齊最近 ${AUTO_SYNC_WEEKS_BACK} 週與 ${monthLabel(lastMonthKey)} 資料`);
    let successCount = 0, errorCount = 0;

    for (let i = 0; i < needsWeek.length; i++) {
      const t = needsWeek[i];
      try {
        const record = await fetchInsightsForRange(token.trim(), t.apiId, t.weekRange.since, t.weekRange.until, true);
        await storage.set(weekKeyFor(t.storageId, t.weekRange.weekStart), JSON.stringify(record));
        successCount++;
      } catch { errorCount++; }
      if (i < needsWeek.length - 1 || needsMonth.length) await new Promise((r) => setTimeout(r, 4000));
    }
    for (let i = 0; i < needsMonth.length; i++) {
      const t = needsMonth[i];
      try {
        const record = await fetchOneBrandMonth(token.trim(), t.apiId, lastMonthKey);
        await storage.set(monthKeyFor(t.storageId, lastMonthKey), JSON.stringify(record));
        successCount++;
      } catch { errorCount++; }
      if (i < needsMonth.length - 1) await new Promise((r) => setTimeout(r, 4000));
    }

    setAutoSyncStatus(null);
    await loadAll(activeBrandId);
    await loadAllWeeks(activeBrandId);
    if (successCount > 0) {
      setApiNotice(`已自動同步完成:成功更新 ${successCount} 筆資料${errorCount > 0 ? `,${errorCount} 筆失敗(可能是頻率限制,之後再手動抓一次即可)` : ""}。`);
    } else if (errorCount > 0) {
      setApiError("自動同步失敗,請手動連接 Meta API 重新抓取一次。");
    }
  }

  // 手動觸發同步(例如面板裡的「立即同步」按鈕),用目前畫面上的權杖跟品牌清單
  function runAutoSync() {
    return runAutoSyncWith(apiToken, brands, apiAccountId);
  }

  const sortedKeys = useMemo(() => Object.keys(months).sort(), [months]);
  const enriched = useMemo(() => { const out = {}; for (const mk of sortedKeys) out[mk] = deriveMetrics(months[mk]); return out; }, [months, sortedKeys]);
  const chartData = useMemo(() => sortedKeys.map((mk) => ({
    month: monthLabel(mk), 廣告費: Math.round(enriched[mk].spend), 轉單: enriched[mk].conversions,
    CPA: enriched[mk].cpa !== null ? Number(enriched[mk].cpa.toFixed(1)) : null,
    ROAS: enriched[mk].roas !== null ? Number(enriched[mk].roas.toFixed(2)) : null,
  })), [sortedKeys, enriched]);
  const currency = sortedKeys.length ? months[sortedKeys[sortedKeys.length - 1]].currency : "TWD";
  const focusIdx = sortedKeys.indexOf(focusMonth);
  const focusData = focusMonth ? enriched[focusMonth] : null;
  const prevData = focusIdx > 0 ? enriched[sortedKeys[focusIdx - 1]] : null;
  const MIN_AD_SPEND = 500;
  const spendFilteredAds = focusData && focusData.ads ? focusData.ads.filter((ad) => ad.spend >= MIN_AD_SPEND) : [];
  const visibleAds = filterAdsByStatus(spendFilteredAds, adStatusFilter, adSearchKeyword);
  const hiddenAdCount = focusData && focusData.ads ? focusData.ads.length - spendFilteredAds.length : 0;

  // ---------- 每日營收報表:直接呈現後台每日收益表(ledgerByMonth)裡「每一天 x 每個產品代號」的明細,不用另外彙總 ----------
  // 選單月份/選單日,優先順序是:①使用者自己手動點過的(dailyMonth/focusDay,只要那筆資料還在就沿用,尊重手動導覽)
  // ②今天實際的月份/日期(如果那個月/那一天剛好有資料的話)③都沒有的話,退回資料裡最後一筆(例如試算表只匯到某個過去的月份)。
  // 這樣打開「每日報表」預設就會對準今天,不用手動點,但只要手動切換過,還是會照使用者選的走,不會一直搶跳回今天。
  const ledgerMonthKeys = useMemo(() => Object.keys(ledgerByMonth).sort(), [ledgerByMonth]);
  const todayParts = useMemo(() => {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, "0");
    const d = String(now.getDate()).padStart(2, "0");
    return { monthKey: `${y}-${m}`, dateKey: `${y}-${m}-${d}` };
  }, []);
  const activeDailyMonth = (dailyMonth && ledgerByMonth[dailyMonth])
    ? dailyMonth
    : ledgerByMonth[todayParts.monthKey]
    ? todayParts.monthKey
    : (ledgerMonthKeys.length ? ledgerMonthKeys[ledgerMonthKeys.length - 1] : null);
  const dailyMonthRecord = activeDailyMonth ? ledgerByMonth[activeDailyMonth] : null;
  const sortedDailyDays = useMemo(
    () => (dailyMonthRecord ? dailyMonthRecord.days.slice().sort((a, b) => (a.date < b.date ? -1 : 1)) : []),
    [dailyMonthRecord]
  );
  const activeFocusDay = (focusDay && sortedDailyDays.some((d) => d.date === focusDay))
    ? focusDay
    : sortedDailyDays.some((d) => d.date === todayParts.dateKey)
    ? todayParts.dateKey
    : (sortedDailyDays.length ? sortedDailyDays[sortedDailyDays.length - 1].date : null);
  const focusDayRecord = activeFocusDay ? sortedDailyDays.find((d) => d.date === activeFocusDay) : null;
  const dailyMatrixCodes = dailyMonthRecord ? dailyMonthRecord.productCodes : [];
  // threshold 有給且超過時,回傳標紅、加驚嘆號的樣式;沒給 threshold 或沒超過,就是原本的樣式。
  const AD_RATIO_CRITICAL_PCT = 30; // 廣告費佔比超過這個數字,不管有沒有設定門檻,一律標紅(比黃字警示更嚴重的等級)
  const adPct = (spend, revenue, threshold) => {
    if (revenue <= 0) return "—";
    const pct = (spend / revenue) * 100;
    const isCritical = pct > AD_RATIO_CRITICAL_PCT;
    const isOverThreshold = !isCritical && threshold != null && pct > threshold; // 超過自訂門檻、但還沒到 30% 的中間警示等級
    const style = isCritical
      ? { color: "var(--red)", fontWeight: 700 }
      : isOverThreshold
      ? { color: "var(--amber)", fontWeight: 700 }
      : undefined;
    return (
      <span style={style}>
        {pct.toFixed(0)}%{isCritical ? " ‼" : isOverThreshold ? " ⚠" : ""}
      </span>
    );
  };
  // 淨利潤是負的(虧錢)時,用比廣告費佔比超標更重的標紅樣式(深紅底色+粗體),兩種警示程度做出區別。
  const netProfitCell = (value) => {
    if (value < 0) {
      return (
        <span style={{ color: "#8B1E2B", fontWeight: 700, background: "#FBE4E4", padding: "1px 6px", borderRadius: 4 }}>
          {fmtMoney(value)}
        </span>
      );
    }
    return fmtMoney(value);
  };
  // 基礎分析用:當月每一天的廣告費佔比,抓出佔比最高的一天,以及(如果有設定門檻)超過門檻的天數清單。
  const dailyRatioStats = useMemo(() => {
    let highestDay = null;
    const overThresholdDays = [];
    const threshold = adRatioThresholds[activeBrandId];
    sortedDailyDays.forEach((d) => {
      if (d.overall.revenue > 0) {
        const pct = (d.overall.adSpend / d.overall.revenue) * 100;
        if (!highestDay || pct > highestDay.pct) highestDay = { date: d.date, pct };
        if (threshold != null && pct > threshold) overThresholdDays.push({ date: d.date, pct });
      }
    });
    return { highestDay, overThresholdDays };
  }, [sortedDailyDays, adRatioThresholds, activeBrandId]);

  // ---------- 業配廣告長線分析:把名稱或行銷活動裡含「業配」兩個字的廣告單獨拉出來,依月份累計趨勢 ----------
  const SPONSOR_KEYWORD = "業配";
  const sponsorMonthlyStats = useMemo(() => sortedKeys.map((mk) => {
    const rec = months[mk];
    const sponsorAds = (rec.ads || []).filter(
      (ad) => (ad.name && ad.name.includes(SPONSOR_KEYWORD)) || (ad.campaign && ad.campaign.includes(SPONSOR_KEYWORD))
    );
    const spend = sponsorAds.reduce((s, a) => s + a.spend, 0);
    const conversions = sponsorAds.reduce((s, a) => s + a.conversions, 0);
    const revenue = sponsorAds.reduce((s, a) => s + a.revenue, 0);
    return {
      monthKey: mk, month: monthLabel(mk), ads: sponsorAds, spend, conversions, revenue,
      cpa: conversions > 0 ? spend / conversions : null,
      roas: spend > 0 && revenue > 0 ? revenue / spend : null,
    };
  }), [sortedKeys, months]);
  const sponsorChartData = useMemo(() => sponsorMonthlyStats.map((s) => ({
    month: s.month, 廣告費: Math.round(s.spend), 轉單: s.conversions,
    CPA: s.cpa !== null ? Number(s.cpa.toFixed(1)) : null,
    ROAS: s.roas !== null ? Number(s.roas.toFixed(2)) : null,
  })), [sponsorMonthlyStats]);
  const sponsorTotal = useMemo(() => {
    const spend = sponsorMonthlyStats.reduce((s, m) => s + m.spend, 0);
    const conversions = sponsorMonthlyStats.reduce((s, m) => s + m.conversions, 0);
    const revenue = sponsorMonthlyStats.reduce((s, m) => s + m.revenue, 0);
    return { spend, conversions, revenue, cpa: conversions > 0 ? spend / conversions : null, roas: spend > 0 && revenue > 0 ? revenue / spend : null };
  }, [sponsorMonthlyStats]);
  const sponsorMonthsWithData = sponsorMonthlyStats.filter((m) => m.ads.length > 0);

  const sortedWeekKeys = useMemo(() => Object.keys(weeksData).sort(), [weeksData]);
  const focusWeekData = focusWeek ? weeksData[focusWeek] : null;
  const focusWeekIdx = sortedWeekKeys.indexOf(focusWeek);
  const prevWeekData = focusWeekIdx > 0 ? weeksData[sortedWeekKeys[focusWeekIdx - 1]] : null;
  function weekLabel(weekStart) {
    if (!weekStart) return "";
    const [y, m, d] = weekStart.split("-").map(Number);
    const start = new Date(y, m - 1, d);
    const end = new Date(y, m - 1, d + 6);
    const fmt2 = (dt) => `${String(dt.getMonth() + 1).padStart(2, "0")}/${String(dt.getDate()).padStart(2, "0")}`;
    return `${fmt2(start)}~${fmt2(end)}`;
  }

  const sortedVisibleAds = useMemo(() => {
    const withMetrics = visibleAds.map((ad) => ({
      ad,
      cpa: ad.conversions > 0 ? ad.spend / ad.conversions : null,
      roas: ad.spend > 0 && ad.revenue > 0 ? ad.revenue / ad.spend : null,
    }));
    if (adSortMode === "cpa") {
      return withMetrics
        .slice()
        .sort((a, b) => {
          if (a.cpa === null) return 1;
          if (b.cpa === null) return -1;
          return a.cpa - b.cpa;
        })
        .map((x) => x.ad);
    }
    if (adSortMode === "roas") {
      return withMetrics
        .slice()
        .sort((a, b) => {
          if (a.roas === null) return 1;
          if (b.roas === null) return -1;
          return b.roas - a.roas;
        })
        .map((x) => x.ad);
    }
    if (adSortMode === "composite") {
      // rank-based composite: best CPA (lowest) and best ROAS (highest) each contribute a rank;
      // lower combined rank = better overall performance. Ads missing a metric get the worst rank.
      const n = withMetrics.length;
      const byCpa = withMetrics
        .map((x, i) => i)
        .sort((i, j) => {
          const a = withMetrics[i].cpa, b = withMetrics[j].cpa;
          if (a === null) return 1;
          if (b === null) return -1;
          return a - b;
        });
      const byRoas = withMetrics
        .map((x, i) => i)
        .sort((i, j) => {
          const a = withMetrics[i].roas, b = withMetrics[j].roas;
          if (a === null) return 1;
          if (b === null) return -1;
          return b - a;
        });
      const cpaRank = new Array(n), roasRank = new Array(n);
      byCpa.forEach((idx, rank) => { cpaRank[idx] = rank; });
      byRoas.forEach((idx, rank) => { roasRank[idx] = rank; });
      return withMetrics
        .map((x, i) => ({ ad: x.ad, score: cpaRank[i] + roasRank[i] }))
        .sort((a, b) => a.score - b.score)
        .map((x) => x.ad);
    }
    if (adSortMode === "startDate") {
      return withMetrics
        .slice()
        .sort((a, b) => {
          if (!a.ad.startDate) return 1;
          if (!b.ad.startDate) return -1;
          return a.ad.startDate < b.ad.startDate ? 1 : a.ad.startDate > b.ad.startDate ? -1 : 0;
        })
        .map((x) => x.ad);
    }
    if (adSortMode === "postPublishDate") {
      // 查得到前台發表時間的排前面(新到舊),查不到的排最後——查不到的那一段,畫面上會另外用分隔線標示出來,
      // 不會讓人誤以為那些廣告也有排進時間順序裡。
      return withMetrics
        .slice()
        .sort((a, b) => {
          if (!a.ad.postPublishDate) return 1;
          if (!b.ad.postPublishDate) return -1;
          return a.ad.postPublishDate < b.ad.postPublishDate ? 1 : a.ad.postPublishDate > b.ad.postPublishDate ? -1 : 0;
        })
        .map((x) => x.ad);
    }
    // default: by spend, high to low
    return withMetrics.map((x) => x.ad).sort((a, b) => b.spend - a.spend);
  }, [visibleAds, adSortMode]);

                          checked={selectedBatchBrandIds.includes(b.id)}
                          onChange={(e) => {
                            setSelectedBatchBrandIds((prev) =>
                              e.target.checked ? [...prev, b.id] : prev.filter((id) => id !== b.id)
                            );
                          }}
                        />
                        {b.name}
                      </label>
                    ))}
                  </div>
                )}
              </div>
            )}

            {(apiMode === "week" || (apiMode === "multi" && batchGranularity === "week")) && (
              <div className="mal-field">
                <label>上週日期範圍</label>
                <div style={{ padding: "8px 10px", border: "1px solid var(--rule)", borderRadius: "10px", background: "var(--paper-raised)", fontFamily: "IBM Plex Mono, monospace", fontSize: "13px" }}>
                  {weekInfo.since} ~ {weekInfo.until}
                </div>
                <p style={{ fontSize: 11.5, color: "var(--ink-soft)", marginTop: 6, lineHeight: 1.5 }}>
                  自動抓「上一個完整的週一到週日」,只統計「購買」類型的轉換。花費 ≥ 500 的廣告會收錄;花費雖然還不到 500,但目前仍在投放中的廣告也會一併收錄,方便觀察剛起步的廣告。
                </p>
              </div>
            )}

            {apiMode === "recentWeeks" && (
              <div className="mal-field">
                <label>要往前回溯抓幾週?</label>
                <select
                  value={recentWeeksCount}
                  onChange={(e) => setRecentWeeksCount(Number(e.target.value))}
                  style={{ width: "100%", padding: "8px 10px", border: "1px solid var(--rule)", borderRadius: "10px", background: "var(--paper-raised)" }}
                >
                  <option value={2}>過去 2 週</option>
                  <option value={4}>過去 4 週</option>
                  <option value={8}>過去 8 週</option>
                  <option value={12}>過去 12 週</option>
                </select>
                <p style={{ fontSize: 11.5, color: "var(--ink-soft)", marginTop: 6, lineHeight: 1.5 }}>
                  會從「上週」開始,一週一週往前抓(每週都是完整的週一到週日),每抓完一週會間隔 4 秒再抓下一週,避免觸發 Meta 頻率限制。
                  週數越多需要等待的時間越長,過程中請不要關掉這個分頁。已經抓過的週份重新抓取會直接覆蓋更新。
                </p>
              </div>
            )}

            {(apiMode === "full" || (apiMode === "multi" && batchGranularity === "month")) && (
              <div className="mal-field">
                <label>要抓哪個月?</label>
                <input
                  type="month"
                  value={apiMonth}
                  onChange={(e) => setApiMonth(e.target.value)}
                  style={{ width: "100%", padding: "8px 10px", border: "1px solid var(--rule)", borderRadius: "10px", fontFamily: "Noto Sans TC, sans-serif", fontSize: "13px" }}
                />
                <p style={{ fontSize: 11.5, color: "var(--ink-soft)", marginTop: 6, lineHeight: 1.5 }}>
                  只會統計「購買」類型的轉換(訂單數與金額)。如果你的廣告目標不是導購,轉單數可能會顯示 0,這是正常的。
                </p>
              </div>
            )}

            {batchProgress && (
              <div className="mal-field">
                <label>批次進度</label>
                <div style={{ border: "1px solid var(--rule)", borderRadius: "10px", padding: "8px 10px" }}>
                  {batchProgress.map((p) => (
                    <div key={p.id} style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, padding: "4px 0" }}>
                      <span>{p.name}</span>
                      <span style={{
                        color: p.status === "error" ? "var(--red)" : p.status === "done" ? "var(--green)" : "var(--ink-soft)",
                      }}>
                        {p.status === "pending" && "等待中"}
                        {p.status === "running" && "抓取中…"}
                        {p.status === "done" && `✓ ${p.message}`}
                        {p.status === "empty" && "沒有資料"}
                        {p.status === "error" && `✗ ${p.message}`}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <div className="mal-modal-actions">
              <button className="mal-btn" onClick={() => setShowApiPanel(false)}>取消</button>
              <button
                className="mal-btn mal-btn-primary"
                disabled={apiLoading || weekLoading}
                onClick={
                  apiMode === "full"
                    ? fetchFullMonthFromApi
                    : apiMode === "multi"
                    ? fetchBatchFromApi
                    : apiMode === "recentWeeks"
                    ? () => fetchRecentWeeksFromApi(recentWeeksCount)
                    : fetchLastWeekData
                }
              >
                {apiLoading || weekLoading ? "抓取中…" : "開始抓取"}
              </button>
            </div>
          </div>
        </div>
      )}

      {showTeamKeyModal && (
        <div className="mal-modal-overlay">
          <div className="mal-modal">
            <h3>登入身份密碼</h3>
            <p className="mal-modal-sub">
              這個網站部署在 Cloudflare 上,後台設定了 <code>TEAM_CREDENTIALS</code>(多組密碼,各自綁定能看的品牌)。
              輸入你自己那組密碼,系統會自動判斷你能看哪些品牌的資料。密碼只存在你自己的瀏覽器裡,不會被同步出去。
            </p>
            <div className="mal-field">
              <label>密碼</label>
              <input
                type="password"
                value={teamKeyInput}
                onChange={(e) => setTeamKeyInput(e.target.value)}
                placeholder="輸入你的登入密碼"
                style={{ width: "100%", padding: "8px 10px", border: "1px solid var(--rule)", borderRadius: "10px", fontFamily: "IBM Plex Mono, monospace", fontSize: "13px" }}
              />
            </div>
            <p style={{ fontSize: 11.5, color: "var(--ink-soft)", marginTop: 6, lineHeight: 1.5 }}>
              目前狀態:
              {cloudStatus === "connected" && ` ☁️ 已連上共用資料庫${credentialName ? `(身份:${credentialName})` : ""}`}
              {cloudStatus === "unauthorized" && " ⚠️ 有連上,但密碼不對"}
              {cloudStatus === "unavailable" && " ⚠️ 連不到 /api/kv,請確認 Cloudflare Functions 已經跟這個網站一起部署"}
              {cloudStatus === "unknown" && " 尚未測試"}
            </p>
            <div className="mal-modal-actions">
              <button className="mal-btn" onClick={() => setShowTeamKeyModal(false)}>關閉</button>
              <button className="mal-btn mal-btn-primary" onClick={saveTeamKey}>儲存並測試連線</button>
            </div>
          </div>
        </div>
      )}

      {showLedgerModal && (
        <div className="mal-modal-overlay">
          <div className="mal-modal">
            <h3>匯入後台每日收益表</h3>
            <p className="mal-modal-sub">
              上傳「每日收益表」.xlsx 檔(跟範例表單一致:分頁是「1月」~「12月」,欄位依產品代號拆分)。
              系統會自動抓出每個分頁對應的月份,存成該品牌的後台實際業績,週報表/月報表會自動比對 Meta 回報的落差。
              重新匯入同一個月份會直接覆蓋更新。
            </p>
            <div className="mal-field">
              <label>這份檔案的年度 <span className="mal-req">*</span></label>
              <input
                type="number"
                value={ledgerYear}
                onChange={(e) => setLedgerYear(e.target.value)}
                style={{ width: "100%", padding: "8px 10px", border: "1px solid var(--rule)", borderRadius: "10px", fontFamily: "IBM Plex Mono, monospace", fontSize: "13px" }}
              />
              <p style={{ fontSize: 11.5, color: "var(--ink-soft)", marginTop: 6, lineHeight: 1.5 }}>
                表單裡的分頁只有「月」沒有「年」,所以需要另外指定年度,才能正確存成例如 2026-07 這樣的月份。
              </p>
            </div>
            <div className="mal-field">
              <label>選擇檔案 <span className="mal-req">*</span></label>
              <input
                type="file"
                accept=".xlsx"
                onChange={(e) => { const f = e.target.files && e.target.files[0]; if (f) importLedgerFile(f); }}
                style={{ width: "100%" }}
              />
            </div>
            {!HAS_SHARED_STORAGE && (
              <>
                <div style={{ borderTop: "1px dashed var(--rule)", margin: "16px 0 14px" }} />
                <div className="mal-field">
                  <label>或者:直接從 Google 試算表同步(不用手動下載/上傳)</label>
                  <input
                    type="text"
                    value={sheetIdInput}
                    onChange={(e) => setSheetIdInput(e.target.value)}
                    placeholder="Google 試算表 ID(網址 .../spreadsheets/d/ 後面那一串)"
                    style={{ width: "100%", padding: "8px 10px", border: "1px solid var(--rule)", borderRadius: "10px", fontFamily: "IBM Plex Mono, monospace", fontSize: "13px", marginBottom: 8 }}
                  />
                  <p style={{ fontSize: 11.5, color: "var(--ink-soft)", lineHeight: 1.5, marginBottom: 8 }}>
                    試算表不用公開,只要分享給服務帳號的 email(檢視者權限即可,詳見 README「步驟 7」)。
                    會同步到目前選取的品牌(廣告帳號 ID:{activeBrandId || "尚未選擇"}),下次打開會自動記住這個品牌對應的試算表 ID(留空直接按同步,會沿用上次記住的那份)。
                  </p>
                  <button className="mal-btn mal-btn-primary" disabled={sheetSyncLoading} onClick={syncFromGoogleSheet}>
                    {sheetSyncLoading ? "同步中…" : "☁️ 從 Google 試算表同步"}
                  </button>
                </div>
              </>
            )}
            {ledgerImportError && <div className="mal-error">⚠ {ledgerImportError}</div>}
            {ledgerImportNotice && <div className="mal-notice">✓ {ledgerImportNotice}</div>}
            <div className="mal-modal-actions">
              <button className="mal-btn" disabled={ledgerImportLoading} onClick={() => setShowLedgerModal(false)}>
                {ledgerImportLoading ? "匯入中…" : "關閉"}
              </button>
            </div>
          </div>
        </div>
      )}

      {confirmReset && (
        <div className="mal-modal-overlay">
          <div className="mal-modal mal-modal-small">
            <h3>重置「{activeBrandId ? (brands.find((b) => b.id === activeBrandId) || {}).name || activeBrandId : "此帳本"}」?</h3>
            <p className="mal-modal-sub">這會刪除目前這個品牌底下所有已儲存的月份資料,無法復原。其他品牌的資料不受影響。</p>
            <div className="mal-modal-actions">
              <button className="mal-btn" onClick={() => setConfirmReset(false)}>取消</button>
              <button className="mal-btn mal-btn-danger" onClick={resetAll}>確認重置</button>
            </div>
          </div>
        </div>
      )}

      {confirmDelete && (
        <div className="mal-modal-overlay">
          <div className="mal-modal mal-modal-small">
            <h3>刪除 {monthLabel(confirmDelete)} 的資料?</h3>
            <p className="mal-modal-sub">刪除後可重新上傳該月報表補回。</p>
            <div className="mal-modal-actions">
              <button className="mal-btn" onClick={() => setConfirmDelete(null)}>取消</button>
              <button className="mal-btn mal-btn-danger" onClick={() => deleteMonth(confirmDelete)}>確認刪除</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MetaAdsLedger />);
</script>
</body>
</html>
