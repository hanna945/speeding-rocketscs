function getCollapsibleSectionContext(title) {
  if (!title) return { anchorNode: null, boundaryParent: null };

  let anchorNode = title;
  let boundaryParent = title.parentElement;
  const parent = title.parentElement;
  const grandParent = parent && parent.parentElement;
  const isHeaderRow = (el) => el && (
    el.classList.contains("mal-ad-header-row") ||
    el.classList.contains("mal-section-header-row") ||
    el.classList.contains("mal-plan-title-row")
  );

  if (isHeaderRow(parent)) {
    anchorNode = parent;
    boundaryParent = parent.parentElement;
  } else if (isHeaderRow(grandParent)) {
    anchorNode = grandParent;
    boundaryParent = grandParent.parentElement;
  }

  return { anchorNode, boundaryParent };
}

function getCollapsibleAffectedNodes(title) {
  const { anchorNode, boundaryParent } = getCollapsibleSectionContext(title);
  if (!anchorNode || !boundaryParent) return [];

  const affected = [];
  let node = anchorNode.nextElementSibling;
  while (node) {
    const isExplicitBoundary = node.matches && node.matches("[data-collapse-boundary='true']");
    const isNextTitle =
      (node.matches && node.matches(".mal-section-title")) ||
      (node.querySelector && node.querySelector(":scope > .mal-section-title")) ||
      (node.querySelector && node.querySelector(":scope > .mal-section-header-row > .mal-section-title")) ||
      (node.querySelector && node.querySelector(":scope > .mal-ad-header-row > .mal-section-title")) ||
      (node.querySelector && node.querySelector(":scope > .mal-plan-title-row > .mal-section-title"));
    if (isExplicitBoundary || isNextTitle) break;
    affected.push(node);
    node = node.nextElementSibling;
  }
  return affected;
}

function CollapsibleSectionTitle({ children, className = "", style, ...props }) {
  const [collapsed, setCollapsed] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const title = ref.current;
    if (!title) return;
    const affected = getCollapsibleAffectedNodes(title);

    affected.forEach((el) => {
      if (collapsed) el.classList.add("mal-major-collapsed-body");
      else el.classList.remove("mal-major-collapsed-body");
    });

    return () => affected.forEach((el) => el.classList.remove("mal-major-collapsed-body"));
  }, [collapsed, children]);

  return (
    <h2
      {...props}
      ref={ref}
      className={`${className} mal-major-section-title ${collapsed ? "mal-major-section-title-collapsed" : ""}`}
      style={style}
      onClick={() => setCollapsed((v) => !v)}
      role="button"
      tabIndex={0}
      onKeyDown={(e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          setCollapsed((v) => !v);
        }
      }}
      aria-expanded={!collapsed}
    >
      {children}
      <span className="mal-major-section-toggle" aria-hidden="true">{collapsed ? "＋" : "−"}</span>
    </h2>
  );
}



function PresentationDelta({ value, inverse = false }) {
  if (value === null || value === undefined || !isFinite(value)) return <span className="mal-presentation-delta flat">—</span>;
  const positive = inverse ? value < 0 : value > 0;
  const negative = inverse ? value > 0 : value < 0;
  return <span className={"mal-presentation-delta " + (positive ? "good" : negative ? "bad" : "flat")}>{value > 0 ? "+" : ""}{value.toFixed(1)}%</span>;
}

function presentationNextMonthKey(monthKey) {
  if (!monthKey) return null;
  const parts = monthKey.split("-").map(Number);
  let y = parts[0], m = parts[1] + 1;
  if (m === 13) { y += 1; m = 1; }
  return y + "-" + String(m).padStart(2, "0");
}

function presentationPlanKey(brandId, monthKey) {
  return brandId && monthKey ? "monthly-plan:" + brandId + "::" + monthKey : null;
}

function presentationPostUrl(postId) {
  if (!postId) return null;
  const raw = String(postId);
  const parts = raw.split("_");
  if (parts.length >= 2 && parts[0] && parts[1]) {
    return "https://www.facebook.com/" + encodeURIComponent(parts[0]) + "/posts/" + encodeURIComponent(parts.slice(1).join("_"));
  }
  return "https://www.facebook.com/" + encodeURIComponent(raw);
}

function presentationAdManagerUrl(accountId, ad) {
  const ids = [];
  if (ad && Array.isArray(ad.adIds)) ids.push.apply(ids, ad.adIds);
  if (ad && ad.adId) ids.push(ad.adId);
  const id = ids.filter(Boolean)[0];
  if (!accountId || !id) return null;
  return "https://www.facebook.com/adsmanager/manage/ads?act=" + encodeURIComponent(accountId) + "&selected_ad_ids=" + encodeURIComponent(id);
}

function presentationAdUrl(accountId, ad) {
  return presentationPostUrl(ad && ad.postId) || presentationAdManagerUrl(accountId, ad);
}

function PresentationLinkify({ text }) {
  const raw = String(text || "");
  if (!raw) return null;
  const parts = raw.split(/(https?:\/\/[^\s]+)/g);
  return (
    <>
      {parts.map((part, i) => /^https?:\/\//.test(part)
        ? <a key={i} className="mal-presentation-link" href={part} target="_blank" rel="noopener noreferrer">{part}</a>
        : <React.Fragment key={i}>{part}</React.Fragment>
      )}
    </>
  );
}


function reportTextHttpLinks(text) {
  const raw = String(text || "");
  const matches = raw.match(/https?:\/\/[^\s]+/g) || [];
  return Array.from(new Set(matches.map((url) => url.replace(/[),.;]+$/, ""))));
}

function ReportTextLinkChips({ text }) {
  const urls = reportTextHttpLinks(text);
  if (!urls.length) return null;
  return (
    <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginTop:8 }}>
      {urls.map((url,i)=><a key={url} className="mal-plan-link-go" href={url} target="_blank" rel="noopener noreferrer">↗ 開啟連結{i > 0 ? " " + (i + 1) : ""}</a>)}
    </div>
  );
}

function PresentationSectionHead({ title, subtitle }) {
  return (
    <div className="mal-presentation-section-head">
      <div>
        <h2>{title}</h2>
        {subtitle ? <p>{subtitle}</p> : null}
      </div>
    </div>
  );
}

function MonthlyPresentation({
  currentRecord,
  previousRecord,
  ledgerAgg,
  previousLedgerAgg,
  brandName,
  brandId,
  monthKey,
  roasTarget = 3,
  cpaTarget = null,
  sponsorStats = null,
  topProducts = [],
  history = [],
}) {
  const [slideIndex, setSlideIndex] = useState(0);
  const [planState, setPlanState] = useState({ current: null, next: null, loading: true });
  const stageRef = useRef(null);
  const safeRecord = currentRecord || { ads: [], spend: 0, revenue: 0, conversions: 0, currency: "TWD" };
  const currencyCode = safeRecord.currency || "TWD";
  const ads = Array.isArray(safeRecord.ads) ? safeRecord.ads : [];
  const accountId = safeRecord.accountId || "";
  const nextMonthKey = presentationNextMonthKey(monthKey);

  useEffect(() => {
    let cancelled = false;
    async function loadPlans() {
      if (!brandId || !monthKey) {
        if (!cancelled) setPlanState({ current: null, next: null, loading: false });
        return;
      }
      try {
        const keys = [presentationPlanKey(brandId, monthKey), presentationPlanKey(brandId, nextMonthKey)];
        const results = await Promise.all(keys.map((key) => storageGetStrict(key).catch(() => null)));
        const parse = (res) => {
          if (!res || !res.value) return null;
          try { return JSON.parse(res.value); } catch { return null; }
        };
        if (!cancelled) setPlanState({ current: parse(results[0]), next: parse(results[1]), loading: false });
      } catch {
        if (!cancelled) setPlanState({ current: null, next: null, loading: false });
      }
    }
    loadPlans();
    return () => { cancelled = true; };
  }, [brandId, monthKey, nextMonthKey]);

  const currentPlan = planState.current || { actionItems: [], projects: [], materialIssues: [] };
  const nextPlan = planState.next || { actionItems: [], projects: [], materialIssues: [] };

  const metaBreakdown = useMemo(() => buildProductBreakdown(ads, 500), [ads]);
  const merged = useMemo(
    () => mergeChannelBreakdown(metaBreakdown.rows, metaBreakdown.totalRevenue, metaBreakdown.totalSpend, ledgerAgg),
    [metaBreakdown, ledgerAgg]
  );
  const previousMerged = useMemo(() => {
    if (!previousRecord && !previousLedgerAgg) return null;
    const prevAds = previousRecord && Array.isArray(previousRecord.ads) ? previousRecord.ads : [];
    const prevMeta = buildProductBreakdown(prevAds, 500);
    return mergeChannelBreakdown(prevMeta.rows, prevMeta.totalRevenue, prevMeta.totalSpend, previousLedgerAgg);
  }, [previousRecord, previousLedgerAgg]);

  const metaMetrics = computeDeliveryMetrics(safeRecord);
  const prevMetaMetrics = computeDeliveryMetrics(previousRecord);
  const revenueDelta = previousMerged ? metricPctDelta(merged.grandTotalRevenue, previousMerged.grandTotalRevenue) : null;
  const spendDelta = previousMerged ? metricPctDelta(merged.grandTotalSpend, previousMerged.grandTotalSpend) : null;
  const metaRoasDelta = prevMetaMetrics ? metricPctDelta(metaMetrics.roas, prevMetaMetrics.roas) : null;
  const conversionDelta = prevMetaMetrics ? metricPctDelta(metaMetrics.conversions, prevMetaMetrics.conversions) : null;

  const ledgerRows = useMemo(() => {
    if (!ledgerAgg) return [];
    const b = buildLedgerProductBreakdown(ledgerAgg);
    return (b.rows || []).map((r) => ({
      ...r,
      roas: r.spend > 0 ? r.revenue / r.spend : null,
      cpa: r.conversions > 0 ? r.spend / r.conversions : null,
      aovCalc: r.conversions > 0 ? r.revenue / r.conversions : r.aov,
      spendShare: 0,
    }));
  }, [ledgerAgg]);

  const ledgerTotalSpend = ledgerRows.reduce((sum, r) => sum + Number(r.spend || 0), 0);
  ledgerRows.forEach((r) => { r.spendShare = ledgerTotalSpend > 0 ? (r.spend / ledgerTotalSpend) * 100 : 0; });
  const ledgerJudgments = useMemo(() => generateRuleJudgments(ledgerRows, roasTarget || 3), [ledgerRows, roasTarget]);
  const ledgerSorted = useMemo(() => ledgerRows.slice().sort((a,b) => {
    if ((b.spend > 0) !== (a.spend > 0)) return b.spend > 0 ? 1 : -1;
    if (b.spend !== a.spend) return b.spend - a.spend;
    return b.revenue - a.revenue;
  }), [ledgerRows]);

  const ledgerConversions = ledgerRows.reduce((sum, r) => sum + Number(r.conversions || 0), 0);
  const ledgerRevenue = ledgerAgg && ledgerAgg.overall ? Number(ledgerAgg.overall.revenue || 0) : merged.grandTotalRevenue;
  const ledgerSpend = ledgerAgg && ledgerAgg.overall ? Number(ledgerAgg.overall.adSpend || 0) : merged.grandTotalSpend;
  const ledgerProfit = ledgerAgg && ledgerAgg.overall ? Number(ledgerAgg.overall.profit || 0) : (ledgerRevenue - ledgerSpend);
  const ledgerRoas = ledgerSpend > 0 ? ledgerRevenue / ledgerSpend : null;

  const roasBarRows = ledgerRows.filter((r) => r.spend > 0 && r.roas !== null).sort((a,b) => b.roas - a.roas).slice(0,5);
  const maxRoas = Math.max(1, ...roasBarRows.map((r) => Number(r.roas || 0)));

  const planning = useMemo(
    () => generateRulePlanning(metaBreakdown.rows, metaBreakdown.totalRevenue, metaBreakdown.totalSpend, roasTarget || 3, currencyCode),
    [metaBreakdown, roasTarget, currencyCode]
  );

  const campaignRows = useMemo(() => {
    const map = {};
    ads.forEach((ad) => {
      const key = ad.campaign || "(未分類活動)";
      if (!map[key]) map[key] = { name:key, spend:0, revenue:0, conversions:0, count:0, postId:ad.postId || "", adId:(ad.adIds && ad.adIds[0]) || ad.adId || "" };
      map[key].spend += Number(ad.spend || 0);
      map[key].revenue += Number(ad.revenue || 0);
      map[key].conversions += Number(ad.conversions || 0);
      map[key].count += 1;
      if (!map[key].postId && ad.postId) map[key].postId = ad.postId;
      if (!map[key].adId && ad.adIds && ad.adIds[0]) map[key].adId = ad.adIds[0];
    });
    return Object.values(map).map((r) => ({ ...r, roas:r.spend > 0 ? r.revenue / r.spend : null })).sort((a,b) => b.revenue - a.revenue);
  }, [ads]);

  const topCampaigns = campaignRows.slice(0,5);
  const riskCampaigns = campaignRows.filter((r) => r.spend > 0 && (r.revenue <= 0 || (r.roas !== null && r.roas < (roasTarget || 3) * .75))).sort((a,b) => b.spend - a.spend).slice(0,5);

  const newAds = useMemo(() => ads.filter((ad) => ad.startDate && monthKey && String(ad.startDate).slice(0,7) === monthKey), [ads, monthKey]);
  const newAdRows = useMemo(() => newAds.slice().sort((a,b) => Number(b.revenue || 0) - Number(a.revenue || 0)).slice(0,6), [newAds]);

  const sponsor = useMemo(() => {
    if (sponsorStats) return sponsorStats;
    const rows = ads.filter((ad) => String(ad.name || "").includes("業配") || String(ad.campaign || "").includes("業配"));
    const spend = rows.reduce((sum, ad) => sum + Number(ad.spend || 0), 0);
    const revenue = rows.reduce((sum, ad) => sum + Number(ad.revenue || 0), 0);
    const conversions = rows.reduce((sum, ad) => sum + Number(ad.conversions || 0), 0);
    return { spend, revenue, conversions, roas:spend > 0 ? revenue / spend : null, cpa:conversions > 0 ? spend / conversions : null, ads:rows };
  }, [sponsorStats, ads]);

  const sponsorTop = useMemo(() => {
    const rows = sponsor && Array.isArray(sponsor.ads) ? sponsor.ads : [];
    return rows.map((ad) => ({ ...ad, roasCalc:Number(ad.spend || 0) > 0 ? Number(ad.revenue || 0) / Number(ad.spend || 0) : null }))
      .sort((a,b) => Number(b.revenue || 0) - Number(a.revenue || 0)).slice(0,6);
  }, [sponsor]);

  const channelRows = useMemo(() => {
    const rows = [];
    if (ledgerAgg && ledgerAgg.byCode) {
      Object.entries(ledgerAgg.byCode).forEach(([code,v]) => {
        if (!isChannelCode(code)) return;
        rows.push({ code, revenue:Number(v.revenue || 0), spend:Number(v.spend || 0) });
      });
    }
    rows.push({ code:"META", revenue:Number(safeRecord.revenue || 0), spend:Number(safeRecord.spend || 0) });
    const dedup = {};
    rows.forEach((r) => {
      if (!dedup[r.code]) dedup[r.code] = { ...r };
      else { dedup[r.code].revenue += r.revenue; dedup[r.code].spend += r.spend; }
    });
    return Object.values(dedup).map((r) => ({ ...r, roas:r.spend > 0 ? r.revenue / r.spend : null })).sort((a,b) => b.revenue - a.revenue).slice(0,8);
  }, [ledgerAgg, safeRecord.revenue, safeRecord.spend]);

  const historyRows = useMemo(() => (history || []).filter((r) => r && r.monthKey).slice(-6), [history]);

  function metricCard(label, value, delta, inverse) {
    return (
      <div className="mal-presentation-card">
        <div className="mal-presentation-card-label">{label}</div>
        <div className="mal-presentation-card-value">{value}</div>
        <PresentationDelta value={delta} inverse={inverse} />
      </div>
    );
  }

  function statusClass(status) {
    if (status === "green") return "green";
    if (status === "red") return "red";
    return "yellow";
  }

  function renderPlanItem(item, i) {
    return (
      <div className="mal-presentation-plan-card" key={item.id || i}>
        <div className="mal-presentation-plan-index">{String(i + 1).padStart(2,"0")}</div>
        <div>
          <div className="mal-presentation-plan-title">{item.title || item.name || "未命名項目"}</div>
          <div className="mal-presentation-plan-desc"><PresentationLinkify text={item.description || item.content || ""} /></div>
          {item.link && /^https?:\/\//.test(String(item.link).trim()) ? <a className="mal-presentation-link-chip" href={String(item.link).trim()} target="_blank" rel="noopener noreferrer">↗ 開啟連結</a> : null}
        </div>
      </div>
    );
  }

  const actionItems = currentPlan.actionItems && currentPlan.actionItems.length ? currentPlan.actionItems : (planning.actionItems || []);
  const materialIssues = currentPlan.materialIssues && currentPlan.materialIssues.length ? currentPlan.materialIssues : (planning.materialIssues || []);
  const projectItems = currentPlan.projects || [];
  const nextHasContent = !!((nextPlan.actionItems && nextPlan.actionItems.length) || (nextPlan.projects && nextPlan.projects.length) || (nextPlan.materialIssues && nextPlan.materialIssues.length));
  const nextActionItems = nextHasContent ? (nextPlan.actionItems || []) : actionItems;
  const nextProjects = nextHasContent ? (nextPlan.projects || []) : projectItems;

  const seriesChunks = [];
  for (let i=0; i<ledgerSorted.length; i+=6) seriesChunks.push(ledgerSorted.slice(i,i+6));

  const slides = [];

  slides.push({
    key:"cover",
    node:(
      <div className="mal-presentation-slide mal-presentation-slide-cover">
        <div>
          <div className="mal-presentation-kicker">Monthly Brand Performance Report</div>
          <div className="mal-presentation-title">{brandName || "品牌"}<br />{monthKey ? monthLabel(monthKey) : ""} 月報簡報</div>
          <div className="mal-presentation-subtitle">營運成效、投放判讀、專案進度與下月行動</div>
        </div>
        <div className="mal-presentation-cover-metrics">
          <div className="mal-presentation-cover-metric"><strong>{fmtMoney(ledgerRevenue,currencyCode)}</strong><span>整體營收</span></div>
          <div className="mal-presentation-cover-metric"><strong>{fmtMoney(ledgerSpend,currencyCode)}</strong><span>總廣告費</span></div>
          <div className="mal-presentation-cover-metric"><strong>{ledgerRoas !== null ? ledgerRoas.toFixed(2)+"x" : "—"}</strong><span>整體 ROAS</span></div>
        </div>
      </div>
    )
  });

  slides.push({
    key:"summary",
    node:(
      <div className="mal-presentation-slide">
        <PresentationSectionHead title="Executive Summary｜本月摘要" subtitle="老闆先看這頁，就能知道本月結果、問題與下一步。" />
        <div className="mal-presentation-grid" style={{marginBottom:18}}>
          {metricCard("整體營收",fmtMoney(ledgerRevenue,currencyCode),revenueDelta)}
          {metricCard("整體廣告費",fmtMoney(ledgerSpend,currencyCode),spendDelta,true)}
          {metricCard("Meta ROAS",metaMetrics && metaMetrics.roas !== null ? metaMetrics.roas.toFixed(2)+"x":"—",metaRoasDelta)}
          {metricCard("Meta 轉單",fmtInt(metaMetrics ? metaMetrics.conversions : 0),conversionDelta)}
        </div>
        <div className="mal-presentation-grid mal-presentation-grid-3" style={{flex:1}}>
          <div className="mal-presentation-panel"><h3>本月亮點</h3><ul>
            <li>{revenueDelta !== null ? "整體營收較上期 " + (revenueDelta >= 0 ? "成長 " : "下降 ") + Math.abs(revenueDelta).toFixed(1) + "%" : "目前尚無完整上期營收可比較"}</li>
            <li>{ledgerRoas !== null ? "整體 ROAS " + ledgerRoas.toFixed(2) + "x，" + (ledgerRoas >= (roasTarget || 3) ? "已達目標" : "仍低於目標") : "目前無法計算整體 ROAS"}</li>
            <li>{roasBarRows.length ? "目前效率最高系列：" + roasBarRows[0].code + "，ROAS " + roasBarRows[0].roas.toFixed(2) + "x" : "尚無足夠投放系列資料"}</li>
          </ul></div>
          <div className="mal-presentation-panel"><h3>需要留意</h3><ul>
            {materialIssues.length ? materialIssues.slice(0,3).map((x,i)=><li key={i}>{x.title}</li>) : <li>目前未偵測到重大風險項目</li>}
          </ul></div>
          <div className="mal-presentation-panel"><h3>下一步</h3><ul>
            {nextActionItems.length ? nextActionItems.slice(0,3).map((x,i)=><li key={i}>{x.title}</li>) : <li>尚未建立下月操作方向</li>}
          </ul></div>
        </div>
      </div>
    )
  });

  slides.push({
    key:"performance",
    node:(
      <div className="mal-presentation-slide">
        <PresentationSectionHead title={"投放成效｜" + (monthKey ? monthLabel(monthKey) : "")} subtitle="完整沿用月報的帳面營收、花費、成交與系列判斷，不另外重算一套。" />
        <div className="mal-presentation-grid" style={{marginBottom:20}}>
          {metricCard("營業額",fmtMoney(ledgerRevenue,currencyCode),null)}
          {metricCard("總花費",fmtMoney(ledgerSpend,currencyCode),null,true)}
          {metricCard("帳面利潤",fmtMoney(ledgerProfit,currencyCode),null)}
          {metricCard("成交筆數",fmtInt(ledgerConversions),null)}
        </div>
        <div className="mal-presentation-performance-layout">
          <div className="mal-presentation-panel" style={{minHeight:0}}>
            <h3>整體效率</h3>
            <div className="mal-presentation-card-value" style={{fontSize:"50px",marginTop:"4px"}}>{ledgerRoas !== null ? ledgerRoas.toFixed(2)+"x":"—"}</div>
            <div className="mal-presentation-note">ROAS 目標 {Number(roasTarget || 3).toFixed(1)}x</div>
            <div style={{marginTop:18,fontSize:18,lineHeight:1.65}}>
              {ledgerRoas !== null && ledgerRoas >= (roasTarget || 3)
                ? "整體效率達標。優先把預算放在已證明有效、且仍有放量空間的系列。"
                : "整體效率尚未達標。先收斂高花費低 ROAS 系列，再談擴量。"}
            </div>
          </div>
          <div className="mal-presentation-roas-bars">
            {roasBarRows.length ? roasBarRows.map((r) => {
              const cls = r.roas >= 5 ? "" : r.roas >= 3 ? "mid" : "low";
              return <div className="mal-presentation-roas-row" key={r.code}>
                <div className="mal-presentation-roas-code">{r.code}</div>
                <div className="mal-presentation-roas-track"><div className={"mal-presentation-roas-fill " + cls} style={{width:Math.max(4,(r.roas/maxRoas)*100)+"%"}} /></div>
                <div className="mal-presentation-roas-value">{r.roas.toFixed(1)}x</div>
              </div>;
            }) : <div className="mal-presentation-panel">目前沒有可比較的系列投放資料。</div>}
          </div>
        </div>
      </div>
    )
  });

  seriesChunks.forEach((chunk,chunkIndex) => {
    const chunkSpend = chunk.reduce((sum,r)=>sum+Number(r.spend||0),0);
    const chunkRevenue = chunk.reduce((sum,r)=>sum+Number(r.revenue||0),0);
    const chunkConversions = chunk.reduce((sum,r)=>sum+Number(r.conversions||0),0);
    const chunkRoas = chunkSpend > 0 ? chunkRevenue / chunkSpend : null;
    const best = chunk.filter((r)=>r.roas !== null).slice().sort((a,b)=>b.roas-a.roas)[0] || null;
    const highestSpend = chunk.slice().sort((a,b)=>Number(b.spend||0)-Number(a.spend||0))[0] || null;
    const weak = chunk.filter((r)=>r.spend>0 && (r.roas===null || r.roas < (roasTarget||3))).sort((a,b)=>Number(b.spend||0)-Number(a.spend||0))[0] || null;
    const noSpend = chunk.filter((r)=>Number(r.spend||0)<=0).length;
    const chunkShare = ledgerSpend > 0 ? (chunkSpend / ledgerSpend) * 100 : 0;

    slides.push({
      key:"series-"+chunkIndex,
      node:(
        <div className="mal-presentation-slide">
          <PresentationSectionHead
            title={"投放成效｜系列明細" + (seriesChunks.length > 1 ? " " + (chunkIndex + 1) + "/" + seriesChunks.length : "")}
            subtitle="系列資料＋本頁重點判讀，版面以老闆閱讀距離為優先。"
          />
          <div className="mal-presentation-table-wrap">
            <table className="mal-presentation-table mal-presentation-series-table">
              <thead><tr><th>系列</th><th>營業額</th><th>花費</th><th>ROAS</th><th>廣告佔比</th><th>CPA</th><th>成交</th><th>帳面利潤</th><th>客單價</th><th>判斷</th></tr></thead>
              <tbody>
                {chunk.map((r) => {
                  const j = ledgerJudgments[r.code] || {icon:"⚪",label:"無資料"};
                  return <tr key={r.code}>
                    <td><strong>{r.code}</strong></td>
                    <td className="num">{fmtMoney(r.revenue,currencyCode)}</td>
                    <td className="num">{fmtMoney(r.spend,currencyCode)}</td>
                    <td className="num">{r.roas !== null ? r.roas.toFixed(2)+"x":"—"}</td>
                    <td className="num">{r.spendShare.toFixed(0)+"%"}</td>
                    <td className="num">{r.cpa !== null ? fmtMoney(r.cpa,currencyCode):"—"}</td>
                    <td className="num">{fmtInt(r.conversions || 0)}</td>
                    <td className="num">{fmtMoney(r.profit || 0,currencyCode)}</td>
                    <td className="num">{r.aovCalc ? fmtMoney(r.aovCalc,currencyCode):"—"}</td>
                    <td className="mal-presentation-judgment">{j.icon} {j.label}</td>
                  </tr>;
                })}
              </tbody>
            </table>
          </div>

          <div className="mal-presentation-series-summary">
            <div className="mal-presentation-series-summary-card">
              <div className="mal-presentation-series-summary-label">本頁系列花費</div>
              <div className="mal-presentation-series-summary-value">{fmtMoney(chunkSpend,currencyCode)}</div>
              <div className="mal-presentation-series-summary-text">佔整體廣告費 {chunkShare.toFixed(0)}%｜本頁 ROAS {chunkRoas !== null ? chunkRoas.toFixed(2)+"x" : "—"}</div>
            </div>
            <div className="mal-presentation-series-summary-card">
              <div className="mal-presentation-series-summary-label">效率最高</div>
              <div className="mal-presentation-series-summary-value">{best ? best.code : "—"}</div>

function StaticSectionTitle({ children, className = "", style, ...props }) { return (<h2 {...props} className={className} style={style}>{children}</h2>); }

function OverallOpsSummary({ ads, ledgerAgg, prevAds, prevLedgerAgg, periodLabel, prevPeriodLabel, roasTarget = 3, currencyCode, minSpend = 500, collapsible = true }) {
  const meta = buildProductBreakdown(ads || [], minSpend);
  const merged = mergeChannelBreakdown(meta.rows, meta.totalRevenue, meta.totalSpend, ledgerAgg);
  const { grandTotalRevenue, grandTotalSpend, channelRevenueOnlyRows, rows } = merged;

  if (grandTotalRevenue === 0 && grandTotalSpend === 0) return null; // 這期完全沒資料,不顯示整個區塊

  const netProfit = grandTotalRevenue - grandTotalSpend;

  let prevGrandTotalRevenue = null;
  if (prevAds || prevLedgerAgg) {
    const prevMeta = buildProductBreakdown(prevAds || [], minSpend);
    const prevMerged = mergeChannelBreakdown(prevMeta.rows, prevMeta.totalRevenue, prevMeta.totalSpend, prevLedgerAgg);
    if (prevMerged.grandTotalRevenue > 0 || prevMerged.grandTotalSpend > 0) prevGrandTotalRevenue = prevMerged.grandTotalRevenue;
  }
  const growthAmount = prevGrandTotalRevenue !== null ? grandTotalRevenue - prevGrandTotalRevenue : null;
  const growthPct = prevGrandTotalRevenue !== null && prevGrandTotalRevenue > 0 ? (growthAmount / prevGrandTotalRevenue) * 100 : null;

  // 狀態標籤:跟投放成效同一套邏輯(整體ROAS對目標的比例),維持全站判定方式一致。
  const overallRoas = grandTotalSpend > 0 ? grandTotalRevenue / grandTotalSpend : null;
  const ratio = overallRoas !== null && roasTarget > 0 ? overallRoas / roasTarget : null;
  const status = ratio === null ? null : ratio >= 1.5 ? "超標" : ratio >= 1 ? "優於目標" : "未達標";
  const statusColor = { 超標: "var(--blue)", 優於目標: "var(--green)", 未達標: "var(--red)" };
  const allTags = ["超出預算", "超標", "未達標", "優於目標"];

  // 平台/通路清單:Meta對不到代號的所有通路(有花費的+沒花費的合在一起),依營收排序。
  const allChannelRows = [
    ...rows.filter((r) => r.isChannel),
    ...channelRevenueOnlyRows,
  ].sort((a, b) => b.revenue - a.revenue);
  const [channelsCollapsed, setChannelsCollapsed] = useState(false);

  return (
    <div className="mal-ops-summary">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10, marginBottom: 4 }}>
        {collapsible ? (
          <CollapsibleSectionTitle className="mal-section-title" style={{ marginBottom: 0 }}>整體營運{periodLabel ? `(${periodLabel})` : ""}</CollapsibleSectionTitle>
        ) : (
          <StaticSectionTitle className="mal-section-title" style={{ marginBottom: 0 }}>整體營運{periodLabel ? `(${periodLabel})` : ""}</StaticSectionTitle>
        )}
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {allTags.map((tag) => (
            <span
              key={tag}
              style={{
                fontSize: 12.5, padding: "2px 10px", borderRadius: 999,
                fontWeight: tag === status ? 700 : 400,
                background: tag === status ? statusColor[tag] : "transparent",
                color: tag === status ? "#fff" : "var(--ink-soft)",
              }}
            >
              {tag}
            </span>
          ))}
        </div>
      </div>
      <div className="mal-cards" style={{ marginBottom: 18 }}>
        <div className="mal-card">
          <div className="mal-card-label">總營收{periodLabel ? `(${periodLabel})` : ""}</div>
          <div className="mal-card-value">{fmtMoney(grandTotalRevenue, currencyCode)}</div>
        </div>
        {prevGrandTotalRevenue !== null && (
          <div className="mal-card">
            <div className="mal-card-label">上期總營收{prevPeriodLabel ? `(${prevPeriodLabel})` : ""}</div>
            <div className="mal-card-value">{fmtMoney(prevGrandTotalRevenue, currencyCode)}</div>
            {growthPct !== null && (
              <div style={{ fontSize: 11.5, color: "var(--ink-soft)", marginTop: 4 }}>
                較上期{growthPct >= 0 ? "成長約" : "下降約"}{" "}
                <span style={{ color: growthPct >= 0 ? "var(--green)" : "var(--red)", fontWeight: 700 }}>{Math.abs(growthPct).toFixed(1)}%</span>
                ,{growthAmount >= 0 ? "增加了" : "減少了"} {fmtMoney(Math.abs(growthAmount), currencyCode)}
              </div>
            )}
          </div>
        )}
        <div className="mal-card">
          <div className="mal-card-label">總廣告費</div>
          <div className="mal-card-value">{fmtMoney(grandTotalSpend, currencyCode)}</div>
        </div>
        <div className={`mal-card ${netProfit >= 0 ? "mal-card-highlight-good" : ""}`}>
          <div className="mal-card-label">總淨利(扣除廣告費後)</div>
          <div className="mal-card-value">{fmtMoney(netProfit, currencyCode)}</div>
        </div>
      </div>

      {allChannelRows.length > 0 && (
        <>
          {collapsible ? (
            <h2
              className="mal-section-title mal-major-section-title"
              style={{ fontSize: 15, marginBottom: 10 }}
              onClick={() => setChannelsCollapsed((v) => !v)}
              role="button"
              tabIndex={0}
              aria-expanded={!channelsCollapsed}
            >
              平台／通路明細<span style={{ fontWeight: 400, fontSize: 11.5, color: "var(--ink-soft)", marginLeft: 6 }}>(後台帳本裡Meta廣告代號對不到的通路)</span>
              <span className="mal-major-section-toggle" aria-hidden="true">{channelsCollapsed ? "＋" : "−"}</span>
            </h2>
          ) : (
            <StaticSectionTitle className="mal-section-title" style={{ fontSize: 15, marginBottom: 10 }}>

  // 從 Google 試算表直接同步後台每日收益表(方式B:試算表保持完全私密,只分享給一個服務帳號),
  // 取代手動下載 xlsx 再上傳的步驟。伺服器端(/api/sheets/sync)會用服務帳號金鑰讀「1月」~「12月」
  // 這些分頁,轉成跟 xlsx 匯入完全同一套格式後直接存進帳本,前端這裡只需要打一次 API。
  async function syncFromGoogleSheet() {
    if (!activeBrandId) {
      setLedgerImportError("請先在上方選擇或建立一個品牌(廣告帳號),系統才知道要把同步回來的資料存到哪一本帳。");
      return;
    }
    const sheetId = sheetIdInput.trim();
    setSheetSyncLoading(true); setLedgerImportError(null); setLedgerImportNotice(null);
    try {
      const res = await fetch(`/api/sheets/sync`, {
        method: "POST",
        headers: { ...teamKeyHeaders(), "Content-Type": "application/json" },
        body: JSON.stringify({ accountId: activeBrandId, sheetId, year: Number(ledgerYear) }),
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
      await loadLedger(activeBrandId);
      const monthsLabel = (json.importedMonths || []).map((mk) => monthLabel(mk)).join("、");
      setLedgerImportNotice(
        `已從 Google 試算表同步 ${monthsLabel} 的後台每日收益表。` +
        (json.errors && json.errors.length ? ` (部分分頁略過:${json.errors.join(";")})` : "")
      );
    } catch (e) {
      setLedgerImportError("同步失敗:" + e.message + "——請確認這份試算表已經分享給服務帳號的 email(檢視者權限即可),且 ID 沒有貼錯。");
    } finally {
      setSheetSyncLoading(false);
    }
  }

  async function loadAll(brandId, isStale) {
    setLoading(true); setError(null);
    try {
      const listRes = await storage.list(STORAGE_PREFIX);
      if (isStale && isStale()) return; // 品牌已經切換了,這次請求過期
      const keys = ((listRes && listRes.keys) || []).filter((k) => {
        const rest = k.slice(STORAGE_PREFIX.length);
        return brandId ? rest.startsWith(brandId + "::") : !rest.includes("::");
      });
      const entries = {};
      for (const k of keys) {
        if (isStale && isStale()) return;
        const res = await storage.get(k);
        if (res && res.value) {
          const rest = k.slice(STORAGE_PREFIX.length);
          const mk = brandId ? rest.slice((brandId + "::").length) : rest;
          entries[mk] = JSON.parse(res.value);
        }
      }
      if (isStale && isStale()) return; // 寫回畫面前最後一道防線,避免切換品牌後被舊資料蓋回去
      setMonths(entries);
      const sorted = Object.keys(entries).sort();
      setFocusMonth(sorted.length ? sorted[sorted.length - 1] : null);
    } catch (e) {
      if (!(isStale && isStale())) setError("讀取先前資料時發生問題,先從空白帳本開始。");
    } finally {
      if (!(isStale && isStale())) setLoading(false);
    }
  }

  // 「匯出PDF」用的是跟「列印」同一套瀏覽器原生引擎(不是html2canvas,那條路已經證實不可靠),
  // 但多做兩件事:①先跳勾選視窗,依使用者選擇隱藏不要的區塊,不是整份報表照單全收
  // ②動態算出「隱藏完不要的區塊之後,剩下內容實際多高」,把@page尺寸設成剛好那麼高的單一頁面,
  // 這樣列印引擎不會照A4/Letter這種標準紙張尺寸把內容切成好幾頁——存出來的PDF是連續一整份,
  // 不會有內容被紙張邊界硬生生切斷的問題。
  async function runPdfExport() {
    setPdfExportBusy(true);
    window.dispatchEvent(new Event(PERF_EXPAND_ALL_EVENT));
    try {
      await Promise.all([
        document.fonts.load("500 16px 'Noto Serif TC'"),
        document.fonts.load("600 16px 'Noto Serif TC'"),
        document.fonts.load("700 16px 'Noto Serif TC'"),
        document.fonts.load("400 13px 'Noto Sans TC'"),
        document.fonts.load("600 13px 'Noto Sans TC'"),
        document.fonts.ready,
      ]);
    } catch {
      /* 個別字重載入失敗也不中斷匯出流程 */
    }
    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    await new Promise((resolve) => setTimeout(resolve, 900)); // 等雲端資料(月報告/AI分析)讀取完成

    // 隱藏使用者沒勾選的區塊
    const hiddenEls = [];
    document.querySelectorAll("[data-pdf-section]").forEach((el) => {
      const key = el.getAttribute("data-pdf-section");
      if (!pdfSelectedSections.has(key)) {
        hiddenEls.push({ el, originalDisplay: el.style.display });
        el.style.display = "none";
      }
    });

    // textarea 動態撐高(跟列印同一個理由,月報告的文字框不會自動撐開)
    const resizedTextareas = [];
    document.querySelectorAll(".mal-plan-textarea").forEach((el) => {
      resizedTextareas.push({ el, originalHeight: el.style.height });
      el.style.height = "auto";
      el.style.height = el.scrollHeight + "px";
    });

    document.body.classList.add("mal-exporting");
    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    // 隱藏完不要的區塊、textarea也撐開之後,量測「現在實際還剩多高」,動態產生一個剛好這麼高
    // 的單一頁面尺寸——用CSS像素除以96(瀏覽器預設DPI)換算成英吋,是CSS px轉實體單位的標準做法。
    const target = document.querySelector(".mal-shell");
    const widthPx = target.scrollWidth;
    const heightPx = target.scrollHeight;
    const widthIn = (widthPx / 96 + 0.6).toFixed(2); // 留一點左右邊距空間
    const heightIn = (heightPx / 96 + 0.6).toFixed(2);
    const pageStyle = document.createElement("style");
    pageStyle.id = "mal-dynamic-page-size";
    pageStyle.textContent = `@page { size: ${widthIn}in ${heightIn}in; margin: 0.3in; }`;
    document.head.appendChild(pageStyle);

    function cleanup() {
      hiddenEls.forEach(({ el, originalDisplay }) => { el.style.display = originalDisplay; });
      resizedTextareas.forEach(({ el, originalHeight }) => { el.style.height = originalHeight; });
      document.body.classList.remove("mal-exporting");
      const styleEl = document.getElementById("mal-dynamic-page-size");
      if (styleEl) styleEl.remove();
      window.removeEventListener("afterprint", cleanup);
      setPdfExportBusy(false);
    }
    window.addEventListener("afterprint", cleanup);
    requestAnimationFrame(() => window.print());
  }

  const MIN_FETCH_SPEND = 500;
  const MIN_API_GAP_MS = 1200; // 任兩次 Meta Graph API 請求之間的最小間隔(毫秒)

  // 所有打 Meta Graph API 的地方都要改叫這個,不要直接用 fetch()。
  // 它會確保「這一次要打的請求」跟「上一次真正打出去的請求」之間至少間隔 MIN_API_GAP_MS,
  // 不管上一次請求是來自月報表、批次、備援同步或縮圖抓取,全部共用同一個計時器,
  // 所以就算使用者連續手動觸發抓取，也一樣會被這裡擋下來排隊等待。
  async function throttledFetch(url, context) {
    const now = Date.now();
    const wait = lastApiCallRef.current + MIN_API_GAP_MS - now;
    if (wait > 0) await new Promise((r) => setTimeout(r, wait));
    lastApiCallRef.current = Date.now();
    try {
      return await fetch(url);
    } catch (e) {
      throw new Error(`${context || "呼叫 Meta API"}時網路請求失敗:${e.message}`);
    }
  }

  async function parseApiResponse(res, context) {
    let json;
    try {
      json = await res.json();
    } catch {
      throw new Error(`${context}回傳的內容無法解析(可能是網路中斷或 Meta 伺服器異常)。`);
    }
    if (!res.ok || json.error) {
      const code = json.error && json.error.code;
      const sub = json.error && json.error.error_subcode;
      const msg = (json.error && json.error.message) || `HTTP ${res.status}`;
      const err = new Error(`${context}失敗(錯誤代碼 ${code || res.status}${sub ? "/" + sub : ""}):${msg}`);
      err.code = code;
      err.subcode = sub;
      throw err;
    }
    return json;
  }

  // 統一包裝「打 API + 解析回應」,遇到 Meta 那邊回傳的暫時性錯誤時,自動等一下重試,不用使用者手動再按一次。
  // 錯誤代碼 1(含各種 subcode,例如 1/99)跟 2 都是 Meta 官方文件裡列為「建議直接重試」的暫時性錯誤,
  // 跟權杖/帳號 ID/權限完全無關,常見原因是短時間內打太多次 API(不管是你自己、同事,或自動同步同時在跑)。
  async function fetchGraphApi(url, context, retriesLeft = 2) {
    const res = await throttledFetch(url, context);
    try {
      return await parseApiResponse(res, context);
    } catch (e) {
      if ((e.code === 1 || e.code === 2) && retriesLeft > 0) {
        const waitMs = retriesLeft === 2 ? 3000 : 6000; // 重試間隔逐次拉長,給 Meta 那邊更多喘息時間
        await new Promise((r) => setTimeout(r, waitMs));
        return fetchGraphApi(url, context, retriesLeft - 1);
      }
      throw e;
    }
  }

  function apiErrorHint(e) {
    const msg = (e && e.message) || "";
    if (e && (e.code === 1 || e.code === 2)) {
      return (
        "。這不是你的權杖或帳號 ID 設定錯誤——Meta 官方把這種錯誤歸類為「暫時性問題,建議直接重試」," +
        "常見原因是短時間內對同一個廣告帳號打太多次 API(可能是你自己連續按了好幾次、同事剛好也在同時間抓同一個品牌、" +
        "或自動同步跟手動抓取撞在一起),系統已經自動重試過,如果還是失敗,等 1~2 分鐘再試一次通常就會恢復。"
      );
    }
    if (/since cannot be in the future|time_range.*future/i.test(msg)) {
      return "。這是日期區間超過 Meta 帳號當地今天，不是廣告帳號 ID 或權杖錯誤。系統會自動把本月結束日封頂到帳號當地今天。";
    }
    if (/too many calls/i.test(msg) || /80004/.test(msg) || /error_subcode 2446079/i.test(msg)) {
      return "。這是 Meta 廣告帳號的呼叫頻率限制,不是設定錯誤——通常等 5~15 分鐘再試一次就會恢復,批次抓多個品牌時建議一次不要抓太多個。";
    }
    return "。請確認權杖沒過期、廣告帳號 ID 正確,且已授權 ads_read 權限。";
  }

  function parseDateStr(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    return { y, m, d };
  }
  // 高量帳號(例如 H&J)整月直接做 level=ad Insights 容易讓 Meta 查詢過重。
  // 改成最多 4 天一段，再把「可加總」指標依 ad_id 合併；31 天月份最多 8 段，
  // 仍遠低於每小時呼叫上限，也比整月單次查詢穩定。Reach 不能跨區間相加，下面會另外用
  // 一次輕量的 full-range reach 查詢覆蓋，避免 Frequency 被日期切段扭曲。
  function splitDateRangeIfLarge(since, until) {
    const start = new Date(`${since}T00:00:00Z`);
    const end = new Date(`${until}T00:00:00Z`);
    if (!Number.isFinite(start.getTime()) || !Number.isFinite(end.getTime()) || start > end) {
      return [{ since, until }];
    }
    const MAX_DAYS_PER_INSIGHTS_QUERY = 4;
    const out = [];
    let cursor = start;
    while (cursor <= end) {
      const partEndMs = Math.min(end.getTime(), cursor.getTime() + (MAX_DAYS_PER_INSIGHTS_QUERY - 1) * 86400000);
      const partEnd = new Date(partEndMs);
      out.push({ since: cursor.toISOString().slice(0, 10), until: partEnd.toISOString().slice(0, 10) });
      cursor = new Date(partEndMs + 86400000);
    }
    return out;
  }

  // relaxThreshold=true(備援抓取需要放寬門檻時使用):篩選階段不會排除掉「目前還在投放中」的廣告,
  // 就算這支廣告這段期間花費還沒到 500,只要現在仍在投放,一樣會保留下來,方便看到剛起步/學習中的廣告。
  // 月報表(fetchOneBrandMonth)沒有帶這個參數,維持原本花費 ≥ 500 才留下的嚴格門檻。
  async function fetchInsightsForRange(token, accountId, since, until, relaxThreshold = false) {
    const encToken = encodeURIComponent(token);

    // 0) account metadata + future-date guard
    let currency = "TWD";
    let accountToday = null;
    try {
      const metaJson = await fetchGraphApi(
        `https://graph.facebook.com/v19.0/act_${accountId}?fields=currency,timezone_offset_hours_utc&access_token=${encToken}`,
        "讀取帳號幣別與時區"
      );
      if (metaJson.currency) currency = metaJson.currency;
      if (typeof metaJson.timezone_offset_hours_utc === "number") {
        accountToday = new Date(Date.now() + metaJson.timezone_offset_hours_utc * 3600000).toISOString().slice(0, 10);
      }
    } catch { /* metadata isn't critical; fall back to browser-local date */ }

    if (!accountToday) {
      const now = new Date();
      accountToday = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
    }

    // Meta rejects time_range when a split starts in the future. Current-month reports used to request
    // the calendar month end (e.g. 10/31 on 10/28), so clamp every caller at this shared layer.
    const requestedUntil = until;
    if (until > accountToday) until = accountToday;
    if (since > until) {
      return {
        spend: 0, conversions: 0, revenue: 0, impressions: 0, clicks: 0, linkClicks: 0, reach: 0,
        campaigns: 0, currency, accountId, ads: [], rawAds: [], sponsorAds: [], syncedAt: new Date().toISOString(),
        requestedUntil, effectiveUntil: until
      };
    }

    // 1) per-ad performance——範圍太大(月報表等級)時自動切成約4天一段各自查詢再合併。
    async function fetchOneRangeRows(rangeSince, rangeUntil) {
      const timeRange = encodeURIComponent(JSON.stringify({ since: rangeSince, until: rangeUntil }));
      let insightsUrl =
        `https://graph.facebook.com/v19.0/act_${accountId}/insights?level=ad&use_account_attribution_setting=true` +
        `&fields=ad_id,ad_name,campaign_name,spend,impressions,clicks,inline_link_clicks,reach,actions,action_values&time_range=${timeRange}&limit=500&access_token=${encToken}`;
      let out = [];
      let page = 0;
      while (insightsUrl && page < 20) {
        const json = await fetchGraphApi(insightsUrl, `讀取成效資料(${rangeSince}~${rangeUntil},第${page + 1}頁)`);
        out = out.concat(json.data || []);
        insightsUrl = json.paging && json.paging.next ? json.paging.next : null;
        page++;
      }
      return out;
    }
    const ranges = splitDateRangeIfLarge(since, until);
    let rawRows = [];
    for (const r of ranges) {
      const part = await fetchOneRangeRows(r.since, r.until);
      rawRows = rawRows.concat(part);
    }
    // 切段查詢時,同一支廣告會分別出現在不同段的結果裡,依 ad_id 加總合併,避免「花費是否達門檻」
    // 誤判(平均分散在兩段、單段各自都不到門檻但合計其實達標的廣告不能被錯誤排除)。
    let rows;
    if (ranges.length <= 1) {
      rows = rawRows;
    } else {
      const mergedByAdId = {};
      rawRows.forEach((r) => {
        const key = r.ad_id || `__no_id_${Math.random()}`;
        if (!mergedByAdId[key]) {
          mergedByAdId[key] = { ad_id: r.ad_id, ad_name: r.ad_name, campaign_name: r.campaign_name || "", spend: 0, impressions: 0, clicks: 0, inline_link_clicks: 0, reach: 0, actions: [], action_values: [] };
        }
        const m = mergedByAdId[key];
        if (!m.campaign_name && r.campaign_name) m.campaign_name = r.campaign_name;
        m.spend = (parseFloat(m.spend) || 0) + (parseFloat(r.spend) || 0);
        m.impressions += parseFloat(r.impressions) || 0;
        m.clicks += parseFloat(r.clicks) || 0;
        m.inline_link_clicks += parseFloat(r.inline_link_clicks) || 0;
        m.reach += parseFloat(r.reach) || 0;
        ["actions", "action_values"].forEach((field) => {
          (r[field] || []).forEach((entry) => {
            const existing = m[field].find((e) => e.action_type === entry.action_type);
            if (existing) {
              existing.value = String((parseFloat(existing.value) || 0) + (parseFloat(entry.value) || 0));
            } else {
              m[field].push({ action_type: entry.action_type, value: entry.value });
            }
          });
        });
      });
      rows = Object.values(mergedByAdId);

      // Reach 是「去重人數」，日期區間切段後不能直接相加。
      // 另外做一次欄位很輕的 full-range reach 查詢來覆蓋；如果連這支輕量查詢都失敗，
      // 就把 reach 留空(0)，寧可讓 Frequency 顯示無資料，也不要給一個錯的數字。
      const fullTimeRange = encodeURIComponent(JSON.stringify({ since, until }));
      let reachUrl =
        `https://graph.facebook.com/v19.0/act_${accountId}/insights?level=ad&fields=ad_id,reach&time_range=${fullTimeRange}&limit=500&access_token=${encToken}`;
      const reachByAdId = {};
      let reachPage = 0;
      try {
        while (reachUrl && reachPage < 20) {
          const json = await fetchGraphApi(reachUrl, `讀取完整區間 Reach(第${reachPage + 1}頁)`);
          (json.data || []).forEach((r) => {
            if (r.ad_id) reachByAdId[r.ad_id] = parseFloat(r.reach) || 0;
          });
          reachUrl = json.paging && json.paging.next ? json.paging.next : null;
          reachPage++;
        }
        if (reachUrl) throw new Error("Reach 分頁超過安全上限");
      } catch {
        Object.keys(reachByAdId).forEach((k) => delete reachByAdId[k]);
      }
      rows.forEach((r) => {
        r.reach = Object.prototype.hasOwnProperty.call(reachByAdId, r.ad_id) ? reachByAdId[r.ad_id] : 0;
      });
    }

    if (!rows.length) {
      return { spend: 0, conversions: 0, revenue: 0, impressions: 0, clicks: 0, linkClicks: 0, reach: 0, campaigns: 0, currency, accountId, ads: [], rawAds: [], sponsorAds: [], syncedAt: new Date().toISOString(), requestedUntil, effectiveUntil: until };
    }

    // 2) thumbnails + UTM tags + 投放狀態 + 所屬行銷活動,matched by ad_id (more reliable than name)
    // 這一步要放在篩選門檻「之前」,因為 relaxThreshold 模式需要用投放狀態來決定要不要放行低花費的廣告。
    // 只查「這段期間真的有花費紀錄」的廣告 ID,不要掃整個帳號的歷史廣告,避免觸發 Meta 帳號層級的頻率限制。
    // 非relax模式(月報表)時,只對「花費有機會達標」的廣告抓細節,高流量帳號常常有大量低花費、
    // 之後反正會被篩掉的廣告,不用每支都白跑一次查詢,減少總請求數。
    const detailTargetRows = relaxThreshold ? rows : rows.filter((r) => (parseFloat(r.spend) || 0) >= MIN_FETCH_SPEND);
    const periodAdIds = [...new Set(detailTargetRows.map((r) => r.ad_id).filter(Boolean))];
    let thumbMap = {};
    let utmMap = {};
    let statusMap = {};
    let campaignMap = {};
    let adSetMap = {};
    let adSetIdMap = {};
    let startDateMap = {};
    let storyIdMap = {}; // ad.id -> effective_object_story_id(這支廣告素材背後對應的前台貼文 ID,不是每支廣告都有)
    let creativeIdMap = {}; // ad.id -> creative.id，給品牌獨立報表做同素材跨 Campaign 比較
    let objectiveMap = {}; // ad.id -> campaign.objective
    let campaignStatusMap = {}; // ad.id -> campaign.effective_status
    let optimizationGoalMap = {}; // ad.id -> adset.optimization_goal
    const ID_CHUNK_SIZE = 50;
    for (let i = 0; i < periodAdIds.length; i += ID_CHUNK_SIZE) {
      const chunk = periodAdIds.slice(i, i + ID_CHUNK_SIZE);
      const filtering = encodeURIComponent(JSON.stringify([{ field: "id", operator: "IN", value: chunk }]));
      let adsUrl =
        `https://graph.facebook.com/v19.0/act_${accountId}/ads?fields=id,name,url_tags,effective_status,created_time,campaign{name,objective,effective_status},adset{id,name,start_time,optimization_goal},creative{id,thumbnail_url,image_url,url_tags,effective_object_story_id}` +
        `&filtering=${filtering}&limit=500&access_token=${encToken}`;
      let page2 = 0;
      while (adsUrl && page2 < 5) {
        const json = await fetchGraphApi(adsUrl, "讀取廣告清單");
        (json.data || []).forEach((ad) => {
          const thumb = ad.creative && (ad.creative.thumbnail_url || ad.creative.image_url);
          if (thumb) thumbMap[ad.id] = thumb;
          // 有些廣告(例如動態素材/型錄類廣告)的追蹤參數是設在「創意」層級,不是廣告本身,
          // 所以廣告本身的 url_tags 抓不到值時,再退回去看創意底下的 url_tags。
          const tags = ad.url_tags || (ad.creative && ad.creative.url_tags) || "";
          if (tags) utmMap[ad.id] = extractUtmValue(tags);
          statusMap[ad.id] = ad.effective_status || "UNKNOWN";
          if (ad.campaign && ad.campaign.name) campaignMap[ad.id] = ad.campaign.name;
          if (ad.campaign && ad.campaign.objective) objectiveMap[ad.id] = ad.campaign.objective;
          if (ad.campaign && ad.campaign.effective_status) campaignStatusMap[ad.id] = ad.campaign.effective_status;
          if (ad.adset && ad.adset.name) adSetMap[ad.id] = ad.adset.name;
          if (ad.adset && ad.adset.id) adSetIdMap[ad.id] = ad.adset.id;
          if (ad.adset && ad.adset.optimization_goal) optimizationGoalMap[ad.id] = ad.adset.optimization_goal;
          if (ad.creative && ad.creative.id) creativeIdMap[ad.id] = ad.creative.id;
          // 投放起始時間:優先用廣告組合(adset)排定的開始時間,最貼近實際開始投放的日期;
          // 抓不到的話(例如舊資料、權限限制)退回用廣告本身的建立時間,當作大概的參考。
          const startRaw = (ad.adset && ad.adset.start_time) || ad.created_time || "";
          if (startRaw) startDateMap[ad.id] = startRaw;
          if (ad.creative && ad.creative.effective_object_story_id) storyIdMap[ad.id] = ad.creative.effective_object_story_id;
        });
        adsUrl = json.paging && json.paging.next ? json.paging.next : null;
        page2++;
      }
    }

    // 前台發表時間:貼文本身原本在粉專上發佈的時間,跟「投放起始時間」是不同的東西
    // (例如拿一則很久以前的舊貼文來投放廣告,貼文發佈時間會比開始投放時間早很多)。
    // 用批次查詢一次把這段期間所有廣告用到的貼文發佈時間都抓回來,不是一支廣告分開查一次,
    // 避免多打幾十次 API 拖慢速度、更容易撞到頻率限制。沒有對應貼文的廣告(素材是直接建立、不是沿用既有貼文),
    // 這裡就查不到值,畫面上會另外分區顯示,不會假裝有一個時間硬塞進去。
    const uniqueStoryIds = [...new Set(Object.values(storyIdMap))];
    let postPublishMap = {}; // story_id -> created_time
    for (let i = 0; i < uniqueStoryIds.length; i += ID_CHUNK_SIZE) {
      const chunk = uniqueStoryIds.slice(i, i + ID_CHUNK_SIZE);
      try {
        const json = await fetchGraphApi(
          `https://graph.facebook.com/v19.0/?ids=${chunk.join(",")}&fields=created_time&access_token=${encToken}`,
          "讀取貼文發佈時間"
        );
        Object.entries(json || {}).forEach(([storyId, obj]) => {
          if (obj && obj.created_time) postPublishMap[storyId] = obj.created_time;
        });
      } catch { /* 查不到就算了,對應廣告會被歸類到「沒有對應貼文」那一區,不會擋住其他資料 */ }
    }
    const adPostPublishMap = {}; // ad.id -> 貼文發佈時間(查得到的話)
    Object.entries(storyIdMap).forEach(([adId, storyId]) => {
      if (postPublishMap[storyId]) adPostPublishMap[adId] = postPublishMap[storyId];
    });

    // 3) 先用「完整、未篩選」的資料算總計——這樣廣告費/轉單數/轉單金額才會跟 Meta 後台的帳號總覽數字完全一致。
    // 後台的總計是把該期間「所有」廣告都算進去,不會因為某支廣告花費很小就不計入;
    // 如果只加總「花費 ≥ 500」的廣告,總計就會比後台實際數字少,CPA/ROAS 也會跟著失真。
    let totalSpend = 0, totalConv = 0, totalRev = 0, totalImpressions = 0, totalClicks = 0, totalLinkClicks = 0, totalReach = 0;
    rows.forEach((row) => {
      totalSpend += parseFloat(row.spend) || 0;
      totalConv += pickPurchaseValue(row.actions);
      totalRev += pickPurchaseValue(row.action_values);
      totalImpressions += parseFloat(row.impressions) || 0;
      totalClicks += parseFloat(row.clicks) || 0;
      totalLinkClicks += parseFloat(row.inline_link_clicks) || 0;
      totalReach += parseFloat(row.reach) || 0;
    });

    // 「業配分析」要跟 Meta 後台用行銷活動名稱篩選的結果一致，所以必須從完整 rows 統計，
    // 不能沿用下方會套用 500 元明細門檻的 detailRows。campaign_name 直接由 Insights 一起取回，
    // 即使某支廣告花費不到 500、沒有另外抓 /ads 詳細資料，也不會漏掉它的業配花費。
    const sponsorAds = rows
      .filter((row) => {
        const adName = row.ad_name || "";
        const campaignName = row.campaign_name || campaignMap[row.ad_id] || "";
        return adName.includes("業配") || campaignName.includes("業配");
      })
      .map((row) => ({
        name: row.ad_name || "(未命名廣告)",
        adId: row.ad_id || "",
        campaign: row.campaign_name || campaignMap[row.ad_id] || "(未分類活動)",
        postId: storyIdMap[row.ad_id] || "",
        spend: parseFloat(row.spend) || 0,
        conversions: pickPurchaseValue(row.actions),
        revenue: pickPurchaseValue(row.action_values),
      }));

    // 花費門檻只用來決定「廣告明細列表」要不要顯示這支廣告(避免清單被大量花費很少的測試廣告洗版),
    // 不會再影響上面的總計數字或上面的業配統計。
    const detailRows = rows.filter((row) => {
      const spend = parseFloat(row.spend) || 0;
      if (spend >= MIN_FETCH_SPEND) return true;
      if (relaxThreshold && statusMap[row.ad_id] === "ACTIVE") return true;
      return false;
    });

    // 4) aggregate, merging ads that share the same UTM tag —— 但「投放中」跟「已停止」的廣告絕對不會合併在一起,
    // 即使 UTM 追蹤代碼相同,只要目前的投放狀態不一樣,就會拆成不同的兩列,避免誤把已經停掉的舊數字跟現在還在跑的混在一起看。
    const grouped = {};
    detailRows.forEach((row) => {
      const spend = parseFloat(row.spend) || 0;
      const conversions = pickPurchaseValue(row.actions);
      const revenue = pickPurchaseValue(row.action_values);
      const impressions = parseFloat(row.impressions) || 0;
      const clicks = parseFloat(row.clicks) || 0;
      const linkClicks = parseFloat(row.inline_link_clicks) || 0;
      const reach = parseFloat(row.reach) || 0;

      const adName = row.ad_name || "(未命名廣告)";
      const utm = utmMap[row.ad_id] || "";
      const isActive = statusMap[row.ad_id] === "ACTIVE";
      // 跟shopline-proxy後端同一個bug、同一套修法:UTM相同但行銷活動不同的廣告,不該被合併成一筆,
      // 分組key加上行銷活動名稱,兩個都相同才合併。
      const campaignName = campaignMap[row.ad_id] || "(未分類活動)";
      const adSetName = adSetMap[row.ad_id] || "(未分類廣告組合)";
      const groupKey = (utm ? "utm:" + utm : "ad:" + row.ad_id) + "::campaign:" + campaignName + "::adset:" + adSetName + "::" + (isActive ? "on" : "off");
      if (!grouped[groupKey]) {
        grouped[groupKey] = { utm, names: new Set(), image: "", postId: "", spend: 0, conversions: 0, revenue: 0, impressions: 0, clicks: 0, linkClicks: 0, reach: 0, active: isActive, campaigns: new Set(), adSets: new Set(), adSetIds: new Set(), adIds: new Set(), startDate: null, postPublishDate: null };
      }
      const g = grouped[groupKey];
      g.names.add(adName);
      g.spend += spend; g.conversions += conversions; g.revenue += revenue; g.impressions += impressions; g.clicks += clicks; g.linkClicks += linkClicks; g.reach += reach;
      if (!g.image && thumbMap[row.ad_id]) g.image = thumbMap[row.ad_id];
      if (!g.postId && storyIdMap[row.ad_id]) g.postId = storyIdMap[row.ad_id];
      if (campaignMap[row.ad_id]) g.campaigns.add(campaignMap[row.ad_id]);
      if (adSetMap[row.ad_id]) g.adSets.add(adSetMap[row.ad_id]);
      if (adSetIdMap[row.ad_id]) g.adSetIds.add(adSetIdMap[row.ad_id]);
      if (row.ad_id) g.adIds.add(row.ad_id);
      // 如果這個群組是合併了好幾支廣告(同一個 UTM 追蹤代碼),投放起始時間取「最早」的那個,
      // 代表這個素材/追蹤代碼最初是什麼時候開始投放的。
      const rowStart = startDateMap[row.ad_id];
      if (rowStart && (!g.startDate || rowStart < g.startDate)) g.startDate = rowStart;
      // 前台發表時間也是取最早的一筆;只要合併起來的廣告裡「有任何一支」查得到對應貼文,這個群組就算查得到。
      const rowPostPublish = adPostPublishMap[row.ad_id];
      if (rowPostPublish && (!g.postPublishDate || rowPostPublish < g.postPublishDate)) g.postPublishDate = rowPostPublish;
    });

    // 額外保留「未做 UTM 合併」的逐廣告明細，供品牌獨立 Dashboard 共用。
    // 主報表既有畫面仍然使用下面的 ads，不會因為這份 rawAds 改變任何既有彙總或顯示。
    const rawAds = detailRows.map((row) => ({
      name: row.ad_name || "(未命名廣告)",
      adId: row.ad_id || "",
      campaign: campaignMap[row.ad_id] || "(未分類活動)",
      adSet: adSetMap[row.ad_id] || "(未分類廣告組合)",
      adSetId: adSetIdMap[row.ad_id] || "",
      objective: objectiveMap[row.ad_id] || "",
      campaignEffectiveStatus: campaignStatusMap[row.ad_id] || "UNKNOWN",
      campaignActive: campaignStatusMap[row.ad_id] === "ACTIVE",
      optimizationGoal: optimizationGoalMap[row.ad_id] || "",
      creativeId: creativeIdMap[row.ad_id] || "",
      postId: storyIdMap[row.ad_id] || "",
      utm: utmMap[row.ad_id] || "",
      image: thumbMap[row.ad_id] || "",
      active: statusMap[row.ad_id] === "ACTIVE",
      startDate: startDateMap[row.ad_id] || null,
      postPublishDate: adPostPublishMap[row.ad_id] || null,
      spend: parseFloat(row.spend) || 0,
      conversions: pickPurchaseValue(row.actions),
      revenue: pickPurchaseValue(row.action_values),
      impressions: parseFloat(row.impressions) || 0,
      clicks: parseFloat(row.clicks) || 0,
      linkClicks: parseFloat(row.inline_link_clicks) || 0,
      landingPageViews: pickActionValue(row.actions, ["landing_page_view", "omni_landing_page_view"]),
      reach: parseFloat(row.reach) || 0,
    }));

    const ads = Object.values(grouped)
      .map((g) => {
        const nameList = [...g.names];
        const adCount = g.adIds.size || nameList.length || 1;
        const name =
          nameList.length === 0
            ? g.utm || "未命名廣告"
            : nameList.length === 1
            ? nameList[0]
            : `${nameList[0]} 等 ${nameList.length} 支廣告`;
        const campaignList = [...g.campaigns];
        // 跟 shopline-proxy 後端同一個bug、同一個修法:同一個UTM群組如果合併了很多支分屬不同
        // Meta行銷活動的廣告,原本用join(" / ")全部接在一起會變成一長串看不懂的文字,
        // 改成跟上面 name 欄位同一套「只顯示第一個+等N個活動」的邏輯。
        const campaign =
          campaignList.length === 0
            ? "(未分類活動)"
            : campaignList.length === 1
            ? campaignList[0]
            : `${campaignList[0]} 等 ${campaignList.length} 個活動`;
        const adSetList = [...g.adSets];
        const adSet =
          adSetList.length === 0
            ? "(未分類廣告組合)"
            : adSetList.length === 1
            ? adSetList[0]
            : `${adSetList[0]} 等 ${adSetList.length} 個廣告組合`;
        return {
          name, utm: g.utm, image: g.image, postId: g.postId, spend: g.spend, conversions: g.conversions, revenue: g.revenue,
          impressions: g.impressions, clicks: g.clicks, linkClicks: g.linkClicks, reach: g.reach,
          adCount, rawNames: nameList, active: g.active, campaign, adSet, adSetIds: [...g.adSetIds], adIds: [...g.adIds], startDate: g.startDate,
          postPublishDate: g.postPublishDate,
        };
      })
      .sort((a, b) => b.spend - a.spend);

    return {
      spend: totalSpend, conversions: totalConv, revenue: totalRev,
      impressions: totalImpressions, clicks: totalClicks, linkClicks: totalLinkClicks, reach: totalReach,
      campaigns: 0, currency, accountId, ads, rawAds, sponsorAds, syncedAt: new Date().toISOString(),
      requestedUntil, effectiveUntil: until
    };
  }

  // ---------- 投放中廣告成效分類(成效好 / 成效正常 / 成效不好 / 學習中) ----------
  const LEARNING_MIN_CONVERSIONS = 10; // 轉單數不足,還看不出真實成效,先歸類為「學習中」
  const PERF_LABELS = { good: "成效好", normal: "成效正常", poor: "成效不好", learning: "學習中" };
  const PERF_COLORS = { good: "var(--green)", normal: "var(--blue)", poor: "var(--red)", learning: "var(--amber)" };
  const PERF_ORDER = ["good", "normal", "poor", "learning"];

  function classifyAdPerformance(ad) {
    if (ad.conversions < LEARNING_MIN_CONVERSIONS) return "learning";
    const roas = ad.spend > 0 && ad.revenue > 0 ? ad.revenue / ad.spend : null;
    if (roas === null) return "poor";
    if (roas >= 3) return "good";
    if (roas >= 1.5) return "normal";
    return "poor";
  }

  function groupAdsByPerformance(ads) {
    // 這裡故意不只看「目前投放中」的廣告——花費超過門檻、已經停止但表現不好的廣告,
    // 也應該讓你看得到(不然「成效不好」分類永遠是空的,容易誤以為沒有表現差的廣告)。
    const qualifyingAds = (ads || []).filter((a) => a.spend >= MIN_AD_SPEND);
    const buckets = { good: [], normal: [], poor: [], learning: [] };
    qualifyingAds.forEach((ad) => {
      buckets[classifyAdPerformance(ad)].push(ad);
    });
    PERF_ORDER.forEach((k) => buckets[k].sort((a, b) => b.spend - a.spend));
    return { qualifyingAds, buckets };
  }

  // ---------- 行銷活動(campaign)整體成效分析 ----------
  function computeCampaignStats(ads) {
    const activeAds = (ads || []).filter((a) => a.active);
    const campaignMap = {};
    activeAds.forEach((ad) => {
      const key = ad.campaign || "(未分類活動)";
      if (!campaignMap[key]) campaignMap[key] = { name: key, spend: 0, conversions: 0, revenue: 0, adCount: 0 };
      const c = campaignMap[key];
      c.spend += ad.spend;
      c.conversions += ad.conversions;
      c.revenue += ad.revenue;
      c.adCount += 1;
    });
    return Object.values(campaignMap)
      .map((c) => ({
        ...c,
        cpa: c.conversions > 0 ? c.spend / c.conversions : null,
        roas: c.spend > 0 && c.revenue > 0 ? c.revenue / c.spend : null,
      }))
      .sort((a, b) => b.spend - a.spend);
  }

  function computeCampaignInsights(campaignStats, currencyCode) {
    if (!campaignStats.length) return ["目前沒有偵測到任何投放中的廣告,無法進行行銷活動分析。"];
    const insights = [];
    const totalSpend = campaignStats.reduce((s, c) => s + c.spend, 0);
    const totalConv = campaignStats.reduce((s, c) => s + c.conversions, 0);
    const totalRev = campaignStats.reduce((s, c) => s + c.revenue, 0);
    const overallRoas = totalSpend > 0 && totalRev > 0 ? totalRev / totalSpend : null;
    insights.push(
      `目前投放中的活動共 ${campaignStats.length} 個,總花費 ${fmtMoney(totalSpend, currencyCode)},轉單 ${fmtInt(totalConv)} 筆${overallRoas !== null ? `,整體 ROAS ${overallRoas.toFixed(2)}x` : ""}。`
    );
    const withRoas = campaignStats.filter((c) => c.roas !== null);
    if (withRoas.length) {
      const best = withRoas.slice().sort((a, b) => b.roas - a.roas)[0];
      insights.push(`表現最好的活動是「${best.name}」,ROAS 有 ${best.roas.toFixed(2)}x。`);
      const worst = withRoas.slice().sort((a, b) => a.roas - b.roas)[0];
      if (worst.name !== best.name && worst.roas < 1.5) {
        insights.push(`表現較弱的活動是「${worst.name}」,ROAS 只有 ${worst.roas.toFixed(2)}x,建議檢視受眾或素材。`);
      }
    } else {
      insights.push("目前投放中的活動都還沒有足夠的轉換金額資料,先持續觀察。");
    }
    const noDataCampaigns = campaignStats.filter((c) => c.conversions < LEARNING_MIN_CONVERSIONS);
    if (noDataCampaigns.length) {
      insights.push(`有 ${noDataCampaigns.length} 個活動轉單數還不到 ${LEARNING_MIN_CONVERSIONS} 筆,屬於學習中階段,建議再觀察一段時間再下結論。`);
    }
    return insights;
  }

  // 依「行銷活動名稱」最前面的括號(例如「【RS】」「【AP】」)自動歸類,統計各產品的營業額/廣告費佔比與利潤。
  // 產品代號完全依實際行銷活動名稱動態產生——新增產品時只要照同一套命名規則建立行銷活動,
  // 不需要在系統裡手動登記新產品,代號就會自動出現在分析裡。
  // 「一頁式正確業績」比對區塊:後台每日收益表匯入後的實際營收/廣告費,vs. Meta 回報的轉單金額,依產品代號逐一比對落差。
  // 月報告 / 後續規劃區塊——每個品牌、每個月份各自獨立一份,存在KV,使用者自己編輯,
  // 不是系統自動產生的。三個子區塊對應 Hanna 提供的範例格式:後續操作方向(編號+標題+說明)、
  // 專案進度(負責人/預定完成日/進度/狀態燈號/說明)、素材調整方向(狀態燈號+標題+內容)。
  // 900ms 防抖自動儲存,不用按「儲存」按鈕,跟這裡其他設定(ROAS目標等)是不同的儲存模式——
  // 那些是「跳出視窗一次填完」,這裡是「持續編輯的長文字內容」,debounce autosave 比較適合。
  const ReportPlanningSection = React.forwardRef(function ReportPlanningSection(
    { storageKey, ads, currencyCode, roasTarget, periodLabel, brandName, minSpend },
    planRef
  ) {
    const [data, setData] = useState(null); // null = 載入中
    const [saveStatus, setSaveStatus] = useState("");
    const [aiLoading, setAiLoading] = useState(false);
    const [aiError, setAiError] = useState("");
    const [loadError, setLoadError] = useState("");
    const [lightboxImage, setLightboxImage] = useState(null); // 點縮圖放大看原圖用
    const saveTimerRef = useRef(null);
    // 待存檔的最新內容——跟 saveTimerRef 分開追蹤,是因為「立即存檔」(flush)要能在計時器
    // 還沒觸發前,直接把這裡記著的最新資料送出去,不用等900ms。之前的版本只靠setTimeout,
    // 使用者打完字後如果馬上切換品牌/月份/把App切到背景,計時器根本還沒觸發存檔動作就消失了,
    // 資料就真的遺失——這是這次修正的根本原因。
    const pendingSaveRef = useRef(null);

    function flushPendingSave() {
      if (saveTimerRef.current) {
        clearTimeout(saveTimerRef.current);
        saveTimerRef.current = null;
      }
      if (pendingSaveRef.current) {
        const { key, value } = pendingSaveRef.current;
        pendingSaveRef.current = null;
        // 頁面即將關閉/離開時的最後嘗試,這裡沒辦法再跳UI提示了(頁面都要關了),
        // 只能盡量送出去,送不出去也沒有更好的辦法,所以這裡維持吞掉錯誤。
        storageSetStrict(key, value).catch(() => {});
      }
    }

    useEffect(() => {
      let cancelled = false;
      setData(null);
      setLoadError("");
      (async () => {
        try {
          const res = await storageGetStrict(storageKey);
          if (cancelled) return;
          if (res && res.value) {
            try {
              setData(JSON.parse(res.value));
              return;
            } catch {}
          }
          setData({ actionItems: [], projects: [], materialIssues: [] });
        } catch (e) {
          if (cancelled) return;
          // 連不上雲端才會走到這裡(key不存在是正常回傳null,不會丟例外)——這時候不能顯示空白表單,
          // 因為畫面看起來會像「這期沒資料」,但實際上是「不知道有沒有資料,因為根本連不上去查」,
          // 兩者天差地遠,不能混為一談。
          setLoadError(e.message || "連不上雲端資料庫,無法確認這期是否已有內容。");
        }
      })();
      return () => { cancelled = true; };
    }, [storageKey]);

    // 三層保護,確保「還沒等到900ms就離開」的情境一定會把最新內容存下去:
    // ①頁面被切到背景/分頁不可見(手機切App、鎖螢幕最常見)②使用者關閉分頁/離開網站
    // ③這個元件本身被卸載(例如切換品牌或月份,key改變導致React整個重新建立元件實例)。
    useEffect(() => {
      function handleVisibilityChange() {
        if (document.visibilityState === "hidden") flushPendingSave();
      }
      document.addEventListener("visibilitychange", handleVisibilityChange);
      window.addEventListener("beforeunload", flushPendingSave);
      window.addEventListener("pagehide", flushPendingSave);
      return () => {
        document.removeEventListener("visibilitychange", handleVisibilityChange);
        window.removeEventListener("beforeunload", flushPendingSave);
        window.removeEventListener("pagehide", flushPendingSave);
        flushPendingSave();
      };
    }, []);

    async function performSave(next) {
      const value = JSON.stringify(next);
      pendingSaveRef.current = { key: storageKey, value };
      try {
        await storageSetStrict(storageKey, value);
        pendingSaveRef.current = null;
        setSaveStatus("已儲存 ✓");
        setTimeout(() => setSaveStatus(""), 2000);
      } catch (e) {
        // 特意不清空 pendingSaveRef——存檔失敗時保留這筆待存資料,之後flushPendingSave
        // (切換分頁/關閉頁面時)還有機會再試一次,不是失敗一次就徹底放棄這筆內容。
        pendingSaveRef.current = { key: storageKey, value };
        setSaveStatus(`⚠ 存檔失敗:${e.message || "未知錯誤"}(內容還留在畫面上,但還沒真的存進雲端,請勿關閉頁面,再按一次「立即儲存」重試)`);
      }
    }

    function scheduleSave(next) {
      setData(next);
      setSaveStatus("編輯中…");
      if (saveTimerRef.current) clearTimeout(saveTimerRef.current);
      saveTimerRef.current = setTimeout(() => {
        saveTimerRef.current = null;
        performSave(next);
      }, 900);
    }

    // 明確的「立即儲存」按鈕——跳過900ms的debounce等待,直接存,而且有清楚的成功/失敗畫面回饋。
    // 自動存檔已經有debounce+分頁切換/關閉時的保護,這顆按鈕是給使用者「我現在就是想親眼確認存到了」
    // 的明確操作,兩者不衝突,按下這顆的時候就算debounce計時器還在跑,也會被取消、直接用這次的結果。
    function manualSave() {
      if (saveTimerRef.current) {
        clearTimeout(saveTimerRef.current);
        saveTimerRef.current = null;
      }
      setSaveStatus("儲存中…");
      performSave(data);
    }

    // AI分析:沿用「投放成效」同一套 buildProductBreakdown 邏輯算出逐代號數據,
    // 送去跟「投放成效」共用同一支 OpenAI 金鑰的另一支後端(material-issues.js,職責不同、金鑰共用),
    // 請AI挑出「值得下週特別調整」的系列,寫成標題+數據佐證+建議方向。是「新增建議草稿」進現有清單,
    // 不會清掉使用者已經手動寫好/編輯過的項目,AI生成的項目使用者一樣可以編輯或刪除。
    // 「後續操作方向」「素材調整方向」兩個子區塊的AI按鈕都呼叫這同一個函式——同一份期間數據,
    // 沒必要因為使用者按了兩個不同按鈕就打兩次OpenAI,拿到回應後兩個子區塊會一起更新。
    function runAiMaterialAnalysis() {
      if (!data) return;
      setAiLoading(true);
      setAiError("");
      try {
        const { rows, totalRevenue, totalSpend } = buildProductBreakdown(ads || [], minSpend || 500);
        if (!rows.length) throw new Error("目前沒有足夠的資料可以判斷。");

        const generated = generateRulePlanning(rows, totalRevenue, totalSpend, roasTarget || 3, currencyCode);
        const now = Date.now();
        const newActionItems = generated.actionItems.map((it, i) => ({
          id: now + i,
          title: it.title || "",
          description: it.description || "",
          generatedByRules: true,
        }));
        const newMaterialIssues = generated.materialIssues.map((it, i) => ({
          id: now + 100 + i,
          title: it.title || "",
          status: it.status === "red" || it.status === "yellow" || it.status === "green" ? it.status : "yellow",
          category: it.category || "",
          content: it.content || "",
          generatedByRules: true,
        }));

        scheduleSave({
          ...data,
          actionItems: [
            ...data.actionItems.filter((it) => !it.generatedByRules),
            ...newActionItems,
          ],
          materialIssues: [
            ...data.materialIssues.filter((it) => !it.generatedByRules),
            ...newMaterialIssues,
          ],
        });
      } catch (e) {
        setAiError(e.message || String(e));
      } finally {
        setAiLoading(false);
      }
    }

    // 沒有依賴陣列,每次render都重新指定,理由跟AdPerformanceReport那邊一樣——確保外部觸發時
    // 拿到的一定是包著最新ads/props的版本。
    useImperativeHandle(planRef, () => ({ triggerAi: runAiMaterialAnalysis }));

    if (loadError) {
      return (
        <div className="mal-plan-load-error">
          <p>⚠ 月報告讀取失敗:{loadError}</p>
          <p style={{ fontSize: 12, marginTop: 4 }}>這不代表資料不存在,是暫時連不上雲端資料庫確認——請勿在這個狀態下新增內容,以免蓋掉原本已經存在雲端的資料。稍後重新整理再試一次。</p>
        </div>
      );
    }
    if (!data) return <p style={{ color: "var(--ink-soft)", fontSize: 13, marginTop: 32 }}>載入報告中…</p>;

    const STATUS_OPTIONS = [
      { value: "green", label: "🟢 照計畫" },
      { value: "yellow", label: "🟡 有風險" },
      { value: "red", label: "🔴 已落後/卡住" },
    ];

    function addActionItem() {
      scheduleSave({ ...data, actionItems: [...data.actionItems, { id: Date.now(), title: "", description: "" }] });
    }
    function updateActionItem(id, field, value) {
      scheduleSave({ ...data, actionItems: data.actionItems.map((it) => (it.id === id ? { ...it, [field]: value } : it)) });
    }
    function removeActionItem(id) {
      scheduleSave({ ...data, actionItems: data.actionItems.filter((it) => it.id !== id) });
    }
    function addProject() {
      scheduleSave({ ...data, projects: [...data.projects, { id: Date.now(), name: "", owner: "", dueDate: "", progress: "", status: "green", description: "", link: "", image: "" }] });
    }
    function updateProject(id, field, value) {
      scheduleSave({ ...data, projects: data.projects.map((it) => (it.id === id ? { ...it, [field]: value } : it)) });
    }
    function removeProject(id) {
      scheduleSave({ ...data, projects: data.projects.filter((it) => it.id !== id) });
    }
    // 圖片存進雲端資料庫時,是跟整份「月報告」文字內容存在同一個key裡(不是另外開檔案儲存空間),
    // 原圖(尤其手機拍的照片)動輒4-5MB,同時放幾張很容易撐爆單一key的儲存上限、也會讓每次
    // 存檔/讀取變慢。選好圖片後,先用畫布把長邊壓縮到最多960px、轉成JPEG(品質0.75)再存,
    // 壓縮後通常只有幾百KB,對「輔助說明用的示意圖」這種用途來說,畫質已經很夠用。
    function handleProjectImageUpload(id, file) {
      if (!file || !file.type.startsWith("image/")) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const MAX_DIM = 960;
          let { width, height } = img;
          if (width > MAX_DIM || height > MAX_DIM) {
            const ratio = Math.min(MAX_DIM / width, MAX_DIM / height);
            width = Math.round(width * ratio);
            height = Math.round(height * ratio);
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          const compressed = canvas.toDataURL("image/jpeg", 0.75);
          updateProject(id, "image", compressed);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }
    function addMaterialIssue() {

                </select>
                <span className="mal-plan-select-export-text">{(STATUS_OPTIONS.find((s) => s.value === m.status) || {}).label}</span>
                <input className="mal-plan-input mal-plan-input-category" placeholder="分類" value={m.category || ""} onChange={(e) => updateMaterialIssue(m.id, "category", e.target.value)} />

              <textarea className="mal-plan-textarea" placeholder="數據、問題點、建議方向…(可以換行分段)" rows={4} value={m.content} onChange={(e) => updateMaterialIssue(m.id, "content", e.target.value)} />
