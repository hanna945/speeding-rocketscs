name: Validate Brand Report Structure

on:
  push:
    branches:
      - work/brand-report-full-mavis-structure-20261029
    paths:
      - "index.html"
      - ".github/workflows/validate-brand-report-structure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save @babel/parser@7
      - name: Parse JSX and validate report structure
        run: |
          node <<'NODE'
          const fs = require('fs');
          const parser = require('@babel/parser');
          const html = fs.readFileSync('index.html', 'utf8');
          const m = html.match(/<script type="text\/babel">([\s\S]*?)<\/script>/);
          if (!m) throw new Error('text/babel script not found');
          parser.parse(m[1], { sourceType: 'script', plugins: ['jsx'] });

          const forbidden = [
            'WEEK_STORAGE_PREFIX','WEEKLY_PLAN_PREFIX','ADPERF_AI_WEEK_PREFIX','SHOPLINE_WEEK_PREFIX',
            'loadAllWeeks(','fetchLastWeekData(','fetchRecentWeeksFromApi(',
            'weeklyAdReportRef','weeklyPlanRef','viewMode === "week"','setViewMode("week")',
            'metaads-week:','weekly-plan:','adperf-ai-week:','shopline-week:',
            '每週報表','上週報表','週報告','廣告怎麼調','viewMode === "adjust"'
          ];
          for (const x of forbidden) if (html.includes(x)) throw new Error('Forbidden ghost code: ' + x);

          const identifiers = [...new Set(html.match(/[A-Za-z_][A-Za-z0-9_]*[Ww]eek[A-Za-z0-9_]*/g) || [])];
          if (identifiers.length) throw new Error('Week identifiers remain: ' + identifiers.join(', '));

          const required = [
            'viewMode === "month"','viewMode === "daily"','viewMode === "sponsor"','viewMode === "ads"',
            '📊 廣告分析','CPC 目標','meta-api-cpc-thresholds',
            'function OverallOpsSummary(','function LedgerVsMetaComparison(','function mergeChannelBreakdown(',
            'monthly-plan:','ReportPlanningSection','syncFromGoogleSheet',
            'HJ_ONEPAGE_ACCOUNT_ID','shoplineMonthKey','showPrintSelector','PDF_SECTION_OPTIONS',
            'EvidenceExecutiveSummary','MetaAdsOpenSourceSuite','AdSetAnalysis','PerformanceBreakdown'
          ];
          for (const x of required) if (!html.includes(x)) throw new Error('Required feature missing: ' + x);

          if (!/function CollapsibleSectionTitle[\s\S]{0,350}useState\(false\)/.test(html))
            throw new Error('CollapsibleSectionTitle is not default expanded');
          if (!/function MetaAdsOpenSourceSuite[\s\S]{0,550}useState\(false\)/.test(html))
            throw new Error('MetaAdsOpenSourceSuite is not default expanded');
          if (!html.includes('useState({ good: false, normal: false, poor: false, learning: false })'))
            throw new Error('Performance buckets are not default expanded');

          console.log('VALIDATION_OK');
          NODE
