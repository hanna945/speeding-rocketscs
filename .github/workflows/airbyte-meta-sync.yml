name: Airbyte Meta Central Sync

on:
  push:
    branches:
      - main
    paths:
      - "tools/airbyte_meta_sync.py"
      - "functions/api/airbyte/**"
      - "functions/_shared/auth.js"
      - ".github/workflows/airbyte-meta-sync.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      brand_id:
        description: "Optional Meta ad account ID. Leave blank to sync every brand in the report roster."
        required: false
        default: ""
      backfill_days:
        description: "Optional current-month backfill window. 0 uses incremental cache/lookback."
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: airbyte-meta-central-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate central sync source
        run: |
          python -m py_compile tools/airbyte_meta_sync.py
          node --check functions/api/airbyte/brands.js

      - name: Check whether central sync secrets are configured
        id: configured
        shell: bash
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          REPORT_TEAM_KEY: ${{ secrets.REPORT_TEAM_KEY }}
        run: |
          if [ -n "$META_SYSTEM_USER_TOKEN" ] && [ -n "$REPORT_TEAM_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Airbyte sync is installed but dormant. Add META_SYSTEM_USER_TOKEN and REPORT_TEAM_KEY repository secrets to activate it."
          fi

      - name: Install Airbyte Agent SDK
        if: steps.configured.outputs.ready == 'true'
        run: python -m pip install --upgrade airbyte-agent-sdk

      - name: Sync Meta through Airbyte into existing report KV
        if: steps.configured.outputs.ready == 'true'
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          REPORT_TEAM_KEY: ${{ secrets.REPORT_TEAM_KEY }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL || 'https://speedingscs.pages.dev' }}
        run: |
          python tools/airbyte_meta_sync.py             --lookback-days 8             --metadata-max-age-hours 24             --brand-id "${{ github.event.inputs.brand_id || '' }}"             --backfill-days "${{ github.event.inputs.backfill_days || '0' }}"
