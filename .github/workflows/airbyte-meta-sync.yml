name: Airbyte Meta Central Sync
run-name: Airbyte Meta Central Sync · ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.request_id || 'scheduled' }}

on:
  push:
    branches:
      - main
    paths:
      - "tools/airbyte_meta_sync.py"
      - "functions/api/airbyte/**"
      - "functions/_shared/auth.js"
      - "functions/_shared/githubOidc.js"
      - ".github/workflows/airbyte-meta-sync.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      brand_id:
        description: "Optional Meta ad account ID. Leave blank to sync every brand in the report roster."
        required: false
        default: ""
      backfill_days:
        description: "Optional current-month Airbyte backfill window. 0 keeps today-only mode."
        required: false
        default: "0"
      engine:
        description: "Sync engine. Keep airbyte normally; use sdk only for emergency manual fallback."
        required: false
        default: "airbyte"
        type: choice
        options:
          - airbyte
          - sdk
      request_id:
        description: "Optional request ID used by the report UI to track this manual sync."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: airbyte-meta-central-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate central sync source
        run: |
          python -m py_compile tools/airbyte_meta_sync.py
          node --check functions/api/airbyte/brands.js
          node --check functions/api/airbyte/sync.js
          node --check functions/_shared/githubOidc.js
          node --check 'functions/api/airbyte/kv/item/[key].js'

      - name: Check whether Meta machine token is configured
        id: configured
        shell: bash
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
        run: |
          if [ -n "$META_SYSTEM_USER_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Airbyte sync is installed but dormant. Add META_SYSTEM_USER_TOKEN to activate it."
          fi

      - name: Install Airbyte Facebook Marketing SDK
        if: steps.configured.outputs.ready == 'true'
        run: python -m pip install --upgrade airbyte-agent-sdk

      - name: Install Meta Business SDK only for emergency fallback
        if: steps.configured.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.engine == 'sdk'
        run: python -m pip install --upgrade facebook-business

      - name: Sync Meta through Airbyte into existing report KV
        if: steps.configured.outputs.ready == 'true'
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL || 'https://speedingscs.pages.dev' }}
        run: |
          python tools/airbyte_meta_sync.py \
            --lookback-days 1 \
            --metadata-max-age-hours 24 \
            --brand-id "${{ github.event.inputs.brand_id || '' }}" \
            --backfill-days "${{ github.event.inputs.backfill_days || '0' }}" \
            --reconcile-days 2 \
            --engine "${{ github.event.inputs.engine || 'airbyte' }}"
