name: Cloudflare Account Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-account-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit Cloudflare account resources
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_API_TOKEN:-}"
          test -n "${CF_ACCOUNT_ID:-}"
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"

          cf_get() {
            local path="$1"
            curl -sS "$api$path" -H "Authorization: Bearer $CF_API_TOKEN"
          }

          show_error_or_pass() {
            jq -e '.success == true' >/dev/null 2>&1 || {
              jq -c '{success,errors,messages}' 2>/dev/null || cat
              return 1
            }
          }

          echo "=== PAGES PROJECTS ==="
          pages_json="$(cf_get "/pages/projects")"
          echo "$pages_json" | show_error_or_pass && echo "$pages_json" | jq -r '
            .result[]? |
            [
              .name,
              (.subdomain // ""),
              (.production_branch // ""),
              (.source.type // "manual"),
              (.source.config.repo_name // ""),
              (.created_on // "")
            ] | @tsv
          ' | sort

          echo
          echo "=== PAGE PROJECT DETAILS ==="
          for project in hj-brand-report hj-shopline-report rocket speeding-rocket speedingrocket speedingscs; do
            echo "--- $project ---"
            project_json="$(cf_get "/pages/projects/$project")"
            if echo "$project_json" | show_error_or_pass; then
              echo "$project_json" | jq -c '{
                name:.result.name,
                subdomain:.result.subdomain,
                domains:(.result.domains // []),
                production_branch:.result.production_branch,
                source:(.result.source // null),
                latest_deployment:(.result.latest_deployment | if . == null then null else {id,environment,created_on,url,aliases} end),
                production_bindings:{
                  kv_namespaces:(.result.deployment_configs.production.kv_namespaces // {}),
                  d1_databases:(.result.deployment_configs.production.d1_databases // {}),
                  services:(.result.deployment_configs.production.services // {}),
                  compatibility_date:(.result.deployment_configs.production.compatibility_date // null)
                }
              }'
            fi
          done

          echo
          echo "=== WORKER SCRIPTS ==="
          workers_json="$(cf_get "/workers/scripts")"
          echo "$workers_json" | show_error_or_pass &&
            echo "$workers_json" | jq -r '.result[]?.id // .result[]?.name // empty' | sort

          echo
          echo "=== WORKER DOMAINS ==="
          domains_json="$(cf_get "/workers/domains")"
          echo "$domains_json" | show_error_or_pass && echo "$domains_json" | jq -r '
            .result[]? |
            [.service, .environment, .hostname, (.enabled|tostring), (.previews_enabled|tostring)] | @tsv
          ' | sort

          echo
          echo "=== WORKER DETAILS ==="
          while IFS= read -r script; do
            [ -n "$script" ] || continue
            echo "--- $script ---"
            echo "subdomain:"
            cf_get "/workers/scripts/$script/subdomain" 2>/dev/null |
              jq -c '{enabled:(.result.enabled // false),previews_enabled:(.result.previews_enabled // false)}' ||
              echo '{"unavailable":true}'
            echo "schedules:"
            cf_get "/workers/scripts/$script/schedules" 2>/dev/null |
              jq -c '.result.schedules // .result // []' ||
              echo '[]'
            echo "bindings:"
            cf_get "/workers/scripts/$script/settings" 2>/dev/null |
              jq -c '[.result.bindings[]? | {name,type,namespace_id,database_id,service,environment}]' ||
              echo '[]'
          done < <(echo "$workers_json" | jq -r '.result[]?.id // .result[]?.name // empty' | sort)

          echo
          echo "=== KV NAMESPACES ==="
          kv_json="$(cf_get "/storage/kv/namespaces?per_page=100")"
          echo "$kv_json" | show_error_or_pass && echo "$kv_json" | jq -r '
            .result[]? | [.id, .title] | @tsv
          ' | sort -k2

          echo
          echo "=== D1 DATABASES ==="
          d1_json="$(cf_get "/d1/database?per_page=100")"
          echo "$d1_json" | show_error_or_pass && echo "$d1_json" | jq -r '
            .result[]? | [.uuid, .name, (.created_at // ""), (.version // "")] | @tsv
          ' | sort -k2

          echo
          echo "AUDIT_COMPLETE"
