name: Airbyte Manual Sync Poll
# queue-kick: thumbnail-repair

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/airbyte-manual-sync-poll.yml"
      - ".github/workflows/airbyte-meta-sync.yml"
      - "functions/api/airbyte/sync.js"
      - "tools/airbyte_meta_sync.py"
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: write

concurrency:
  group: airbyte-manual-sync-poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check pending manual sync request
        id: pending
        uses: actions/github-script@v7
        env:
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL || 'https://speedingscs.pages.dev' }}
        with:
          script: |
            const token = await core.getIDToken('speedingscs-airbyte');
            const base = process.env.REPORT_BASE_URL.replace(/\/$/, '');
            const response = await fetch(base + '/api/airbyte/sync?machine=pending', {
              headers: {
                Authorization: 'Bearer ' + token,
                Accept: 'application/json',
              },
            });
            const body = await response.json();
            if (!response.ok || !body.ok) {
              core.setFailed('Unable to read pending sync request: ' + JSON.stringify(body));
              return;
            }
            if (!body.pending) {
              core.info('No pending manual Airbyte sync request.');
              core.setOutput('pending', 'false');
              return;
            }
            core.setOutput('pending', 'true');
            core.setOutput('request_id', body.requestId);
            core.setOutput('mode', body.mode || 'full');
            core.info('Pending request: ' + body.requestId + ' mode=' + (body.mode || 'full'));

      - name: Claim request and dispatch central sync
        if: steps.pending.outputs.pending == 'true'
        uses: actions/github-script@v7
        env:
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL || 'https://speedingscs.pages.dev' }}
          REQUEST_ID: ${{ steps.pending.outputs.request_id }}
          REQUEST_MODE: ${{ steps.pending.outputs.mode }}
        with:
          github-token: ${{ github.token }}
          script: |
            const requestId = process.env.REQUEST_ID;
            const mode = process.env.REQUEST_MODE === 'thumbnails' ? 'thumbnails' : 'full';
            const base = process.env.REPORT_BASE_URL.replace(/\/$/, '');
            const oidc = await core.getIDToken('speedingscs-airbyte');

            if (mode === 'full') {
              // Full Meta sync shares one central lane. Thumbnail repair is deliberately
              // independent and never waits for the Airbyte lane.
              const running = await github.request('GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'airbyte-meta-sync.yml',
                status: 'in_progress',
                per_page: 1,
              });
              const queued = await github.request('GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'airbyte-meta-sync.yml',
                status: 'queued',
                per_page: 1,
              });
              if ((running.data.workflow_runs || []).length || (queued.data.workflow_runs || []).length) {
                core.info('Central Airbyte sync is busy; keep full sync request queued for the next poll.');
                return;
              }
            }

            const claim = await fetch(base + '/api/airbyte/sync', {
              method: 'POST',
              headers: {
                Authorization: 'Bearer ' + oidc,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                action: 'claim',
                requestId,
                htmlUrl: 'https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions',
              }),
            });
            const claimBody = await claim.json();
            if (!claim.ok || !claimBody.ok) {
              core.setFailed('Unable to claim request: ' + JSON.stringify(claimBody));
              return;
            }

            try {
              const workflowId = mode === 'thumbnails' ? 'meta-thumbnail-repair.yml' : 'airbyte-meta-sync.yml';
              const inputs = mode === 'thumbnails'
                ? { request_id: requestId, brand_id: '', months: '6' }
                : { brand_id: '', backfill_days: '0', engine: 'airbyte', request_id: requestId };
              await github.request('POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                ref: 'main',
                inputs,
              });
              core.info('Dispatched ' + workflowId + ' for ' + requestId);
            } catch (error) {
              await fetch(base + '/api/airbyte/sync', {
                method: 'POST',
                headers: {
                  Authorization: 'Bearer ' + oidc,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  action: 'complete',
                  requestId,
                  conclusion: 'failure',
                  message: 'GitHub Actions dispatch failed',
                }),
              });
              throw error;
            }
