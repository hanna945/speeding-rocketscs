name: Remove Legacy Meta Secret

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-remove-legacy-meta-secret.yml"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Remove META_TOKEN from legacy shopline proxy
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"
          result="$(curl -sS -X DELETE "$api/workers/scripts/shopline-proxy/secrets/META_TOKEN"             -H "Authorization: Bearer $CF_API_TOKEN")"
          echo "$result" | jq -c '{success,errors,messages}'
          echo "$result" | jq -e '.success == true' >/dev/null

          secrets="$(curl -sS "$api/workers/scripts/shopline-proxy/secrets"             -H "Authorization: Bearer $CF_API_TOKEN")"
          echo "$secrets" | jq -c '[.result[]?.name]'
          echo "$secrets" | jq -e '[.result[]?.name] | index("META_TOKEN") == null' >/dev/null
