name: Disable Speedingscs Native Auto Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-disable-native-autodeploy.yml"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Disable Cloudflare Git auto deploy for speedingscs
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"
          body='{
            "source": {
              "type": "github",
              "config": {
                "owner": "hanna945",
                "owner_id": "300317863",
                "repo_name": "speeding-rocketscs",
                "repo_id": "1293281505",
                "production_branch": "main",
                "deployments_enabled": false,
                "production_deployments_enabled": false,
                "preview_deployment_setting": "none",
                "pr_comments_enabled": false,
                "preview_branch_includes": [],
                "preview_branch_excludes": [],
                "path_includes": [],
                "path_excludes": []
              }
            }
          }'
          result="$(curl -sS -X PATCH "$api/pages/projects/speedingscs"             -H "Authorization: Bearer $CF_API_TOKEN"             -H "Content-Type: application/json"             --data "$body")"
          echo "$result" | jq -c '{
            success,
            errors,
            source:{
              type:.result.source.type,
              deployments_enabled:.result.source.config.deployments_enabled,
              production_deployments_enabled:.result.source.config.production_deployments_enabled,
              preview_deployment_setting:.result.source.config.preview_deployment_setting
            }
          }'
          echo "$result" | jq -e '.success == true and .result.source.config.production_deployments_enabled == false and .result.source.config.preview_deployment_setting == "none"' >/dev/null
