name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "manifest.json"
      - "_routes.json"
      - "wrangler.toml"
      - "functions/**"
      - "liaoliao-meta/**"
      - "mavis-meta/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy speedingscs to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=speedingscs --branch=main
